ps:[
"城南这套小 {{apartment|公寓}} 是苏晚婚前自己买的，不大，却 {{spacious|宽敞的}} 得刚刚好。三年没人住，通风三天就能住人。",
"她把行李箱摊开在客厅，三年的 {{belongings|个人物品}} 原来一个箱子就装得下。霍家的东西她一件没拿，连结婚时霍母随手赏的那串珍珠，也被她干脆地 {{discard|丢弃}} 进了纸箱最底层。",
"唯一留下的，是当年奶奶给她的一枚旧顶针——不是什么值钱的 {{souvenir|纪念品}}，却是她全部的来处。",
"收拾到半夜，她靠在沙发上 {{recollect|回忆}} 这三年。婚礼、开业、除夕，每一个重要 {{occasion|场合}} 她都独自出席又独自回家；结婚 {{anniversary|周年纪念日}} 那天她做了一桌菜，霍沉凌晨两点才回来，看都没看一眼。",
"被 {{neglect|忽视}} 久了，人真的会麻木——她如今想，那时的自己不是不痛，只是不敢承认罢了。婚戒也取了下来，指根上一圈浅浅的白痕，像一种无声的 {{testimony|证明}}。",
"可她心里反倒觉得 {{tranquil|宁静的}}。这间屋子很小，小到装不下豪门的规矩，却装得下她全部的 {{solitude|独处}}。 {{leisure|闲暇}} 的午后睡到自然醒，不必再按霍家的钟点活着； {{routine|日常}} 简单到只剩一杯茶、一窗雨。",
"阳台上她婚前种下的一盆 {{mint|薄荷}}，三年没人管，居然还活着，倔强得像它的主人。",
"第二天她把屋子收拾得 {{tidy|整洁的}}。从前在霍家，她的房间永远被佣人打扫得一丝不苟，却也永远冷得像样板间；如今哪怕 {{messy|凌乱的}} 一点，都是活着的痕迹。",
"她搬 {{furniture|家具}}、擦窗户，把 {{luggage|行李}} 一件件 {{unpack|拆包}} 归位，然后下楼熟悉了一下 {{neighborhood|街区}}——菜场、药店、旧书店，一切 {{unfamiliar|陌生的}} 又新鲜。",
"黄昏，她给自己 {{brew|冲泡}} 一壶红茶。茶汤红亮， {{aroma|香气}} 漫开，她小口 {{sip|啜饮}} 着，忽然觉得连日的 {{exhaustion|筋疲力尽}} 都被熨平了。",
"原来离开一个人，最好的 {{soothe|安抚}} 不是时间，是重新掌控生活的那种 {{relief|如释重负}}。沙发上那条旧毯子还在，抱进怀里，是久违的 {{familiar|熟悉的}} 气味。",
"门铃响。顾之衍拎着果篮进来，一身 {{casual|随意的}} 便装，笑说：“离婚快乐。”",
"苏晚哭笑不得：“哪有人这么道贺的。”",
"“从 {{self-esteem|自尊}} 的角度讲，你值得庆祝。”他是苏家世交家的独子，从小跟她是老 {{acquaintance|熟人}}，也是这三年里唯一把她当 {{companion|伙伴}} 而不是“霍太太”的人。",
"这场轻松的 {{conversation|交谈}} 是她三年来头一回。他偶尔一句 {{remark|评论}} 就能把她逗笑，又立刻举手投降：“说错了，我 {{tease|调侃}} 的。”",
"气氛一度有点 {{awkward|尴尬的}}——顾之衍忽然认真起来，语气 {{earnest|认真的}}：“苏晚，我 {{persuade|说服}} 过自己很多次，说别趁虚而入。可我还是想 {{insist|坚持}} 一次：以后霍家敢为难你，我陪你应对。”",
"苏晚 {{decline|婉拒}} 了他话里更深的那层意思，却收下了果篮：“谢谢。你一直这么 {{generous|慷慨的}}，我的 {{gratitude|感激}} 记在账上。”",
"“别记账，记仇就行。”他笑了一下，又敛住神色，语气难得凝重，“温念薇回国了，机场那条热搜你现在去看，评论区都在等你的笑话。”",
"“让她等。”苏晚的声音很轻，却有一种 {{breeze|微风}} 般不动声色的锋利。真正 {{provoke|激怒}} 她的事还没发生；发生了，她不介意让对方 {{utterly|彻底地}} 记住教训。",
"顾之衍欲言又止，最后只留下一句：“总之，凡事 {{caution|谨慎}}。”",
"夜里十点，一个陌生号码打进来。听筒里是程伯苍老的声音， {{faint|微弱的}} 却急切：“晚先生，老爷子的 {{prescription|处方}} 三年了，这回的药引子……您真不亲自来配？”",
"苏晚握着手机，目光落在窗外。",
"{{decade|十年}} 前，她随奶奶学医出师，此后一直用“晚先生”这个 {{mysterious|神秘的}} 名号行医， {{identity|身份}} 连顾之衍都瞒着。为了嫁进霍家，她亲手把这门 {{profession|职业}} 连同一身 {{expertise|专长}} 一起 {{conceal|隐藏}} 进了陪嫁箱底。",
"三年间，名动京城的“晚先生” {{merely|仅仅}} 是个二十七岁的女人——霍家老爷子这两年吃的药，一半出自她的手笔。她的 {{reputation|名声}} 在那个世界里顶天立地，霍沉却从没察觉半分。",
"奶奶留给她的药方手稿，当年也以“陪嫁”名义进了霍家库房。那是她必须拿回来的 {{legacy|传承}}。",
"程伯在电话那头叹气：“老爷子嘴上骂你，实际寿宴盼着你回来。”",
"苏晚 {{linger|徘徊}} 了片刻，到底还是应了：“我去。”有些旧账，她要当面算清；有些 {{fortune|机缘}}，也该拿回来了。她 {{deserve|值得}} 更好的，这一点，从今往后由她自己来 {{settle|了结}}。",
"挂了电话，她推开窗，晚风 {{drift|飘拂}} 进来。",
"赴那场寿宴需要一点 {{courage|勇气}}——她怕的不是旧人旧事，是当年那个在暴雨里 {{barely|勉强}} 站稳的自己。",
"可这一次不一样了。",
"这一次，她为自己而来。"
]},

ps:[
"温念薇回国那天，整座城的娱乐 {{media|媒体}} 都疯了。热搜第一挂着九个大字：霍总亲赴机场迎佳人。",
"{{headline|头条}} 配图里，他站在 {{terminal|航站楼}} 的贵宾通道口，风衣笔挺，气质清冷，像一柄收在鞘里的刀。",
"{{flight|航班}} 落地， {{passenger|乘客}} 还没走完，一圈黑衣保镖先散开，把蜂拥的 {{crowd|人群}} 和举着长枪短炮的 {{paparazzi|狗仔}} 隔在三米之外。",
"温念薇拖着一只粉色 {{suitcase|行李箱}} 出关，白裙 {{delicate|精致的}} 像画里走出来的。",
"她的 {{elegance|优雅}} 是刻意练出来的：走路 {{graceful|优雅的}}、笑不露齿，一身 {{fashionable|时髦的}} 高定，喷着限量的 {{perfume|香水}}。霍沉迎上去，把一束 {{bouquet|花束}} 递给她，两人轻轻 {{embrace|拥抱}}，姿态 {{intimate|亲密的}} 却又恰到好处——他们太懂镜头要什么了。",
"“欢迎回家。”霍沉说。",
"温念薇眼里的 {{affection|爱慕}} 像是真的一样。当晚，#霍氏太子爷的白月光回国了# 挂了一整夜，网友的 {{gossip|八卦}} 和 {{rumor|谣言}} 以病毒般的速度 {{spread|传播}}，几万条 {{comment|评论}} 全在赌：前霍太太什么时候被正式钉上 {{celebrity|名人}} 黑历史榜。",
"更有小报翻出她当年嫁入霍家时被嘲“高攀”的旧闻，新旧两张照片 {{contrast|对照}}， {{comparison|比较}} 之下，高下立判。",
"只有很少的人记得，三年前苏晚独自 {{departure|启程}} 回国的那天，也是暴雨。接机口空无一人，她在长椅上坐到凌晨，看着别人重逢时的 {{enthusiasm|热情}}，把眼泪一寸寸逼回去。那段 {{loneliness|孤独}} 和 {{isolation|孤立}} 的日子，她等一个永远不会来的人，像等一场没有尽头的 {{eternity|永恒}}。",
"而此刻的机场贵宾室里，霍沉在签一份文件。",
"陈默 {{uneasy|不安的}} 地发现，老板少见地有些 {{restless|焦躁的}}，钢笔转了三次都没落下去。他偷瞄了一眼那纸文件——是温家昨晚发来的合作意向书。",
"“霍总，”陈默试探，“热搜闹成这样，前……前苏小姐那边会不会受影响？”",
"“ {{coincidence|巧合}} 而已。”霍沉头也不抬，“跟她无关。”",
"话是这么说，他翻文件的手却停了两秒。",
"温念薇挽住他的手臂，声音又软又甜：“阿沉，我这次回来就不走了。欧洲那边的一切我都推了——为了你，我觉得值。”",
"霍沉侧头看她，眼神有一瞬间的 {{distracted|心不在焉的}}，随即恢复平静：“先安顿好，公司最近事多。”",
"温念薇笑容不变，指尖却悄悄 {{clench|攥紧}} 了手包。她认识的霍沉，连谈判桌都要占尽 {{privilege|特权}}、喝杯咖啡都要算 {{cost|成本}}，怎么会允许一个女人全身而退？这不正常。",
"“阿沉，”她状似无意地开口，“听说你离婚了？那个苏小姐，我出国前见过一次，长得是清秀，看着挺 {{innocent|单纯的}}。她不会分走你什么吧？”",
"“分不走。”霍沉语气平淡，“协议是她自己拟的。”",
"“自己拟的？”温念薇 {{hesitate|犹豫}} 了一下，笑意更深，“那她可真是个妙人。”",
"上车前，温念薇回头望了一眼夜色。十八岁那年也是这样一个雨夜，一场 {{incident|变故}} 让她仓促出国，把最想要的东西丢在了原地。",
"这一次回来，她要一样一样拿回来——包括这个男人。至于那个叫苏晚的，不过是个 {{substitute|替代品}}，替她管了三年钥匙的下人罢了。",
"可她没看见，车窗倒影里，霍沉正望着自己无名指上那圈浅浅的戒痕。他的 {{expression|神情}} 看不出波澜，只有 {{gaze|凝视}} 在那里停了一秒，又移开。那一秒里，某种连他自己都读不懂的 {{emotion|情感}} 一闪而过，快得像错觉。",
"迈巴赫驶进雨里。陈默从后视镜里观察老板的 {{mood|心情}}，猜不透；只看得见他手机备忘录里多了一行字：苏晚，近三年行程，查。",
"陈默 {{weary|疲惫的}} 地叹气：这架势，分明是嘴上说无关，身体很诚实。但愿前苏小姐的 {{patience|耐心}} 够用——毕竟老板最近三天处处 {{abnormal|反常的}}：多问一句离婚证放哪，被冷脸怼回来；深夜书房的灯，亮到凌晨三点。",
"深夜的公寓里，苏晚收到顾之衍转来的热搜链接，只回了一个字：“哦。”",
"顾之衍秒回：“不 {{irritate|激怒}} 吗？”",
"“跟谁置气？”她关掉手机，笑了笑，“ {{ultimate|最终的}} 笑话还没开场呢。”",
"有了 {{luxury|奢侈}} 的自由，她更愿意把 {{silence|沉默}} 留给药臼和药杵。窗台边，那只从小戴到大的银镯子在灯下泛着旧光，坠着一枚小小的 {{charm|护身符}}——奶奶临终前给她打的，说是戴着它，阎王殿前少磕三个头。",
"她没觉得自己可怜，也不需要谁的 {{welcome|欢迎}}。三年前她 {{await|等待}} 一个回头，三年后，她只等药炉烧开。",
"窗外雨声把旧事敲得很 {{vivid|鲜明的}}。那种 {{bitter|苦涩的}} 滋味，如今想来倒像一副药引——治好了她经年的 {{ache|隐痛}}，也把从前的自己从骨头缝里一寸寸 {{pierce|刺穿}} 出来，重新长过。",
"第二天一早，她把回国后一周的 {{agenda|议程}} 排得满满当当：上午整理药方，下午出诊，晚上制香。她的战场，从来不在情场上。",
"至于热搜上那位？她关掉推送，此后半 {{seclusion|深居简出}}，两耳不闻。",
"凌晨一点，机场高架下，一辆黑色轿车等着温念薇。温家老管家躬身递伞：“大小姐，老爷子说，您这次回国的 {{duty|职责}} 不可忘——霍家的事，务必办成。”",
"温念薇眸色一冷：“知道了，让我演好白月光就是了。”",
"管家又递上一份文件：“您要的苏晚的资料。”",
"她扫了一眼，嘴角挑起：“孤儿？留学？嫁进霍家三年没工作？一个 {{plain|平平无奇的}} 女人而已。”",
"车窗外，城市霓虹倒退。她想起临登机前，温父在书房里给她的最后通牒——这次再失手，就永远别回来。 {{strain|重压}} 像潮水，可她早就习惯了。",
"她这一生，都是被 {{exile|放逐}} 着长大的。所以这一次，她绝不会空手而归。",
"车驶过高架，电子 {{billboard|广告牌}} 上霍氏的新季广告一闪而过。她盯着那个男人的侧脸看了三秒，指甲轻轻掐进掌心。"

{no:4,t:"乌木匣请帖",ws:[["invitation","n.","请帖"],["banquet","n.","寿宴"],["ceremony","n.","仪式"],["elder","n.","长辈"],["relic","n.","遗物"],["dowry","n.","嫁妆"],["generation","n.","世代"],["tradition","n.","传统"],["etiquette","n.","礼数"],["mansion","n.","宅邸"],["household","n.","家族"],["stern","adj.","严厉的"],["strict","adj.","严格的"],["staff","n.","仆役/员工"],["discipline","n.","纪律"],["uniform","n.","制服"],["schedule","n.","日程"],["in-law","n.","姻亲"],["relative","n.","亲戚"],["cousin","n.","表亲"],["maid","n.","女佣"],["reception","n.","招待会"],["confrontation","n.","对峙"],["maneuver","n.","手段"],["antique","n.","古董"],["embroidery","n.","刺绣"],["heirloom","n.","传家宝"],["host","n.","主人"],["successor","n.","继承人"],["heritage","n.","祖产/传承"],["favor","n.","人情"],["owe","v.","欠"],["repay","v.","偿还"],["grudge","n.","积怨"],["syringe","n.","注射器"],["calligraphy","n.","书法"],["proper","adj.","得体的"],["courteous","adj.","有礼的"],["obedience","n.","顺从"],["rebel","v.","反叛"],["precaution","n.","预防"],["burden","n.","负担"],["tolerance","n.","容忍"],["dilemma","n.","两难"],["friction","n.","摩擦"],["alert","n./adj.","警觉"],["deceased","adj.","已故的"],["memorial","adj.","纪念的"],["mourning","n.","哀悼"],["grief","n.","悲痛"],["sorrow","n.","悲伤"],["cherish","v.","珍惜"],["treasure","n.","珍宝"],["obligation","n.","义务"],["boundary","n.","边界"],["compromise","n.","妥协"],["anticipate","v.","预料"],["predict","v.","预测"],["wary","adj.","警惕的"],["arrangement","n.","安排"],["urge","v.","催促"],["courtyard","n.","庭院"],["corridor","n.","回廊"],["staircase","n.","楼梯"],["pressure","n.","压力"]],
ps:[
"三天后，一辆黑色轿车停在城南公寓楼下。老管家程伯捧着一只乌木匣子登门，礼数周全得挑不出错：“ {{invitation|请帖}} 呈苏小姐。老爷子七十大寿， {{banquet|寿宴}} 定在周六， {{ceremony|仪式}} 简办，家宴为主。”",
"苏晚没接：“霍家的家宴，请我做什么？”",
"程伯叹气：“ {{elder|长辈}} 的话您可以不听，但有一句您得听——老爷子说，欠的债，要当面还。”",
"匣子里除了烫金请帖，还有一只旧锦盒。打开，是一支素银簪子——她母亲的 {{relic|遗物}}，三年前被霍母以“ {{dowry|嫁妆}} 入库”为由收走，从此没了下落。",
"苏晚指尖一颤，随即平静：“好，我去。”",
"锦盒底层还压着一页泛黄的纸，是老爷子亲笔写的 {{heritage|祖产}} 清单：苏氏陪嫁之物，造册奉还。老爷子的态度，比请帖本身更耐人寻味。",
"她摩挲着簪子想，霍家这棵老树的 {{generation|世代}} 规矩森严， {{tradition|传统}} 比人命还重。儿媳进门三道关：第一关 {{etiquette|礼数}}，第二关规矩，第三关人心。她当年一晚过完——因为根本没人在乎她。",
"傍晚顾之衍来电话：“老 {{mansion|宅邸}} 的门不好进，尤其以弃妇的身份。”",
"他给她科普霍家这个 {{household|家族}}：老爷子白手起家，脾气 {{stern|严厉的}}，规矩 {{strict|严格的}} 出了名；宅子里的 {{staff|仆役}} 连走路都带着 {{discipline|纪律}}，连 {{uniform|制服}} 都分三六九等。",
"“你在里面的一举一动，都有人记在 {{schedule|日程}} 里。”他说，“ {{in-law|姻亲}} 们明着捧你暗着踩你， {{relative|亲戚}} 之间一点 {{friction|摩擦}} 都能闹成戏，两位 {{cousin|表亲}} 夫人最爱挑事，贴身 {{maid|女佣}} 更是温念薇的人。”",
"“你怕我应付不来？”",
"“怕。”他答得干脆，“但我知道你应付得来。只一条：全程保持 {{alert|警觉}}，别喝任何人递的第二杯茶。”",
"挂了电话，苏晚把请帖立在书架上。烫金的字在灯下泛着冷光——这封请帖不是善意，是一场 {{reception|招待会}} 式的 {{confrontation|对峙}}。她认得这种 {{maneuver|手段}}：先把你请回棋盘，再让你输得体面。",
"去或不去，本是一道 {{dilemma|两难}}，但她答得干脆：她要去。为了母亲这支 {{heirloom|传家宝}}，也为了当年那笔没算清的 {{favor|人情}}——她 {{owe|欠}} 程伯一条命的恩，该 {{repay|偿还}} 了；至于霍家欠她的 {{grudge|积怨}}，记在账上，不急。",
"她拉开书桌抽屉，里面是她三年攒下的几只 {{antique|古董}} 药瓶；最里侧压着一方 {{embroidery|刺绣}} 手帕，并蒂莲绣了一半——出嫁那天没绣完的。这次赴宴回来，她要亲手绣完它。",
"至于霍家凭什么觉得能“请”动她？ {{host|主人}} 的架子再大，也架不住寿星是他； {{successor|继承人}} 之位再金贵，也早跟她没关系了。",
"周五夜里，她把东西一样样理进包里：安宫丸、银针、一支急救用的 {{syringe|注射器}}，还有一小盒 {{precaution|预防}} 用的药粉。",
"这趟赴宴，她把所有 {{burden|负担}} 都卸下了，唯独这份职业本能，丢不掉。",
"包底压着一册 {{calligraphy|书法}} 手卷——母亲生前抄的药方，一笔一画都清雅得很。母亲若还在，看见女儿今日，不知会不会笑。",
"睡前，霍母的电话打进来，客气里带刺：“晚晚啊，寿宴上举止 {{proper|得体的}} 一点，别让老爷子扫兴。温念薇是客人，你……多一分 {{tolerance|容忍}}，让着点。”",
"“夫人放心，”苏晚笑意盈盈，“ {{courteous|有礼的}} 我最擅长。让着客人，也是我擅长。”",
"挂断前霍母又补一句：“给老爷子 {{obedience|顺从}} 一点，他最烦人顶嘴。”",
"“夫人说的是。”苏晚笑意更深，“我 {{rebel|反叛}} 起来，也很有分寸。”",
"挂了电话，她望着窗外的月亮发了一会儿呆。母亲 {{deceased|已故的}} 七年，她连一张 {{memorial|纪念的}} 照片都没能摆进霍家——当年霍母说， {{mourning|哀悼}} 的东西晦气。那时她 {{grief|悲痛}} 到不能自已；如今再想起，只剩一层浅浅的 {{sorrow|悲伤}}，像旧疤，不碰不疼。",
"“妈，”她对着月亮轻声说，“明天，我带你回家。”",
"她 {{cherish|珍惜}} 这次机会很久了。那只簪子是母亲留给她的 {{treasure|珍宝}}，而霍家欠她的，她会一分不少地讨回来。这是她给自己定的 {{obligation|义务}}——当着所有人的面，把 {{boundary|边界}} 重新画清楚：她苏晚，不做谁的儿媳，也不欠谁一个 {{compromise|妥协}}。",
"睡前最后一条短信发给程伯：程伯，寿宴那天，老爷子的药我亲自带上。 {{anticipate|预料}} 到的病，我治； {{predict|预测}} 不到的局，我也接。",
"程伯盯着短信看了半分钟，老泪纵横：晚先生，还是那个晚先生。",
"而此时，霍家老宅书房，霍母放下电话对丈夫皱眉：“她答应了。答应得太快，我心里 {{wary|警惕的}}。”",
"霍父翻着报纸：“一个离婚的儿媳能翻出什么浪？”",
"“你去查查她这三年到底干了什么。”",
"“ {{arrangement|安排}} 我早就让人办了，查不到什么，她就是个普通的空降女人。”",
"谁也没注意，书房角落里，温念薇的贴身丫鬟正低着头记录这一切。一条 {{urge|催促}} 的短信从她手机里悄悄发了出去：“计划提前。”",
"夜色里，老宅的 {{courtyard|庭院}} 静得能听见 {{corridor|回廊}} 尽头的风声； {{staircase|楼梯}} 上那盏百年铜灯忽明忽暗，像这座大宅压在所有人头顶的 {{pressure|压力}}。",
"一场寿宴，暗流已至。"
]},

{no:5,t:"一支晚簪",ws:[["jewelry","n.","珠宝"],["gem","n.","宝石"],["jade","n.","玉"],["pearl","n.","珍珠"],["crystal","n.","水晶"],["silver","n.","银"],["artisan","n.","工匠"],["craft","n.","工艺"],["carve","v.","雕刻"],["polish","v.","抛光"],["engrave","v.","錾刻"],["motif","n.","纹样"],["sketch","n.","草图"],["draft","n.","草稿"],["refine","v.","打磨/改进"],["exquisite","adj.","精致的"],["gorgeous","adj.","华丽的"],["lavish","adj.","奢华的"],["gaudy","adj.","俗艳的"],["understated","adj.","低调的"],["texture","n.","质地"],["luster","n.","光泽"],["translucent","adj.","半透明的"],["magnificent","adj.","壮丽的"],["masterpiece","n.","杰作"],["gallery","n.","画廊"],["exhibition","n.","展览"],["auction","n.","拍卖"],["bid","n./v.","出价"],["collector","n.","收藏家"],["appraisal","n.","鉴定"],["authentic","adj.","真品的"],["counterfeit","adj.","赝品的"],["precious","adj.","珍贵的"],["worthless","adj.","不值钱的"],["priceless","adj.","无价的"],["bargain","n.","便宜货"],["discount","n.","折扣"],["competitor","n.","竞争者"],["opponent","n.","对手"],["challenge","n./v.","挑战"],["defeat","v.","击败"],["triumph","n.","胜利"],["dominate","v.","称霸"],["feast","n.","盛宴"],["toast","n.","敬酒"],["champagne","n.","香槟"],["gown","n.","礼服"],["veil","n.","面纱"],["bracelet","n.","手镯"],["hairpin","n.","发簪"],["taunt","v.","嘲讽"],["mock","v.","嘲弄"],["insult","n./v.","侮辱"],["sarcasm","n.","讽刺"],["pretense","n.","伪装"],["facade","n.","假象"],["venom","n.","恶毒"],["malice","n.","恶意"],["hostility","n.","敌意"],["feud","n.","宿怨"],["tension","n.","紧张"],["collide","v.","冲突"],["spark","n.","火花"],["awe","n.","敬畏"]],
ps:[
"寿宴的寿礼，苏晚准备了一整天。",
"她没去商场，而是回了趟婚前常去的老 {{gallery|画廊}}——画廊后间是她的工作台，一柜子的 {{jewelry|珠宝}} 工具安安静静等了她三年。",
"她给自己倒了杯茶，摊开一张 {{sketch|草图}}——三年前没打完的 {{draft|草稿}}。老爷子的寿礼，她要做一支 {{hairpin|发簪}}。",
"选料是关键。她挑了一块 {{translucent|半透明的}} 冰种 {{jade|玉}}，配几颗指甲盖大的 {{gem|宝石}}、一串老 {{pearl|珍珠}}、两粒 {{crystal|水晶}}，主体用足银——她不用金，嫌金子太吵。",
" {{silver|银}} 这种金属， {{texture|质地}} 沉稳， {{luster|光泽}} 内敛，像极了某些人的性子。",
"她曾师从京城最好的老 {{artisan|工匠}}，这门 {{craft|工艺}} 她练了十年： {{carve|雕刻}} 玉身， {{polish|抛光}} 银胎，再用最细的錾刀 {{engrave|錾刻}} 出缠枝莲的 {{motif|纹样}}。",
"每一道工序她都亲手 {{refine|打磨}} 过三遍。成品出炉那一刻，连她自己都怔了一下—— {{exquisite|精致的}} 簪身流转着温润的光， {{gorgeous|华丽的}} 却不 {{lavish|奢华的}}，更无半分 {{gaudy|俗艳的}} 气息，低调得像一句祝福。",
" {{understated|低调的}} 奢华，才是真正的 {{magnificent|壮丽的}}。这支簪子，够得上 {{masterpiece|杰作}} 四个字。",
"她给簪子起了名字，叫“晚簪”。",
"巧合的是，回公寓的路上，她看到商场中庭在办国际珠宝 {{exhibition|展览}} 的预热展，下一站将举槌 {{auction|拍卖}}。展柜里一枚“温氏出品”的翡翠戒指标价八位数，解说词吹得天花乱坠。",
"她驻足看了十秒，心里默默给出 {{appraisal|鉴定}} 结论： {{counterfeit|赝品的}} 处理手段，B货充A货， {{authentic|真品的}} 成色不到三成。",
"这枚戒指若上拍台，她一个 {{bid|出价}} 都懒得举——它 {{worthless|不值钱的}}，跟温家的承诺一个成色。",
"倒是展柜角落一枚无名老银簪，落款模糊，被标成 {{bargain|便宜货}} 打着 {{discount|折扣}} 处理。她一眼认出那是奶奶当年的手笔，如今成了无主之物——她当场买下， {{precious|珍贵的}} 从来不是标价，是来路。",
"真正 {{priceless|无价的}} 东西，从来不在标价签上。",
"“这位小姐好眼光。”身后有人开口。是温氏珠宝的市场总监，把她当成潜在的 {{collector|收藏家}}，热情介绍：“温氏是国内头号 {{competitor|竞争者}}，明年国际大展上一定 {{dominate|称霸}} 全场。您若有兴趣，我们 {{challenge|挑战}} 一切同行。”",
"苏晚笑笑没接话。同行？好，那明年大展，她让温氏看看什么叫真正的 {{opponent|对手}}——温氏这些年靠造假 {{defeat|击败}} 过多少老实匠人，账她都记着。",
"这一战她不必张扬，胜了也不必 {{triumph|胜利}} 宣言。珠宝圈会记住那支“晚簪”，就像记住每一次公平的鉴定与超越。",
"回程路上，她收到寿宴的着装提示卡：晚宴 {{feast|盛宴}} 规格，来宾着 {{gown|礼服}}，女士可备 {{veil|面纱}}，席间有 {{toast|敬酒}} 环节与 {{champagne|香槟}} 塔。",
"她把手腕上的银 {{bracelet|手镯}} 转了半圈——那是奶奶打的旧物，配她那身素色旗袍，刚刚好。",
"寿宴前夜，门铃响了。",
"温念薇站在门外，一身 {{pretense|伪装}} 般的甜美，身后跟着提果篮的丫鬟。“苏小姐，明天就是一家人了，我先来给你这个‘前辈’问个好。”",
"苏晚倚着门，没让开：“客人请进，前方三分熟。”",
"温念薇笑意不变，话里的 {{sarcasm|讽刺}} 却一层叠一层：“听说你昨天去了珠宝展？逛得起吗？那里面随便一件，都够你三年零花钱了。”",
"“逛不起，”苏晚语气平平，“只敢看看。”",
"“其实你也不用自卑，”温念薇抬手，腕上的祖母绿手链在灯下晃了晃， {{taunt|嘲讽}} 的意味藏都懒得藏，“人和人出生时就分好了层次。你这样的，努力一辈子，也够不到我们随便一件珠宝。”",
"苏晚看着她，忽然笑了：“温小姐这手链成色不错，可惜保养手法错了，再戴三个月会发乌。”",
"温念薇脸上的笑僵了一瞬。",
"“珠宝怕汗，”苏晚慢条斯理，“有些人怕真话。都一样，捂不住的。”",
"“你！”温念薇深吸一口气，把眼里的 {{malice|恶意}} 压下去，重新挂上 {{facade|假象}} 般的无辜，“苏小姐真是能说会道。不过没关系，明天寿宴，长辈们最喜欢懂事的孩子。像你这么 {{mock|嘲弄}} 客人的，可不太懂事。”",
"“我没嘲弄，”苏晚纠正，“我陈述事实。倒是你， {{insult|侮辱}} 完别人还要别人道歉，这规矩是温家家传的？”",
"两人隔着一道门框， {{hostility|敌意}} 几乎凝成实质，两股气场在门口狠狠 {{collide|冲突}}。空气里的 {{tension|紧张}} 像拉满的弓弦，谁先动，谁先断。",
"“苏晚，”温念薇忽然低了声，笑意里渗出一丝 {{venom|恶毒}}，“我劝你识相点。阿沉心里的人从来只有我一个，你不过是替我看了三年门。这场 {{feud|宿怨}} 从你嫁进霍家那天就开始了，认输，你还能体面点。”",
"“体面？”苏晚轻轻笑了一声。",
"“我本来就体面。需要体面的，从来是心虚的人。”",
"她关门前的最后一句话，像一根针，精准地扎进温念薇的骄傲里：“对了，明天的 {{spark|火花}} 我先帮你省了——你那枚翡翠戒指，A货证书是假的。寿宴上要是有人当众鉴定，记得别哭。”",
"门关上了。走廊里，温念薇的脸色第一次彻底沉下来，指尖掐进掌心。",
"她原本只把苏晚当成一只透明袋子，今晚才发现——这个人身上，有她看不懂的东西。那不是虚张声势，是一种让她脊背发凉的笃定。",
"而更让她不安的是，苏晚说那句话时的眼神， {{awe|敬畏}} 都称不上，是怜悯——像看一只即将撞上玻璃的飞蛾。",
"夜里十一点，温念薇给丫鬟发了条短信：“明天的‘药’，按计划。”"

{no:6,t:"寿宴交锋",ws:[["distinguished","adj.","尊贵的"],["noble","adj.","贵族的"],["prestigious","adj.","有声望的"],["prominent","adj.","显要的"],["influential","adj.","有影响力的"],["elite","n.","精英"],["guest","n.","客人"],["hostess","n.","女主人"],["attendant","n.","侍者"],["sumptuous","adj.","丰盛华丽的"],["splendid","adj.","辉煌的"],["whisper","v.","耳语"],["murmur","v.","低语"],["hush","n.","安静"],["stare","v./n.","注视"],["ridicule","n.","嘲弄"],["patronize","v.","居高临下对待"],["disdain","n.","鄙视"],["scorn","n.","轻蔑"],["composure","n.","镇定"],["serene","adj.","安详的"],["poised","adj.","泰然自若的"],["aloof","adj.","冷淡疏远的"],["reserved","adj.","矜持的"],["reticent","adj.","沉默寡言的"],["retort","v.","反驳"],["witty","adj.","机智的"],["irony","n.","反讽"],["blunt","adj.","直率的"],["tactful","adj.","得体的"],["diplomatic","adj.","圆滑的"],["evasive","adj.","回避的"],["defiant","adj.","挑衅的"],["aggressive","adj.","咄咄逼人的"],["longevity","n.","长寿"],["blessing","n.","祝福"],["tribute","n.","祝词"],["gift","n.","礼物"],["inheritance","n.","继承物"],["spotlight","n.","聚光灯"],["limelight","n.","公众注目"],["overshadow","v.","使黯然失色"],["applause","n.","掌声"],["admire","v.","钦佩"],["entrance","n.","入场"],["escort","v.","护送"],["commotion","n.","骚动"],["hierarchy","n.","等级制度"],["patriarch","n.","宗家长者"],["ancestry","n.","祖先"],["descendant","n.","后代"],["kin","n.","亲属"],["nurture","v.","养育"],["upbringing","n.","教养"],["filial","adj.","孝顺的"],["seniority","n.","资历"],["protocol","n.","礼节规程"],["custom","n.","习俗"],["ritual","n.","仪式"],["superstition","n.","迷信"],["taboo","n.","禁忌"],["fate","n.","命运"],["destiny","n.","宿命"],["prosperity","n.","兴旺"],["auspicious","adj.","吉利的"]],
ps:[
"周六傍晚，霍家老宅灯火通明。",
"前来祝寿的都是城里有头有脸的人物： {{distinguished|尊贵的}} 老教授、几代经商的 {{noble|贵族的}} 旧姓、 {{prestigious|有声望的}} 大学校董、 {{prominent|显要的}} 实业家，还有几位在政商两界都 {{influential|有影响力的}} 人物。 {{elite|精英}} 云集，人人脸上都是三分笑、七分算。",
"苏晚一身素色旗袍，准时到场。",
" {{hostess|女主人}} 霍母亲自迎客，目光在她身上扫了一圈，那句“来了”说得像施舍。旁边的 {{attendant|侍者}} 引她入席，座位在末席——按霍家的规矩，离了婚的儿媳，连末席都是给面子的。",
"厅内 {{sumptuous|丰盛华丽的}} 陈设晃人眼：金丝楠的圆桌、整面墙的和田玉雕， {{splendid|辉煌的}} 水晶灯把每个人都照得珠光宝气。",
"苏晚落座，安安静静。",
"她的安静在旁人眼里成了可欺。不远处，两位表夫人凑在一起 {{whisper|耳语}}，又故意提高半度声音 {{murmur|低语}}：“看见没，就是她，被霍家扫地出门的。”",
"“嘘——小声点，好歹是旧儿媳，多少留点 {{hush|安静}}。”",
"“留什么呀，”另一位嗤笑，“寿宴请她回来，是老爷子心善。啧啧，那份请帖里指不定藏着什么敲打呢。”",
"两人的 {{stare|注视}} 像探照灯，明晃晃扫过来。苏晚执壶给自己斟了杯茶，眼皮都没抬。",
"这份视 {{ridicule|嘲弄}} 如无物的定力，反而让她们觉得无趣，又不敢真的上前找茬——毕竟谁都看得出来，这位前儿媳今天的状态，跟三年前那个缩在角落的小可怜，判若两人。",
"“苏小姐，”表夫人甲还是凑了过来，语气 {{patronize|居高临下对待}} 得恰到好处，“一个人来呀？哦，瞧我，忘了你如今是‘自由身’。”",
"苏晚抬眼，笑意 {{tactful|得体的}}：“夫人记性真好，连我户籍状态都记着。”",
"“你说你这孩子，”夫人甲捂嘴，“怎么这么 {{blunt|直率的}}。”",
"“跟聪明人说话，我习惯不绕弯。”",
"夫人甲一路追问到底， {{aggressive|咄咄逼人的}} 劲头里全是 {{defiant|挑衅的}} 意味；苏晚四两拨千斤， {{evasive|回避的}} 功夫炉火纯青，偏又挑不出半点错。",
"夫人甲噎住。夫人乙打圆场， {{diplomatic|圆滑的}} 换了话题，又试探几句，句句带着 {{disdain|鄙视}} 的底色；见苏晚始终温和却不接招，那份无处安放的 {{scorn|轻蔑}} 只好收回去，换了个方向——朝温念薇去了。",
"温念薇今晚是全场焦点。香槟塔前，她被众人簇拥着，一举一动都在 {{spotlight|聚光灯}} 下，风头一时无两， {{limelight|公众注目}} 加持得理直气壮。",
"“温小姐和阿沉真是天造地设，”有人恭维，“苏小姐在旁边，多少有点被 {{overshadow|使黯然失色}} 了。”",
"“哪里的话，”温念薇掩唇而笑，声音刚好让半厅人都听见，“苏小姐是长辈们请回来的，我这做客人的，还得多谢谢她当年……成全呢。”",
"满厅一阵意味不明的低笑， {{irony|反讽}} 摆得明明白白。",
"苏晚端起茶盏，把这一幕尽收眼底，神色 {{serene|安详的}}。三年的冷眼教会她一件事：别人演的戏里没有她的体面，她自己的 {{composure|镇定}} 才是体面。如今她坐在满堂算计的正中央，也能像看一出戏。",
"她一直这么 {{poised|泰然自若的}}， {{aloof|冷淡疏远的}}， {{reserved|矜持的}}，不是没脾气，是不屑。",
"“苏小姐好像不怎么说话？”有人故意发问。",
"“我一向 {{reticent|沉默寡言的}}，”苏晚笑了笑，“贵宅今晚喜气太重，不宜抬杠。”",
"众人一愣，随即有人噗嗤笑出声。这位前儿媳的 {{witty|机智的}} 回敬，实在不像传闻里那个唯唯诺诺的女人。",
"“我不是抬杠，”表夫人甲不服，卷土重来，“我是替你惋惜。你看温小姐，海外名校，家世又好，哪像你——”",
"“像我也不错，”苏晚 {{retort|反驳}} 得不急不缓，“至少离婚分文不取，走得干净。有些人订婚订了八年不敢进门，才是真的可惜。”",
"满厅一 {{commotion|骚动}}——温家和霍家的婚事八字没一撇，这根刺算是被她当众拔了。",
"温念薇脸色白了白，随即笑得更大方：“苏小姐这张嘴，真是三年不见长进了不少。”",
"“托您的福。”",
"霍沉此时才正式 {{entrance|入场}}。众人自动让开一条路，两名护卫一路 {{escort|护送}}，他先向长辈见礼，再对满堂宾客颔首，最后目光在末席停了半秒——就半秒。",
"陈默跟在他身后半步，想给前老板娘递个眼神安慰，被那双冷淡的眼睛瞪了回去。",
"吉时到，拜寿开始。",
"按 {{protocol|礼节规程}}，长房长孙霍沉先上，捧寿 {{blessing|祝福}} 词，敬酒三杯； {{kin|亲属}} 们依次上前， {{filial|孝顺的}} 姿态一个比一个标准。老爷子坐在主位，半阖着眼，像一尊不怒自威的 {{patriarch|宗家长者}}。",
"轮到送礼环节，表夫人送了一尊玉佛，温念薇送了一幅亲手绣的“松鹤延年”，满堂 {{applause|掌声}}，人人 {{admire|钦佩}}。",
"“苏晚呢？”有人起哄，“前儿媳总不能空手来吧？”",
"苏晚起身，捧上一只素锦盒：“我给老爷子备了一份 {{gift|礼物}}。”",
"盒子打开的瞬间，厅里静了一拍——一支银簪静静卧在绒布上，缠枝莲纹，玉润银温。",
"“簪子？”表夫人甲率先发难，“寿宴送簪子？苏小姐是不是没搞清楚状况，老爷子的寿礼，一向以古玩字画为贵。”",
"“簪子怎么了？”苏晚不紧不慢，“‘簪’谐音‘赞’，古人称寿，最重这个彩头。再说，”她看了一眼温念薇那幅绣品，声音清清淡淡，“松鹤再好，也是机器绣花几十块一幅的东西；这支簪子，倒是手工錾了七十二天。”",
"“你胡说！”温念薇霍然起身，脸上的从容裂了一道缝。",
"“我胡说？”苏晚抬眼，唇角微勾，“温小姐敢让在场任何一位懂行的老师傅验验吗？”",
"满厅的目光瞬间在绣品和银簪之间来回。",
"老爷子忽然抬了抬手，止住骚动。他把那支簪子拿近了，对着灯看了很久——缠枝莲的錾工，收针的手法，和几十年前苏家老太太的手笔一模一样。",
"“好簪子。”老爷子开口，声音不高，却让全场安静下来，“比满厅的金玉都强。”",
"他看向苏晚，浑浊的眼睛里有什么东西动了动：“坐到前面来。末席的规矩，从今天改了。”",
"满厅哗然。",
"霍母的脸色一阵红一阵白；温念薇攥着绣品的手背上青筋凸起；表夫人们把头埋进了果盘里。",
"只有霍沉，站在灯影里，看着那个从末席走到主桌的女人，忽然觉得她每一步都踏在自己心跳上。",
"寿宴继续，觥筹交错。满堂 {{guest|客人}} 皆是城中精英，推杯换盏间尽是人情往来。",
"酒过三巡，老爷子放下筷子，抬手示意安静，说要讲几句。",
"“我们霍家能有今天，靠的不是 {{superstition|迷信}} 里的风水，是规矩。”老爷子呷了口酒，慢慢地说，“霍家的 {{hierarchy|等级制度}}、辈分的 {{seniority|资历}}，外人看着繁琐，内里是秩序。我先祖 {{ancestry|祖先}} 两代白手起家，才挣下这份家业；我这辈子，不过是守成了这份 {{prosperity|兴旺}}。”",
"“后人 {{descendant|后代}} 再多，不成器也是白搭。孩子的 {{upbringing|教养}}，一半靠先生，一半靠家里 {{nurture|养育}}；进门的人要守 {{custom|习俗}}、行 {{ritual|仪式}}，初一十五的香火不能断——这不是老封建，是让后人记得敬畏。心存敬畏，才不碰 {{taboo|禁忌}}。”",
"他说到这儿，目光在主桌扫了一圈，最后落在苏晚身上，停了停。",
"“都说寿星要讲吉言。今天我七十整寿，说句 {{auspicious|吉利的}} 话：霍家这座宅子，认本事，不认出身。谁有本事， {{fate|命运}} 给谁让路， {{destiny|宿命}} 替谁开门；没本事的，守着 {{inheritance|继承物}} 也是个空壳子。”",
"满堂宾客连声附和。只有几个人听出了弦外之音——老爷子这是当众给苏晚抬身份，也是敲打某些人。",
"霍母脸上的笑僵得像糊了层浆子；温念薇端着酒杯，指尖微微发抖。",
"没有人知道，方才那支簪子里还藏着一味药引——老爷子这两年的 {{longevity|长寿}} 靠的不是燕窝，是“晚先生”的方子；也没有人知道，今晚这场 {{tribute|祝词}} 盛宴之下，一张针对苏晚的网已经收紧。",
"温念薇的丫鬟端着一盏“安神汤”穿过回廊，脚步轻得像猫。",
"夜还长。"
]},

ps:[
"寿宴散场前，意外来了。",
"老爷子起身致辞，话说到一半，忽然脸色一 {{pale|苍白的}}，扶住桌沿的手背青筋暴起。紧接着，他胸口像被一只手攥住， {{agony|剧痛}} 顺着 {{nerve|神经}} 炸开，整张脸瞬间扭曲。",
"“老爷子！”",
"满厅大乱。霍母尖叫，表夫人们吓得连椅子都带翻了，宾客们七零八落地往后退。",
"老爷子闷哼一声，直挺挺地栽了下去——在所有人反应过来之前，他已经 {{collapse|昏倒}} 在地毯上，手指 {{tremble|颤抖}} 着蜷缩，随即开始轻微 {{convulsion|抽搐}}。",
"“这是 {{emergency|急诊}}！快叫 {{ambulance|救护车}}！”霍父嘶吼。",
"随行的家庭医生——市里最贵的 {{physician|内科医生}}——扑过去探了探 {{pulse|脉搏}}，声音都变了调：“脉搏乱得厉害， {{blood pressure|血压}} 也在掉！是 {{cardiac|心脏的}} 毛病， {{acute|急性的}} 发作！他这个年纪， {{artery|动脉}} 和 {{vein|静脉}} 都老化得厉害， {{circulation|血液循环}} 一时跟不上——先含一片硝酸甘油，都别围着，让他透气！”",
"药片塞进去，情况却没 {{alleviate|缓解}}，反而还在 {{deteriorate|恶化}}。",
"“不对，”医生的额头上全是 {{sweat|汗}}，“为什么药效起不来……他长期服用的方子呢？剂型、 {{dosage|剂量}}，一样一样报给我听！”",
"没人答得上来。老爷子这两年的方子，是程伯亲自管着的，锁在药柜里。",
"“他的 {{symptom|症状}} 越来越像 {{suffocate|窒息}}，”医生的声音开始发飘，“再来两分钟，我怕他连 {{breath|气息}} 都保不住。人一 {{unconscious|失去知觉的}}，就全完了！”",
"就在这片兵荒马乱里，一只素白的手伸了过来。",
"“让我看看。”苏晚拨开人群，在老爷子身边单膝跪下。",
"“你干什么！”霍母一把要拦。",
"霍沉却先一步按住了母亲的手腕，声音冷而稳：“让她试。”",
"苏晚三根手指搭上老爷子的腕间，另一只手翻开他的眼皮。十秒。",
"“不是单纯的心梗发作。”她开口，声音不大，却让全场安静下来，“他本身有 {{chronic|慢性的}} 心脉旧疾，这我知道——他吃我的方子两年了。但今天这一场，是被人动了手脚。”",
"“什么意思？”霍父脸色铁青。",
"“他今晚喝的那盏安神汤，”苏晚语速极快，“我方子里本有一味 {{herb|草药}} 性平，配伍里能养心安神。可这碗汤里多加了一味，药性相冲， {{aggravate|加重}} 心脉负担——对普通人是补品，对他的心脏，是引信。”",
"“不可能！”温念薇抢上一步，声音又急又颤，“那汤是我孝敬的！苏小姐，你离婚了可以不懂规矩，但不能血口喷人——”",
"“是不是喷人，”苏晚已经拆开随身的针包，“等老爷子醒来对质。现在，谁再拦我一步，出了人命谁负责。”",
"她的针包摊开，十二根银 {{needle|针}} 在灯下泛着冷光——每一根都用酒精 {{disinfect|消毒}} 过， {{sterile|无菌的}} 处理一丝不苟。",
"“针灸？”那位名医生愣住，“都什么年代了还用 {{acupuncture|针灸}}？这可不是闹着玩的——”",
"“你的 {{injection|注射}} 和 {{sedative|镇静剂}} 我不反对，”苏晚头也不抬，“但你现在推一支进去，他的 {{metabolism|新陈代谢}} 撑不住，等于送他走。我这一套针法下来，先 {{stabilize|稳定住}} 心率，你们再送医院。”",
"她闭眼调息三秒，再睁眼时，整个人的气质都变了——那不是豪门弃妇，是京城各大 {{clinic|诊所}} 和 {{ward|病房}} 里被传了十年的那位“晚先生”。",
"第一针，入内关；第二针，落膻中；第三针，走心包 {{meridian|经络}}。银针入体，稳、准、快。",
"她的手指修长有力，每一针落下的角度都拿捏到毫厘——那是十年 {{therapy|疗法}} 功底和上万次练手养出来的肌肉 {{muscle|记忆}}，任何一台仪器都量不出这种手感。",
"老爷子 {{feeble|虚弱的}} 身体在她手下一点点松开： {{spasm|痉挛}} 停了，青灰的唇色回暖， {{dizzy|头晕的}} 潮红退下去，散乱的 {{organ|器官}} 机能像被一只手轻轻拨回正轨。",
"“ {{gasp|倒吸冷气}} 声此起彼伏。”有宾客小声惊呼。",
"一炷香后，老爷子喉头一动，猛地咳出一口浊气——人被 {{revive|苏醒}} 回来了， {{conscious|清醒的}} 意识重新接管了那具苍老的身体。",
"“……晚丫头。”他睁开眼，第一句话，喊的是苏晚。",
"满厅死寂。",
"苏晚收针入包，声音平稳：“初步 {{diagnosis|诊断}} 是药物相冲引发的心绞痛急发，没伤到要害。但今晚这碗汤只是引信，他心脏本身的老底子才是雷——这种 {{incurable|无法治愈的}} 老毛病治不断根，只能养。接下来送医院，按我方子里的 {{remedy|药方}} 调理三个月，忌怒忌累。老爷子底子原本 {{robust|强健的}}， {{nutrition|营养}} 和作息跟上， {{heal|治愈}} 七成把握， {{recover|康复}} 后至少十年不用再犯 {{relapse|复发}}。”",
"她顿了顿，看向霍父：“还有，他常年 {{insomnia|失眠}}、应酬喝酒，这些习惯不改，神仙来了也没用。今晚的事，我建议报警——那碗汤里的 {{ingredient|成分}}，送去化验就知道。”",
"“汤里能有什么？”温念薇的声音发尖，“不过是一些寻常补品——”",
"“寻常补品不会让人 {{toxic|有毒的}} 反应这么快。”苏晚终于正眼看她，一字一句，“除非，里面加了不该加的东西。温小姐是学营养学的，该懂 {{poison|毒药}} 和 {{allergy|过敏}} 的区别吧？”",
"“你——”",
"“另外，”苏晚站起身，拍了拍裙上的灰，环视一圈铁青着脸的霍家人，“今晚有人想借我的方子杀人，然后嫁祸给我。这个局，一环扣一环，挺精致的。”",
"“可惜，”她微微一笑，“你们算漏了一件事。”",
"“我从来不做没有把握的 {{vitality|活力}} 养护——老爷子今天喝的每一盏汤，程伯都留了底样。化验单会替我说话。”",
"她转身时，目光扫过脸色煞白的丫鬟，在那人开始发抖的手上停了半秒。",
"而在她看不见的地方，霍沉一直盯着她的手——那双刚才行针的手，稳定得不像话。",
"还有她方才说的话。 {{capsule|胶囊}}、 {{immune|免疫的}} 机能、 {{hygiene|卫生}} 标准、甚至急救 {{surgeon|外科医生}} 用的术语，她张口就来，专业得像一个从医学院里泡出来的人。",
"一个“普通女人”，一个三年没工作的家庭主妇。",
"哪里不对。非常不对。",
"霍沉的太阳穴突突地跳，一种被雷劈中的错觉贯穿全身——他忽然意识到，自己对这个同床三年的女人，一无所知。"
]},

{no:8,t:"三年空白",ws:[["investigate","v.","调查"],["probe","v.","探查"],["trace","v.","追踪"],["file","n.","档案"],["archive","n.","存档"],["profile","n.","档案/侧写"],["clue","n.","线索"],["hint","n.","暗示"],["lead","n.","线索头绪"],["confirm","v.","证实"],["validate","v.","确证"],["scrutinize","v.","细察"],["examine","v.","审查"],["question","v.","盘问"],["interrogate","v.","审问"],["alibi","n.","不在场证明"],["blank","adj.","空白的"],["gap","n.","空白/缺口"],["omit","v.","缺失/省略"],["erase","v.","抹去"],["distort","v.","歪曲"],["fabricate","v.","捏造"],["forge","v.","伪造"],["manipulate","v.","操纵"],["bury","v.","掩埋"],["drown","v.","淹没"],["shroud","v.","笼罩"],["obscure","adj.","模糊的"],["vague","adj.","含糊的"],["ambiguous","adj.","模棱两可的"],["explicit","adj.","明确的"],["contradict","v.","矛盾"],["puzzle","n.","谜"],["unravel","v.","解开谜团"],["unearth","v.","发掘"],["surface","v.","浮出水面"],["emerge","v.","浮现"],["loom","v.","逼近"],["lurk","v.","潜伏"],["haunt","v.","萦绕不去"],["obsess","v.","使痴迷"],["unsettle","v.","使不安"],["turmoil","n.","纷乱"],["chaos","n.","混乱"],["contemplate","v.","沉思"],["reflect","v.","反思"],["regret","n./v.","悔恨"],["remorse","n.","懊悔"],["guilt","n.","内疚"],["shame","n.","羞愧"],["melancholy","n.","忧郁"],["defend","v.","辩护"],["justify","v.","辩解"],["assume","v.","臆断"],["infer","v.","推断"],["deduce","v.","推理"],["logic","n.","逻辑"],["rational","adj.","理性的"],["intuition","n.","直觉"],["instinct","n.","本能"],["impulse","n.","冲动"],["glimpse","n.","瞥见"],["spot","v.","发现"],["detect","v.","察觉"],["perceive","v.","感知"]],
ps:[
"老爷子被送进医院的头一夜，霍沉在书房坐到天亮。",
"桌上摊着陈默连夜送来的东西：一份对苏晚三年行踪的 {{investigate|调查}} 汇总。",
"他一根根翻过去，眉头越锁越紧。",
"三年，一千多个日夜，这份 {{profile|档案}} 里的记录少得可怜：陪他出席过十一次宴会，去过四次医院探望霍母，剩余的每一天，全部标注着同一个词——无外出记录。",
"像是有人故意把一个活人从这座城市里 {{erase|抹去}} 了。",
"“没查到别的？”霍沉的声音听不出情绪。",
"陈默满头是汗：“都查过了。这三年她的社交、消费、出行，干净得像一张 {{blank|空白的}} 纸。只有几个季度，交通记录里出现几次城南的行程，目的地是老城区，具体地点查不到监控——那一片的 {{archive|存档}} 三年前就报损了。这条 {{lead|线索头绪}} 断在那里，属下正在想办法 {{trace|追踪}} 街坊的走访记录。”",
"回到车里，陈默越想越不对，连夜重新 {{probe|探查}} 每一份 {{file|档案}}， {{scrutinize|细察}} 每一条 {{clue|线索}}。凌晨四点，他终于 {{spot|发现}} 一个细节：三年前苏晚陪嫁进霍家库房的物品清单里，有一批药材的入库签字笔迹是苏晚的，可库房管理员名册上对应的名字是 {{forge|伪造}} 的——伪造得很巧，直到今天对账才露馅。",
"他把这个发现发上去，忽然意识到自己从前根本没认真看过这位前老板娘——三年里不过是在车队里远远 {{glimpse|瞥见}} 过几次，就跟着所有人一起，把她当成了透明人。",
"“报损。”霍沉重复了一遍这两个字。",
"一个普通家庭主妇的生活，不该有这么大一块 {{gap|空白}}。要么是她刻意 {{bury|掩埋}} 了行踪，要么——有人替她把这些记录 {{omit|省略}} 掉了。",
"无论哪一种，都不正常。",
"他翻开第二份材料：医院方向的消息。老爷子的情况暂时稳住了，那碗安神汤的化验结果也出来了——汤里检出了微量乌头碱，一种天然毒物，剂量控制得极其“精妙”：不致死，但足以诱发心疾。",
"剂量精妙到这个地步，投毒的人必须懂药。",
"而整个寿宴上懂药的，只有一个人——他自己竟然下意识往这个方向想，又立刻掐灭了。这个念头太荒谬。",
"“还有一件事，”陈默小心翼翼地开口，“温小姐今早让人送来一份‘资料’，说是……关于前苏小姐的。”",
"霍沉打开信封。",
"里面是几张照片和一沓打印纸，内容指向同一个结论：苏晚早在婚前进过温家的门，跟温家的旧仆往来密切；她当年接近霍沉，是温家铺好的路——连温父都知情。",
"照片的时间、地点，看起来都很“清楚”。清楚得像一篇写好了的 {{fabricate|捏造}} 故事，只等他签字画押。",
"霍沉把纸一张张看完，手指在“温家铺路”四个字上敲了敲。",
"两年婚姻里，温念薇在他面前 {{hint|暗示}} 过无数次：苏晚处心积虑。他那时深信不疑，甚至觉得这个认知 {{justify|辩解}} 了自己所有的冷暴力。",
"可现在再看这些“证据”，每一处都 {{vague|含糊的}}，每一处都 {{ambiguous|模棱两可的}}，没有一处 {{explicit|明确的}} 能坐实。它们唯一的作用，是引导他往结论里跳。",
"更妙的是，温念薇把自己当年出国的时间点卡得死死的，给自己留足了 {{alibi|不在场证明}}——仿佛早就等着这一天。",
"太急了。温念薇太急了。",
"“这一批照片，”他缓缓开口，“找人去原始出处 {{examine|审查}} 一遍。照片有 {{distort|歪曲}} 的痕迹，时间戳对不上——有人动过手脚。查，是谁在背后 {{manipulate|操纵}}。”",
"陈默愣住了：“霍总，您是说温小姐她……造假？”",
"“我只是让你去 {{confirm|证实}} 事实。”霍沉把照片丢回桌上，“ {{validate|确证}} 每一条信息来源。别用‘温小姐说’当结论， {{assume|臆断}} 是调查的大忌。”",
"陈默忽然觉得后背发凉。这些话，从前都是霍沉用来说别人的。",
"送走陈默后，书房彻底静下来。",
"霍沉逼自己用最 {{rational|理性的}} 方式把所有材料重新推演一遍：从化验报告 {{infer|推断}}，下药的人必须能接触到那碗汤；从丫鬟反常的抖手 {{deduce|推理}}，她是执行的人；再往上一层，幕后之人的 {{logic|逻辑}} 清晰得可怕——借刀，杀人，嫁祸。",
"三层剥完，他 {{perceive|感知}} 到一条清晰的暗线，指向那张他从没怀疑过的、温婉的笑脸。他也终于 {{detect|察觉}}，这些疑点三年里其实一直在他眼皮底下——不是没有迹象，是他从没想过要看。",
"霍沉靠在椅背上，闭上眼。",
"一件件旧事自己浮上来，拦都拦不住。",
"他想起婚后第二年冬天，他重感冒，半夜烧得迷迷糊糊，醒来时床头放着一碗药，苦得恰到好处——佣人说是苏晚熬的，他嫌味道古怪，一口没喝，第二天就倒掉了。",
"他想起她缝扣子，指尖捏针的姿势稳得吓人；想起她递给他的手，虎口有一层薄茧——他当时还嘲讽过，“写字还是绣花能磨出这种茧？”她没解释，只是把手收回袖子里。",
"如今想来，那是常年行针、碾药磨出来的茧。",
"再往下想，是更深的一层：他甚至想不起——三年里，他有没有认真看过她一次？",
"记忆里她的脸竟然是 {{obscure|模糊的}}。他把一个人的三年白白浪费掉，还亲手把她的存在 {{drown|淹没}} 在偏见里，现在这偏见回过头来， {{shroud|笼罩}} 住他自己。",
"胸口那块空掉的地方，又开始疼。",
"理性告诉他，这一切可以有很多解释：一个妻子被丈夫冷落久了，自然有秘密；一个被误解的人，懒得自证。",
"可 {{intuition|直觉}} 和 {{instinct|本能}} 都在咆哮：不止如此。苏晚身上有一个巨大的 {{puzzle|谜}}，谜底被什么东西死死压着。他只要顺着今晚的针、手上的茧、档案里的空白往下挖，就一定能 {{unravel|解开谜团}}。",
"他有一种强烈的 {{impulse|冲动}}，想现在就开车去城南，当面 {{question|盘问}} 她每一个细节，把她这三年从骨头缝里 {{unearth|发掘}} 出来。",
"但另一个声音告诉他：他没有资格。",
"三年里他没给过她一次开口的机会。现在他拿什么立场去 {{interrogate|审问}} 一个前妻？",
"霍沉烦躁地揉了揉眉心。三年冷暴力造成的裂缝正在他记忆里 {{contradict|矛盾}} 着：一边是他三年来笃信的“她算计我”，一边是寿宴上她行针时笃定的眼神——这两种画面互相撕扯，让他脑子里一团 {{chaos|混乱}}。",
"最讽刺的是，明天满城的人都会看到：霍氏总裁的前妻，当众救了霍老爷子的命。",
"而这，只是她第一次 {{surface|浮出水面}}。",
"后半夜，他破天荒地给陈默发了条消息：把追查方向调整一下——不要查她这三年做了什么，去查，她到底是谁。",
"发完，他起身走到窗前。",
"城市的灯一盏盏灭下去，只有城南的方向，有一小片灯还亮着——那栋小公寓里，他曾经落掉过一把伞的地方。",
"黑夜像海。有些真相正在深处 {{lurk|潜伏}}，等着 {{emerge|浮现}}；而他胸口那点微光似的异样，也开始 {{loom|逼近}}，像一场躲不掉的旧病 {{haunt|萦绕不去}}。",
"他没有察觉，这只是开始。接下来的每一天，他都会被一个名字反复 {{obsess|使痴迷}}，在无数个深夜里 {{unsettle|使不安}}，卷进回忆的 {{turmoil|纷乱}}，尝到 {{regret|悔恨}}、 {{remorse|懊悔}} 和 {{guilt|内疚}} 混在一起的、滚烫的 {{shame|羞愧}}——",
"天快亮时，他踱到书架前， {{contemplate|沉思}} 良久，抽出一页纸，开始 {{reflect|反思}} 这三年：哪一次冷脸是可以 {{defend|辩护}} 的？哪一次嘲讽是不该发生的？一条条列下来，纸很快就写满了。",
"写完，他盯着那页纸看了很久，一股沉沉的 {{melancholy|忧郁}} 从骨头缝里漫上来——纸上没有一条，站得住脚。",
"而这一切的解药，可能永远不会原谅他。"
]},

ps:[
"老爷子住院第三天，病情突然反复。",
"凌晨两点，重症监护区的 {{alarm|警报}} 响过两轮，主管医生打电话给霍家：老爷子心率紊乱，疑似药物作用——让家属马上来，并且，把“开方子的人”也叫来。",
"天没亮，霍家的人就堵在了医院走廊上。",
"这一次，枪口调转了方向。",
"“苏晚，”霍母劈头质问，“老爷子吃你的药两年，越吃越差，现在直接住进重症监护！你到底安的什么心？”",
"温念薇站在人群最前面，眼睛红红的，一副强忍悲伤的模样：“伯母，您别激动。也许苏小姐不是故意的……毕竟她不是真正的医生。没有执照就敢开药，本身已经触犯法律了。”",
"她的话像刀子，一句一句往外递。",
"“我 {{allege|指控}} 不了什么，也不敢 {{assert|断言}}，”她掩唇轻泣，“我只是听护工说，老爷子床头的药，跟苏小姐平时配的不一样。若真是这样，出了事，谁担得起？”",
"“你没有证据的事，最好少 {{claim|声称}}。”苏晚站在走廊灯下，声音很稳。",
"“证据？”温念薇仰起脸，“全医院都听见了，是你自己亲口说的，老爷子吃你的方子两年！现在人躺在里面，你倒想撇清？”",
"霍父的脸色阴沉得能滴出水：“苏晚，是不是你给的药出了问题，配合调查，别在这里狡辩。”",
"看热闹的家属越聚越多，窃窃私语像潮水，一句句 {{slander|诽谤}} 和 {{smear|抹黑}} 借着众人的嘴，往她身上泼。",
"“啧，这就是豪门弃妇，救人也救不安生。”",
"“我早说过，来历不明的女人，混进霍家就是一场 {{scandal|丑闻}}。”",
"议论声里， {{indignation|愤慨}} 和 {{outrage|义愤}} 混成一锅沸腾的油。有人举起了手机，走廊里已经有人一边 {{weep|哭泣}} 一边拍摄——视频传出去，就是一场 {{frenzy|狂乱}} 的网暴。",
"霍沉赶到时，看到的就是这个场面：苏晚孤零零站在走廊正中央，被所有人 {{condemn|谴责}}，脊背却挺得笔直。",
"他几步走过去，挡在她面前，声音冷得像冰：“证据出来之前，谁再敢对她指一个字——”",
"“霍沉！”温念薇打断他，泪珠滚滚而落，“你护着她？老爷子还在里面！你忘了这三年她怎么算计你的吗？她今天能对老爷子下手，明天就能对你——”",
"霍沉眉头一拧，还没开口，苏晚却先说话了。",
"“温小姐，”她越过霍沉的肩膀，直视温念薇的眼睛，“你哭得很好，眼泪的节奏都卡在镜头上。不过既然你把话挑明了，我也说清楚：老爷子这两年的药，每一剂我都有留样；床头的药我不是没检查过——我只检查了我给的东西。”",
"“言下之意？”霍父皱眉。",
"“言下之意，”苏晚一字一顿，“有人换了我的药。换药的人，就在这家医院里，此刻也许就站在你们中间，假装 {{victim|受害者}}。”",
"走廊上的议论声戛然而止。",
"温念薇脸上的血色一点点褪下去，手指下意识摸向手包——那里躺着一只还没来得及处理的小 {{packet|小包}}。",
"苏晚的目光精准地落在她的手边：“温小姐，你的手包里装的什么？要不要当众打开？”",
"“你胡说八道！”温念薇猛地把手背到身后，声音发尖，“苏晚，你被人赃俱获，还想反咬一口？各位都看到了，她这是在做无谓的 {{counter|反击}}！”",
"“是不是反咬，”苏晚转向主管医生，“请取老爷子今晨输液的 {{residue|残留物}} 样本当场化验。另外——调出昨晚十一点到凌晨一点，进入重症病房的所有人员监控。”",
"霍沉抬手，截断了所有反对：“照她说的做。”",
"半小时后，结果一层层剥出来，像剥一颗烂了芯的果子。",
"老爷子今晨输的液里，检出了过量的乌头 {{extract|提取物}}——一种必须人工提纯的剧毒 {{substance|物质}}，绝不是配伍失误，是人为投毒。",
"而监控里，昨晚十一点四十七分，温念薇的贴身丫鬟端着“炖品”进了病房，在药车旁停留了四十秒。",
"四十秒。够搅一杯药，够下一次毒，也够毁掉一个人。",
"丫鬟被带到办公室的时候，膝盖都是软的。霍家的律师一开口，她就 {{shudder|战栗}} 着全招了：温念薇拿五十万 {{bribe|贿赂}} 她，指使她把苏晚配的药换掉——老爷子出事，就说是苏晚医术不精，让整个霍家去 {{retaliate|报复}} 苏晚。",
"她哭着说，自己不过是个收钱办事的 {{puppet|傀儡}}，真正接头的 {{accomplice|同伙}} 是温氏珠宝的一个采购——那批乌头原浆，是从一条 {{corrupt|腐败的}} 地下药市渠道弄来的。",
"昨晚进过老爷子病房的 {{suspect|嫌疑人}} 名单上，只有五个人：三位家属，两位护工。名单一亮出来，走廊里死一样安静。",
"一场环环相扣的 {{conspiracy|阴谋}} 就此拆解干净：先用五十万和一张回国机票做 {{bait|诱饵}}， {{lure|引诱}} 丫鬟上钩，再布好换药的 {{trap|圈套}}，最后把所有的罪往苏晚头上一扣——让她当 {{scapegoat|替罪羊}}，一了百了。",
"而苏晚从头到尾，只做了一件事：让她自己动手，然后留下证据。",
"“温念薇。”霍沉的声音低得像淬了冰，一步步走过去，“这三年，你在我面前 {{declare|宣称}} 的每一分真心，原来都标着价。现在你告诉我，这算什么？”",
"“阿沉，你听我解释——不是这样的——”温念薇腿一软，扶住桌角， {{panic|恐慌}} 第一次真切地爬上脸。她还在拼命 {{deny|否认}}，可所有人都看见了，她刚刚下意识 {{plead|哀求}} 的眼神。",
"“ {{frame|栽赃}} 前妻， {{plot|密谋}} 谋害霍老爷子，”霍沉一字一顿，“温念薇，你让我怎么听你解释？”",
"“我只是……我只是想除掉她！”温念薇终于崩溃，尖声喊出来，“我在国外等了三年！凭什么她回来说回来就回来？我不甘心！我不是想 {{tempt|诱惑}} 你，我是真的爱你——”",
"这声喊出来，她自己也怕了，捂住嘴 {{sob|啜泣}} 起来。",
"走廊外围观的人越聚越多，有人低声 {{criticize|批评}}，有人当场 {{denounce|公开指责}}，整个楼层一片 {{uproar|哗然}}；几位家属推搡着 {{dispute|争执}} 起来，保安急忙拉起隔离带，把一场一触即发的 {{clash|冲突}} 挡在了线外。",
"围观的议论可以定人心里的罪，但定不了法律的罪。谁是真正的 {{culprit|肇事者}}，每个人心里都有自己的 {{verdict|裁决}}——苏晚要的，却是法律意义上的 {{judgment|判决}}。",
"“你们没有证据说是我主使！”温念薇还在垂死挣扎，声音里全是 {{resentment|怨恨}} 和 {{spite|恶意}}，“那些脏水，我 {{refute|驳斥}} 得了！”",
"“你当然可以驳。”苏晚淡淡地看着她，“不过在那之前，先 {{admit|承认}} 一个事实——你手包里那袋没来得及处理的药粉，保安的镜头拍下来了。化验结果马上出来， {{chemical|化学的}} 成分会和老爷子血液里的乌头碱完全一致。这种 {{additive|添加剂}} 级别的提纯物，市面上买不到，得靠温氏的门路。”",
"温念薇想 {{suppress|压制}} 住发抖的手，没能做到。她没有 {{acknowledge|认可}} 这个指控，但沉默本身就是答案。",
"紧接着，病房的药渣 {{jar|罐子}} 也被封存了：没喝完的半 {{portion|一份}} 药膳被人为 {{stir|搅动}} 过，汤底 {{blend|混合}} 着两种不该同时出现的成分， {{soak|浸泡}} 在里面的药棉签上，还提取到了丫鬟的指纹。",
"证据链一环扣一环，温念薇彻底瘫软在椅子上， {{dread|恐惧}} 和 {{horror|惊骇}} 一起漫上来，脸白得像纸。",
"苏晚连一句 {{reproach|责备}} 都懒得给：“温小姐，我不想 {{divert|转移}} 话题，只提醒你一句——你让我背锅的那笔钱，走的是温氏珠宝的公账。公账，是要审计的。回京的车上，想好怎么向你父亲交代吧。”",
"“到了这一步，就不只是名声上留个 {{stain|污点}} 的事了。”她拎起包，往电梯走，声音轻而清晰，“是整个圈子怎么看你温家的 {{disgrace|耻辱}} 的问题。”",
"温念薇面无人色，瘫坐在椅子上，再也哭不出来。",
"而苏晚转身离开的背影，笔直，利落，没有一丝留恋。",
"霍沉站在原地，盯着那个背影，胸口像被人生生挖走了一块。",
"他忽然意识到，从民政局那个雨夜到今天，他好像从来没有、哪怕一次，真正读懂过这个女人。"

{no:10,t:"反杀与雨夜",ws:[["evidence","n.","证据"],["proof","n.","证明"],["surveillance","n.","监控"],["footage","n.","录像"],["recording","n.","录音"],["transaction","n.","交易"],["transfer","n.","转账"],["account","n.","账户"],["statement","n.","声明"],["expose","v.","揭露"],["unveil","v.","揭开"],["uncover","v.","查明"],["defect","v.","反水/叛变"],["backtrack","v.","改口"],["withdraw","v.","撤回"],["astonish","v.","震惊"],["stun","v.","惊呆"],["speechless","adj.","说不出话的"],["backfire","v.","适得其反"],["self-inflicted","adj.","自己造成的"],["humility","n.","谦卑"],["bow","v.","低头"],["apologize","v.","道歉"],["atone","v.","赎罪"],["repent","v.","悔过"],["flustered","adj.","慌乱的"],["agitate","v.","使焦躁"],["thump","n.","心跳怦然"],["pound","v.","狂跳"],["choke","v.","哽住"],["lump","n.","哽块"],["swirl","v.","翻涌"],["surge","v.","涌上"],["overwhelm","v.","压倒"],["stance","n.","立场"],["allegiance","n.","效忠"],["bias","n.","偏见"],["prejudice","n.","成见"],["partial","adj.","偏袒的"],["impartial","adj.","公正的"],["neutral","adj.","中立的"],["bystander","n.","旁观者"],["mob","n.","乌合之众"],["publicity","n.","曝光"],["coverage","n.","报道"],["broadcast","v.","播报"],["journalist","n.","记者"],["tabloid","n.","小报"],["hype","n.","炒作"],["sensation","n.","轰动"],["buzz","n.","热议"],["simmer","v.","发酵"],["escalate","v.","升级"],["amplify","v.","放大"],["umbrella","n.","伞"],["shelter","n.","庇护"],["shield","v.","庇护"],["warmth","n.","温暖"],["tender","adj.","温柔的"],["heartfelt","adj.","由衷的"],["profound","adj.","深沉的"],["estranged","adj.","疏远的"],["barrier","n.","隔阂"],["rift","n.","裂痕"],["chasm","n.","鸿沟"]],
ps:[
"温家倒台的速度，比苏晚预想的还快。",
"第二天上午，警方通报发布：温氏珠宝采购主管涉嫌非法购入管制药材，温念薇涉嫌投毒与构陷，已被采取强制措施。 {{evidence|证据}} 链完整—— {{surveillance|监控}} {{footage|录像}}、丫鬟的 {{recording|录音}} 证词、五十万 {{transaction|交易}} 的 {{transfer|转账}} 流水、以及温氏公账 {{account|账户}} 的审计疑点，四样齐了。",
"铁一般的 {{proof|证明}} 摆在台面上，谁都翻不了案。",
"热搜以一种报复性的姿态反弹。昨晚还在抹黑苏晚的账号，今早集体倒戈。",
"有人挖出温念薇当年设计的种种旧事，一条条 {{expose|揭露}}；大 V 们连夜 {{unveil|揭开}} 温氏珠宝的造假史，顺着线往下 {{uncover|查明}}，竟牵出一串更大的案中案。",
"最先崩的是温家的公关。",
"凌晨三点，温氏珠宝发 {{statement|声明}}，把一切推给“个别员工个人行为”；中午，眼见舆论烧到集团层面，又连夜 {{backtrack|改口}}， {{withdraw|撤回}} 声明，宣布与温念薇“断绝一切关系”——亲女儿，说弃就弃。",
"那位收钱办事的丫鬟，在律师的见证下彻底 {{defect|反水}}，把温念薇从计划到付款的每一步都吐得干干净净。",
" {{journalist|记者}} 们蹲在医院和温家老宅门口，小 {{tabloid|小报}} 的 {{hype|炒作}} 推波助澜，一场全民围观的 {{sensation|轰动}} 持续发酵，相关话题的 {{buzz|热议}} 一浪高过一浪。",
"而整场风暴的中心，苏晚正在给老爷子复诊。",
"“脉象稳了。”她收起腕枕，语气平常得像在说天气，“接下来三个月，药膳我配好送来，忌怒、忌酒、忌熬夜。”",
"老爷子看着她，浑浊的眼睛里全是感慨：“晚丫头，这一场，满城都看见了——不是我们霍家护了你，是你自己救了自己。”",
"“爷爷，”苏晚笑笑，“是我自己救了自己，也是您当年留的那页清单救了场。两清了。”",
"老爷子一怔，随即叹气：“你这份清醒，比药金贵。”",
"温念薇被带走的那天下午，霍沉没有去送。他站在办公室的落地窗前，看着楼下蜂拥的镜头，忽然觉得这场他自以为握在掌心的棋，从头到尾都是别人在落子。",
"他曾以为自己是执棋的人，其实不过是个被 {{mob|乌合之众}} 的声浪推着走的 {{bystander|旁观者}}——连他认定的“真相”，都裹着一层 {{bias|偏见}} 和 {{prejudice|成见}}。",
"当晚，霍氏的公关会议开了四个小时。 {{publicity|曝光}} 的 {{coverage|报道}} 铺天盖地，几家电视台抢着 {{broadcast|播报}} 后续，所有镜头都在问同一个问题：当年那位被霍家扫地出门的苏小姐，到底是谁？",
"而全网也 {{astonish|震惊}} 地发现，所谓“弃妇”苏晚，资料干净得像白纸——没有工作，没有背景，没有丑闻。评论区一片 {{stun|惊呆}} 的死寂，跟帖的人大都 {{speechless|说不出话的}}——谁能想到，全网嘲了三个月的弃妇，转身救了霍家老爷子？",
"干净，本身就是最大的不对劲。",
"评论区有人开始起底“晚先生”，把寿宴上行针的视频和某些老照片反复对比；猜测试图越演越烈， {{simmer|发酵}} 的火苗一点点 {{escalate|升级}}，有有心人开始 {{amplify|放大}} 每一个细节。",
"苏晚看着手机里的推测帖，把手机扣在了桌上。",
"“让他们猜。”她说，“猜对了，我认；猜错了，不亏。”",
"周五傍晚，暴雨如约而至——像三年前她离开的那天一样。",
"苏晚从医院出来，在屋檐下等车。一把黑色的 {{umbrella|伞}} 从身后递了过来。",
"霍沉站在雨里，半边肩膀都淋透了，伞却整个倾向她这一边。",
"“苏晚。”他的声音有点 {{flustered|慌乱的}} 生涩，全然没有平日的从容，“送你回家，可以吗？”",
"苏晚看着那把伞，没接。“霍总有话，站在雨里说也一样。”",
"雨声哗哗地下，两个人隔着一步的距离，像隔着一整片海。",
"“我 {{apologize|道歉}}。”他说得又慢又艰难，像每个字都要先过一遍喉咙里的 {{lump|哽块}}，“三年前我不该不问缘由就给你定罪；这三年，我不该用冷暴力把一个人的真心耗尽。”",
"“ {{humility|谦卑}} 这两个字，我是离了婚才学会的。 {{bow|低头}} 给你，不是 {{atone|赎罪}} 给自己看，是我真的知道错了。”",
"苏晚安静地听完，忽然问：“后悔了？”",
"“ {{repent|悔过}} 都来不及。”他垂下眼，雨顺着发梢往下滴，“这半年我总在想，如果我当年肯多问你一句，哪怕一句——”",
"“没有如果。”苏晚打断他，语气平静得近乎温柔，“霍沉，我嫁你三年，等过你两年，恨过你一年。 {{estranged|疏远的}} 感情不是一天冷下来的，是三百多个冬天，一天一天冻上的。”",
"“你今天递伞，我会心软一次；明天你走了，后天呢？ {{barrier|隔阂}} 这种东西，不是一次道歉能填平的。我们中间隔着的不是一场误会，是一条 {{rift|裂痕}} 堆出来的 {{chasm|鸿沟}}。”",
"霍沉张了张嘴，喉咙 {{choke|哽住}}，一个字都说不出来。",
"雨幕里，雨点 {{agitate|使焦躁}} 地敲着车顶。他的心跳一下一下 {{thump|心跳怦然}}，然后越跳越快，重重地 {{pound|狂跳}}，像有什么东西在胸腔里 {{swirl|翻涌}}、 {{surge|涌上}}，要把他整个人 {{overwhelm|压倒}}。",
"原来失去一个人是这样疼的——疼得那么具体，那么 {{self-inflicted|自己造成的}}。",
"三年冷暴力，最终 {{backfire|适得其反}} 地砸回了他自己身上。",
"“我送你，”他最后说，声音哑得厉害，“不为别的，就顺路。”",
"苏晚看了他很久。",
"最后，她伸手接过那把伞，却没有站到他的伞下：“伞我收下。人，不必了。”",
"她撑开伞走进雨里。走了几步，忽然停下，没有回头：“霍沉，最后一课，送给你。”",
"“以后再遇到一个人，先看清她是谁，再决定怎么待她。别让立场先于事实——你的 {{stance|立场}} 可以是你的，但真相是大家的。这世上没有谁天生 {{partial|偏袒的}} 或天生 {{impartial|公正的}}，也没有真正的 {{neutral|中立的}} 旁观众；谁先放下 {{allegiance|效忠}} 给偏见的执念，谁先看见人。”",
"雨里，霍沉一动不动地站了很久。",
"车里的陈默把这一幕收进眼底，忽然明白了什么叫“后悔”——那不是一句 {{heartfelt|由衷的}} 对不起就能翻篇的事，是一种 {{profound|深沉的}}、日复一日的凌迟。",
"他想说点什么安慰，最终只是默默把空调调高了两度。",

"车驶过城南，小公寓的灯亮着，暖黄的一小方，像整片夜里唯一没有被雨浇湿的地方。",

"那时他以为，她不过是又一场安排好的联姻；如今才知道，那个雨夜，是他这辈子唯一一次，被一个人真心实意地，等着回家。",
