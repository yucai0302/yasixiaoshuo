ps:[
"温家老宅售出的第九天，温父飞了一趟南边的海岛。",
"那座 {{isle|岛}} 以离岸金融出名：一年四季都是资本的季节，{{bull|牛市}} 与 {{bear|熊市}} 的传单贴在同一条街上。温父的老式皮鞋踩在金融区的玻璃地面上，格格不入，但他眼神里的东西和三十年前第一次进珠宝行时一模一样——{{greed|贪婪}} 压着 {{fear|恐惧}}，烧得又暗又稳。",
"通过一位旧日买家的牵线，他坐进了一间没有挂牌的会议室。对面的人自称「鸢」，一家国际 {{venture|风投}} 旗下的做空团队；名片上只有一行小字：special situations，特别情形部。",
"「温先生想做珠宝？」对面的人翻着他的档案。",
"「做过了。」温父把一份文件推过去，「我想做空它。」",
"桌上摊开的，是霍氏的 {{security|证券}} 走势：三年来爬得又稳又慢，像一头不回头的牛。{{ticker|代码}} 右边标注着目标价，箭头朝下。",
"「霍氏的 {{share|股份}} 结构干净，业绩连续八个季度向好，」对面的人不紧不慢，「做空一家基本面向好的 {{conglomerate|集团}}，不是 {{correction|回调}} 的活，是掀桌子的活。你要有筹码，更要有缝。」",
"「缝我有。」温父的指尖点在报表一角，「三十年里，我给霍氏送过三次礼。他们收没收，我心里有账。」",
"对面的人第一次抬起眼。",
"这间 {{den|巢穴}} 般的会议室里，交易被一点点谈开。所谓做空，温父学得很快：先借入 {{short|做空}} 的股票高位卖出，再在低位买回归还，差价就是 {{profit|利润}}；风险与机会都藏在 {{volatility|波动性}} 里——放消息、砸盘口、猎杀 {{liquidity|流动性}}，业内叫猎熊。他听得入迷，像三十年前第一次听人讲赌石。",
"「工具库里什么都有。」对面的人调出产品清单：先教他用 {{hedge|对冲}} 锁底仓，再亮出 {{futures|期货}}、{{option|期权}}、{{swap|掉期}}，每一样 {{derivative|衍生品}} 都是一把不同的刀；连认股 {{warrant|认股权证}} 和可转 {{debenture|债券}} 都备好了模型。{{credit|信贷}} 与 {{debit|借记}} 的通道设在离岸 {{haven|避风港}}，一家空壳 {{subsidiary|子公司}} 作 {{trustee|受托人}}，{{remittance|汇款}} 走三层，{{escrow|托管}} 到位后锁进 {{safe|保险柜}}——他说得像在念一本 {{playbook|剧本}}。",
"温父把每一页都 {{underwrite|签署承保}}。老宅的 {{sell-off|甩卖}} 款、温氏最后一点资产变现、连当年给温母留的私房钱，一并打了过去。他对钱的态度一贯如此：仇比 {{capital|资本}} 贵，{{loss|亏损}} 比钱狠。",
"「万一是笔 {{windfall|意外之财}} 呢？」签完字对面的人打趣。",
"「我不为财。」温父把笔帽按上，「我为账。」",
"那笔账挂了三十年：珠宝展输的一局、女儿十二年的刑期、儿子在看守所的秋天。温家在这座城市的商业 {{dynasty|王朝}} 塌了，他不认塌——他认定是霍家那一族 {{empire|帝国}} 抢的。这份 {{obsession|执念}}，如今升级成一场体面的 {{vendetta|世仇}}：不吵不闹，用 K 线说话。",
"同一周，苏晚回国。",
"对照是残忍的：这边温父在 {{clandestine|秘密的}} 会面里学怎么 {{dump|抛售}} 别人的一生；那边城南的清晨，苏晚把行李一件件归置——「本草」七件进了老药市博物馆专柜，工坊重新开工，街坊排队求金针。",
"还有一摊 {{meeting|会面}} 摆在霍氏总部：年度 {{boardroom|董事会室}} 里，霍沉刚做完全年最好的一份财报。老爷子的药膳基金运转良好，珠宝线的重启方案压轴——他打算把这条线独立出来，请苏晚出任首席艺术顾问。散会后他笑着给城南发了条消息：粥，今晚开始学。",
"没人看见风从哪个方向来。",
"「鸢」的调研报告在两周后成稿：这份连年报 {{auditor|审计师}} 都签字放行的报表里，藏着霍氏三道命门——珠宝线刚重启、现金重度依赖 {{loan|贷款}}（新厂区抵押品是 {{collateral|抵押品}} 重估过两次的旧资产，评级行提过 {{foreclosure|止赎}} 风险敞口）；{{exposure|敞口风险}} 最重的一笔收购，估值全押在商誉上。猎杀 {{predator|掠食者}} 们嗅着报表，把这串数字圈成一圈红。",
"「{{insider|内部人}} 呢？」温父问。",
"「已在办。」对面的人说，「每个盘口里都缺一只 {{mole|内鬼}}，每场好戏开场前，都需要一位 {{spy|间谍}} 悄悄 {{infiltrate|渗入}}。」",
"温父笑了笑，把一份名单推过去。名单不长，都是些当年温家养过的旧人：物业的、配菜的、看档案的。三十年布的线，如今一根根接进新的电路。",
"「你们这种人，」对面的人第一次露出点敬意，「像 {{vulture| 秃鹫}}，饿了很多年。」",
"「不。」温父把外套穿上，「我这条线，不食腐——食仇。」他此刻的处境与 {{pariah|弃儿}} 无异，走到哪里都招人白眼；可他自认不是被逐出局的 {{outcast|弃子}}——他只是换了一张牌桌。他要在 {{offshore|离岸的}} 账户、{{underground|地下的}} 渠道和一间间 {{covert|暗中的}} 视频会议室里，把「温氏珠宝」这四个字，改写进那只三年连阳的标的里。",
"回国的航班上，苏晚睡得很沉。霍沉替她掖了掖毯子，望着舷窗外的云层。他不知道那座海岛上有一份做空报告刚刚成稿；他只觉得这三年最好的运气，是机舱里这个人的呼吸。",
"两周后，霍氏股价开盘后忽然放了一根长阴线，多头回补的 {{rally|反弹}} 没能撑过午盘；收盘的 {{slump|暴跌}} 让交易大厅的屏幕绿了一片。尾盘 {{tip|风声}} 开始流传：有机构在悄悄加 {{holding|持仓}}，有人在借券，有人说——狙击开始了。",
"卷三的故事到这里落幕。卷四的战鼓，从一根绿线开始擂响。"
]},
{no:46,t:"异动",ws:[["morning","n.","早盘"],["nosedive","n.","俯冲"],["momentum","n.","动能"],["thick","adj.","放大的"],["ask","n.","卖盘价"],["order","n.","委托单"],["trader","n.","交易员"],["workstation","n.","工作站"],["unwind","v.","平仓"],["dealer","n.","交易商"],["offload","v.","减持"],["midday","adj.","午盘"],["shed","v.","跌去"],["tumble","v.","滚落"],["bottleneck","n.","瓶颈关口"],["beat","v.","跌破"],["bell","n.","开收市钟"],["slippage","n.","滑落"],["close","n.","收盘"],["average","n.","均值"],["sink","v.","下坠"],["tailspin","n.","失控下旋"],["down","adj.","下跌的"],["explain","v.","解释"],["plunge","n.","暴跌"],["yardstick","n.","衡量标准"],["barometer","n.","晴雨表"],["uptick","n.","上行"],["recoup","v.","收复"],["sustain","v.","支撑维持"],["breakout","n.","突破"],["floor","n.","下限"],["swing","n.","摆动"],["screen","n.","屏幕"],["study","v.","钻研"],["real-time","adj.","实时的"],["premonition","n.","预感"],["overworked","adj.","超负荷的"],["workload","n.","工作量"],["pajamas","n.","睡衣"],["chatter","n.","窃议"],["cover","v.","回补"],["questionable","adj.","存疑的"],["call","n.","催缴"],["flare","n.","警讯"],["ominous","adj.","不祥的"],["watchful","adj.","警醒的"],["dubious","adj.","可疑的"],["afternoon","n.","午后"],["irregular","adj.","异常的"],["odd","adj.","反常的"],["baffle","v.","使困惑"],["parallel","n.","平行对照"],["ordinary","adj.","平常的"],["wonder","v.","纳闷"],["thin","adj.","萎缩的"],["mundane","adj.","平淡的"],["tense","adj.","紧张的"],["supper","n.","晚饭"],["hum","n.","嗡鸣"],["teapot","n.","茶壶"],["chore","n.","家务"],["mull","v.","反复思量"],["comfort","n.","安慰"],["beyond","adj./prep.","超出"]],
ps:[
"那根长阴线之后的第三天，霍氏股价在 {{morning|早盘}} 跳水开盘。",
"开盘十分钟，股价一头 {{nosedive|俯冲}}：卖单像退潮一样层层压下，砸盘的 {{momentum|动能}} 一浪高过一浪，量柱一根比一根 {{thick|放大的}}，买单薄得可怜——{{ask|卖盘价}} 一路抬高，{{order|委托单}} 簿里绿色压着绿色。{{trader|交易员}} 们在各自的 {{workstation|工作站}} 前面无表情地 {{unwind|平仓}}，{{dealer|交易商}} 们 {{offload|减持}} 的单子排成了队。",
"{{midday|午盘}}，跌幅加深：每股 {{shed|跌去}} 四个点，像钝刀子；午后跌破前期平台，股价 {{tumble|滚落}} 到二十日线之下——技术派们挂在嘴边的每一道 {{bottleneck|瓶颈关口}}，被一根阴线一根阴线逐层 {{beat|跌破}}，没有一次像样的 {{breakout|突破}} 回去。",
"收盘 {{bell|开收市钟}} 响时，{{slippage|滑落}} 定格在负百分之七。{{close|收盘}} 屏上，霍氏绿得刺眼，行业 {{average|均值}} 却是红的——同板块都涨，只有霍氏一头 {{sink|下坠}}，走势像一只 {{tailspin|失控下旋}} 的风筝。",
"这是连续第三个 {{down|下跌的}} 交易日。论基本面，霍氏刚做完史上最好的年报；论消息面，珠宝线重启、S 之热尚在——没有任何一桩坏事，能 {{explain|解释}} 这场 {{plunge|暴跌}}。可空头的单子实实在在：手法凶而稳，像有人拿着 {{yardstick|衡量标准}}，一分一分地锯。老股民都懂那句行话：量价是市场的 {{barometer|晴雨表}}——可这回，晴雨表被人握在手里摇晃。",
"市场两次想 {{uptick|上行}}，两次被打回；多头想 {{recoup|收复}} 失地，却找不到能 {{sustain|支撑维持}} 的买家，接盘薄得像纸，承接之 {{thin|萎缩的}}，史所罕见；尾盘再被砸时，股价离跌停 {{floor|下限}} 只剩一步之遥。",
"霍氏总部的灯连亮三夜。霍沉盯 {{screen|屏幕}} 到凌晨，把三个月来每一笔异动单拉出来 {{study|钻研}}：{{real-time|实时的}} 大宗交易、融资余额的变化、融券卖出量的 {{swing|摆动}}——数据越多，疑点越密；所有 {{dubious|可疑的}} 线索都指向同一批干净得反常的交易对手。他心里那点 {{premonition|预感}}，正从直觉变成确认：这不是回调，这是猎杀。",
"「查到什么了？」陈默顶着黑眼圈进来，人已经 {{overworked|超负荷的}} 三天——{{workload|工作量}} 翻倍，{{pajamas|睡衣}} 直接穿在衬衫外面打了个结。",
"「三件事。」霍沉把 {{chatter|窃议}} 复盘报告推过去，「第一，做空筹码集中，是一致行动人；第二，他们只打压、不 {{cover|回补}}，摆明了不赚短线，要的是恐慌；第三——」他顿了顿，「打压的时点，踩着我们内部流程最准，连融资盘什么时候接 {{call|催缴}} 都算得分毫不差。什么人下得这么准的手？」",
"陈默咽了口唾沫：「您的意思是……里应外合？」",
"「我什么都没说。」霍沉望着窗外，天边一线 {{ominous|不祥的}} 铁灰色，「我只知道，盘口里有鬼，钟表里有鬼。盘面的第一记 {{flare|警讯}} 往往不是绿线，是 {{questionable|存疑的}} 分寸感。{{watchful|警醒的}} 一点——从今天起，文件过手要三人签。」",
"城南的 {{afternoon|午后}}，苏晚正给一位老街坊行针。拾晚堂没装行情屏——她看盘用手机，看人用眼睛，两不耽误。",
"街坊们的话题也从药换到了股：谁家儿子满仓霍氏，谁家老伴急得失眠，连药都换了安神的方子。苏晚一边行针一边听，眉头不动，指下的针却快了半分。这种 {{irregular|异常的}} 传导她见过：有人往水里投了石头，等的就是水面全乱。散了针，她翻出手机看了一眼盘口，{{wonder|纳闷}} 了一瞬：恐慌不是天上来的，是造出来的。",
"当天的盘后复盘会上，两条线第一次摆到了同一张桌上：霍沉的监控屏，苏晚的街坊观察——一条线上是大数字，一条线上是 {{ordinary|平常的}} 人心，合起来正好是一页 {{parallel|平行对照}}。这样的 {{odd|反常的}} 联动把两人都 {{baffle|使困惑}} 了一瞬。",
"「散户怕，是因为有人替他们害怕。」苏晚说，「恐慌是产能——做空的产。庄家要股价，散户要的，只是睡个好觉。可这份 {{mundane|平淡的}} 人心，才是最贵的盘面。」",
"晚饭时，霍沉把 {{teapot|茶壶}} 推到她面前，替她把 {{chore|家务}} 都赶完，才低声问：「如果他们要的不是钱呢？」",
"苏晚给两人续上茶，慢慢 {{mull|反复思量}} 着说：「那就要查三十年前的账——{{beyond|超出}} 盘面的事，盘面上找不到。当年温家做的那些局，每一笔都有底稿。」",
"那晚两个人谁都没说宽心话。{{tense|紧张的}} 时刻，真正的 {{comfort|安慰}} 从来不是乐观，是身边这个人比你更清醒。{{supper|晚饭}} 后的城市有一层低低的 {{hum|嗡鸣}}，像大战前夜磨刀的声音。而温父的账户里，第一批做空的浮盈，刚刚转正。"
]},
{no:47,t:"做空报告",ws:[["report","n.","报告"],["whitepaper","n.","白皮书"],["memo","n.","备忘录"],["abstract","n.","摘要"],["attachment","n.","附件"],["footnote","n.","脚注"],["reference","n.","引证"],["source","n.","信源"],["attribute","v.","归因"],["mud","n.","泥潭"],["innuendo","n.","影射"],["half-truth","n.","半真半假"],["spin","n.","带风向"],["angle","n.","角度"],["publish","v.","发布"],["drop","v.","投放"],["unnamed","adj.","匿名的"],["avow","v.","公开承认"],["editorial","n.","社论"],["column","n.","专栏"],["opinion","n.","观点"],["viewpoint","n.","观点"],["perspective","n.","视角"],["debunk","v.","辟谣"],["clarify","v.","澄清"],["rectify","v.","纠正"],["denial","n.","否认"],["internal","adj.","内部的"],["classified","adj.","机密的"],["verbatim","adj.","逐字的"],["printer","n.","打印机"],["jump","n.","跳升"],["brake","n.","刹停"],["pullback","n.","回撤"],["capitulate","v.","投降式抛售"],["sentiment","n.","情绪"],["herd","n.","羊群效应"],["stampede","n.","踩踏式抛售"],["contagion","n.","传染"],["domino","n.","骨牌"],["cascade","n.","级联"],["somber","adj.","凝重的"],["grave","adj.","严重的"],["undisturbed","adj.","镇定的"],["unruffled","adj.","不为所动的"],["backbone","n.","骨气"],["mettle","n.","锋芒"],["ally","n.","同盟"],["coalition","n.","联盟"],["unite","v.","团结"],["standpoint","n.","立场"],["solidarity","n.","同袍之情"],["morale","n.","士气"],["airtime","n.","播出时段"],["interview","n.","采访"],["watchdog","n.","监督机构"],["regulator","n.","监管者"],["inquiry","n.","调查"],["gird","v.","束紧戒备"],["huddle","n.","碰头"],["war room","n.","作战室"],["counterattack","n.","反击"],["blitz","n.","闪电行动"],["ammunition","n.","弹药"],["arsenal","n.","武器库"]],
ps:[
"第四天清晨六点零四分，一份三十九页的匿名 {{report|报告}} 被同时 {{drop|投放}} 到十七家财经媒体和三家海外通讯社的邮箱。附件名只有四个字：霍氏之弊。",
"报告做得像模像样：封皮是 {{whitepaper|白皮书}} 式的排版，{{abstract|摘要}}、正文、{{attachment|附件}}、四十一条 {{footnote|脚注}} 一样不缺，每条 {{reference|引证}} 都挂着 {{unnamed|匿名的}} 「知情人士」——{{source|信源}} 无一可查，数字却精确得吓人。",
"标题是《关于霍氏集团财务造假与内部人交易的白皮书》；内文把真账目与虚构推演糅成一份 {{half-truth|半真半假}} 的大杂烩：七成数据是真的，三成关键的 {{classified|机密的}} 细节是编的——可那七成，全部来自 {{internal|内部的}} 文件，连一段内部 {{memo|备忘录}} 都被 {{verbatim|逐字的}} 摘录，连页边距都对得上霍氏的 {{printer|打印机}} 设置。",
"六点零六分，十七家里最快的一家财经媒体把稿子 {{publish|发布}} 上网；六点半，热搜齐爆。股价应声跳空——开盘就是一根向下的深 {{jump|跳升}} 缺口。",
"舆论的打法分明是编好的剧本：先由三家财经号「中立」转述，再由 {{column|专栏}} 作者「独立」评论，把每一个 {{angle|角度}} 都占满；中午起，{{editorial|社论}} 与各路 {{opinion|观点}} 齐飞，标题一个比一个耸动，{{spin|带风向}} 的手法又快又脏——有话不好好说，全靠 {{innuendo|影射}}，把霍氏拖进泥潭 {{mud|泥潭}}，泼完就走。",
"恐慌 {{contagion|传染}} 得比病毒快。散户的 {{herd|羊群效应}} 一触即发：抛售变成 {{stampede|踩踏式抛售}}，融资盘连环 {{capitulate|投降式抛售}}，恐慌像 {{domino|骨牌}} 一张张倒下，一路 {{cascade|级联}} 到债权市场。当天收盘，跌幅两位数——舆论要的效果，全有了。",
"{{sentiment|情绪}} 指数跌到历史冰点。有人说霍氏完了，有人说早有内幕；连供应商都开始催款，老股东的求救电话一个接一个——做空报告最狠的从来不是杀伤股价，是杀伤信任。",
"上午九点，霍氏总部顶层。霍沉把各部门负责人全部叫上，{{gird|束紧戒备}}，成立二十四小时 {{war room|作战室}}：法务一组 {{attribute|归因}} 报告泄密源头，财务一组连夜做数据对照，公关一组准备反 {{counterattack|反击}} 的 {{ammunition|弹药}}——一场辟谣 {{blitz|闪电行动}}，从中午开打。",
"十点的紧急发布会占满了全网的 {{airtime|播出时段}}，霍沉亲自上。他没念稿，只做了三件事：第一，把报告里的「七成真数据」逐页 {{debunk|辟谣}}——真，是被掐头去尾的真；第二，当场 {{clarify|澄清}} 债务与现金流的真实结构，三份审计底稿同步公开；第三，对三成伪造的部分，直接宣布已向 {{watchdog|监督机构}} 和 {{regulator|监管者}} 递交 {{inquiry|调查}} 申请：「报告里那段被逐字引用的备忘录，我们内部根本没有第二份。是谁抄走的，监管会给我们答案。」",
"有记者 {{interview|采访}} 追问：「霍总，这是不是意味着你们承认有内鬼？」",
"霍沉看着镜头，第一次当众没有回避：「我 {{avow|公开承认}} 管理有漏洞。但漏洞是用来 {{rectify|纠正}} 的，不是用来给小偷开门的。」他的 {{denial|否认}} 斩钉截铁，从 {{standpoint|立场}} 到 {{viewpoint|观点}} 没有一丝含糊——那个当年冷冰冰拒绝解释的男人，如今把每一个 {{perspective|视角}} 都摆到了台面上。",
"发布会结束，他用一句被全城转摘的话收尾：「雪崩时没有一片雪花是无辜的；但雪崩查源头，先看是谁在山顶跺的脚。」",
"盘面在午后第一次给面子：跌幅从两位数收窄，恐慌的踩踏被生生踩了 {{brake|刹停}}，最后半小时走出一波像样的 {{pullback|回撤}}——有人护盘，手法沉得像山。",
"没人知道那是谁。温父不知道，「鸢」也不知道。只有城南小院里，苏晚收起手机，神色 {{undisturbed|镇定的}}——电话那头，顾之衍刚汇报完：「第一批护盘资金已进场，走的是苏家旧部的通道。他们问要不要留名？」",
"「不留。」苏晚说，「霍家的仗，让他们先打完。苏家只做一件事——别让好公司死在谣言手里。」",
"当晚的霍家老宅，气氛 {{somber|凝重}} 却不 {{grave|严重的}}：老爷子把全家叫齐，只说了一段话：「霍家最难的时候，比这难十倍。人可以输阵，不能输 {{backbone|骨气}}。{{morale|士气}} 在，霍氏就在。」他让人把那面旧锦旗取出来挂在堂屋——三十年前霍氏第一次渡过危机时，供应商们送的。老 {{ally|同盟}} 们的后人当晚就来了电话：货款不催了，账期放半年。",
"{{coalition|联盟}} 就是这样：平时各自忙，塌方时 {{unite|团结}} 到一张桌前。霍沉挨个记下名字，只说一个字：「记。」",
"夜里，他给苏晚发去当天的最后一行字：「报告里那段假的，就是内鬼递出去的模子。明早抓内鬼，你说的三十年前的底稿，也开始查。」",
"苏晚回得很快，只有八个字：「{{huddle|碰头}} 明早八点，我带茶。」",
"这一晚，霍氏的 {{mettle|锋芒}} 被逼了出来：一家公司的 {{arsenal|武器库}}，从来不是账上的现金，是人心。而温父在海岛的露台上举杯——报告的效果超出了他的预期；只是他不知道，那份报告七成的「真」，正在变成反咬他的牙：{{unruffled|不为所动的}} 猎人们，已经开始倒查泄密的路径。",
"{{solidarity|同袍之情}} 在城南也在发酵：街坊们自发把拾晚堂门口的灯多挂了一盏——他们不懂 K 线，但他们懂，苏姑娘家的灯亮着，这条街就不慌。"
]},
{no:48,t:"内鬼",ws:[["breakfast","n.","早餐"],["scented","adj.","香的"],["crumb","n.","碎屑"],["tabletop","n.","桌面"],["fingerprint","n.","指纹"],["print","n.","指印"],["cross-check","v.","交叉核对"],["calendar","n.","日历"],["keycard","n.","门禁卡"],["logbook","n.","登记簿"],["roster","n.","排班表"],["janitor","n.","门房"],["pantry","n.","茶水间"],["shredder","n.","碎纸机"],["bin","n.","纸篓"],["photocopier","n.","复印机"],["after-hours","adj.","下班后的"],["shady","adj.","行迹可疑的"],["accidental","adj.","偶然的"],["convenient","adj.","巧合的"],["intentional","adj.","故意的"],["purposeful","adj.","有目的的"],["debrief","v.","盘问"],["corner","v.","逼入死角"],["break","v.","招供"],["narration","n.","讲述"],["retelling","n.","复述"],["nail","v.","钉死证据"],["clincher","n.","定案证据"],["snippet","n.","片段"],["excerpt","n.","节选"],["transcript","n.","记录文本"],["header","n.","页眉"],["footer","n.","页脚"],["motive","n.","动机"],["incentive","n.","诱因"],["blackmail","n.","敲诈"],["threat","n.","威胁"],["debt","n.","债"],["wager","n.","赌注"],["casino","n.","赌场"],["extort","v.","敲诈"],["squeeze","v.","施压"],["handler","n.","上线"],["paymaster","n.","金主"],["middleman","n.","中间人"],["dead-end","n.","断头路"],["fork","n.","分岔"],["strand","n.","一缕线索"],["comb","v.","篦梳排查"],["filter","v.","过滤排查"],["mismatch","n.","不匹配"],["outlier","n.","异常值"],["dragnet","n.","拉网"],["roundup","n.","排查收网"],["backup","n.","备份"],["redundant","adj.","冗余的"],["offsite","adj.","异地的"],["secrecy","n.","保密"],["dependable","adj.","可靠的"],["vet","v.","审查"],["turncoat","n.","叛徒"],["saboteur","n.","蓄意破坏者"],["thwart","v.","挫败"],["vindicate","v.","澄清昭雪"]],
ps:[
"清晨八点，苏晚拎着一盒 {{scented|香的}} 茶准时进会议室——碰头会变成了 {{breakfast|早餐}} 会：豆浆、肉包、一份加密的排查计划，三样上桌。",
"她开门见山：「报告里七成真数据，是有人从里往外抱的。抱东西的人不显眼，但一定留痕。」",
"排查从最小的口子开始。技术组把三个月的 {{keycard|门禁卡}} 记录、文件系统的 {{logbook|登记簿}}、行政排班 {{roster|排班表}} 三表并排，一天一天 {{comb|篦梳排查}}：谁的加班日期，和文件被调阅的日期 {{mismatch|不匹配}}？",
"筛出三个 {{outlier|异常值}}。第一个被排除：那几天在休假，{{accidental|偶然的}} 撞不上；第二个是正常项目调用，{{convenient|巧合的}} 但清白；只剩第三个——行政档案室的管理员，一位在霍氏干了十一年的老实人。",
"他的门禁记录只有一条 {{shady|行迹可疑的}}：报告发布前第九天，一张「下班后加班」的卡，刷在档案楼层，时长七分钟——七分钟里，连 {{pantry|茶水间}} 都没去一趟，正好够把一份底稿拍照。",
"「{{after-hours|下班后的}} 加班申请谁批的？」霍沉问。",
"陈默查回来：批卡的是物业经理——三年前物业外包换过一轮供应商，新经理是外包公司塞进来的，推荐人一栏，空着。两条 {{strand|一缕线索}} 在这里拧成一股：一条通向档案室，一条通向门房 {{janitor|门房}}。",
"「顺这条查。」霍沉下令，「今晚收网。在收网前，一切照常——别打草惊蛇。」",
"当晚十点，技术组对档案楼层做了一次例行的 {{dragnet|拉网}}。{{shredder|碎纸机}} 旁的 {{bin|纸篓}} 里，一只压瘪的纸杯——杯身上提取出两枚 {{fingerprint|指纹}}：一枚是管理员的，另一枚不属于任何在册员工。{{photocopier|复印机}} 的任务 {{transcript|记录文本}} 里，还躺着一份被删除又没删干净的 {{excerpt|节选}}：正是那份内部备忘录，{{header|页眉}} 的密级标记被裁掉，{{footer|页脚}} 的水印编号，和报告里的引文完全对上。",
"{{cross-check|交叉核对}} 的结果成了 {{clincher|定案证据}}：文件 {{print|指印}}、门禁日志、复印任务三线合一——不是 {{intentional|故意的}} 泄密惯犯，是一次 {{purposeful|有目的的}}、被 {{thwart|挫败}} 在一半的作案。",
"收网在第二天早上九点。没声张，没惊动楼层，保安只在档案室门口把人请进了小会议室。霍沉亲自 {{debrief|盘问}}，第一句就把人 {{corner|逼入死角}}：「九年零四个月，你在温家老宅领了多少回红包？」",
"管理员撑了十一分钟，{{break|招供}} 了。",
"他的 {{narration|讲述}} 很平常，平常得让人心寒：儿子在外地欠了 {{debt|债}}，越滚越大，一头扎进地下 {{casino|赌场}}；他到处凑钱，被一个 {{middleman|中间人}} 找上门——「只是拍几张纸，{{wager|赌注}} 押的是你儿子的手指头能不能保住」。",
"钱走的是三层：一层 {{extort|敲诈}}，一层 {{blackmail|敲诈}} 的录音，一层境外账户的 {{squeeze|施压}} 短信——每一层都把老实的 {{motive|动机}}，拧成不可回头的 {{incentive|诱因}}；最后那枚 {{threat|威胁}}，直接寄到了他儿子的宿舍门口。",
"「上线是谁？」",
"「没见过脸。」管理员抖着声音，把他仅知的信息交了出来：对接的 {{handler|上线}} 用变声器，{{paymaster|金主}} 只出现过一次，在车库——一辆旧款黑色轿车里，一个老人隔着车窗看了他一眼，只说了一句：「替我给霍家带个礼。」",
"会议室安静下来。霍沉和苏晚对视一眼——不约而同想起三个字：温家宅。三十年前那场「送礼」，兜兜转转，原来送到了这里。",
"证据链一小时后闭合：纸杯指印、门禁日志、复印任务、录音、转账 {{snippet|片段}}，一环扣一环，把整个链条 {{nail|钉死证据}}。霍氏同步向监管与警方移交全部材料，用最快的速度把霍氏从「被质疑方」变成「被 {{vindicate|澄清昭雪}} 方」——做空的叙事，从根上断了一截。",
"善后分两条线走。明线：内鬼移交司法，霍氏发公告，坦陈管理漏洞与整改清单；暗线：老宅档案 {{roundup|排查收网}}——所有三十年前经手的旧人名，连夜逐一 {{vet|审查}}，凡与温家有交集的岗位，全部换防。",
"档案室新规矩当场立下：核心文件双 {{backup|备份}} 存 {{offsite|异地的}} 加密库，纸质调阅 {{retelling|复述}} 制度——凡借阅，登记簿上必须亲笔写明用途；{{redundant|冗余的}} 权限全部收回，{{secrecy|保密}} 分级重调。{{calendar|日历}} 上，霍沉在周五那一栏写下三个字：换系统。",
"散会后，苏晚在 {{tabletop|桌面}} 上收拾茶具，忽然指着登记簿边角一点 {{crumb|碎屑}}：「他吃早餐的时候也在看文件——面包渣落在档案页上，他连擦都没擦。慌的人，藏不住。」霍沉看着那点碎屑，忽然觉得这场仗最冷的兵器不是做空，是一个 {{turncoat|叛徒}} 的日常。",
"「他不是坏人。」苏晚轻声说，「是被人拿住了软肋的普通人。所以防内鬼，防的从来不是人品，是制度——把 {{dependable|可靠的}} 流程建起来，才没有人能靠一句 {{filter|过滤排查}} 之外的私人理由，把整个公司卖了。」",
"当晚，温父收到中间人报信：线断了。他坐在临时租的公寓里，捏着 {{fork|分岔}} 般的决定——收手，还是加码？",
"他选了后者。走到这一步，一个 {{saboteur|蓄意破坏者}} 的旧线断了，就换一条新线：三十年的旧账簿他还有一箱没动过。那箱账里，有一桩连霍父都不知道的事。",
"只是这条新线的尽头，是一堵 {{dead-end|断头路}}——他不知道，苏家护盘的暗线，已经等在路的另一头。"
]},
{no:49,t:"股东会前夜",ws:[["docket","n.","议程表"],["quorum","n.","法定人数"],["ballot","n.","投票"],["majority","n.","多数"],["supermajority","n.","绝对多数"],["recess","n.","休会"],["session","n.","会议场次"],["entitlement","n.","权益"],["minutes","n.","会议纪要"],["headcount","n.","点名人数"],["motion","n.","动议"],["second","v.","附议"],["table","v.","列入议程"],["carry","v.","通过"],["reject","v.","否决"],["spoil","v.","废票"],["turnout","n.","到会率"],["late-night","adj.","深夜的"],["lamp","n.","台灯"],["mug","n.","马克杯"],["blanket","n.","毯子"],["nap","n.","小睡"],["soothing","adj.","安抚的"],["lean","v.","依靠"],["encourage","v.","鼓劲"],["assure","v.","打气"],["snack","n.","夜宵"],["chess","n.","棋局"],["endgame","n.","残局"],["gambit","n.","开局让招"],["checkmate","n.","将死"],["countermove","n.","应手"],["foresight","n.","先见"],["backstop","n.","兜底"],["fallback","n.","后备方案"],["worst-case","n.","最坏情形"],["rehearse","v.","预演"],["war-game","v.","兵棋推演"],["unflappable","adj.","沉得住气的"],["sleep","n.","睡眠"],["nightcap","n.","睡前酒"],["old-school","adj.","老派的"],["great-uncle","n.","叔祖"],["tribe","n.","家族部落"],["venerable","adj.","德高望重的"],["reclusive","adj.","隐世的"],["emissary","n.","特使"],["council","n.","议事会"],["gather","v.","集结"],["instruction","n.","指令"],["briefcase","n.","公文包"],["tweed","n.","粗花呢"],["banknote","n.","钞票"],["cheque","n.","支票"],["subscription","n.","认购"],["tranche","n.","批次份额"],["preferential","adj.","优先的"],["silent partner","n.","隐名合伙人"],["low-key","adj.","低调的"],["downplay","v.","淡化"],["unannounced","adj.","未声张的"],["quiet","adj.","安静的"],["belonging","n.","归属"],["hearth","n.","炉火家宅"],["sit-down","n.","围桌便饭"]],
ps:[
"股东会定在周五上午九点。会前的最后一夜，霍氏大厦顶层的 {{session|会议场次}} 布置成了战场沙盘：白板上写着明日 {{docket|议程表}} 的十一项议题，红蓝两色的磁贴各占一边。",
"九点核对 {{quorum|法定人数}}——{{headcount|点名人数}} 显示已登记到会股权百分之八十九，远超开会线；但霍沉的眉头没松：「到会不是胜局，投票才是。空头手里那批筹码，一定会有一场 {{motion|动议}} 发难，到时候谁来 {{second|附议}}，谁跟谁走，比到会率凶险得多。」",
"法务总监把表决规则再过了一遍：普通 {{majority|多数}} 可决，改章程须 {{supermajority|绝对多数}}；为防意外，中途 {{recess|休会}} 的动议权也要握在手上；若有人故意制造 {{spoil|废票}} 或压 {{turnout|到会率}}，投票箱 {{ballot|投票}} 全程录像。",
"「把明早可能出现的六种 {{worst-case|最坏情形}} 各配一套 {{fallback|后备方案}}。」霍沉在白板上画格子，「每套方案，都要有 {{backstop|兜底}}。」",
"这是他 {{war-game|兵棋推演}} 的老习惯——把敌人的每一步 {{gambit|开局让招}} 先摆出来，再推演自己的 {{countermove|应手}}；推到 {{endgame|残局}}，白板上只剩一个词：{{checkmate|将死}} 或被将死。",
"十点半，苏晚拎着两只保温盒进来。这一场深夜 {{chess|棋局}}，她没有上手，只在一旁把明天的股东 {{entitlement|权益}} 明细、历届 {{minutes|会议纪要}} 和表决先例，替他整理成三页小抄——霍家的旧账她比谁都熟。",
"「议题一，会有人动议推迟表决；议题四，会有临时动议要求设立独立调查组；议题九，一定有人提名改选董事。」她把三页纸推过去，「到时候别恋战，逐条 {{reject|否决}}，逐条 {{carry|通过}} 自己的，节奏在主席台手上。」",
"霍沉看着她，忽然笑了：「你现在把这套讲得比我还顺。」",
"「入行那天起，家 {{council|议事会}} 的 {{instruction|指令}} 就学过。」苏晚把 {{snack|夜宵}} 摆开，「苏家是 {{reclusive|隐世的}} 人家，规矩却比谁都老。」",
"十一点，她 {{rehearse|预演}} 明早的发言稿，一段一段来，把「回应做空」的那段掐了三次表。霍沉倚着椅背听，眼神越来越亮：「最后那段，{{encourage|鼓劲}} 的分量刚好。」",
"十二点，顶层只剩一盏 {{lamp|台灯}}。她把热水递到他手边，那只 {{mug|马克杯}} 外面套了保温套；霍沉接过去，顺手把 {{blanket|毯子}} 披到她肩上。",
"「去 {{nap|小睡}} 四十分钟。」他说，「天塌下来我叫你。」",
"「你也睡。」苏晚 {{lean|依靠}} 在沙发另一头，「明天主席台上要是有人 {{table|列入议程}} 突袭，你越 {{unflappable|沉得住气的}}，台下越稳。」",
"她那句 {{soothing|安抚的}} 「你也睡」，比整晚的方案更管用。霍沉真的睡了四十分钟——三年来睡得最沉的一次。醒来时，肩上多了一层毯子，{{late-night|深夜的}} 大厦灯火在窗外连成一线，安安静静。",
"凌晨两点，{{quiet|安静的}} 门铃响了一声。程伯引着两位客人上顶层：一位穿 {{tweed|粗花呢}} 的 {{old-school|老派的}} 绅士，一位提 {{briefcase|公文包}} 的中年人。",
"「晚小姐的 {{great-uncle|叔祖}} 派我们来的。」老绅士递上一封信，「苏家 {{tribe|家族部落}} 的家事会议昨夜在祖宅 {{gather|集结}}，议了四个小时，授权我向您当面转达。」",
"信不长，毛笔小楷：明晨之战，苏家以 {{silent partner|隐名合伙人}} 的名义 {{subscription|认购}} 一批 {{tranche|批次份额}}，授权 {{emissary|特使}} 全权出席；家中几位 {{venerable|德高望重的}} 长辈说——苏家不入世则已，入了，就不站输的那边。落款处盖着一枚古印，压着一张填好的 {{cheque|支票}}，金额一栏是手写的数字，后面跟着一行小字：不够再取。",
"霍沉把那封信读了三遍。他忽然想起自己半个月前说过的那句话——她的来路买不走。他错了：不是买不走，是买的人家根本不卖，人家在暗处看牌，看准了，就亲自下注。这份 {{foresight|先见}}，是苏家两代人换来的。",
"「{{assure|打气}} 的话我就不说了。」老绅士起身告辞，「只带一句：明早九点零五分，第一排左手第三个位子，会有人替苏家举手。」",
"客人们走后，苏晚把 {{nightcap|睡前酒}}——两小盅温过的桂花米酒——摆上 {{hearth|炉火家宅}} 般安静的小桌，算是给这一夜收尾。",
"「家里的事，你怎么 {{downplay|淡化}} 到今天才告诉我？」霍沉问。",
"「不是瞒。」苏晚碰了碰他的盅，「是苏家 {{low-key|低调的}} 了几代，{{unannounced|未声张的}} 是家风。今晚是他们自己要来的——苏家的女儿给霍家守了半个月沙盘，做长辈的，不能让她一个人举杯。」",
"她没有说的是，{{banknote|钞票}} 换成股份的那几笔老账，苏家从她奶奶那辈起就没动过——{{preferential|优先的}} 入场券，留给的从来不是钱，是人。",
"凌晨三点，苏晚靠在沙发上睡去。这一晚的 {{sleep|睡眠}} 总共不到两小时，她却睡得极沉——家 {{belonging|归属}} 这种东西，平时不响，落进梦里，是一整座 {{sit-down|围桌便饭}} 都坐得下的踏实。",
"窗外，天边开始泛白。九点零五分，第一排左手第三个位子——一个名字还没有出现在任何股东名册上的位子，正在等一场真正的亮牌。",
"而温父那口旧箱底，在这一夜被撬开了第一道锁。"
]},

/* ============ 渲染与交互 ============ */
const $=s=>document.querySelector(s), LS={
  get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
  set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))
};
let VOCAB=LS.get("ielts_vocab",[]), READ=LS.get("ielts_read",[]), cur=LS.get("ielts_last",0), FS=LS.get("ielts_fs",17);

function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),1600)}

function renderToc(){
  $("#toc").innerHTML=BOOK.chapters.map((c,i)=>
    `<div class="toc-item ${i===cur?'active':''}" data-i="${i}"><span class="no">${String(c.no).padStart(3,'0')}</span><span>${c.t}</span>${READ.includes(c.no)?'<span class="wc">✓</span>':''}<span class="wc">${c.ws.length}词</span></div>`).join("");
  document.querySelectorAll(".toc-item").forEach(el=>el.onclick=()=>{go(+el.dataset.i);if(innerWidth<=900)closeSide()});
}
function paraHTML(p,i){return `<p class="para ${i===0?'first':''}">`+p.replace(/{{(.+?)\|(.+?)}}/g,(m,w,c)=>`<span class="v" data-w="${w}" data-cn="${c}"><b>${w}</b><i>(${c})</i></span>`)+"</p>"}
function isSaved(w){return VOCAB.some(v=>v.w===w)}
function renderChapter(i){
  const c=BOOK.chapters[i];
  $("#reader").innerHTML=`
  <div class="ch-head"><div class="k">CHAPTER ${String(c.no).padStart(3,"0")}</div><h2>${c.t}</h2><div class="meta">本章嵌入 ${c.ws.length} 个雅思词 · 点击词可收藏</div></div>
  ${c.ps.map(paraHTML).join("")}
  <div class="divider">· · ·</div>
  <div class="wordlist"><h3>本章词汇复习清单 <span class="n">${c.ws.length} 词</span></h3><table>${c.ws.map((w,ix)=>
    `<tr><td>${ix+1}</td><td class="w">${w[0]}</td><td class="p">${w[1]}</td><td>${w[2]}</td><td style="width:96px"><button class="add ${isSaved(w[0])?'on':''}" data-w="${w[0]}" data-p="${w[1]}" data-cn="${w[2]}">${isSaved(w[0])?'★ 已收':'☆ 收词'}</button></td></tr>`).join("")}</table></div>
  <div class="chapter-nav"><button id="prev" ${i===0?'disabled':''}>← 上一章</button><button id="next" ${i===BOOK.chapters.length-1?'disabled':''}>下一章 →</button></div>`;
  $("#reader").querySelectorAll(".v").forEach(el=>el.onclick=e=>showCard(el,e));
  $("#reader").querySelectorAll(".add").forEach(b=>b.onclick=()=>toggleWord({w:b.dataset.w,p:b.dataset.p,cn:b.dataset.cn},b));
  $("#prev").onclick=()=>go(cur-1);$("#next").onclick=()=>go(cur+1);
  if(!READ.includes(c.no)){READ.push(c.no);LS.set("ielts_read",READ)}
  LS.set("ielts_last",i);renderToc();renderWL();
  window.scrollTo({top:0});
}
function go(i){if(i<0||i>=BOOK.chapters.length)return;cur=i;renderChapter(i)}
function showCard(el,e){
  const w=el.dataset.w;
  $("#cdW").textContent=w;$("#cdC").textContent="（"+el.dataset.cn+"）";
  $("#cdP").textContent="第"+String(BOOK.chapters[cur].no).padStart(3,"0")+"章";
  const btn=$("#cdAdd");
  btn.textContent=isSaved(w)?"★ 已在生词本":"☆ 收进生词本";btn.classList.toggle("on",isSaved(w));
  btn.onclick=()=>toggleWord({w,p:"",cn:el.dataset.cn},btn);
  const card=$("#card");card.style.display="block";
  const r=el.getBoundingClientRect();
  let top=r.bottom+10;card.style.left=Math.min(r.left,innerWidth-300)+"px";
  if(top+140>innerHeight){top=r.top-140;card.classList.add("flip")}else{card.classList.remove("flip")}
  card.style.top=Math.max(64,top)+"px";
}
$("#cdClose").onclick=()=>$("#card").style.display="none";
document.addEventListener("click",e=>{
  const card=$("#card");
  if(card.style.display==="block"&&!card.contains(e.target)&&!e.target.closest(".v"))card.style.display="none";
});
function toggleWord(item,btn){
  const ex=VOCAB.find(v=>v.w===item.w);
  if(ex){VOCAB=VOCAB.filter(v=>v.w!==item.w);toast("已从生词本移除："+item.w)}
  else{VOCAB.push({w:item.w,p:item.p||"",cn:item.cn,from:BOOK.chapters[cur].no});toast("已收藏："+item.w)}
  LS.set("ielts_vocab",VOCAB);
  if(btn)btn.classList.toggle("on",isSaved(item.w)),btn.textContent=isSaved(item.w)?"★ 已收":"☆ 收词";
  const ab=$("#cdAdd");if(ab){ab.classList.toggle("on",isSaved(item.w));ab.textContent=isSaved(item.w)?"★ 已在生词本":"☆ 收进生词本"}
  renderWL();refreshRowBtns();
}
function refreshRowBtns(){document.querySelectorAll(".wordlist .add").forEach(b=>{const on=isSaved(b.dataset.w);b.classList.toggle("on",on);b.textContent=on?"★ 已收":"☆ 收词"})}
function renderWL(){
  const box=$("#wl"),n=$("#wlCount");
  n.textContent=VOCAB.length;n.classList.toggle("zero",VOCAB.length===0);
  if(!VOCAB.length){box.innerHTML='<div class="wl-empty">生词本是空的。<br>阅读时点击正文里的红色单词，或用章末清单的“收词”按钮，把难词收进来随时复习。</div>';return}
  box.innerHTML=VOCAB.map(v=>`<div class="wl-item"><b>${v.w}</b><i>${v.cn}</i><button class="rm" data-w="${v.w}" title="移除">×</button></div>`).join("");
  box.querySelectorAll(".rm").forEach(b=>b.onclick=()=>toggleWord({w:b.dataset.w,p:"",cn:""}));
}
function closeSide(){$("#sidebar").classList.remove("open");$("#mask").classList.remove("show")}
$("#btnToc").onclick=()=>{if(innerWidth<=900){$("#sidebar").classList.toggle("open");$("#mask").classList.toggle("show",$(".sidebar").classList.contains("open"))}else{const s=$("#sidebar");s.style.transform=s.style.transform==="translateX(-105%)"?"":"translateX(-105%)";document.querySelector(".main").style.marginLeft=s.style.transform?"0":"290px"}};
$("#mask").onclick=closeSide;
$("#btnWl").onclick=()=>{$("#sidebar").scrollIntoView({behavior:"smooth"});$("#wl").scrollIntoView({behavior:"smooth",block:"center"})};
$("#btnFs").onclick=()=>{FS=FS>=21?15:FS+2;$("#reader").style.setProperty("--fs",FS+"px");LS.set("ielts_fs",FS);toast("字号 "+FS)};
$("#btnTheme").onclick=()=>{const d=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=d?"light":"dark";$("#btnTheme").textContent=d?"🌙":"☀️";LS.set("ielts_theme",d?"light":"dark")};
(function init(){
  const th=LS.get("ielts_theme","light");document.documentElement.dataset.theme=th;$("#btnTheme").textContent=th==="dark"?"☀️":"🌙";
  $("#reader").style.setProperty("--fs",FS+"px");
  renderToc();renderChapter(Math.min(cur,BOOK.chapters.length-1));renderWL();
})();
</script>
