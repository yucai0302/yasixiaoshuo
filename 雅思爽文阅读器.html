"而这个道理，他花了一场婚姻，才学会。"
]},
{no:11,t:"交接与旧账",ws:[["lawsuit","n.","诉讼"],["prosecute","v.","起诉"],["defendant","n.","被告"],["detention","n.","羁押"],["bail","n.","保释"],["summon","v.","传唤"],["contest","v.","抗辩"],["appeal","n./v.","上诉"],["penalty","n.","处罚"],["convict","v.","定罪"],["release","v.","释放"],["freeze","v.","冻结"],["seize","v.","查封"],["confiscate","v.","没收"],["audit","n.","审计"],["ledger","n.","账本"],["notary","n.","公证"],["invoice","n.","发票"],["receipt","n.","收据"],["valuation","n.","估值"],["inventory","n.","清单"],["certify","v.","出具证明"],["damages","n.","赔偿金"],["reimburse","v.","报销"],["liability","n.","责任"],["creditor","n.","债主"],["debtor","n.","债务人"],["default","v.","违约"],["overdue","adj.","逾期的"],["mortgage","n.","按揭"],["installment","n.","分期付款"],["expenditure","n.","开支"],["budget","n.","预算"],["deficit","n.","赤字"],["surplus","n.","盈余"],["equity","n.","股权"],["stake","n.","股份"],["dividend","n.","分红"],["turnover","n.","营业额"],["payroll","n.","工资名单"],["severance","n.","遣散费"],["redundancy","n.","裁员"],["liquidate","v.","清算"],["restructure","v.","重组"],["divest","v.","剥离"],["procurement","n.","采购"],["vendor","n.","供应商"],["quota","n.","配额"],["subsidy","n.","补贴"],["benchmark","n.","基准"],["compliance","n.","合规"],["regulatory","adj.","监管的"],["entity","n.","实体"],["jurisdiction","n.","管辖权"],["sanction","n.","制裁"],["statute","n.","法规"],["provision","n.","条文"],["counsel","n.","法律顾问"],["prerequisite","n.","前提"],["deadline","n.","期限"],["errand","n.","跑腿事务"],["hassle","n.","麻烦事"],["paperwork","n.","文书工作"],["meticulous","adj.","一丝不苟的"],["straightforward","adj.","直截了当的"]],
ps:[
"针对温念薇的 {{lawsuit|诉讼}} 正式立案那天，天出奇地晴。检方宣布全程 {{prosecute|起诉}}，曾经不可一世的温家大小姐，第一次以 {{defendant|被告}} 的身份出现在司法公告里。",
"批捕、{{detention|羁押}}，一气呵成。温家重金请来的金牌律师团连递三份 {{bail|保释}} 申请，全部被驳回；涉案的财务主管也被法院一纸文书 {{summon|传唤}}，随叫随到，半个字不敢多讲。",
"温家先是放话要在庭上 {{contest|抗辩}} 到底，转头又私下打听能不能 {{appeal|上诉}} 减刑——嘴硬与腿软之间，只隔了三天。",
"法律圈看得明白：这次的 {{penalty|处罚}} 不会轻。主犯被 {{convict|定罪}} 几乎是铁板钉钉，倒是那个反水的丫鬟，因为污点证人立功，{{release|释放}} 都有指望。",
"同一时间，法院对温氏资产下手更快：账户 {{freeze|冻结}}，厂房 {{seize|查封}}，涉案珠宝一律 {{confiscate|没收}}。近三年的 {{audit|审计}} 重新调档，老 {{ledger|账本}} 一页页翻过去，翻出的窟窿比案子本身还多。",
"而城南这边，程伯带着公证处的 {{notary|公证}} 员第三次登门。乌木匣子摊开，三年来被扣押的陪嫁明细一页页铺平：当年的 {{invoice|发票}}、{{receipt|收据}}、逐项 {{valuation|估值}} 报告，连同归还 {{inventory|清单}}，码得整整齐齐。",
"清单最后一页由老爷子亲自 {{certify|出具证明}}，签章完备。末尾附着一笔 {{damages|赔偿金}}——当年被扣之物的折价补偿。苏晚没推辞，落笔签收；转头却把程伯代转的一张 {{reimburse|报销}} 单推了回去——她替老爷子配药垫的钱，从没打算走霍家的账。",
"「这一项，」她点了点单据上的法律 {{liability|责任}} 栏，「霍家欠我的，按单结清；我给老人的，是私情，不进公账。」",
"程伯怔了怔，把单子收了回去。他这些年见惯了 {{creditor|债主}} 上门的嘴脸，也见惯了 {{debtor|债务人}} 逃单的无赖，头一回见有人把恩和债分得这么清。",
"温氏倒塌的余震还在扩散：三家关联供应商相继 {{default|违约}}，一笔笔 {{overdue|逾期的}} 货款成了死账；温家名下两栋写字楼被银行收走，{{mortgage|按揭}} 断供，遣散员工的工资都要 {{installment|分期付款}} 才发得出来。",
"霍氏大厦顶层，另一场无声的战役也在收尾。本季度 {{expenditure|开支}} 一刀砍掉三成，{{budget|预算}} 重排，硬是把预估的 {{deficit|赤字}} 拉回 {{surplus|盈余}}；被温系资金掺过沙子的 {{equity|股权}} 全部清仓，那份 {{stake|股份}} 折价转给国资背景的机构——{{dividend|分红}} 稳健，后患全无。",
"内部整顿同步推进：{{turnover|营业额}} 掉得最狠的珠宝线并入主事业部，温系安插的高管清退，{{payroll|工资名单}} 缩了一成；该给的 {{severance|遣散费}} 一分不少，{{redundancy|裁员}} 的刀却半点没钝。",
"再往深处是断臂求生：空壳公司 {{liquidate|清算}}，南区供应链 {{restructure|重组}}，{{divest|剥离}} 出的优质资产重新打包——快得让对手连反应的余地都没有。",
"采购的口子扎得最紧：{{procurement|采购}} 全流程上系统，{{vendor|供应商}} 白名单一年一审，招投标环节全程留痕，采购 {{benchmark|基准}} 价一季一调；想走关系多要 {{quota|配额}}、虚报 {{subsidy|补贴}} 的，一律移交法务。",
"{{compliance|合规}} 部门从十一人扩编到四十人，{{regulatory|监管的}} 风险一天一报；海外那个被温家当跳板的 {{entity|实体}}，也在当地 {{jurisdiction|管辖权}} 下处置干净，涉灰的部分还吃了国际 {{sanction|制裁}}。",
"法务部的灯连亮两周：{{statute|法规}} 一条条对，{{provision|条文}} 一款款抠，外部 {{counsel|法律顾问}} 的会一场接一场。霍沉只提了一个 {{prerequisite|前提}}——所有 {{deadline|期限}} 三个月内结清，不留一件尾巴。",
"陈默跟着连轴转，夜里做梦都在盖章。他如今一半时间盯盘，一半时间替老板办 {{errand|跑腿事务}}，连按时吃口饭都成了 {{hassle|麻烦事}}。他跟司机吐槽：老板这是把三年的 {{paperwork|文书工作}} 压成三十天过，神仙也得脱层皮。",
"唯一的例外是每周三送药膳材料的商务车。这趟差事陈默抢着跑，风雨无阻，东西放下就走，从不多话——他记得老板的叮嘱：别打扰。",
"交接文件做得比并购案还 {{meticulous|一丝不苟的}}：每页骑缝章，每项有出处。有人说那是做给外人看的体面，程伯知道，那是老爷子在用最笨的方式赔罪——欠账还钱，一丝一毫马虎不得。",
"忙完最后一项，苏晚站在小院里洗手晾帕子。她这辈子的账，向来 {{straightforward|直截了当的}}：欠人的，连本带利还清；人欠她的，一笔一笔讨回；讨完，两清，往前走。",
"夜风翻过矮墙，吹动晾衣绳上的白帕子。她还不知道，一通越洋电话正在大洋另一头酝酿，很快就要撕开这座城市的安宁。"
]},
{no:12,t:"庭外",ws:[["mediator","n.","中间人"],["petition","n.","请愿书"],["mediation","n.","调解"],["lobby","n.","大堂"],["appointment","n.","预约"],["negotiation","n.","谈判"],["counteroffer","n.","还价"],["leverage","n.","筹码"],["appease","v.","平息"],["civility","n.","礼数"],["concession","n.","让步"],["deadlock","n.","僵局"],["yield","v.","让步"],["stalemate","n.","僵持"],["ultimatum","n.","最后通牒"],["intimidate","v.","威吓"],["coerce","v.","胁迫"],["witness","n.","证人"],["deter","v.","威慑"],["rebuff","v.","断然拒绝"],["implore","v.","恳求"],["irrevocable","adj.","不可撤回的"],["pledge","n.","承诺"],["non-negotiable","adj.","没得商量的"],["haggle","v.","讨价还价"],["confer","v.","商讨"],["deliberate","v.","深思"],["dismiss","v.","不予理会"],["solicit","v.","请求"],["criteria","n.","标准"],["ponder","v.","权衡"],["weigh","v.","权衡"],["forfeit","v.","丧失"],["resistance","n.","抵制"],["interpersonal","adj.","人际的"],["threshold","n.","门槛"],["intrusion","n.","打扰"],["visitor","n.","访客"],["candid","adj.","坦率的"],["deceit","n.","欺骗"],["sincerity","n.","诚意"],["sympathy","n.","同情"],["empathy","n.","共情"],["relentless","adj.","不依不饶的"],["adamant","adj.","决不让步的"],["reunion","n.","团聚"],["guarantee","n.","保证"],["assurance","n.","保证"],["commitment","n.","承诺"],["conclusive","adj.","决定性的"],["principle","n.","原则"],["priority","n.","优先事项"],["humanitarian","adj.","人道的"],["mercy","n.","宽恕"],["compassion","n.","怜悯"],["verbal","adj.","口头的"],["relent","v.","松动"],["unwavering","adj.","不动摇的"],["resolute","adj.","坚决的"],["dignity","n.","尊严"],["integrity","n.","正直"],["privacy","n.","隐私"],["hypocritical","adj.","虚伪的"],["disregard","v.","无视"],["persistent","adj.","执着的"]],
ps:[
"温家终于坐不住了。开庭前两周，温父不敢露面，托了一位周姓前辈做 {{mediator|中间人}} 说和，登门送上一份措辞谦卑的 {{petition|请愿书}}，以 {{mediation|调解}} 的名义探路——核心只有一个意思：能不能，庭外和解。",
"顾之衍替苏晚把门。他先请来客在 {{lobby|大堂}} 等了四十分钟，才慢悠悠下楼，把一页 {{appointment|预约}} 制度推过去：「见客提前三天登记。今天这趟，算加班。」",
"{{negotiation|谈判}} 桌上，温家的开价毫无诚意：赔偿走个流程，道歉免谈，还请苏小姐高抬贵手。顾之衍听完，连 {{counteroffer|还价}} 都懒得还，只把一沓复印件推过去——丫鬟证词、转账流水、购毒单据，一样不缺。",
"「是你们的 {{leverage|筹码}} 不够，」他说，「不是我们不讲情面。」",
"对面还想 {{appease|平息}} 事态，绕来绕去打感情牌。顾之衍把话挑明：「贵方连基本 {{civility|礼数}} 都想省，凭什么让我们接 {{concession|让步}} 方案？」",
"第一次会谈当场谈成 {{deadlock|僵局}}：双方各坐一边，谁也不肯先 {{yield|让步}}，标准的 {{stalemate|僵持}}。那位周前辈两头跑着说和，磨了三天。",
"第四天，温父亲自来电，开口还是「不看僧面看佛面」，末了撂下一句变味的 {{ultimatum|最后通牒}}：温家在商界三十年，谁不给几分薄面？",
"顾之衍按下录音键，语气没起伏：「电话里威胁当事人，这叫 {{intimidate|威吓}}；想拿商业排挤 {{coerce|胁迫}} 我们收手，只会适得其反。」",
"「另外，」他补了一句，「贵府二公子名下两家空壳公司的问题，我们手上有 {{witness|证人}}，也乐意用来 {{deter|威慑}} 一下。真要撕破脸，牌就都摊开。」先前那些硬话，被他 {{rebuff|断然拒绝}} 得干干净净。",
"电话那头沉默良久。再回电时，温父的声音低了八度，几乎是在 {{implore|恳求}}。",
"这一回，温家把姿态摆正了：公开道歉、足额赔偿、三日内见报，白纸黑字写成 {{irrevocable|不可撤回的}} 条款，{{pledge|承诺}} 一条条列明，违约金翻三倍。",
"顾之衍这才慢条斯理替苏晚开出条件，一页纸，三行字，{{non-negotiable|没得商量的}}：一、道歉声明原文须经她过目；二、赔偿金全额捐给受害员工基金；三、温家任何人，此生不得再进她的视线。",
"「这不是 {{haggle|讨价还价}}，」他说，「是底线。」",
"温家还想回去 {{confer|商讨}} 一番、再 {{deliberate|深思}} 两天，被直接 {{dismiss|不予理会}}；转头托人 {{solicit|请求}} 周前辈多说几句情，老爷子摆摆手：「人家三条 {{criteria|标准}} 清清楚楚，你们自己 {{ponder|权衡}}。」",
"温父在书房枯坐一夜，把利弊放上秤，一整晚 {{weigh|权衡}}：硬扛，{{forfeit|丧失}} 的是整个温氏；低头，丢的只是一个女儿的体面。天亮时，他签了字。那支笔落下去的时候，像用尽半生的力气。",
"和解见报那天，苏晚正在后院晒陈皮，闻讯只嗯了一声。温系残余势力最后一点 {{resistance|抵制}}，也在见报当日烟消云散。",
"陈默奉命送来一箱新会陈皮，顺带传话：「霍总说，温家若再纠缠，霍氏法务随叫随到。」",
"「替我谢谢他。」苏晚把箱子搬进门，语气淡淡，「我的账我自己清。温家想用 {{interpersonal|人际的}} 关系网翻盘，霍家若替我挡了，我反倒欠下新账。」",
"陈默挠挠头没敢接话。他隐约觉得，自家老板在苏晚这里的信用额度，大概还停在「认识」这一档。",
"几天后，霍母亲自登门。她在 {{threshold|门槛}} 外站定，没往里闯，双手把礼盒递上：「不请自来是 {{intrusion|打扰}}，我这个 {{visitor|访客}} 只在门口说话。上个月的事，是我这个做母亲的混账，今天来赔不是。」",
"苏晚请她进屋喝茶。霍母捧着茶盏半晌开不了口，最后 {{candid|坦率的}} 地说了实话：「当年扣你母亲的东西，是怕你图霍家的钱。现在想想，用 {{deceit|欺骗}} 猜度人的，才是我自己。」",
"「您这份 {{sincerity|诚意}}，我收下了。」苏晚替她续茶，「{{sympathy|同情}} 不至于，{{empathy|共情}} 倒有一点——都是被那个家族规矩绑过半辈子的人。」",
"霍母眼圈一红：「人家都说你 {{relentless|不依不饶的}}，是他们不懂。你的硬是对着坏人的；你的 {{adamant|决不让步的}}，从来不是对着亲人的。」",
"临走，霍母提了个小请求：老爷子想请她除夕回家吃顿 {{reunion|团聚}} 饭。苏晚想了想，没点头也没摇头：「看情况。」",
"晚上，顾之衍来电话复盘，把协议从头捋了一遍：{{guarantee|保证}} 条款、{{assurance|保证}} 条款、{{commitment|承诺}} 条款，连违约责任都写得 {{conclusive|决定性的}} 干脆。「温家这次是彻底服了。你那三条 {{principle|原则}}，一步不退，他们照单全收。」",
"「名号从来不是我的 {{priority|优先事项}}。」苏晚望着窗外，「重要的是，有人想拿 {{humanitarian|人道的}} 话术裹挟我，有人想用眼泪讨 {{mercy|宽恕}}、博 {{compassion|怜悯}}——都没用。该办的办，该拒的拒，日子才清爽。」",
"「不过说真的，」顾之衍笑了笑，「温念薇托人带话，说想见你一面，有 {{verbal|口头的}} 遗言交代。」",
"「不必。」苏晚的回答没有一丝 {{relent|松动}}——{{unwavering|不动摇的}}，{{resolute|坚决的}} 得近乎冷淡，「她要说的话，三年前构陷我的时候，都说完了。」",
"挂了电话，她在院子里站了一会儿。夜风清凉，霓虹落在青石板上。她想，这半年把自己的 {{privacy|隐私}} 守成了一座小城：门外讲礼数，门内讲心情。人这一生，把 {{dignity|尊严}} 活成 {{integrity|正直}}，比什么体面都强；至于别人 {{hypocritical|虚伪的}} 眼泪，交给时间晾干就好。",
"对温念薇狱中递来的那封信，她连拆都没拆，随手 {{disregard|无视}}，扫进碎纸机。",
"{{persistent|执着的}} 这种事，用在正道上叫可贵，用在纠缠上，只叫烦。"
]},
{no:13,t:"城南的灯",ws:[["lease","n.","租约"],["landlord","n.","房东"],["carpenter","n.","木匠"],["electrician","n.","电工"],["plumbing","n.","水管"],["signage","n.","标识"],["renovate","v.","翻新"],["premises","n.","店址"],["blinds","n.","百叶窗"],["curtain","n.","窗帘"],["license","n.","执照"],["permit","n.","许可证"],["register","v.","注册"],["certificate","n.","证书"],["qualification","n.","资质"],["grocery","n.","杂货"],["florist","n.","花匠"],["barber","n.","理发师"],["tailor","n.","裁缝"],["pharmacist","n.","药剂师"],["lantern","n.","灯笼"],["clientele","n.","客户群"],["plaster","n.","膏药"],["utility","n.","水电费"],["consultation","n.","问诊"],["deposit","n.","押金"],["stall","n.","摊位"],["commodity","n.","商品"],["boutique","n.","精品店"],["wholesale","n.","批发"],["retail","n.","零售"],["purchase","n.","购买"],["merchandise","n.","商品"],["apprentice","n.","学徒"],["bazaar","n.","集市"],["ointment","n.","药膏"],["kettle","n.","水壶"],["utensil","n.","器皿"],["porcelain","n.","瓷器"],["medicinal","adj.","药用的"],["fragrant","adj.","香的"],["commute","v./n.","通勤"],["bicycle","n.","自行车"],["metro","n.","地铁"],["intersection","n.","路口"],["dawn","n.","黎明"],["twilight","n.","黄昏"],["dusk","n.","薄暮"],["neon","n.","霓虹"],["midnight","n.","午夜"],["tenant","n.","租户"],["municipal","adj.","市政的"],["infrastructure","n.","基础设施"],["sanitation","n.","卫生"],["formula","n.","配方"],["awning","n.","雨棚"],["storefront","n.","店面"],["downtown","n.","市中心"],["suburb","n.","近郊"],["workshop","n.","工坊"],["alley","n.","巷子"],["boulevard","n.","林荫大道"],["pedestrian","n.","行人"],["recipe","n.","药方"],["vicinity","n.","附近"]],
ps:[
"六月里，城南老街的蝉鸣一日盛过一日。苏晚盘下街口那间两层老铺。签 {{lease|租约}} 那天，{{landlord|房东}} 是位退休老教师，只提一个条件：老房子，别改得面目全非。",
"苏晚本就打算修旧如旧：老 {{carpenter|木匠}} 打柜台，老 {{electrician|电工}} 重排线路，{{plumbing|水管}} 换成新的铜管；招牌也克制，一方原木 {{signage|标识}}，只刻三个字——拾晚堂。",
"{{renovate|翻新}} 整整四十天。她白天盯工，晚上画图，把两层 {{premises|店址}} 隔出诊室、药房和一间晒药的小阳台：诊室挂竹 {{blinds|百叶窗}}，药房用靛蓝 {{curtain|窗帘}} 隔出阴凉。",
"执照的事有顾之衍跑动：行医 {{license|执照}}、经营 {{permit|许可证}}、{{register|注册}} 手续，连同奶奶师承的 {{certificate|证书}} 和她本人的 {{qualification|资质}} 证明，一样样办齐。",
"开张前一周，苏晚挨家送喜糖：卖 {{grocery|杂货}} 的阿婆、{{florist|花匠}} 小妹、{{barber|理发师}} 老赵、改衣裳的 {{tailor|裁缝}} 师傅，都笑呵呵说要来捧场。",
"对门坐堂的老 {{pharmacist|药剂师}} 拄着拐过来，绕柜台转了三圈，捏起一味陈皮闻了闻，点头：「地道。后生可畏。」",
"开张那天没有花篮鞭炮，只一盏 {{lantern|灯笼}} 挂上门楣，暮色四合时点亮，暖黄一方，像给整条街留的门灯。",
"头一拨 {{clientele|客户群}} 是街坊：程序员颈椎僵了，老教师久坐劳损，奶茶店小妹痛经，广场舞领队阿姨膝盖积液。苏晚来者不拒，三副 {{plaster|膏药}} 两帖汤方，收的诊金还不够付 {{utility|水电费}}。",
"{{consultation|问诊}} 有个小规矩：不收 {{deposit|押金}}，赊账记黑板上，好了再给。月底一看，黑板上一笔没欠——穷街坊的信用，比许多大人物都干净。",
"老 {{stall|摊位}} 主们也爱来凑热闹：卖 {{commodity|商品}} 的、开 {{boutique|精品店}} 的、做 {{wholesale|批发}} 和 {{retail|零售}} 买卖的，闲了就挤在门口闲话。柜上自制的酸梅汤和驱蚊香囊明码标价，街坊一次 {{purchase|购买}} 三五块，图个心安。这些小 {{merchandise|商品}}，苏晚做得比大生意还上心。",
"{{apprentice|学徒}} 阿满是捡回来的。十六岁，爹妈走得早，在 {{bazaar|集市}} 帮工烫伤了手，苏晚给他上了 {{ointment|药膏}}，他就不肯走了，非要拜师。",
"苏晚没收徒，只留他打杂。小伙子勤快：天不亮起来烧水，{{kettle|水壶}} 一把把坐上灶，{{utensil|器皿}} 洗得锃亮，{{porcelain|瓷器}} 药罐排成一列，晒药的竹匾翻得比谁都勤。",
"她教他的第一课是认药：「这是 {{medicinal|药用的}} 紫苏，那是 {{fragrant|香的}} 佩兰。药有药性，人有脾气，都得顺着来。」",
"老街的日子有老街的节奏。阿满住在阁楼，每天 {{commute|通勤}} 的距离只有一截楼梯；傍晚他蹬着二八 {{bicycle|自行车}} 去河堤买活鱼，说是比坐 {{metro|地铁}} 换三个口自在，回来路过 {{intersection|路口}}，车铃总摇得叮当响。",
"清晨 {{dawn|黎明}} 有豆花车吱呀过街，{{twilight|黄昏}} 收摊，{{dusk|薄暮}} 里 {{neon|霓虹}} 招牌次第亮起，{{midnight|午夜}} 前整条街睡熟。拾晚堂的灯笼，总是最后一个熄。",
"老街渐渐有了名气。有 {{tenant|租户}} 慕名搬来，就为离拾晚堂近点；{{municipal|市政的}} 规划图把这条街圈进保护名单，说 {{infrastructure|基础设施}} 要修旧如旧——房东们笑得合不拢嘴。",
"{{sanitation|卫生}} 检查来过两回，回回满分。检查员临走偷偷讨养生 {{formula|配方}}，苏晚送他一包酸梅汤料，皆大欢喜。",
"小暑那天，老木匠特意给门口搭了一方 {{awning|雨棚}}，说看苏晚晒药怕淋雨。街坊都说，这条街多少年没这么齐心地疼过一个人了。",
"阿满问过她：这间 {{storefront|店面}} 不大，又不在 {{downtown|市中心}}，连 {{suburb|近郊}} 那些新区的门诊部都比不过，您图什么？",
"「图它有人气。」苏晚在 {{workshop|工坊}} 台前碾着药，头也不抬，「你看这条街，{{alley|巷子}} 里下棋的，{{boulevard|林荫大道}} 上遛鸟的，{{pedestrian|行人}} 来来往往，谁家有事喊一嗓子，全街都应。人待在这样的地方，病都好得快。」",
"「再说了，」她把刚誊好的一页 {{recipe|药方}} 折起来，「医馆开在街坊的 {{vicinity|附近}}，比开在十里外的闹市有用。灯要亮在人回家的路上，才有意义。」",
"这话后来被老街坊口口相传，成了拾晚堂门口的半副对联：不救急难处，只亮回家路。",
"入夜收摊，苏晚站在门口看灯笼的光铺满青石板。她想起在霍家的三年，灯永远是为客人亮的；如今在城南，灯是为回家的人亮的。",
"七月半，老宅的例行电话来了：一切向好，药膳照旧。她挂了电话，把日历翻到下一页——日历背面，还压着一张泛黄的世界地图，是奶奶当年行医用旧的。",
"她还不知道，一场横跨半个地球的远行，正等着她。"
]},
{no:14,t:"旧疾与新局",ws:[["screening","n.","筛查"],["hereditary","adj.","遗传的"],["trait","n.","特征"],["genetic","adj.","基因的"],["predisposition","n.","易患体质"],["checkup","n.","体检"],["diet","n.","饮食"],["lifestyle","n.","生活方式"],["sedentary","adj.","久坐的"],["physique","n.","体格"],["dietary","adj.","饮食的"],["sodium","n.","钠"],["caffeine","n.","咖啡因"],["tobacco","n.","烟草"],["protein","n.","蛋白质"],["vitamin","n.","维生素"],["fiber","n.","纤维"],["sugar","n.","糖"],["calorie","n.","卡路里"],["appetite","n.","胃口"],["digest","v.","消化"],["alcohol","n.","酒"],["intake","n.","摄入量"],["gastric","adj.","胃的"],["nicotine","n.","尼古丁"],["ulcer","n.","溃疡"],["inflammation","n.","炎症"],["fatigue","n.","疲乏"],["posture","n.","体态"],["swelling","n.","肿胀"],["excessive","adj.","过度的"],["burnout","n.","过劳"],["indigestion","n.","消化不良"],["quit","v.","戒掉"],["abstain","v.","戒除"],["bedtime","n.","就寝时间"],["habit","n.","习惯"],["drowsy","adj.","困倦的"],["yawn","v.","打哈欠"],["doze","v.","打盹"],["moderation","n.","适度"],["balanced","adj.","均衡的"],["vigorous","adj.","有活力的"],["workout","n.","锻炼"],["jog","v.","慢跑"],["stretch","v.","拉伸"],["yoga","n.","瑜伽"],["treadmill","n.","跑步机"],["addictive","adj.","上瘾的"],["mindfulness","n.","正念"],["meditation","n.","冥想"],["bruise","n.","瘀伤"],["nocturnal","adj.","夜间的"],["slumber","n.","睡眠"],["vaccine","n.","疫苗"],["supplement","n.","补剂"],["antibody","n.","抗体"],["offspring","n.","后代"],["bloodline","n.","血统"],["lineage","n.","血脉"],["clan","n.","家族"],["bond","n.","纽带"],["follow-up","n.","复诊"],["matriarch","n.","女家长"],["sibling","n.","兄弟姐妹"]],
ps:[
"立秋后，老爷子例行 {{follow-up|复诊}}。搭脉、看舌、听诊，一套做完，苏晚沉吟了一下：「爷爷，我建议霍家直系，都做一次心脏 {{screening|筛查}}。」",
"「您这个病，」她斟酌着措辞，「有 {{hereditary|遗传的}} 底子。脉象里那点 {{trait|特征}}，我在您两个儿子身上都摸到过苗头——{{genetic|基因的}} 的事，瞒不住。」",
"「当然，{{predisposition|易患体质}} 不等于定病，」她补一句，「但 {{checkup|体检}} 必须年年做。这个病，最会欺负不肯体检的硬汉。」",
"老爷子当场拍板全家体检。霍母第一个响应，顺势把苏晚拉住问了半下午：从 {{diet|饮食}} 到 {{lifestyle|生活方式}}，从 {{sedentary|久坐的}} 如何伤腰，到 {{physique|体格}} 如何靠养不靠补，一路问到底。",
"苏晚给她开了个轻方子，{{dietary|饮食的}} 三原则：少 {{sodium|钠}}、少 {{caffeine|咖啡因}}、少 {{tobacco|烟草}}；{{protein|蛋白质}} 和 {{vitamin|维生素}} 补够，{{fiber|纤维}} 优先，{{sugar|糖}} 减到最少，{{calorie|卡路里}} 自然就下来了。",
"「您 {{appetite|胃口}} 好是福气，但得 {{digest|消化}} 得动才划算。」苏晚笑，「{{alcohol|酒}} 能免则免，{{intake|摄入量}} 整体减三分之一就好。」",
"霍母一一记下，连 {{nicotine|尼古丁}} 贴片都托人买了——她那点烟瘾，是年轻时陪应酬落下的。",
"全家体检报告出来那天，霍家老宅炸了锅。",
"霍沉的报告最扎眼：{{gastric|胃的}} 镜下两处 {{ulcer|溃疡}} 伴 {{inflammation|炎症}}，心律不齐，{{fatigue|疲乏}} 指标爆表；连轴的会议熬得他 {{posture|体态}} 都变了形，颈肩 {{swelling|肿胀}}，一按一个坑。",
"医生批注毫不客气：长期 {{excessive|过度的}} 应酬加 {{burnout|过劳}}，{{indigestion|消化不良}} 都算轻的，再熬下去要出大事。",
"报告转到苏晚手上时，她正在给霍母贴耳豆。扫完那页纸，她语气平平：「{{quit|戒掉}} 夜酒，{{abstain|戒除}} 应酬烟，三餐定时，{{bedtime|就寝时间}} 前一小时停工作。做不到，就不必找我调。」",
"「这不是 {{habit|习惯}} 问题，」她把报告递回去，「是命问题。」",
"霍母在旁帮腔：「小时候让你午睡你装 {{drowsy|困倦的}}，现在好了吧！」说着自己先打了个 {{yawn|哈欠}}——为这几份体检报告，她一夜只 {{doze|打盹}} 了两个钟头。",
"霍沉站在廊下捏着报告，半晌，问：「怎么调？」",
"「先照做三个月。」苏晚收针，「{{moderation|适度}} 两个字，比什么名贵补品都管用。{{balanced|均衡的}} 三餐，{{vigorous|有活力的}} 但不过量的 {{workout|锻炼}}——从每天 {{jog|慢跑}} 二十分钟、睡够七小时开始。」",
"「再加十分钟 {{stretch|拉伸}} 和 {{yoga|瑜伽}}；健身房里 {{treadmill|跑步机}} 慢走就好。」她写处方笺，「至于烟酒 {{addictive|上瘾的}} 那部分，靠 {{mindfulness|正念}} 和 {{meditation|冥想}} 戒，比硬扛稳。」",
"霍沉一条条应下，破天荒没还嘴。陈默在一旁感动得想哭——老板这回是真怕了，还是另有心思，他不敢深想。",
"最不服的是霍父。他自诩铁人，年轻时胳膊上落了 {{bruise|瘀伤}} 都不进医院，{{nocturnal|夜间的}} 应酬照旧，{{slumber|睡眠}} 全靠酒劲，{{vaccine|疫苗}} 嫌疼不打，{{supplement|补剂}} 更是嗤之以鼻——去年体检提醒他 {{antibody|抗体}} 偏低，他把单子折了当扇子用。「我的身体，我自己有数。」",
"老爷子把报告摔过去：临界的高血压、脂肪肝苗头，样样都是预警。「下个月陪我复查。你敢不来试试。」",
"霍父嘴硬：「我们这一辈就我一个男丁，您孙子都已经是 {{offspring|后代}} 里最有出息的了，我还能垮？」",
"「{{bloodline|血统}} 的事，你少贫嘴。」老爷子吹胡子，「霍家这条 {{lineage|血脉}}，我守了一辈子，到你们手里更不许断！」",
"霍父拗不过，约了复查。霍母私下跟苏晚叹气：「这一家子男人，{{clan|家族}} 观念重，脸又薄，你多担待。我嫁进霍家这些年，连个 {{sibling|兄弟姐妹}} 帮衬的都没有，全靠自己撑。」她如今对苏晚换了称呼，从「苏小姐」叫成了「晚晚」。",
"「体检这道坎，他们会迈过去的。」苏晚合上脉案，「但 {{bond|纽带}} 这种事我帮不了——医得了身，医不了心。老宅那桌除夕饭，我想了想，还是不去了。」",
"霍母眼里的光暗了暗，还是笑着点头：「不急。哪天想通了，老宅的门一直开着，就当多门走动的亲戚。」",
"话是这么说，回程车上她还是红了眼眶。当了二十多年 {{matriarch|女家长}}，她头一回明白：有些墙是她亲手砌的，如今要亲手拆，砖砖瓦瓦都烫手。",
"秋初，温家案宣判：温念薇数罪并罚获刑十二年，温父罚金并具结悔过，涉案公司悉数清算。城里的报纸只当旧闻登了个角落——没人再关心温家。",
"倒有条不起眼的新闻被陈默圈了出来：温氏珠宝最后一栋总部大楼挂牌拍卖，温家彻底退出这座城市的商业版图。他犹豫半天，还是没敢拿给老板看——温家的事，现在谁提谁挨瞪。",
"那天夜里，苏晚在账本上写完最后一笔，抬头看月历。老爷子的药膳换了秋方，霍沉的胃疼终于轻了些，霍母的烟减到一天三根。她合上账本想：都上新局了，挺好。",
"而千里之外，霍父正登上飞往海外矿区的航班，电话里跟老爷子说：这边谈完就回，别惦记。",
"谁也没想到，这一去，就是一场大变。"
]},
{no:15,t:"夜航",ws:[["nightfall","n.","入夜"],["international","adj.","国际的"],["abroad","adv.","在国外"],["overseas","adj.","海外的"],["delay","n.","延误"],["pressing","adj.","紧迫的"],["crisis","n.","危局"],["takeoff","n.","起飞"],["baggage","n.","行李"],["passport","n.","护照"],["visa","n.","签证"],["itinerary","n.","行程"],["runway","n.","跑道"],["mask","n.","面纱"],["charter","v.","包"],["cabin","n.","机舱"],["oxygen","n.","氧气"],["stretcher","n.","担架"],["monitor","n.","监护仪"],["ventilator","n.","呼吸机"],["paramedic","n.","急救员"],["consultant","n.","会诊医生"],["boarding","n.","登机"],["ascend","v.","爬升"],["airborne","adj.","在空中的"],["turbulence","n.","气流"],["altitude","n.","海拔"],["mystique","n.","神秘感"],["longitude","n.","经线"],["equator","n.","赤道"],["hemisphere","n.","半球"],["cruise","v.","巡航"],["latitude","n.","纬度"],["cardiologist","n.","心内科医生"],["specialist","n.","专家"],["interpreter","n.","口译员"],["attire","n.","穿着"],["coordinate","n.","坐标"],["layover","n.","中转停留"],["refuel","v.","加油"],["customs","n.","海关"],["stopover","n.","中途停留"],["voyage","n.","航程"],["helicopter","n.","直升机"],["mission","n.","任务"],["jet","n.","喷气机"],["aisle","n.","过道"],["cockpit","n.","驾驶舱"],["tray","n.","托盘"],["distress","n.","危难"],["coma","n.","昏迷"],["critical","adj.","危重"],["intensive","adj.","加护的"],["navigation","n.","导航"],["countdown","n.","倒计时"],["overnight","adj.","通宵的"],["horizon","n.","地平线"],["adjust","v.","适应"],["vigil","n.","守夜"],["atlas","n.","地图册"],["compass","n.","罗盘"],["reckoning","n.","清算时刻"],["descend","v.","下降"],["landing","n.","降落"],["determination","n.","决心"]],
ps:[
"九月末的一个深夜，报丧似的电话打进霍家老宅时，距离 {{nightfall|入夜}} 才过去三个钟头。",
"{{international|国际的}} 矿区传来消息：霍父在谈判桌上突然栽倒，心源性休克。当地诊所条件简陋，人已推进抢救室，主治医生的原话是：能不能撑过今夜，看天意。老爷子其实早就想拦他这一趟 {{abroad|在国外}} 的差事，被一句「集团要紧」顶了回来；如今人躺在 {{overseas|海外的}} 病床上，音讯隔着八千里。",
"老宅一夜无眠。霍母哭到脱力，霍沉连夜调度，半小时后攥着一串批复站在堂屋：「医疗专机两小时后起飞。{{delay|延误}} 全部跳过，直飞矿区——眼下最 {{pressing|紧迫的}} 就是这一件事，别的都可以放。」",
"老爷子摆手打断他：「请晚先生。」",
"满屋寂静。霍沉喉结动了动：「爷爷，传闻晚先生从不接外诊，只凭机缘。」",
"「那也请。」老爷子的声音不容置疑，「当年我这颗心，是他从阎王手里拽回来的。你父亲这个 {{crisis|危局}}，我只信他。」",
"电话是程伯打的。苏晚听完只问一句：「几点 {{takeoff|起飞}}？」",
"「两小时后。」电话那头顿了顿，「晚先生，老爷子说……求您了。」",
"苏晚披衣起身。夜里的城南很静，她把随身药箱翻检一遍：金针、随身灸、几味救急的成药，一样样码进 {{baggage|行李}}。",
"去机场的路上，顾之衍的电话追上来：「{{passport|护照}}、{{visa|签证}} 都在周律师手里，落地手续已确认；{{itinerary|行程}} 同步给了航司，一路绿灯。」他顿了顿，「晚先生，海外那边，靠您了。」",
"「嗯。」苏晚望着车窗外的夜色。为霍家人出这一趟远门——三年前，她不会信。",
"机场 {{runway|跑道}} 边，霍沉已经到了。见到素色长衫、以 {{mask|面纱}} 覆面的晚先生，他整个人僵在原地——那个身形，那个步态，上个月他隔着车窗见过一模一样的背影。他攥紧文件，把那个疯狂的念头压下去：不可能。",
"专机是 {{charter|包}} 下来的医疗机，{{cabin|机舱}} 改成了小型监护舱：{{oxygen|氧气}} 瓶、{{stretcher|担架}}、{{monitor|监护仪}}、{{ventilator|呼吸机}} 一应俱全，另随一位 {{paramedic|急救员}} 和一位心外 {{consultant|会诊医生}}。",
"{{boarding|登机}} 完毕，跑道灯亮成一条河。飞机 {{ascend|爬升}} 拔地，穿过云层；离地那一刻起，这方 {{airborne|在空中的}} 小舱，就是霍父唯一的移动病房。",
"爬升遇上一段 {{turbulence|气流}}，{{altitude|海拔}} 表的数字一格一格往上跳。苏晚闭目养神，心里过的是心源性休克的四种转归。",
"霍沉坐在对面，一路无言。陈默缩在角落大气不敢出——他头一回这么近地面对这位裹在传说和 {{mystique|神秘感}} 里的人物，总觉得哪里见过，又不敢细想。",
"航线图上，{{longitude|经线}} 与纬线织成一张网，蓝线一拐，跨过 {{equator|赤道}}，穿过两个 {{hemisphere|半球}}；进入 {{cruise|巡航}} 后，{{latitude|纬度}} 一度一度往下坠。",
"巡航高度上，随行医生远程调阅病历，苏晚听完，只补了三句修改意见。屏幕那头，海外的 {{cardiologist|心内科医生}} 沉默了十秒，问：「请问，您是哪位？」",
"「晚。」她答了一个字。",
"「晚——晚先生？！」对方的英语都劈了，「那个金针续命的晚先生？！」",
"海外的联络频道瞬间炸了。当地 {{specialist|专家}} 组连夜重排方案，{{interpreter|口译员}} 在三个频道里来回传话；连矿区合作方的老太太都顾不得 {{attire|穿着}}，披件外衣就冲进了医务楼。",
"苏晚报出一串 {{coordinate|坐标}} 让机组同步地面：航路气象窗口提前两小时。又列转运清单：升压方案、抗凝时机——「这趟不做 {{layover|中转停留}}，加满油直飞，{{refuel|加油}} 压缩到二十分钟；入境 {{customs|海关}} 走绿色通道，医疗设备提前报备。」",
"{{stopover|中途停留}} 点的血库备案，她要求逐站核对；落地后由矿区机场直转医院，四十分钟 {{voyage|航程}} 的 {{helicopter|直升机}} 也提前协调好了，分秒必争。",
"霍沉全程在听。他看着那个瘦削的身影把一切安排到分钟，忽然懂了：他在董事会上见过的所有运筹，加起来都不如这一场 {{mission|任务}} 的一半惊心动魄。",
"中途遇上一片颠簸区，苏晚睁眼只说两个字：「绕开。」机长应声调转航向——这架 {{jet|喷气机}} 上的指令链，明明白白，是这位最年轻的女客在掌。",
"夜航十三个小时，她没合眼。{{aisle|过道}} 对面，霍沉同样睁着眼；{{cockpit|驾驶舱}} 传来的气象、航路、油量，她一条条听完，随时修订方案。",
"{{tray|托盘}} 餐食她只动了两口。霍沉递过去一杯温水，她摆手谢绝：「马上进抢救流程，空腹。」他握着纸杯站在原地，第一次真切地明白：这间舱里，他帮不上任何忙。",
"还剩两小时航程时，{{distress|危难}} 信号再度传来：病人一度陷入浅 {{coma|昏迷}}，血压又掉了一次，情况 {{critical|危重}}；当地 {{intensive|加护的}} 措施全开，也只勉强吊着。",
"苏晚让随机医生传话：加大氧流量，抬高下肢，掐人中——老法子不是不科学，是替身体争时间。机长的 {{navigation|导航}} 屏上，最后的 {{countdown|倒计时}} 开始跳动。她低声补了一句：「赢下来的每一分钟，都是他的。」",
"{{overnight|通宵的}} 长途末段，云层尽头透出一线 {{horizon|地平线}} 的鱼肚白。霍沉算着时差，好不容易 {{adjust|适应}} 过来的生物钟提醒他：国内，天也快亮了。",
"老宅那头，老爷子的 {{vigil|守夜}} 也是一整晚。案头那本翻旧的 {{atlas|地图册}} 被他一页页又对了一遍，手边搁着当年跑船用的老 {{compass|罗盘}}。霍母端来的参茶凉了三道，他一口没动。",
"「爷爷，」视频里霍沉说，「晚先生在机上，您放心。」",
"老人家沉默半晌，说了句没头没尾的话：「沉啊，有些债，霍家欠了人家三年。往后，你拿命还。」霍沉望着屏幕，忽然觉得这一晚是场 {{reckoning|清算时刻}}：等父亲醒来，他也该开始还账了。",
"飞机开始 {{descend|下降}}，{{landing|降落}} 灯亮起。苏晚最后一次核对方案，抬眼看向霍沉：「落地后你只做一件事——签所有该签的字。别的问题，别问我。」",
"「好。」他答得没有一丝犹豫。苏晚转回头去，握针的手，多了一分旁人看不见的 {{determination|决心}}。"
]},
{no:16,t:"晴天霹雳",ws:[["seizure","n.","抽搐"],["arrest","n.","心搏骤停"],["resuscitate","v.","复苏"],["prognosis","n.","预后"],["mortality","n.","死亡率"],["bleak","adj.","黯淡的"],["necrosis","n.","坏死"],["ischemia","n.","缺血"],["blockage","n.","堵塞"],["clot","n.","血栓"],["thrombosis","n.","血栓症"],["valve","n.","瓣膜"],["aorta","n.","主动脉"],["hypertension","n.","高血压"],["hypotension","n.","低血压"],["hypoxia","n.","缺氧"],["angina","n.","心绞痛"],["ventricle","n.","心室"],["edema","n.","水肿"],["viable","adj.","可行的"],["procedure","n.","医疗操作"],["stent","n.","支架"],["gamble","n.","赌博"],["bypass","n.","搭桥"],["graft","n.","移植"],["lesion","n.","病灶"],["transfusion","n.","输血"],["donor","n.","献血者"],["grim","adj.","严峻的"],["hemorrhage","n.","出血"],["paralysis","n.","瘫痪"],["inevitable","adj.","不可避免的"],["fatal","adj.","致命的"],["slim","adj.","渺茫的"],["odds","n.","胜算"],["bet","n.","赌局"],["miracle","n.","奇迹"],["trauma","n.","外伤"],["syndrome","n.","综合征"],["operation","n.","手术"],["invasive","adj.","侵入性的"],["authoritative","adj.","权威的"],["reverence","n.","敬畏"],["defer","v.","听从"],["pivotal","adj.","关键的"],["tumult","n.","骚动"],["complication","n.","并发症"],["gauze","n.","纱布"],["iodine","n.","碘伏"],["swab","n.","棉签"],["forceps","n.","镊子"],["suture","n.","缝线"],["bandage","n.","绷带"],["casualty","n.","伤亡"],["drastic","adj.","激烈的"],["scalpel","n.","手术刀"],["reluctance","n.","不情愿"],["torment","n.","折磨"],["bolt","n.","霹雳"],["misery","n.","苦难"],["adrenaline","n.","肾上腺素"],["defibrillator","n.","除颤仪"],["anesthetic","n.","麻醉剂"],["anguish","n.","极度痛苦"],["hiatus","n.","间歇"]],
ps:[
"落地、转运、交接，一气呵成。四十分钟的航程把死亡线上的人抢了回来——也只抢回来一半。",
"矿区医院的走廊里挤满白大褂。值班医生念完汇报，嗓子是哑的：心源性休克合并大面积梗死，室颤两次，浑身 {{seizure|抽搐}} 样发作一回，院内骤停一次——翻译成人话：{{arrest|心搏骤停}}，{{resuscitate|复苏}} 抢回来一遭，随时可能有第二遭。",
"「{{prognosis|预后}} 很差。」主任医生说得直白，「这种病例，放在任何医院，{{mortality|死亡率}} 都一半对一半往上。就算转运回国，路上任何一次颠簸都可能是最后一次。前景 {{bleak|黯淡的}}，听懂了吗。」",
"苏晚听完，只把片子往灯箱上一插。梗死核心区已见 {{necrosis|坏死}}，边缘一片 {{ischemia|缺血}} 带还吊着活性；主支 {{blockage|堵塞}} 位置刁钻，近端 {{clot|血栓}} 随时可能脱落，{{thrombosis|血栓症}} 的警报没解除；二尖 {{valve|瓣膜}} 反流加重，{{aorta|主动脉}} 压不稳，上午血压两头跳——{{hypertension|高血压}} 与 {{hypotension|低血压}} 轮流坐庄。",
"她一条条问：氧饱和多少？答：一直低位 {{hypoxia|缺氧}}。房颤几次？答：{{angina|心绞痛}} 间歇发作，左 {{ventricle|心室}} 功能掉到正常人的四成。脚上的 {{edema|水肿}} 按下去，半天弹不回来。",
"结论只有一个：唯一 {{viable|可行的}} 路线，是先稳内环境，再谈 {{procedure|医疗操作}}。此刻上 {{stent|支架}} 等于 {{gamble|赌博}}；{{bypass|搭桥}} 更别提，{{graft|移植}} 条件根本不具备。",
"「国内专家几点到？」霍沉问。",
"「下午。」",
"这一上午，苏晚把人从鬼门关里又拽出来一截：升压、抗凝、化解 {{lesion|病灶}} 周边的水肿带，{{transfusion|输血}} 备上两份——矿区血库的 {{donor|献血者}} 名录她亲自过了一遍，存量薄得像纸。",
"中午，病危通知书送到霍沉面前。他捏着笔，看着 {{grim|严峻的}} 措辞：恶性心律失常、脑 {{hemorrhage|出血}}、急性 {{paralysis|瘫痪}}——这些 {{inevitable|不可避免的}} 风险，白纸黑字。他这辈子签过上百份合同，头一回觉得笔有千斤重。",
"「先签。」苏晚的声音在旁边响起，「犹豫的功夫，{{fatal|致命的}} 变数不等人。」",
"霍沉落笔，字迹歪得不像他。他问：「是不是很 {{slim|渺茫的}}。有多大 {{odds|胜算}}。」",
"「你把我这当赌 {{bet|赌局}}？」她隔着面纱看他，「医学不是掷骰子。但我可以告诉你：他每多撑一小时，{{miracle|奇迹}} 就厚一分。」",
"下午三点，国内专家团到了——清一色的名字，平时挂一号难求。带队的权威教授看完病历，脸色比谁都难看：没有 {{trauma|外伤}}，问题全在心内；这么重的 {{syndrome|综合征}}，他行医四十年，见过的不超过一掌之数。",
"会诊室里吵成一锅粥。有人主张立即 {{operation|手术}}，有人坚决反对 {{invasive|侵入性的}} 干预，有人提议人工心肺——五个人，六种意见。",
"吵到最凶时，一直沉默的晚先生忽然开口。她不提声音，只把方案掰开揉碎：什么能做，什么不能做，什么现在做等于杀人。满室的 {{authoritative|权威的}} 口吻安静下来，最倔的老教授眼里都带了三分 {{reverence|敬畏}}，不自觉 {{defer|听从}} 她的临床判断。",
"「这台手术是全程的 {{pivotal|关键的}} 一仗。不是不能做，是现在不能做。三到五天窗口期，把人托进窗口，是诸位的事；窗口里那把刀，我来递。」",
"老教授盯着她看了半晌，忽然问：「晚先生，令师到底是谁？」",
"「家师姓什么不重要。」她收病历，「重要的是，令弟三年前那台手术，是我递的刀。」",
"老教授的手抖了一下——那台手术，国内医学圈整整传了三年。",
"会议室里的 {{tumult|骚动}} 慢慢平息。老教授最终拍板：按晚先生的方案来——先把 {{complication|并发症}} 一个个摁住，窗口期，全力配合。",
"深夜，霍沉守在病房外。隔着玻璃看那个素色身影俯身查看——{{gauze|纱布}}、{{iodine|碘伏}}、{{swab|棉签}}、{{forceps|镊子}}、{{suture|缝线}}、{{bandage|绷带}}，每一样东西都听她调动，唯独他这个儿子，没有一件事用得上。他头一次发现，自己引以为傲的一切，在这里轻得像纸。",
"后半夜，苏晚出来，摘下手套：「今天的 {{casualty|伤亡}} 关，算是过了。往后四十八小时，{{drastic|激烈的}} 变数随时来。家属要做的只有一件：别添乱。」",
"「我能问一句吗，」霍沉哑声说，「您为什么肯来？」",
"苏晚系上药箱扣，隔着面纱看了他一眼：「在你父亲的病历上，我只看得见病灶和方案。{{scalpel|手术刀}} 不认姓氏，药不认恩仇。」",
"「而且，」她补了一句，声音轻了些，「我有过 {{reluctance|不情愿}}。但从接电话那一刻起，病床上就只有一个病人。」",
"她说完就走，白衣角扫过门框，像一阵不带走任何东西的风。",
"霍沉站在原地，心口某处像被什么 {{torment|折磨}} 着——那个背影熟悉得过分。三年前那个人在雨里替他熬汤送药，何尝不是这样：明明可以不管，却偏偏把每件事都做到最好。",
"国内的消息是当天傍晚传回老宅的。程伯念完电文，满堂寂静——对霍家来说，这一晚无异于晴天一道 {{bolt|霹雳}}。霍母当场就哭了，连日的 {{misery|苦难}} 全挂在脸上。",
"老爷子闭着眼靠在椅背上，很久，只说了一句：「我在等晚先生的信。」",
"当晚十点，一封手写的病情摘要送到老宅，条分缕析，末尾一行小字：勿慌，有我在。",
"老爷子把那页纸折好，贴身收着，谁也不许碰。",
"而在矿区医院，凌晨四点，监护仪骤响。苏晚冲进去时，房颤又来了。",
"{{adrenaline|肾上腺素}} 推注，{{defibrillator|除颤仪}} 充电，{{anesthetic|麻醉剂}} 备台——一整套动作行云流水。五分钟后，那条线终于稳了。",
"苏晚直起身，额角全是汗。霍沉在门口把这一幕看得清清楚楚：她站的位置、施救的手法，和那年寿宴上救爷爷时，一模一样。",
"一个荒唐的念头，再一次压不住了。",
"但下一秒他就被自己 {{anguish|极度痛苦}} 地否了——万一是呢？万不是呢？他不敢想，也没资格问。晚先生的规矩摆在那里：只谈病，不谈人。",
"窗外，矿区凌晨的风裹着尘。这一夜的 {{hiatus|间歇}} 之后，是七十二小时雷区。所有人都清楚：这场仗，才刚开头。"
]},
{no:17,t:"会诊",ws:[["laboratory","n.","实验室"],["specimen","n.","样本"],["sample","n.","样品"],["biopsy","n.","活检"],["culture","n.","培养"],["assay","n.","化验"],["reagent","n.","试剂"],["centrifuge","n.","离心机"],["microscope","n.","显微镜"],["slide","n.","载玻片"],["interpretation","n.","解读"],["assessment","n.","评估"],["objection","n.","反对"],["hypothesis","n.","假设"],["empirical","adj.","实证的"],["clinical","adj.","临床的"],["trial","n.","试验"],["control","n.","对照组"],["peer","n.","同行"],["journal","n.","期刊"],["literature","n.","文献"],["placebo","n.","安慰剂"],["citation","n.","引用"],["precision","n.","精确"],["rebuttal","n.","反驳"],["inspection","n.","检查"],["consensus","n.","共识"],["controversy","n.","争议"],["conventional","adj.","常规的"],["complementary","adj.","互补的"],["alternative","adj.","替代的"],["skeptical","adj.","怀疑的"],["dissent","n.","异议"],["analysis","n.","分析"],["origin","n.","产地"],["cultivation","n.","栽培"],["harvest","n.","采收"],["sustainability","n.","可持续"],["substandard","adj.","不达标的"],["endangered","adj.","濒危的"],["palpation","n.","触诊"],["percussion","n.","叩诊"],["auscultation","n.","听诊"],["technique","n.","技术"],["botany","n.","植物学"],["flora","n.","植物群"],["pharmacology","n.","药理学"],["interaction","n.","相互作用"],["indication","n.","适应症"],["contraindication","n.","禁忌症"],["adverse","adj.","不良的"],["overdose","n.","过量"],["acupoint","n.","穴位"],["holistic","adj.","整体的"],["moxibustion","n.","灸"],["cupping","n.","拔罐"],["massage","n.","推拿"],["potency","n.","药效"],["calibration","n.","校准"],["decoction","n.","汤剂"],["tincture","n.","酊剂"],["granule","n.","颗粒剂"],["crude","adj.","生的"],["dispense","v.","配药"],["proficiency","n.","熟练程度"]],
ps:[
"正式大会诊定在第二天上午九点。会议桌上摆了三样东西：国内顶级团队的方案、矿区医院的检验单，和晚先生一页手写的脉案——三足鼎立，谁也不服谁。",
"西医师的流程走完了：{{laboratory|实验室}} 里 {{specimen|样本}} 齐全——血 {{sample|样品}} 六管，心肌酶全套两次，谈不上 {{biopsy|活检}}，倒是做了细菌 {{culture|培养}}，{{assay|化验}} 报告摞了半尺高。{{reagent|试剂}} 是国际冷链空运的，{{centrifuge|离心机}} 转了整夜，{{microscope|显微镜}} 下连 {{slide|载玻片}} 都编了号。",
"数据没有争议。争议在于 {{interpretation|解读}}。",
"「我的 {{assessment|评估}} 是保守治疗。」老教授敲着片子，「谁有 {{objection|反对}}，请拿证据。」",
"「拿证据？」一位海归专家冷笑，「贵方那位晚先生的方案，连 {{hypothesis|假设}} 都不算，何谈 {{empirical|实证的}} 支持？中草药没有 {{clinical|临床的}} 双盲 {{trial|试验}}，没有 {{control|对照组}}，没有 {{peer|同行}} {{journal|期刊}} 收录，{{literature|文献}} 检索为零——我把话放这，这就是 {{placebo|安慰剂}}。」",
"会议室安静了两秒，随即嗡的一声炸开。",
"苏晚没生气。她把一叠复印件推到长桌中央，{{citation|引用}} 格式规规矩矩——近十年，中医药干预在心衰管理领域的三十多篇系统性综述，英文的，她一页页圈了结论。",
"「第一，」她说，「您说的 {{controversy|争议}}，我承认存在；{{conventional|常规的}} 医学与 {{complementary|互补的}}、{{alternative|替代的}} 疗法之争，吵了一百年，不差您这一票。第二，{{skeptical|怀疑的}} 是科学精神，我很尊重；但 {{dissent|异议}} 要建立在读过的 {{analysis|分析}} 上——这三十七篇，请先读完。」",
"「第三，」她翻开自己的脉案，「我从不要求任何人信我。我只要求对等：给我七十二小时，数据说话。若指标不涨，我立刻退场，方案全盘归您。」",
"海归专家被噎住了。他翻了翻那沓纸——数据库、页码、{{precision|精确}} 到日的收录时间——最后嘟囔了一句「我保留 {{rebuttal|反驳}} 权」，坐下了。",
"老教授看看左右，一锤定音：「方案并行，全程 {{inspection|检查}} 交叉验证，七十二小时后复盘。就这样，形成 {{consensus|共识}}。」散会前，他多问了一句：「晚先生，您那些方子，药从哪来？矿区可没有道地药材。」",
"「这个我来。」顾之衍接口。他昨晚就把合作药房的联络表发进了群：{{origin|产地}} 直采、{{cultivation|栽培}} 记录齐全、{{harvest|采收}} 时节标注到日、{{sustainability|可持续}} 认证齐备；凡 {{substandard|不达标的}} 药材一律退回。至于穿山甲、犀角这类 {{endangered|濒危的}} 名录货色，他家药房从不碰——「这是底线，也是法律。」",
"会诊后，苏晚去查房。当着三位专家的面，她三指搭脉，{{palpation|触诊}} 配 {{percussion|叩诊}}，再 {{auscultation|听诊}}——这一整套 {{technique|技术}} 行云流水，连老教授都跟着学了一遍手法。",
"「从 {{botany|植物学}} 讲，这个方子七味主药，{{flora|植物群}} 分属四个科；」她一边写医嘱一边说，「从药理讲各有分工。{{pharmacology|药理学}} 讲 {{interaction|相互作用}}，西药之间有，中西药之间也有——所以我把服药时间和你们的给药错开两小时。」",
"「{{indication|适应症}} 和 {{contraindication|禁忌症}} 都在医嘱单上。{{adverse|不良的}} 反应监测项目，每四小时记一次；过了量就是 {{overdose|过量}}，一丝一毫都不行。」",
"她说话的时候，指尖在一个 {{acupoint|穴位}} 上按了按。霍父的眉头松了松。",
"老教授在旁边看着，忽然低声感慨：「难怪祖上说，上医治未病。这一手 {{holistic|整体的}} 功夫，我们这一代，丢得太多了。」",
"隔壁治疗室里，护士在准备外治：艾 {{moxibustion|灸}} 的条香、{{cupping|拔罐}} 的负压罐、{{massage|推拿}} 用的精油——矿区的医生们全围过来看稀奇。",
"海归专家站在门口看了很久，最后问了一句：「晚先生，那些药的 {{potency|药效}}，靠什么保证？」",
"「{{calibration|校准}}。」苏晚答得干脆，「每一批进药，指纹图谱、含量测定，三次复核；煎药的 {{decoction|汤剂}} 用定量器，{{tincture|酊剂}} 用滴定管，{{granule|颗粒剂}} 用天平；{{crude|生的}} 药材和炮制品分开管理，{{dispense|配药}} 双人核对。这不是玄学，是工艺。」",
"海归专家盯着她看了半晌，忽然笑了：「晚先生，我收回昨天的话。您这 {{proficiency|熟练程度}}，比我们实验室的规程还严。」",
"当天夜里，霍父第一次短暂清醒。",
"他睁眼的时间只有五分钟。看见床边的素色身影，他浑浊的眼睛动了一下，喉咙里滚出几个含混的字：「像……苏……」",
"苏晚手上的动作没有停，替他掖好被角：「您认错了。喝药。」",
"霍父昏昏沉沉地咽下那口药，又睡了过去。他不知道自己说了什么，更不知道，门口的霍沉把那半个字听得清清楚楚。",
"霍沉扶着门框站了很久。",
"夜里，他给陈默发消息：查一下，苏家——都有什么人。",
"发出去十秒，他又撤回了。",
"晚先生的规矩，他记得：只谈病，不谈人。可有些念头，像种子落进石缝，风一吹，就往深处扎根。"
]},
{no:18,t:"条件",ws:[["authority","n.","授权"],["autonomy","n.","自主权"],["discretion","n.","自行裁量"],["veto","n.","否决权"],["breach","v.","违反"],["foundation","n.","基金会"],["rare","adj.","罕见的"],["dialysis","n.","透析"],["preserve","v.","保留"],["demolish","v.","拆除"],["earmark","v.","指定用途"],["volunteer","n./v.","志愿"],["accessible","adj.","可及的"],["ratify","v.","批准"],["charitable","adj.","慈善的"],["philanthropy","n.","慈善"],["fiscal","adj.","财政的"],["nonprofit","adj.","非营利的"],["donation","n.","捐赠"],["grant","n.","拨款"],["endow","v.","捐资"],["landmark","n.","地标"],["allocate","v.","分配"],["fund","v.","资助"],["welfare","n.","福利"],["mandate","n.","授权"],["sponsor","v.","赞助"],["brick","n.","砖"],["tile","n.","瓦"],["timber","n.","木"],["copper","n.","铜"],["eaves","n.","屋檐"],["historic","adj.","有历史意义的"],["restoration","n.","修复"],["conservation","n.","保护"],["bronze","n.","青铜"],["artifact","n.","器物"],["revitalize","v.","振兴"],["inclusion","n.","包容"],["disability","n.","残障"],["affordable","adj.","负担得起的"],["lifelong","adj.","终身的"],["disorder","n.","失调"],["ethical","adj.","伦理的"],["adhere","v.","遵守"],["violation","n.","违反"],["punitive","adj.","惩罚性的"],["abide","v.","遵守"],["amend","v.","修订"],["infringement","n.","违反"],["nullify","v.","作废"],["revoke","v.","撤销"],["supersede","v.","取代"],["goodwill","n.","善意"],["benevolent","adj.","仁慈的"],["magnanimous","adj.","宽宏的"],["animosity","n.","敌意"],["enmity","n.","仇恨"],["forgive","v.","原谅"],["altruistic","adj.","利他的"],["redemption","n.","救赎"],["conscience","n.","良知"],["morality","n.","道德"],["catheter","n.","导管"],["modest","adj.","谦逊的"]],
ps:[
"第三天，霍父的指标爬过了第一道坎。晚先生松了口：手术，她接。但在签字之前，她提了条件。三条，一页纸。",
"「其一，」她把纸推给霍沉，「治疗期间，医疗决策的 {{authority|授权}} 全在我：用什么药、何时手术、临时变更，皆凭我的 {{autonomy|自主权}}、我的 {{discretion|自行裁量}}，不受任何人干涉——包括你爷爷。老爷子那票 {{veto|否决权}}，也请先收起来。若做不到这一条，一切免谈。」",
"「其二，不问身份。不拍照，不录音，不外传；对外只称晚先生。谁 {{breach|违反}} 这条，我即刻退场，后果自负。」",
"「其三，」她顿了顿，「霍氏出资，做三件与本案无关的事。」",
"霍沉接过纸。第三条下面写着三行小字：一、注资 {{foundation|基金会}}，设立 {{rare|罕见的}} 病与 {{dialysis|透析}} 患者援助项目；二、南区老药市改造，原址 {{preserve|保留}}，不得 {{demolish|拆除}}；三、霍氏医药板块每年利润的一成，定向 {{earmark|指定用途}} 于中医药传承。三条之外还添了个小尾巴：项目落地后，霍氏员工每年安排 {{volunteer|志愿}} 服务日进社区做药理科普——「{{accessible|可及的}} 医疗，不是拨款就完事的。」",
"「这不是买卖。」霍沉看完，抬起头，语气竟是松了一口气的，「第一条，我现在就可以 {{ratify|批准}}。第二条，我以个人名义担保。第三条——董事会那边，我去讲。」",
"「第三条最难。」晚先生提醒他，「涉及 {{fiscal|财政的}} 拨付。董事会那帮人，一分钱都要吵三天。」",
"「那也去。」霍沉把纸折好收进内袋，「治病救人这种事，从来不该是 {{charitable|慈善的}} 施舍；霍家欠下的账，用 {{philanthropy|慈善}} 的名义还，天经地义。」",
"当晚的董事会开到凌晨。有人拍桌子：公司的钱不是做 {{nonprofit|非营利的}} 善堂；有人说 {{donation|捐赠}} 金额太大，{{grant|拨款}} 得走预算流程；还有人暗示，这是晚先生趁人之危。",
"霍沉听完，只把父亲的病危通知书复印件放在长桌上，一页页排开。",
"「各位。」他说，「我父亲躺在那个矿区，是 {{endow|捐资}} 一条街的 {{landmark|地标}} 要紧，还是给董事会省三成分红要紧？今天这几笔 {{allocate|分配}}，我以总裁权限 {{fund|资助}} 一半，剩下的一半，算我个人借款。」",
"满场哑然。半晌，最资深的老董事摘下眼镜：「{{welfare|福利}} 做在企业前头，生意反而做得更久。批了。」",
"散会时凌晨两点。陈默跟着老板走出大楼，忍不住小声问：「霍总，第三条里那个老药市……为什么非保不可？」",
"霍沉站在台阶上，望着南区的方向，很久没说话。他也不知道为什么——只是签署 {{mandate|授权}} 文书的时候，笔尖在那个条款上停了很久，像有什么东西替他做了决定。",
"后来陈默去查了：南区老药市，三十年前出过一位姓苏的女大夫，药铺一条街，救过半城人。这条街拆与不拆，规划图上改了七稿，悬了五年。",
"霍沉看完报告，把档案合上，只说了两个字：「保留。」",
"批复下来那天，老药市的原住民自发放了两挂鞭炮。青石 {{brick|砖}}、灰 {{tile|瓦}}、老 {{timber|木}} 梁、朽了的 {{copper|铜}} 门环、缺角的 {{eaves|屋檐}}，一并按 {{historic|有历史意义的}} 街区做 {{restoration|修复}} 与 {{conservation|保护}}；街口那家百年药铺的老 {{bronze|青铜}} 门匾，连同药柜、戥子等 {{artifact|器物}}，登记造册，原样陈列。沿街铺面加装坡道，把 {{inclusion|包容}} 与 {{disability|残障}} 通道一并做好，药价走 {{affordable|负担得起的}} 惠老档；霍氏每年还 {{sponsor|赞助}} 一场老药市文化节——整条街谈不上重建，是一场缓慢的 {{revitalize|振兴}}。",
"有老街坊给霍氏送来一筐自己晒的陈皮，说：「当年苏大夫在的时候，就这么个味儿。」",
"霍沉收到那筐陈皮，怔了很久。",
"矿区这边，条件谈妥，一切走上正轨。霍父那 {{lifelong|终身的}} 老毛病——三十年的烟酒，在晚先生的方子里一并管住：戒断方案、肝肾功能双护，代谢的 {{disorder|失调}} 一项项纠回来。「这一条是 {{ethical|伦理的}} 底线，」苏晚在戒断方案上敲了敲，「家属随我 {{adhere|遵守}}；谁 {{violation|违反}}，按条款 {{punitive|惩罚性的}} 扣他自己的零花钱。」",
"霍沉看着那条「家属 {{abide|遵守}} 条款」，哭笑不得：「扣我自己？」",
"「对。」苏晚头也不抬，「你签的字，一个字不许 {{amend|修订}}；谁 {{infringement|违反}} 我定的规矩，一样 {{nullify|作废}} 我的配合义务。到时候别怪我 {{revoke|撤销}} 方案、被别人 {{supersede|取代}}——你的医生，随时可以不是我。」",
"霍沉举手投降，转头把这几页纸锁进保险柜，比并购合同锁得还深。",
"深夜，霍母的越洋电话打进来，絮絮叨叨问了一小时。末了她忽然说：「沉啊，妈总觉得欠那位晚先生的，欠得没边了。人家要什么都不要，倒贴咱们一场 {{goodwill|善意}}。」",
"「妈。」霍沉打断她，「晚先生不要的，是想让我们自己想明白。{{benevolent|仁慈的}} 人救的是命，{{magnanimous|宽宏的}} 人放的是心。霍家这条命是捡回来的，别再弄丢了良心。」",
"电话那头，霍母吸了吸鼻子：「妈这半年的 {{animosity|敌意}}、{{enmity|仇恨}}，也该放下了。人家连你爸这条命都不计前嫌地救——{{forgive|原谅}} 这两个字，妈学着写。」",
"挂了电话，霍沉在病房外的长椅上坐下。夜风穿过走廊尽头的窗，把白天的喧嚣吹成很远的声音。",
"他想起白天董事会有人私下议论：这位晚先生图什么？{{altruistic|利他的}} 到这个地步，圣人吗？",
"霍沉想，或许吧。但他隐约觉得，那层面纱背后的东西，比 {{redemption|救赎}} 更旧，比 {{conscience|良知}} 更沉——像一个把 {{morality|道德}} 藏进药方里的人，顺手也把霍家的旧账，一笔一笔翻了出来。",
"病房里，霍父忽然咳了一声。护士进去的时候，他正望着窗外出神——手背上的 {{catheter|导管}} 换了新的，人清醒的时候越来越多了。",
"「听说……老药市保下来了？」他哑着嗓问。",
"「保下来了。」护士答，「听说是霍总亲自拍的板，还留了那家药铺。」",
"霍父的眼眶忽然就红了。他别过脸去，很久很久，说了一句谁也听不懂的话：「欠苏家的……又多了一笔……」",
"第二天查房，苏晚听完护士转述，脚步只顿了半秒，神色 {{modest|谦逊的}} 如常：「老人的话，听过就算。」"
]},
{no:19,t:"病人不是仇人",ws:[["delirium","n.","谵妄"],["babble","v.","呓语"],["hallucination","n.","幻觉"],["fidget","v.","烦躁不安"],["twitch","v.","抽动"],["moan","v.","呻吟"],["wince","v.","因痛缩脸"],["groan","v.","呻吟"],["flinch","v.","畏缩"],["frail","adj.","虚弱的"],["gaunt","adj.","消瘦的"],["ashen","adj.","灰白的"],["hatred","n.","憎恨"],["smolder","v.","郁积"],["seethe","v.","强压怒火"],["fester","v.","郁结"],["vindictive","adj.","怀恨的"],["loathing","n.","厌恶"],["aversion","n.","反感"],["abhor","v.","痛恨"],["perseverance","n.","毅力"],["resilience","n.","韧性"],["vocation","n.","天职"],["calling","n.","使命感"],["wrestle","v.","内心挣扎"],["grapple","v.","较劲"],["contend","v.","抗争"],["lucid","adj.","清醒的"],["exhale","v.","呼气"],["inhale","v.","吸气"],["lifespan","n.","寿命"],["divulge","v.","透露"],["survive","v.","存活"],["perish","v.","死亡"],["rehabilitation","n.","康复训练"],["convalesce","v.","调养"],["haggard","adj.","憔悴的"],["quiver","v.","颤抖"],["bedside","n.","床边"],["sleepless","adj.","不眠的"],["drained","adj.","精疲力竭的"],["attentive","adj.","体贴的"],["withhold","v.","隐瞒"],["disclose","v.","揭露"],["reveal","v.","揭示"],["confession","n.","忏悔"],["repress","v.","压抑"],["stupor","n.","昏沉"],["predicament","n.","窘境"],["restraint","n.","克制"],["daybreak","n.","破晓"],["uphold","v.","坚守"],["detachment","n.","超脱"],["confide","v.","吐露"],["catharsis","n.","宣泄"],["unburden","v.","卸下重担"],["benefactor","n.","恩人"],["rapport","n.","默契"],["custodian","n.","守护者"],["guardianship","n.","监护"],["honorable","adj.","光明磊落的"],["mobility","n.","行动能力"],["caregiver","n.","照护者"],["credibility","n.","可信度"],["righteous","adj.","正义的"]],
ps:[
"手术定在第五天。最后这一夜，苏晚守在病房，谁也不叫。",
"后半夜，霍父烧得迷迷糊糊，{{delirium|谵妄}} 上来了。他开始 {{babble|呓语}}，声音碎成一截一截：「药王谷……我不去……不对不住……」",
"陪夜的护士出去换液体。病房里只剩仪器的声音，和他断断续续的 {{hallucination|幻觉}}。",
"苏晚坐在床边，看着他 {{fidget|烦躁不安}} 地扯被角，手指偶尔 {{twitch|抽动}} 一下，喉咙里 {{moan|呻吟}} 着谁也听不懂的音节。",
"「对不住谁？」她轻声问，明知对方答不上来。",
"霍父没有回答。换个液体的时候，他 {{wince|因痛缩脸}}；喉咙里 {{groan|呻吟}} 了一声，眉头拧紧，像怕谁把什么东西收走。",
"苏晚替他掖被角，指尖碰到他 {{frail|虚弱的}} 手腕，他像被烫到似的 {{flinch|畏缩}} 了一下——这只手签过对她不利的每一份家族决议，如今 {{gaunt|消瘦的}} 得只剩一层皮，{{ashen|灰白的}} 脸上全是病气。",
"说不恨，是假的。",
"这三年她见惯了这家人给她的脸色。有些 {{hatred|憎恨}} 埋在心里三年，看似冷却，其实 {{smolder|郁积}}；夜深人静时会 {{seethe|强压怒火}}，在没人看见的角落 {{fester|郁结}}。她有过 {{vindictive|怀恨的}} 时刻，也有 {{loathing|厌恶}} 与 {{aversion|反感}} 交杂的时刻——恨一个家庭的做派，{{abhor|痛恨}} 一种被轻贱的处境。",
"可是药王谷出来的规矩压着这一切：遇病先医，遇债后算。师门十年给了她 {{perseverance|毅力}} 和 {{resilience|韧性}}，也给了她更重要的一条：{{vocation|天职}} 面前，恩怨靠后。",
"「行医是 {{calling|使命感}}，不是生意。」奶奶的原话，「病人躺在你面前，就不是仇人。」",
"道理她都懂。可道理和心，从来是 {{wrestle|内心挣扎}} 的两方——她这些年一直在跟自己 {{grapple|较劲}}，此刻依然 {{contend|抗争}} 着。",
"天快亮时，霍父忽然 {{lucid|清醒的}} 了一阵。他望着天花板，忽然开口：「晚先生在吗。」",
"「在。」",
"「我这病……是报应吧。」他 {{exhale|呼气}} 很长，{{inhale|吸气}} 很短，「我这条 {{lifespan|寿命}}，做了不少亏心事……要是熬不过去，替我跟那个人说一声……我到死，都没敢 {{divulge|透露}} 的……」",
"「熬不过去的话，留给家属说。」苏晚打断他，「你现在的任务只有一件：{{survive|存活}}。往 {{perish|死亡}} 那边多走一步，都算我失职。康复的事，{{rehabilitation|康复训练}} 的事，一件一件来。能 {{convalesce|调养}} 到什么程度，一半看医，一半看你肯不肯配合。」",
"霍父望着她，浑浊的眼睛湿了。「你……到底是谁家孩子。」",
"「您的医生。」苏晚答，「只谈病，不谈人。」",
"霍父合上眼。有滚烫的东西从他 {{haggard|憔悴的}} 眼角滑下去。他 {{quiver|颤抖}} 着动了动嘴唇，什么也没说出来。",
"天光爬上窗帘时，他重新睡熟。苏晚站在 {{bedside|床边}} 收拾针具，一夜 {{sleepless|不眠的}}，人有点 {{drained|精疲力竭的}}。",
"推开病房门，霍沉就守在外面，{{attentive|体贴的}} 地递来一杯温水。他的眼睛也熬红了，见她出来，张了张嘴：「我父亲的呓语……您都听见了吧。」",
"「听见了。放心，该我 {{withhold|隐瞒}} 的，一个字不会往外 {{disclose|揭露}}；该他自己说的，我也不会替他 {{reveal|揭示}}。至于他到底想对谁 {{confession|忏悔}}，等他自己清醒了说。」",
"「好。」霍沉点点头，没再问。他其实是怕问——父亲的呓语里有太多旧年的东西，一碰，全是灰。",
"走廊那头，陈默抱着文件打盹，听见动静跳起来。看见苏晚，他 {{repress|压抑}} 着一夜的紧张，小心翼翼地说：「晚先生，我第一次跟着熬通宵，现在脑子跟 {{stupor|昏沉}} 灌了浆似的。」",
"「去睡。」苏晚说，「手术前你们要做的，是把体力留给第五天。」",
"晨光漫上窗台的时候，顾之衍的电话准时打进来。他问她：「这一趟，{{predicament|窘境}} 摆得这样满，你 {{restraint|克制}} 得住吗？值吗？」",
"「值不值，不该由恨来答。」苏晚望着 {{daybreak|破晓}} 的天际线，「我答应过师父，{{uphold|坚守}} 这个行当的规矩。人在病里，就是病人；出了病房，恩怨归恩怨。」",
"「你这份 {{detachment|超脱}}，」顾之衍感慨，「一半是天性，一半是修行。」",
"「也有撑不住的时候。」苏晚忽然笑了笑，「今晚跟你 {{confide|吐露}} 一段：前天夜里，我把那页旧药方翻出来抄了一遍，抄到一半，哭了。哭完，{{unburden|卸下重担}}——原来我不是不恨，是把恨叠好，收进了该收的地方。就当一场 {{catharsis|宣泄}}。」",
"电话那头沉默了一会儿。「他要是知道为自己递刀的是谁，」顾之衍轻声说，「怕是连病都吓好了。」",
"「所以他不需要知道。」苏晚收线，「至少现在不需要。」",
"上午交班，矿区医院给晚先生腾了间休息室。苏晚靠着椅背阖眼片刻，听见两个护士在门口小声聊天：这位晚先生真是霍家的 {{benefactor|恩人}}；也是怪了，霍总跟他那份 {{rapport|默契}}，倒不像头回认识。",
"苏晚闭着眼，眼睫都没动一下。",
"倒是陈默这个 {{custodian|守护者}} 型特助，把这句闲话收进耳朵里，心里那点疑影又冒了头。他不敢跟老板提，只能私下做起了 {{guardianship|监护}} 一样的观察笔记：晚先生出现的日子、苏小姐出诊的日子，从来没撞过车。",
"他盯着自己那张排班表看了一下午，越看心越虚，最后把纸折起来塞进钱包夹层——{{honorable|光明磊落的}} 人不做亏心事，他这是……为科学求真。",
"傍晚，霍父的烧退了。{{mobility|行动能力}} 暂时谈不上，但他已经能在护士搀扶下坐起来，喝完一整碗粥——托 {{caregiver|照护者}} 们把好消息第一时间报到了走廊那头。",
"手术前夜，所有人各就各位。霍沉在同意书上一笔一签，把 {{credibility|可信度}} 都押给了那位不肯露面的晚先生；苏晚在灯下最后过一遍方案，笔尖顿在 {{righteous|正义的}} 二字批注上——那是她写给自己的：不迁怒，不挟私，不误一刀。"
]},
{no:20,t:"一纸方子",ws:[["compound","n.","复方"],["alkaloid","n.","生物碱"],["molecule","n.","分子"],["receptor","n.","受体"],["enzyme","n.","酶"],["hormone","n.","激素"],["insulin","n.","胰岛素"],["glucose","n.","葡萄糖"],["cholesterol","n.","胆固醇"],["renal","adj.","肾的"],["hepatic","adj.","肝的"],["pulmonary","adj.","肺的"],["respiratory","adj.","呼吸的"],["coronary","adj.","冠状的"],["regimen","n.","用药方案"],["tablet","n.","药片"],["pill","n.","药丸"],["anticoagulant","n.","抗凝剂"],["course","n.","疗程"],["diuretic","n.","利尿剂"],["taper","v.","逐渐减量"],["administer","v.","给药"],["intravenous","adj.","静脉的"],["infusion","n.","输注"],["drip","n.","点滴"],["absorption","n.","吸收"],["distribution","n.","分布"],["concentration","n.","浓度"],["dissolve","v.","溶解"],["soluble","adj.","可溶的"],["emulsion","n.","乳剂"],["powder","n.","药粉"],["suspension","n.","混悬液"],["paste","n.","糊剂"],["solvent","n.","溶剂"],["excretion","n.","排泄"],["dilute","v.","稀释"],["harmless","adj.","无害的"],["serum","n.","血清"],["electrolyte","n.","电解质"],["plasma","n.","血浆"],["platelet","n.","血小板"],["hemoglobin","n.","血红蛋白"],["antigen","n.","抗原"],["turnaround","n.","好转"],["steady","adj.","平稳的"],["parameter","n.","参数"],["fluctuation","n.","波动"],["peak","n.","峰值"],["spike","n.","骤升"],["indicator","n.","指标"],["variable","n.","变量"],["plateau","n.","平台期"],["rebound","n.","反弹"],["recurrence","n.","复发"],["vessel","n.","血管"],["capillary","n.","毛细血管"],["saline","n.","生理盐水"],["eligibility","n.","手术资格"],["slot","n.","排期"],["timeline","n.","时间线"],["milestone","n.","里程碑"],["curative","adj.","有疗效的"],["efficacy","n.","疗效"],["formidable","adj.","难对付的"]],
ps:[
"第五天凌晨，方案定稿。晚先生把那页方子钉在交班板上，像钉下一面旗。",
"老教授带着团队围着看。七味药的 {{compound|复方}}，底下附着一张现代药理注解表：每味主药的 {{alkaloid|生物碱}} 与黄酮 {{molecule|分子}} 对应靶点——强心组分走 {{receptor|受体}}，活血化瘀组抑制 {{enzyme|酶}} 的异常表达，利水组调节 {{hormone|激素}} 水平的紊乱。",
"「人体这台机器，」苏晚在表上敲了敲，「{{insulin|胰岛素}}、{{glucose|葡萄糖}}、{{cholesterol|胆固醇}} 三个值是本周的关卡；{{renal|肾的}} 清除率、{{hepatic|肝的}} 代偿、{{pulmonary|肺的}} 通气，一项盯不牢，满盘皆输。{{respiratory|呼吸的}} 支持随时待命，{{coronary|冠状的}} 供血是主战场。」",
"「具体的 {{regimen|用药方案}}：晨间 {{tablet|药片}} 常规剂量，午间汤剂一剂，睡前 {{pill|药丸}} 减半；西药 {{anticoagulant|抗凝剂}} 按原 {{course|疗程}} 走，利尿的 {{diuretic|利尿剂}} 从今天起 {{taper|逐渐减量}}——一天的量，都排成了钟点。」",
"「所有口服药，{{administer|给药}} 前后半小时不进茶。{{intravenous|静脉的}} 通道维持两条，{{infusion|输注}} 速率我来定，{{drip|点滴}} 不许任何人动。」",
"海归专家把注解表翻来覆去看了三遍，忽然问：「晚先生，药的 {{absorption|吸收}} 和 {{distribution|分布}}，您怎么估？」",
"「按 {{concentration|浓度}} 曲线估。」苏晚调出一张手绘图，「汤剂煎煮后有效成分 {{dissolve|溶解}} 完全，可 {{soluble|可溶的}} 组分半衰期短，所以一日三服；脂溶性的部分做成 {{emulsion|乳剂}}，全草 {{powder|药粉}} 装囊，难溶的走 {{suspension|混悬液}}，外用的熬成 {{paste|糊剂}}——剂型不是玄学，是 {{solvent|溶剂}} 力学。」",
"「至于代谢，」她补了一句，「{{excretion|排泄}} 走肾的组分我每天核对尿量，{{dilute|稀释}} 与浓缩之间，就是有效与 {{harmless|无害的}} 的分界。」",
"海归专家盯着那张手绘曲线图看了很久，最后说了一句：「这张图，比我们的仿真软件画得还细。」",
"第一天，数据平平。",
"第二天清晨，第一份血气报告出来：{{serum|血清}} 酶指标掉头向下，{{electrolyte|电解质}} 两项回正，{{plasma|血浆}} 的 {{platelet|血小板}} 计数稳住了，{{hemoglobin|血红蛋白}} 回了半格；免疫那头的 {{antigen|抗原}} 负荷也降了。",
"老教授捏着报告单的手都在抖：「这个 {{turnaround|好转}} 速度……教科书要改写了。」",
"苏晚只扫了一眼：「{{steady|平稳的}} 才刚开始。盯 {{parameter|参数}}，别庆祝。」",
"第二天入夜，麻烦来了：血压 {{fluctuation|波动}} 加大，凌晨一点到过一个 {{peak|峰值}}，三点又是一次 {{spike|骤升}}。值班医生慌了要加药，被苏晚按住。",
"「先看曲线。」她把二十四小时的 {{indicator|指标}} 拉平，「这是 {{variable|变量}} 在找新平衡，维持原方案，观察两小时。」",
"两小时后，血压回落，曲线进入一条缓慢的 {{plateau|平台期}}。老教授服了：「换我，早就过度干预了。」",
"第三天中午，最险的 {{rebound|反弹}} 没有出现，{{recurrence|复发}} 的警报解除。心功能 {{vessel|血管}} 供血改善，末梢 {{capillary|毛细血管}} 的充盈时间从五秒回到两秒，输液也撤掉了高渗的 {{saline|生理盐水}} 组合。",
"「明天可以手术了。」傍晚复盘会上，苏晚合上病历，「他的 {{eligibility|手术资格}}，今天下午评过，够格。手术 {{slot|排期}} 定在明早八点，{{timeline|时间线}} 提前一小时，各组按新表走。」",
"「这条 {{milestone|里程碑}}，」老教授感慨，「是中医药交出的答卷。」",
"「是中西医一起交的。」苏晚纠正他，「我这方子 {{curative|有疗效的}} 部分，一半靠他们把监测做到了分钟。{{efficacy|疗效}} 从来不是某一味药的独角戏。」",
"会议室安静了几秒。那位海归专家站起来，向晚先生伸出手：「这三天，是我行医以来最 {{formidable|难对付的}} 一课——对手是偏见，赢的是病人。手术台上，我给您当助手。」",
"苏晚和他握了握手，没有多余的话。",
"散会后，霍沉在楼梯间拦住她，递上一份文件：「手术授权书我签了。另外，术后交接的团队名单您过目，都是老教授挑的人。」",
"「嗯。」苏晚接过，翻到一半忽然停住——名单末尾多了一行手写的小字：无论明日结果如何，霍家谢晚先生。落款：霍沉。",
"「谢字太早。」她把名单合上，「先谢手术顺利。」",
"「那就先谢一个人。」霍沉看着她，语气很稳，「谢您让我父亲这一周，活得像个人。」",
"苏晚没接这句话，转身上了楼。夜风从楼梯间的窗口灌进来，把那句没说完的道谢，吹散在矿区深蓝的夜里。",
"而远在八千里外的老宅，老爷子把当天的病情简报读了三遍，又让程伯读了两遍。",
"「去准备。」他放下纸，「明天，全家的电话守在跟前。」",
"霍母抹着眼睛问：「爸，您怎么就信得过这位晚先生？」",
"老爷子望着堂屋的匾，答非所问：「十年前我去京城看病，见过他师父一面。那老先生说过一句话，我记到今天——药治得了病，治不了命；能改命的，是手里有药还不肯敷衍的人。」",
"「晚先生这一周，没有敷衍一个字。」",
"「明天的手术，」老爷子合上眼睛，「要是晚丫头在跟前，我这颗心还能再定三分。」",
"程伯低下头。全霍家，只有他知道：晚先生此刻在的地方，正是晚丫头在的地方。"
]},
{no:21,t:"验血单",ws:[["hematology","n.","血液学"],["coagulation","n.","凝血"],["elevated","adj.","升高的"],["transient","adj.","一过性的"],["hematocrit","n.","血细胞比容"],["bracket","n.","区间"],["aggregation","n.","聚集"],["baseline","n.","基线"],["erratic","adj.","不规律的"],["discrepancy","n.","差异"],["replicate","v.","复核"],["statistical","adj.","统计的"],["halt","v.","叫停"],["institute","v.","实施"],["checklist","n.","核对单"],["waver","v.","犹豫"],["anomaly","n.","异常"],["latent","adj.","潜伏的"],["margin","n.","余地"],["overrule","v.","推翻"],["reschedule","v.","改期"],["shelve","v.","搁置"],["window","n.","窗口期"],["undertake","v.","承担"],["underlying","adj.","潜在的"],["forecast","v.","预判"],["serology","n.","血清学"],["panel","n.","组合检验"],["marker","n.","标志物"],["quantitative","adj.","定量的"],["qualitative","adj.","定性的"],["autoimmune","adj.","自身免疫的"],["acquired","adj.","后天的"],["congenital","adj.","先天的"],["conservative","adj.","保守的"],["prudent","adj.","审慎的"],["preventive","adj.","预防的"],["contingency","n.","应变预案"],["limit","n.","限度"],["significant","adj.","显著的"],["rigorous","adj.","严格的"],["creatinine","n.","肌酐"],["urea","n.","尿素"],["albumin","n.","白蛋白"],["trend","n.","走向"],["biomarker","n.","生物标志物"],["deviation","n.","偏差"],["numeric","adj.","数值的"],["trajectory","n.","轨迹"],["sporadic","adj.","零星的"],["asymptomatic","adj.","无症状的"],["intermittent","adj.","间歇的"],["negligible","adj.","可忽略的"],["guideline","n.","指南"],["pending","adj.","待定的"],["tenuous","adj.","微弱的"],["overlap","v.","重叠"],["intertwine","v.","交织"],["entangle","v.","纠缠"],["orchestrate","v.","统筹"],["paradoxical","adj.","反常的"],["unexplained","adj.","无法解释的"],["dormant","adj.","蛰伏的"],["cloak","v.","掩盖"],["blur","v.","模糊"]],
ps:[
"手术日清晨六点，最后一轮术前化验的血样送进了 {{hematology|血液学}} 室。",
"七点二十，第一份报告回传。七点四十，第二份。两份报告并排摆上桌时，苏晚的眉心拢了起来。",
"{{coagulation|凝血}} 一栏，D-二聚体 {{elevated|升高的}}，纤维蛋白原 {{transient|一过性的}} 走高；血细胞比容 {{hematocrit|血细胞比容}} 落在正常 {{bracket|区间}} 的下缘，血小板 {{aggregation|聚集}} 功能却一反 {{baseline|基线}}，活跃得 {{erratic|不规律的}}。",
"「{{discrepancy|差异}} 太多。」她把两份报告钉在一起，「检验科 {{replicate|复核}} 过吗？」",
"「复核了，{{statistical|统计的}} 曲线也拉了。」值班检验师答，「数据是真的。」",
"苏晚闭了闭眼。手术，得 {{halt|叫停}}。",
"消息传到会议室，炸了锅。麻醉组已经 {{institute|实施}} 了术前 {{checklist|核对单}}，器械台铺到一半，病人也进了术前间——这个节骨眼叫停？",
"海归专家第一个表态：「换成三个月前的我，会硬上。可今天我也 {{waver|犹豫}} 了——这一栏 {{anomaly|异常}} 背后，可能藏着一个新的 {{latent|潜伏的}} 血栓源。术中脱落的 {{margin|余地}}，赌不起。」",
"老教授盯着报告看了半晌，一锤定音：「晚先生的判断，我 {{overrule|推翻}} 不了——手术 {{reschedule|改期}}。先 {{shelve|搁置}} 台次，重排 {{window|窗口期}}。」",
"霍沉是被程伯扶着才坐住的。他一夜没睡，指尖把同意书捏得发白：「就……没有别的办法？」",
"「有。」苏晚把一页新医嘱推过去，「办法就是等，但要有人 {{undertake|承担}} 等的风险，也要有 {{contingency|应变预案}} 兜底。这一周，把 {{underlying|潜在的}} 问题 {{forecast|预判}} 干净——{{serology|血清学}} 复查四项、炎症 {{panel|组合检验}} 两套、抗磷脂 {{marker|标志物}} 加测，{{quantitative|定量的}} 与 {{qualitative|定性的}} 各留一组。」",
"「若 {{autoimmune|自身免疫的}} 抗体是 {{acquired|后天的}} 一过性反应，七天内会自己退；若是 {{congenital|先天的}} 高凝体质，那就 {{conservative|保守的}} 治疗到底，手术另择 {{prudent|审慎的}} 时机。」",
"「这不是退缩，」她把医嘱签了字，「是 {{preventive|预防的}} 医学。风险过线就停——我的 {{limit|限度}} 摆在这：宁可被骂十次胆小，不赌一次 {{significant|显著的}} 风险。」",
"海归专家在旁边轻声补了一句：「这才是真正 {{rigorous|严格的}} 的临床。教科书上写：外科医生最难学的，是收回手。」",
"病人推回病房时，天已经大亮。走廊里，霍沉追上苏晚，声音哑：「晚先生，今天这一停，我父亲会不会……怪我们？」",
"「他会谢你。」苏晚步子没停，「四十岁以后的心脏，经不起英雄主义。」",
"当天中午，第二批化验追加了。{{creatinine|肌酐}}、{{urea|尿素}}、{{albumin|白蛋白}} 三项肝肾指标平稳，{{trend|走向}} 良好；{{biomarker|生物标志物}} 里只有凝血管线整体 {{deviation|偏差}}。{{numeric|数值的}} 报告之外，她还要了床旁心电监护的 {{trajectory|轨迹}} 图——一段 {{sporadic|零星的}} 微小波幅，藏在常规页脚，谁都没留意过。",
"「{{asymptomatic|无症状的}} 房性早搏。」她圈出来，「{{intermittent|间歇的}} 发作——问题不大，但它解释了凝血为什么乱：身体一直在悄悄应激。这些 {{negligible|可忽略的}} 小波动，单独看都能放过；连起来看，就是证据。」",
"护理组连夜更新 {{guideline|指南}}：抗凝剂量逐日评估，任何 {{tenuous|微弱的}} 信号一律上报；{{pending|待定的}} 医嘱单独用红色标签。",
"这一夜，矿区的风照旧刮。苏晚在灯下把三份报告的交叉点一点点 {{overlap|重叠}} 比对：免疫、凝血、心律——三条线 {{intertwine|交织}}，新的方案在纸上渐渐 {{entangle|纠缠}} 成形——她要用一周，把这个新麻烦 {{orchestrate|统筹}} 进原方案里，而不是砍掉重来。",
"凌晨，她给老教授留了张字条：病情 {{paradoxical|反常的}}，疑点 {{unexplained|无法解释的}} 的部分已经收窄；三日为期，{{dormant|蛰伏的}} 风险不醒，如期上手术台。",
"写完，她站在窗前看了一会儿天色。夜色 {{cloak|掩盖}} 下的矿区灯火稀疏，晨光正一点一点把山的轮廓从黑暗里 {{blur|模糊}} 地剥出来——新的一天，新的战场。"
]},
{no:22,t:"走廊",ws:[["admission","n.","入院"],["referral","n.","转诊"],["suite","n.","病房套房"],["insurance","n.","保险"],["premium","n.","保费"],["policy","n.","保单"],["triage","n.","分诊"],["queue","n.","排队"],["orderly","n.","护工"],["gurney","n.","轮床"],["wheelchair","n.","轮椅"],["noticeboard","n.","布告栏"],["directory","n.","名录"],["pamphlet","n.","宣传册"],["brochure","n.","手册"],["usher","v.","引领"],["wristband","n.","腕带"],["technician","n.","技师"],["badge","n.","工牌"],["chart","n.","病历卡"],["lounge","n.","休息室"],["bench","n.","长椅"],["pager","n.","传呼机"],["grip","v.","紧握"],["loosen","v.","松开"],["wring","v.","绞"],["hallway","n.","走廊"],["edgy","adj.","紧张的"],["jittery","adj.","紧张不安"],["waiting","n.","等待"],["tedium","n.","枯燥等待"],["cafeteria","n.","自助餐厅"],["monotonous","adj.","单调的"],["escalator","n.","扶梯"],["footstep","n.","脚步声"],["tick","n.","滴答声"],["hourglass","n.","沙漏"],["drag","v.","拖延"],["elapse","v.","流逝"],["consent","n.","知情同意"],["brief","v.","简报"],["anxiety","n.","焦虑"],["foreboding","n.","不祥预感"],["omen","n.","预兆"],["trepidation","n.","忐忑"],["scrubs","n.","手术服"],["glove","n.","手套"],["stethoscope","n.","听诊器"],["vigilant","adj.","警觉的"],["reassure","v.","安抚"],["echo","n.","回声"],["heartbeat","n.","心跳"],["presence","n.","陪伴在场"],["update","n.","进展更新"],["notify","v.","通知"],["inform","v.","告知"],["confidentiality","n.","保密"],["discharge","n.","出院"],["slipper","n.","拖鞋"],["crutch","n.","拐杖"],["brace","n.","支具"],["crawl","v.","缓慢行进"],["console","v.","安慰"],["sigh","v.","叹气"],["clipboard","n.","写字夹板"]],
ps:[
"医疗专机落地首都机场，救护车队一路绿波，把霍父直接送进了国内顶级的梅岭心血管医院。",
"{{admission|入院}} 手续是顾之衍提前办妥的：绿色通道、独立 {{suite|病房套房}}、全天的 {{referral|转诊}} 记录无缝衔接；连商业 {{insurance|保险}} 的 {{premium|保费}} 理赔，都有专人拿着 {{policy|保单}} 逐条核对——矿区那套病历，凌晨就完成了电子移交。",
"急诊大楼的 {{triage|分诊}} 台前，{{queue|排队}} 的患者绕了半圈楼；{{orderly|护工}} 推着 {{gurney|轮床}} 与 {{wheelchair|轮椅}} 穿梭，门诊大厅的 {{escalator|扶梯}} 一格一格往上送人。墙上 {{noticeboard|布告栏}} 贴满科室 {{directory|名录}} 和健康 {{pamphlet|宣传册}}，取阅处的 {{brochure|手册}} 换了新的一摞。",
"霍父被 {{usher|引领}} 进独立病区时，腕上的 {{wristband|腕带}} 刷出一声轻响。值班 {{technician|技师}} 核对腕带、胸前的 {{badge|工牌}} 和病历 {{chart|病历卡}}，三方一致，才肯交接——这套流程，比霍氏的安保还严。",
"病房外，家属 {{lounge|休息室}} 的长 {{bench|长椅}} 上坐满了等待的人：有人捧着保温杯打盹，有人盯着 {{pager|传呼机}} 出神，有人一遍遍把 {{grip|紧握}} 的手 {{loosen|松开}} 又攥紧——{{wring|绞}} 手的姿势，全世界都一样。",
"霍家的位置在 {{hallway|走廊}} 尽头。这几日，这条走廊被霍家人走出了包浆：老爷子每日下午来坐一小时，霍母 {{edgy|紧张的}}，一天要数三回窗外的树；霍沉干脆把办公桌搬到了窗边，{{jittery|紧张不安}} 地核对每一份记录。",
"陈默负责夜班 {{waiting|等待}}。凌晨三点的 {{tedium|枯燥等待}} 里，他把 {{cafeteria|自助餐厅}} 的粥价背得滚瓜烂熟，{{monotonous|单调的}} {{footstep|脚步声}} 都数得出自己每晚走几个来回。",
"「滴、滴、滴。」监护仪的 {{tick|滴答声}} 像一只 {{hourglass|沙漏}}，时间从每一下响动里漏走。霍沉常常听着听着就 {{drag|拖延}} 着不肯睡——不是不困，是怕睡着的 {{elapse|流逝}} 里出事。",
"第七天傍晚，{{consent|知情同意}} 谈话做完，手术定回第八天清晨。霍沉在同意书上签字时，笔尖顿了很久——那一栏「术中意外授权」，他一个字一个字读完才落笔。",
"医生 {{brief|简报}} 完，霍母的 {{anxiety|焦虑}} 还没散：「能不能……再等等？」",
"「不能了。」霍沉替医生答，「爸的 {{foreboding|不祥预感}} 再拖，就成了真正的 {{omen|预兆}}。」",
"「手术前，谁都不许胡思乱想。」老爷子拄杖站起，一句话定住满屋 {{trepidation|忐忑}}，「等晚先生来了再议。」",
"晚先生到的时候，正撞上值班护士交接。白色 {{scrubs|手术服}}、薄 {{glove|手套}}、颈间一枚 {{stethoscope|听诊器}}——她还没进病房，先在走廊驻足，扫了一眼监护的中央屏。她一出现，家属区的空气就松了一半——这就是 {{reassure|安抚}} 的本事。",
"「{{vigilant|警觉的}} 习惯。」海归专家正好路过，替她解释，「晚先生看病房，先看趋势屏，再看人。」",
"霍沉站在 {{echo|回声}} 空旷的走廊里看着那个背影，{{heartbeat|心跳}} 莫名其妙地快了一拍。第七次了——每一次隔着一段距离见到晚先生，他都有这种没来由的安定感——那是一种说不清的 {{presence|陪伴在场}}，像多年前在暴雨里回头，看见屋檐下有人替他留着一盏灯。",
"「明天上台前，」苏晚对他说，「家属要做的最后一件事，是傍晚六点整来听 {{update|进展更新}}。其余时间，该吃吃，该睡睡。我会随时 {{notify|通知}} 你们任何变化——你们要随时能被 {{inform|告知}} 到，手机别静音。」",
"「另外，」她顿了顿，「病区里人多眼杂。家属的 {{confidentiality|保密}} 意识也要有：不打听晚先生是谁，不对外讨论病情。这条，也写进了你们的承诺里。」",
"「明白。」霍沉答。这一周他被走廊里的目光盯怕了——霍父的病不知怎么传出风声，楼下游客模样的人一天比一天多，全靠医院安保拦着。",
"当晚，霍母在 {{slipper|拖鞋}} 底下垫了两双厚袜，守在病房外打盹；老爷子被劝回了家，临走前把那只老怀表塞给霍沉：「明天六点，替我听结果。」",
"霍父倒是睡得着。晚先生已经把他的 {{discharge|出院}} 评估排到了术后第六周——眼下他胸前贴着 {{brace|支具}} 式的监护固定带，{{crutch|拐杖}} 都用不上，翻身都得叫人。半梦半醒间，他听见走廊里 {{crawl|缓慢行进}} 的脚步声，忽然哑着嗓子说了句：「明天……让我自己签。」",
"「已经替您签过了，霍董。」护士 {{console|安慰}} 他，「家属签的是备用授权，您本人术前还会再确认一遍。」",
"「那就好。」霍父望着天花板，忽然又问，「晚先生……明天主刀？」",
"「是。」",
"他「嗯」了一声，闭上眼：「那就……值。」",
"凌晨五点半，霍沉站在窗边看着天色一点点亮。他的心从没有像今天这样，又满又空——满的是八天来所有人对父亲的托举，空的是明天八点以后那扇手术室的门。他 {{sigh|叹气}} 了一口气，把怀表握进掌心。",
"六点整，走廊尽头传来 {{clipboard|写字夹板}} 敲门的声音——晚先生带着术前最后一份核查来了。"
]},
{no:23,t:"药理",ws:[["monarch","n.","君药"],["minister","n.","臣药"],["adjuvant","n.","佐药"],["messenger","n.","使药"],["compatibility","n.","配伍"],["bind","v.","结合"],["site","n.","位点"],["pathway","n.","通路"],["mechanism","n.","机制"],["antagonist","n.","拮抗剂"],["synergy","n.","协同"],["affinity","n.","亲和力"],["specificity","n.","特异性"],["selective","adj.","选择性的"],["evaluate","v.","评估"],["onset","n.","起效"],["duration","n.","持续时间"],["half-life","n.","半衰期"],["interval","n.","间隔"],["trough","n.","谷值"],["ceiling","n.","上限"],["suboptimal","adj.","欠佳的"],["optimize","v.","优化"],["maximize","v.","最大化"],["cumulative","adj.","累积的"],["minimize","v.","最小化"],["untoward","adj.","不良的"],["carcinogenic","adj.","致癌的"],["pharmacopoeia","n.","药典"],["antidote","n.","解毒药"],["grind","v.","研磨"],["mortar","n.","研钵"],["pestle","n.","药杵"],["sieve","n.","药筛"],["sift","v.","筛"],["gram","n.","克"],["balance","n.","天平"],["roast","v.","炒"],["chill","v.","冷藏"],["funnel","n.","漏斗"],["steep","v.","浸泡"],["charcoal","n.","炭"],["clay","n.","药土罐"],["vial","n.","小药瓶"],["dropper","n.","滴管"],["beaker","n.","烧杯"],["cylinder","n.","量筒"],["favorable","adj.","有利的"],["optimal","adj.","最佳的"],["hone","v.","打磨"],["conversion","n.","转化率"],["embed","v.","嵌入"],["incorporate","v.","纳入"],["integrate","v.","整合"],["assimilate","v.","同化"],["revise","v.","修订"],["hypnotic","adj.","安眠的"],["narrow","adj.","窄的"],["antipyretic","n.","退热药"],["antitussive","n.","止咳药"],["expectorant","n.","祛痰药"],["analgesic","n.","止痛药"],["laxative","n.","泻药"],["astringent","adj.","收敛的"],["propose","v.","提出"]],
ps:[
"手术定回第八天。这两天，苏晚把全部精力花在一张新方上——针对凝血异常和房性早搏的调整方，代号「稳心二号」。",
"新方的骨架，她用一页纸讲给团队听。",
"「方剂讲 {{monarch|君药}}、{{minister|臣药}}、{{adjuvant|佐药}}、{{messenger|使药}}——君药定主攻，臣药辅主攻，佐药制约毒性，使药引经报信。」她在白板上画下四层结构，「别当这是玄学，这是古代的配伍 {{compatibility|配伍}} 学：哪个成分 {{bind|结合}} 哪个 {{site|位点}}，走哪条 {{pathway|通路}}，讲的是同一个 {{mechanism|机制}}。」",
"「有协同就有拮抗。」她敲了敲白板，「西药里，一种药是另一种药的 {{antagonist|拮抗剂}}，药效就互相抵消；中药里这叫相恶。{{synergy|协同}} 与相恶，我都标在表上了。」",
"海归专家盯着那张表：「{{affinity|亲和力}} 和 {{specificity|特异性}} 的注记，你是按受体理论写的？」",
"「按受体理论写，按脉象调。」苏晚点头，「我 {{selective|选择性的}} 保留了现代药理的语言，方便诸位 {{evaluate|评估}}。」",
"老教授最关心时效：「起效多久？」",
"「{{onset|起效}} 半小时，{{duration|持续时间}} 六到八小时，{{half-life|半衰期}} 按体重折算过，{{interval|间隔}} 拉到八小时一次，{{trough|谷值}} 不落安全线以下。」她翻页，「剂量 {{ceiling|上限}} 卡死，宁可 {{suboptimal|欠佳的}}，不许过量。要 {{optimize|优化}} 的是组合，不是单项 {{maximize|最大化}}。」",
"「{{cumulative|累积的}} 毒性怎么防？」",
"「宁可 {{minimize|最小化}} 风险。三条线：肝肾功一天一查，{{untoward|不良的}} 反应清单贴在床尾，{{carcinogenic|致癌的}} 风险这几味为零——{{pharmacopoeia|药典}} 里逐条对过。」",
"老教授追问：「若术中出事，急救药呢？」",
"「{{antidote|解毒药}} 备三联，」苏晚早有预案，「鱼精蛋白对抗肝素，阿托品对抗迷走，第三联是中医的老三宝——写在抢救卡的背面，麻醉主任已经过了目。」",
"散会后，她一头扎进制剂室。新方里三味药要现制：三七粉现 {{grind|研磨}}，{{mortar|研钵}} 和 {{pestle|药杵}} 轮着来，{{sieve|药筛}} 过三道，{{sift|筛}} 出的细粉按 {{gram|克}} 称重——{{balance|天平}} 校到零误差才开工。",
"炮制更讲究。山楂要 {{roast|炒}} 到焦香入脾，牡蛎先煅后 {{chill|冷藏}} 研末，汤剂文火慢熬足时辰；滤药备双 {{funnel|漏斗}}，煨药用的一只老 {{clay|药土罐}}，是她从城南带来的。装药的 {{vial|小药瓶}}、{{dropper|滴管}}、{{beaker|烧杯}}、{{cylinder|量筒}} 摆成一排，全都提前灭菌。",
"有一味药需要冷浸过夜，{{steep|浸泡}} 的火候差一刻都不行。苏晚守到凌晨，把最后一滤 {{charcoal|炭}} 火撤掉时，天边已经泛白。",
"第二天上午，团队复评。海归专家把她的剂量表又算了一遍，抬头时神色复杂：「{{favorable|有利的}}。凝血曲线回到 {{optimal|最佳的}} 区间，早搏负荷掉了一多半。」",
"「这就是那味使药的功劳。」苏晚收拾器材，「引经的药走的是代谢旁路，把整方的 {{conversion|转化率}} 提了一成半——方子是要一环一环 {{hone|打磨}} 的。」",
"老教授把新方抄录了一份，说要带回去给研究生当教材：「这一手，把传统方剂 {{embed|嵌入}} 了现代评价体系，又把现代监测 {{incorporate|纳入}} 了传统框架——两头都 {{integrate|整合}} 了。」",
"「药性最终要 {{assimilate|同化}} 到病人身上才算数。」苏晚把方案 {{revise|修订}} 到第七版才罢手，「明早八点，让数据说话。」",
"术前第三天起，{{antipyretic|退热药}}、{{antitussive|止咳药}}、{{expectorant|祛痰药}}、{{analgesic|止痛药}} 逐项按点减停，{{laxative|泻药}} 也停了——稳心二号一天三剂，和一杯温水。",
"到术前最后一晚，霍父的状态被调到了巅峰：面色转润，血压平稳，夜间 {{hypnotic|安眠的}} 睡足六小时——苏晚只开了半片温和的量，剩下的交给方子本身。他说胸口那点闷也散了，连查房医生都感慨：「这一周调得，比我见过 {{narrow|窄的}} 治疗窗还稳。」",
"「{{astringent|收敛的}} 药性入营血，」苏晚在医嘱末尾写下最后一行字，「到上台前一刻，都交给我。」",
"入夜前，她向手术室 {{propose|提出}} 一个小请求：手术台旁，给她留一尺台面和一盏无影灯的余光。",
"器械护士问做什么用。她说：「做我惯用的事。」",
"没人再问。这一周，「晚先生」两个字，在这家医院已经值回了所有解释。"
]},

ps:[
"手术前那几天，苏晚过成了两种人生。",
"白天，她是梅岭医院里素衫覆面的晚先生，管着霍父的方子和监测；傍晚，她换回自己的身份，回老宅给老爷子做这一季的 {{cuisine|药膳}}——三个月之约，一期不落。",
"老宅的小厨房成了她的地界。银耳百合盅文火慢 {{braise|炖}}，{{lotus|莲}} 籽去芯，{{lily|百合}} 撕瓣，干货 {{seed|籽}} 类先泡后煮；山药选铁棍 {{yam|山药}}，削皮切段上屉 {{steam|蒸}}，{{taro|芋头}} 只做点缀。",
"{{ginger|姜}} 用老姜，{{garlic|蒜}} 要独头，{{scallion|葱}} 白拍碎——肉禽先 {{blanch|焯水}} 去沫，再 {{stew|煨}} 进 {{broth|高汤}} 里。汤底用两年老母鸡吊的 {{stock|汤底}}，撇三次油，清得能照见人。",
"鱼先 {{poach|水煮}} 保全鲜，活水 {{carp|鲤鱼}} 剖花刀，{{crab|蟹}} 只取蟹粉，{{abalone|鲍鱼}} 炖到筷子一挑就开；{{poultry|禽肉}} 里 {{duck|鸭}} 性凉，配 {{lamb|羊羔肉}} 的温补，正好调个阴阳。",
"主食也轮换：{{barley|大麦}}、{{millet|小米}}、{{oat|燕麦}}、{{soybean|大豆}} 一日一味，{{tofu|豆腐}} 一天一道，{{porridge|粥}} 是雷打不动的早课；{{noodle|面}} 条自己抻，{{dumpling|饺子}} 皮自己擀——{{flour|面粉}} 掺三成老面 {{dough|面团}}，{{yeast|酵母}} 用得比城里点心铺还讲究。",
"霍母学得最起劲。她戴着老花镜记笔记：什么是 {{culinary|烹饪的}} 药膳、点心铺 {{bake|烤}} 的 {{pastry|酥皮点心}} 有什么不同、{{batter|面糊}} 煎的薄饼怎么 {{garnish|点缀}}，{{honey|蜂蜜}} 和 {{syrup|糖浆}} 之间又差着几味药性。",
"「{{condiment|调味品}} 要 {{season|调味}} 有度，」苏晚教她，「{{vinegar|醋}} 开胃，{{sauce|酱}} 提鲜，{{sesame|芝麻}} 香而不燥；最后那一滴 {{drizzle|淋}} 下去的麻油，是点睛。」",
"干货柜被她重新理过：{{walnut|核桃}}、{{almond|杏仁}}、{{peanut|花生}}、{{chestnut|栗子}} 各归各位；果脯匣子里，{{jujube|枣}}、{{apricot|杏}} 干、{{pear|梨}} 干、{{pomelo|柚子}} 皮糖分碟装。",
"药材另有一柜：{{licorice|甘草}}、{{cinnamon|肉桂}}、{{anise|茴香}}、{{wolfberry|枸杞}}，配伍 {{kelp|海带}} 与 {{seaweed|海藻}} 的咸寒，{{mushroom|菌菇}} 与 {{fungus|真菌}} 类的鲜——她一一贴了签，写着入哪道菜、忌哪些口。",
"「药膳药膳，七分食三分药。」她把当晚的汤盅端给老爷子，「{{marinate|腌}} 入味的是菜，{{grill|炙}} 出香的是肉，真正入经络的，是这一盅文火煨出来的汤。」",
"老爷子喝着 {{soup|汤}}，忽然叹气：「晚丫头，你这一天两个样，累不累？」",
"「不累。」苏晚收拾着灶台，「救的是同一家人，值。」",
"话音落，厨房外有人应了一声。霍母端着空汤碗站在门口，眼圈忽然红了：「这几个月，妈跟着你喝的药膳，喝的不是汤，是福气。」",
"夜里，苏晚在老宅小院里晾药膳单。霍沉的车停在巷口，没有进来——他隔着一条巷子，看着那扇亮灯的窗，看了半小时。",
"车里的陈默大气不敢出。他兜里那张排班表，今天下午被霍总看见了。霍总看完只说了一句话：「收好，别让她知道。」",
"别让她知道——这句话陈默琢磨了一路：老板是知道了，还是不愿知道？",
"巷子那头，窗里的灯灭了。霍沉在黑暗里坐了一会儿，忽然说：「回去吧。」",
"「明天开始，」他看着车窗外飞退的街灯，「把南区老药市那家药铺，一比一做份档案给我。青瓦、药柜、门匾——还有当年那位苏大夫的所有记载。」",
"陈默应了。他不知道老板要做什么，只觉得这一夜的霍总，不像个等父亲手术的儿子，倒像个在长夜里给旧错立碑的人。"
]},

ps:[
"手术前两天，晚先生查完房，被霍父叫住了。",
"病房里没外人。老人靠坐在床头，眼睛在灯下 {{fathom|揣摩}} 着她——那目光不重，却像要把面纱底下的轮廓一寸寸 {{gauge|试探}} 清楚。",
"「晚先生，」他开门见山，语气是难得的 {{affable|和蔼可亲}}，「明天术前谈话，我想先跟你讲点陈年旧账。」",
"苏晚搬了把椅子坐下：「您讲，我听。」",
"「我这辈子，{{stubborn|固执的}} 出了名。」霍父自嘲地笑了笑，「家里被我管得人人 {{submissive|顺从的}}，{{patriarchal|父权的}} 脾气，说一不二，{{domineering|盛气凌人}}，{{authoritarian|专断的}} 得很。他们没说错。」",
"「当年沉儿要娶苏家姑娘，我一票否决。为什么？我 {{frank|直率的}} 一回：我说她家世不配，是假话。」",
"「苏家那位女大夫，当年在这座城开诊所，救过我。」他 {{recount|讲述}} 得很慢，像翻一本受潮的旧账，「她救我那年，我正因为一桩生意上的 {{strife|冲突}} 和人闹得满城 {{discord|不和}}，被合伙人捅了刀子。是她把我从鬼门关背回来的。医药费我分文没付，出院那天，人就不见了。」",
"「所以苏家姑娘进门，我 {{gruff|生硬的}} 着脸，装不认识这份恩。」他扯了扯嘴角，「人老了才明白，那不叫 {{obstinate|固执的}}，叫 {{complacent|自满的}} 蠢——还是自作聪明、{{smug|沾沾自喜的}} 蠢。」",
"苏晚坐得笔直，面上的平静底下，心口像被什么东西烫了一下。",
"「温家。」他忽然 {{forthcoming|愿意坦白的}} 起来，吐出两个字，「当年拿这件事拿捏我的，是温家。」",
"「他们说，苏家诊所卷进过一桩医闹，那份 {{rupture|破裂}} 的旧档案在他们手上；沉儿要是娶了苏家的姑娘，温家就把事捅出去，让苏家姑娘的行医路彻底断掉。」他闭上眼，「我怕。怕温家，更怕苏家的姑娘真是个有本事的——有本事的人进了霍家这个笼子，会被磋磨死。」",
"「所以我抢先把她往低里踩。踩得越狠，温家越觉得她不足为惧，档案也就一直没动。」他 {{contrite|悔悟的}} 地低下头，「我以为我在保护她。如今想来，我保护的是我自己的脸面。」",
"病房里静了很久。",
"「晚先生，」霍父看着她，「我说这些，不求 {{exonerate|洗清}}。只求您明日上台，别带着对这家人的成见。」",
"「我是医生。」苏晚的声音很稳，稳得压住了袖口底下那一阵 {{palpitation|心悸}}，「上了台，就没有恩怨，只有病人。」",
"「好，好。」老人连说了两个好字，从枕头底下摸出一块旧 {{handkerchief|手帕}}，包着一枚老怀表——表盖内侧刻着一个花体的「苏」字 {{monogram|花押字}}。",
"「这表，是当年那位苏大夫落在我车上的 {{keepsake|纪念物}}。我这 {{intractable|难管的}} 脾气改不了，这 {{memento|纪念品}} 倒是一直收着。」他把怀表连帕子推过去，「要是哪天您碰上苏家的人，替我还了。就说，欠了三十年，利钱我自己来讨罚。」",
"苏晚接过怀表，指尖在「苏」字的刻痕上停了半秒——那 {{initial|首字母}} 是奶奶惯用的笔路。奶奶说过，手艺人给首饰 {{inscribe|题写}} 落款，给记忆 {{etch|铭刻}} 底稿，都要收三分锋、留七分情。",
"「一定带到。」她说。",
"「还有一件事。」霍父 {{curt|简慢的}} 地摆摆手，语气却软了，「沉儿这孩子，被我 {{overbearing|专横}} 了半辈子，管成了半个我。他 {{willful|任性的}}、{{unruly|不服管束}} 的时候六亲不认，软起来又闷得像块石头。明日不管结果怎样，您替我劝劝他——他那个火脾气，得有人 {{placate|抚慰}}；两代人的疙瘩，得有人 {{defuse|缓和}}。别学我。」",
"苏晚走出病房时，霍沉正站在门外。父子俩一个门里一个门外，谁都没先开口。",
"最后是霍父先笑的：「进来。陪老子喝口水。」",
"那一晚，霍沉在病房里坐到熄灯。霍父难得 {{amiable|和蔼的}}，有一搭没一搭地 {{reminisce|追忆}}，从股市聊到渔业，从旧 {{anecdote|轶事}} 聊到他小时候偷开的拖拉机，说到兴起处 {{hearty|热忱的}} 大笑，笑完又咳，咳完又 {{cordial|诚挚的}} 地摆手「没事没事」。说到 {{nostalgia|怀旧}} 处，连窗外值夜的护士都听得入神。父子俩三十年的 {{concord|和睦}}，在最后一夜里悄悄补了一角。",
"「爸。」临走时，霍沉忽然在门口停住，「当年那门婚事，您其实……」",
"「去去去，回去睡觉。」霍父又 {{coy|含蓄回避的}} 地把脸别过去，{{taciturn|沉默寡言}} 的老毛病犯了，「手术完了再聊。」",
"霍沉走到楼梯间，才发现掌心被父亲塞了张字条：一行字，笔画带着 {{tremor|颤动}}——「对不起她。也对不起你。」",
"而此刻，值班室里的苏晚把那块怀表翻来覆去看了很久。表盖内侧除了「苏」字，还有一行小字，磨损得厉害，她借着灯光 {{peruse|细读}} 出来：「赠故人，山河远，勿念。」",
"奶奶的字。她想起老宅阁楼里那幅 {{portrait|肖像}}——奶奶立在老药 {{cabinet|药柜}} 前的旧照，相框的角落，就压着同一块怀表。",
"她忽然想起小时候，奶奶夜里教她认药，说过一句 {{cryptic|暗晦的}} 话——那话里的 {{subtlety|微妙}}，她当年没听懂：「咱们家欠着一位姓霍的，也有一位姓霍的欠着咱们。账都记在药里，别记在心上。」",
"此刻，那句 {{oblique|间接的}} 谜语忽然对上了——原来恩怨的针脚，三十年前就缝进了两家的命里。她把怀表收进贴身口袋，像收起一桩终于 {{thaw|解冻}} 的旧雪。",
"回老宅的路上，夜风清凉。老爷子还没睡，坐在堂屋看她进来，把一盏温着的茶推过来：「听说，明天一早的手？」",
"「嗯。」",
"「坐。」老爷子拍拍身边的位置，「陪我这老头子， {{melt|融化}} 一壶茶的功夫。」",
"炉上的茶咕嘟作响。祖孙俩有一句没一句地说话，说老药市的青石板，说药王谷的春天，说奶奶下葬那年的雪。有些话从前不敢碰，如今碰了，才发现两家人之间那道 {{fissure|裂隙}}，原来一直是通气的——伤口两侧，早就在悄悄长新的肉。",
"「晚丫头。」老爷子忽然叫她，声音 {{wistful|怅然的}}，「等这一场过去，把面纱摘了吧。堂堂正正行医，像你奶奶当年那样。」",
"「好。」苏晚握着茶盏，看着水面的热气，「等这一场过去。」",
"老爷子没 {{allude|暗指}} 谁，可祖孙俩都听懂了那句没点破的话。",
"同一时刻，医院顶楼的家属休息室。霍沉也在等。他手里捏着父亲那张字条，又想起白天晚先生那欲言又止的一眼——那眼神 {{elusive|难以捉摸的}}，藏着某种说不破的 {{nuance|细微差别}}，像一句只说了一半的话。",
"他 {{skim|略读}} 完父亲字条的第五遍，忽然生出一种 {{uncanny|出奇的}} 直觉，越 {{surmise|推测}} 越清晰：晚先生知道一切。他知道的恩怨、他不知道的恩怨，那个人都 {{discern|辨明}} 得清清楚楚。",
"他像做贼似的，对着夜色 {{furtive|鬼祟的}} 地问出那句压在心底的话：「您到底是谁？」没有人回答。只有监护中心的灯，在走廊尽头 {{poignant|动人的}} 地亮着，像替谁守着一整夜的心事，像一封没有落款的 {{longing|眷恋}}。"
]},
