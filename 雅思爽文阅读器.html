ps:[
"手术前夜，霍父失眠了。",
"安眠药他嫌重，数羊他嫌幼稚。值班医生束手无策，只好请出晚先生。",
"苏晚到的时候，只带了一只布 {{pouch|布包}} 和一只器械 {{kit|器械包}}。布包摊开，一排细如毫毛的金针躺在 {{velvet|天鹅绒}} 垫上，针身 {{fine|细的}} 得几乎看不见，每一根都套着小小的 {{sheath|针鞘}}。",
"「先说好，」她消毒指尖，语气 {{brisk|利落的}} 里带点笑，「今晚行针，为安神，不为炫技。有怕的，现在可以出去。」",
"没人出去。值班医生、两个进修生、闻讯赶来的麻醉团队，把病房站成了小课堂。",
"苏晚先点了一支细 {{incense|线香}}。青烟笔直上升，映着监护屏 {{amber|琥珀色的}} 的光。",
"「术前取穴，头面为先。」她指腹搭上霍父的 {{scalp|头皮}}，从 {{crown|头顶}} 百会讲起，{{temple|太阳穴}} 率谷、{{auricular|耳的}} 后安眠，一路点到 {{nape|后颈}} 风池，讲一穴，下一针。",
"她 {{insert|进针}} 的手法放得很慢，好让人看清：{{perpendicular|垂直的}} 直刺、{{slanted|斜的}} 平刺、{{shallow|浅的}} 点刺，三种角度，三种 {{depth|深度}}。",
"「别看针 {{caliber|口径}} 细，」她捻着针尾，「力从腕出，劲往针尖送；部位不同，深浅差之毫厘，效差千里。」",
"运针三法：{{twirl|捻转}}、{{rotate|旋转}}、{{flick|轻弹}}。她的手指 {{dexterous|灵巧的}} 得像会自己思考，{{nimble|敏捷的}} 指尖起落之间，进修生举着手机录像都跟不上她 {{deft|熟练的}} 手速。",
"「得气了。」霍父忽然哑声说，「{{sore|酸的}}……{{numb|麻的}}……胀……像有股 {{tingle|麻刺感}} 顺着脊背往上爬。」",
"「这就对了。酸、麻、{{distend|胀}}——这种 {{feeling|感觉}}，古人叫它气至。气至，如鱼吞钩。」",
"胸腹背的针，她一路扎下去：沿 {{spine|脊柱}} 两侧的夹脊，{{vertebra|椎骨}} 一节节数下来，到 {{lumbar|腰的}}、{{sacral|骶骨的}}，再落 {{coccyx|尾骨}} 长强；{{pelvis|骨盆}} 稳住，{{hip|髋}} 侧走得极浅；{{scapula|肩胛}} 内缘两针定喘，{{shoulder|肩}} 井一针提气；{{elbow|肘}} 弯曲池，{{forearm|前臂}} 内关安神，{{wrist|腕}} 后神门定志。",
"腿脚也没放过：{{hamstring|腿后腱}} 承扶、{{calf|小腿肚}} 承山、{{knee|膝}} 下足三里、{{ankle|踝}} 上三阴交，最后 {{sole|足底}} 涌泉收针，{{arch|足弓}} 一带点了两下。",
"「{{tendon|肌腱}} 和 {{ligament|韧带}} 附近进针要斜，避开 {{joint|关节}} 腔；肌起点的 {{socket|关节窝}} 位置深，得用长针；肌间的 {{fascia|筋膜}} 层，针感传得最远。」她一边行针一边讲，像把整个人体地图摊开在学生面前。",
"她拾起霍父的手，{{palm|掌心}} 朝上，{{knuckle|指节}} 间的劳宫穴轻轻一按：「宽心。您的手，攥了一晚上拳头了。」",
"针毕，留针。她交代护工：四十分钟后起针，从最后一针倒着 {{pluck|拔}}；针在穴里 {{retain|留置}} 期间，人可以睡，不可以翻身。起针用干 {{cotton|棉}} 按压针眼，不必再拿 {{ethanol|乙醇}} 擦第二遍。",
"针具归位，她说得一句是一句：金针细贵，用完过清水、晾干、收鞘，隔夜送制剂室 {{autoclave|高压灭菌锅}} 处理；她那只布包，从不外借。",
"四十分钟后，起针。霍父的呼吸绵长下来，监护仪上心率从九十多落回七十。",
"「行了。」苏晚收针入囊，脚步很轻，「睡吧。明早八点，我候着您。」",
"霍父阖眼之前问了一句：「晚先生，明天的台……您亲自上？」",
"「我主针。」她说，「刀，是教授的。各守各位。」",
"这一夜，霍父睡了入夏以来第一个整觉。陪护的进修生在笔记里写：今晚病房没有一丝 {{acrid|刺鼻的}} 消毒水味，只有线香 {{pungent|辛辣的}} 又绵软的味道，和比镇静剂更温和的安抚。",
"香燃到只剩一线 {{ember|余烬}}，窗外的月 {{glimmer|微光}} 浮动。苏晚收拾行囊离开时，监护仪的绿线走得又匀又稳。",
"走廊尽头，值班室的开水壶发出轻微的 {{sizzle|滋滋声}}。夜班的年轻医生们围着监控屏，小声复盘今晚这一手金针，谁也不敢开大声。",
"值班护士长追出来，问她明天金针台面的事。苏晚答：「备了。」",
"「需要什么，尽管开口。」护士长说，「全院都听您调遣。」",
"「那今晚，」苏晚想了想，「替我留意一件事：明早六点，家属可能会失控。放他进来，让他握五分钟父亲的手。」",
"护士长愣了愣，笑了。"
]},
{no:27,t:"手术前夜",ws:[["on-call","adj.","候召的"],["intercom","n.","对讲系统"],["buzzer","n.","呼叫器"],["walkie-talkie","n.","对讲机"],["fasting","n.","禁食"],["nil","n.","无"],["workup","n.","术前全套检查"],["premedication","n.","术前用药"],["garb","n.","装束"],["cap","n.","帽"],["footwear","n.","鞋类"],["theater","n.","手术室"],["prep","n.","准备工作"],["line","n.","管路"],["pump","n.","泵"],["telemetry","n.","遥测监护"],["electrode","n.","电极"],["pad","n.","垫片"],["gel","n.","凝胶"],["adhesive","adj.","黏的"],["tape","n.","胶带"],["shave","v.","备皮"],["antiseptic","n.","抗菌剂"],["rinse","v.","冲洗"],["lather","n.","泡沫"],["brush","n.","刷"],["immaculate","adj.","洁净无瑕的"],["trolley","n.","推车"],["instrument","n.","器械"],["retractor","n.","拉钩"],["clamp","n.","止血钳"],["staple","n.","钉"],["cauterize","v.","烧灼止血"],["suction","n.","吸引器"],["irrigate","v.","冲洗创腔"],["sponge","n.","纱布块"],["count","n.","清点"],["supine","adj.","仰卧的"],["position","v.","摆放体位"],["tilt","v.","倾斜"],["pivot","v.","以…为轴转"],["cushion","n.","垫"],["strap","n.","固定带"],["harness","n.","固定系带"],["prone","adj.","俯卧的"],["lateral","adj.","侧卧的"],["drape","n.","洞巾"],["aperture","n.","开口"],["cannula","n.","套管"],["intubation","n.","插管"],["airway","n.","气道"],["ventilation","n.","通气"],["airflow","n.","气流"],["fluorescent","adj.","荧光的"],["beam","n.","光束"],["glare","n.","眩光"],["penultimate","adj.","倒数第二的"],["unperturbed","adj.","不为所动的"],["placid","adj.","平和的"],["equanimity","n.","平静"],["stoic","adj.","坚忍的"],["resigned","adj.","顺从认命的"],["restive","adj.","焦躁难安"],["fatalistic","adj.","宿命论的"],["eve","n.","前夜"]],
ps:[
"手术日，凌晨五点半。梅岭医院的手术层，比整座城市醒得早。",
"{{on-call|候召的}} 团队陆续到位，{{intercom|对讲系统}} 里报着各组就位的声音；护士站的 {{buzzer|呼叫器}} 全部调成静音，只有麻醉组的 {{walkie-talkie|对讲机}} 偶尔响起一句核对。",
"霍父是被轻声唤醒的。术前 {{fasting|禁食}} 从昨夜十点开始，此刻只能 {{nil|无}} 进水——护士端来的，只有一小杯润唇的湿棉。",
"{{workup|术前全套检查}} 单最后一遍过目：心电图、胸片、超声、化验，逐页签字。{{premedication|术前用药}} 在六点整推注，霍父的眼皮很快沉了半分。",
"六点，霍沉果然来了。护士长依言放行。他握着父亲的手坐了五分钟，一句话没说；临走替父亲掖了掖被角。霍父半醒着嗯了一声，像多年前每个早班出门的儿子。",
"七点，病人送入手术 {{theater|手术室}} 层。{{prep|准备工作}} 间里，苏晚已到位——素衫换成了手术 {{garb|装束}}，一次性 {{cap|帽}} 压住发，专用 {{footwear|鞋类}} 套了鞋套；只差面纱这一层，她说什么也不摘。",
"麻醉团队开始铺 {{line|管路}}：静脉通路两条，{{pump|泵}} 位的流速先设保守值；{{telemetry|遥测监护}} 接好，胸口 {{electrode|电极}} 垫 {{pad|垫片}} 一枚枚贴妥，导电 {{gel|凝胶}} 抹匀，{{adhesive|黏的}} 胶面压实，再一条 {{tape|胶带}} 加固。",
"备皮由护士操作：胸前 {{shave|备皮}} 干净利落，{{antiseptic|抗菌剂}} 由内向外画了三个圈，{{rinse|冲洗}}、待干。",
"苏晚在一旁刷手。指缝、指背、腕、前臂，{{lather|泡沫}} 打了三层，指甲 {{brush|刷}} 足三十秒，冲下来的水一路垂直不回弹——护士长验收完，说了句「{{immaculate|洁净无瑕的}}」，才放她进术间。",
"术间里，器械 {{trolley|推车}} 已经排开。{{instrument|器械}} 台上，{{retractor|拉钩}}、{{clamp|止血钳}}、吻合 {{staple|钉}} 按序码放；{{suction|吸引器}} 负压测试通过，{{cauterize|烧灼止血}} 的电刀笔、{{irrigate|冲洗创腔}} 的温盐水、加压 {{sponge|纱布块}}，一样样清点入册。",
"器械护士报 {{count|清点}}：纱布四十块、缝针十六根、器械五十三件——开台前一遍，关腔前还要再数两遍，一块都不能少。",
"七点四十，体位摆放。霍父仰卧，{{supine|仰卧的}} 位上胸部垫高十五度，{{position|摆放体位}} 定好后 {{tilt|倾斜}} 台微调，手术床 {{pivot|以…为轴转}} 向主刀侧；膝下 {{cushion|垫}} 支撑，腿上 {{strap|固定带}} 与胸前 {{harness|固定系带}} 松紧两指——{{prone|俯卧的}} 与 {{lateral|侧卧的}} 备选方案图，就贴在墙上。",
"术区 {{drape|洞巾}} 铺下，蓝布层层，只留一道 {{aperture|开口}} 对准切口位置——像整个世界都退到蓝布后面，只把生的希望留在这一方寸之间。",
"麻醉诱导开始。{{cannula|套管}} 固定，{{intubation|插管}} 顺利，{{airway|气道}} 压力正常，{{ventilation|通气}} 频率调定，{{airflow|气流}} 曲线平稳。麻醉主任回头：「晚先生，可以开始了。」",
"八点差五分。老教授站上主刀位，海归专家一助手，苏晚站在金针台旁——那一尺台面和无影灯的余光，都如她所请。",
"灯亮。{{fluorescent|荧光的}} 白 {{beam|光束}} 落在术野上，{{glare|眩光}} 被灯罩切在四周。霍沉在门外看着这扇缓缓关上的门，把怀表握得发烫。",
"手术前的最后一刻，苏晚在术野边缘的神门对应点上落了第一针——不为止痛，为定心。",
"针入的瞬间，监护屏上的心率稳稳落在七十二。",
"「好。」老教授说，「切开。」",
"这一天的 {{eve|前夜}}——那个 {{penultimate|倒数第二}} 的深夜里，霍家人谁也没睡好。可此刻，术间里的每个人都 {{unperturbed|不为所动的}}：{{placid|平和的}} 语气、{{equanimity|平静}} 的呼吸节奏，连霍父睡着的脸，都透着 {{stoic|坚忍的}} 与 {{resigned|顺从认命的}} 的坦然。",
"只有霍沉站在门外。他既不 {{restive|焦躁难安}}，也不 {{fatalistic|宿命论的}}——他只是等。等的姿势，和三年前那个雨夜她等他的姿势，一模一样。"
]},
{no:28,t:"手术",ws:[["incision","n.","切口"],["field","n.","术野"],["dissect","v.","分离"],["visualize","v.","显露"],["excise","v.","切除"],["resect","v.","切除术"],["beep","n.","嘟声"],["staccato","adj.","断续的"],["ooze","v.","渗血"],["spurt","v.","涌出"],["gush","v.","喷涌"],["murky","adj.","视野不清的"],["crimson","adj.","深红的"],["shimmer","v.","闪烁"],["bleed","v.","出血"],["siren","n.","警报音"],["tamponade","n.","填塞止血"],["packing","n.","填塞"],["occlude","v.","封堵"],["tie","v.","结扎"],["fibrillate","v.","纤颤"],["spiral","v.","急转直下"],["shock","n.","电击"],["charge","v.","充电"],["joule","n.","焦耳"],["paddle","n.","电极板"],["clear","adj.","让开"],["jolt","n.","震动"],["stillness","n.","静止"],["immobile","adj.","不动的"],["quake","n.","颤动"],["crumble","v.","崩塌"],["teeter","v.","摇摇欲坠"],["brink","n.","边缘"],["abyss","n.","深渊"],["epinephrine","n.","肾上腺素"],["bolus","n.","推注"],["atropine","n.","阿托品"],["crescendo","n.","渐强"],["climax","n.","顶点"],["swift","adj.","迅捷的"],["lightning","adj.","闪电般的"],["entry","n.","进针点"],["axis","n.","轴"],["pinpoint","v.","精确定位"],["millimeter","n.","毫米"],["vector","n.","方向"],["unerring","adj.","分毫不差的"],["clasp","v.","扣握"],["press","v.","按压"],["recoil","n.","弹回"],["compress","v.","压迫止血"],["unobstructed","adj.","无遮挡的"],["vitals","n.","生命体征"],["flutter","n.","扑动"],["rigor","n.","寒战"],["resume","v.","恢复进行"],["cease","v.","停止"],["artistry","n.","技艺"],["maestro","n.","宗师"],["consummate","adj.","完美娴熟的"],["mastery","n.","精通"],["virtuoso","n.","大师"],["kindle","v.","点燃"],["acumen","n.","敏锐"]],
ps:[
"八点零二分，第一刀 {{incision|切口}} 落下。",
"手术有条不紊地推进。老教授的 {{field|术野}} 干净利落，一层层 {{dissect|分离}}，病变段血管 {{visualize|显露}} 得清清楚楚。",
"「病变比片子上小半圈，」老教授的声音透过口罩透出笑意，「{{excise|切除}} 范围缩小，是好事。」他 {{resect|切除术}} 段离病变，每一步都干脆。",
"苏晚站在金针台旁，指尖搭着霍父的脉门——寸关尺，是她的遥测监护。",
"九点四十，吻合进入关键段。突然，监护仪的 {{beep|嘟声}} 变了调——{{staccato|断续的}} 连响，心率一百八，室颤波形。",
"几乎同时，吻合口后方一声轻响，暗红的血 {{ooze|渗血}} 转 {{spurt|涌出}}，再 {{gush|喷涌}}——术野 {{murky|视野不清的}} 起来，灯光下 {{crimson|深红的}} 血 {{shimmer|闪烁}}。",
"「{{bleed|出血}}！吻合口后壁渗漏！」器械护士的 {{siren|警报音}} 按响，全室的空气在一秒内绷紧。",
"老教授的反应快得惊人：{{tamponade|填塞止血}} 纱布压上去，{{packing|填塞}} 加压，{{occlude|封堵}} 钳阻断近端，缝线 {{tie|结扎}} 加固。可监护屏上的乱线越跳越乱——{{fibrillate|纤颤}} 不停，血压往下 {{spiral|急转直下}}。",
"「{{shock|电击}}。」麻醉主任喊。{{charge|充电}} 双向两百 {{joule|焦耳}}，{{paddle|电极板}} 压实——「{{clear|让开}}！」",
"一次。身体猛地一 {{jolt|震动}}，又归于 {{stillness|静止}}。屏上的乱线没回来。",
"二次。还是一条死线，心脏 {{immobile|不动的}}。有人手一抖，镊子掉在托盘里，{{quake|颤动}} 的余音在死寂里格外刺耳。",
"手术室的空气开始 {{crumble|崩塌}}。所有人都明白：这颗心脏 {{teeter|摇摇欲坠}} 于 {{brink|边缘}}——再两次不回来，就是 {{abyss|深渊}}。",
"「{{epinephrine|肾上腺素}} 一毫克 {{bolus|推注}}！{{atropine|阿托品}} 追加！」麻醉团队的手快得只剩残影，血压还是没抬起来。",
"{{crescendo|渐强}} 至 {{climax|顶点}} 的慌乱里，苏晚的声音不大，却像一枚楔子钉进喧嚣：",
"「停手三秒。都别动。」",
"满室的人僵在原地。她 {{swift|迅捷的}} 落针——{{lightning|闪电般的}} 三针：内关透郄门，膻中一针斜刺，最后一针的 {{entry|进针点}}，差半枚硬币就到心脏投影的 {{axis|轴}} 线。",
"金针 {{pinpoint|精确定位}} 到 {{millimeter|毫米}}，{{vector|方向}} 分毫不偏，{{unerring|分毫不差的}} 稳。",
"接着她上手：掌根 {{clasp|扣握}} 交叠，压在胸骨下段，{{press|按压}} 的深度、频率、{{recoil|弹回}}，教科书级；{{compress|压迫止血}} 的同时，替老教授守住了术野 {{unobstructed|无遮挡的}} 的关键三分钟。",
"「{{vitals|生命体征}} 回一下！」护士的声音劈了叉。",
"乱线忽然一颤，像水底透出一线 {{flutter|扑动}} 的微光——窦性心律回来了。{{rigor|寒战}} 般的战栗掠过每个人的脊背：回来了。",
"「{{resume|恢复进行}} 吻合。」老教授口罩上方那双眼睛红得吓人，声音却稳如磐石。",
"这一次，修补滴水不漏。{{cease|停止}} 转流、逐层关胸，纱布缝针三遍清点，一块不差。",
"十一点二十，手术结束。比预估还快了四十分钟。",
"老教授摘下帽子，在主刀位上深深弯下腰去——对着金针台的方向。这一礼，全场没人觉得突兀。",
"「晚先生，」他直起身，声音哑的，「今天这台手术，是您的 {{artistry|技艺}} 把我们从崖边拉回来的。说什么「递刀」——说轻了。您是这台手术的 {{maestro|宗师}}，我们是您的乐手。」",
"「不。」苏晚隔着面纱摇头，平静得近乎 {{consummate|完美娴熟的}} 从容，「{{mastery|精通}} 是全场的。没有你们的除颤和阻断，我的针没有落点。」",
"海归专家半天才找回声音：「这手针法……教科书该重写了。得叫它「晚先生三针」。」",
"当晚的手术记录存档时，海归专家在文末加了一行批注：「金针镇场，手法 {{virtuoso|大师}} 级，建议录像列为教学示范。」",
"门外，霍沉听见「手术成功」四个字的瞬间，眼眶像被什么东西 {{kindle|点燃}}，多年没红过的眼睛，当场就红了。",
"他没有说话，只是把怀表贴在耳边，听了很久。滴答，滴答——像父亲重新跳动的心，也像某种迟来的、终于开始倒数着回来的东西。",
"护士长出来报平安，末了笑着补一句：「晚先生临下台前说，今天的临床 {{acumen|敏锐}} 是她见过最果断的团队配合——这话我原样带给各位。」",
"霍沉朝她深深鞠了一躬。",
"重症监护室的门外，初秋的太阳很好。陈默蹲在墙角哭得像个孩子，哭完给老宅打电话，声音还在抖：「手术……成了。晚先生……是神仙。」"
]},
{no:29,t:"苏醒",ws:[["tubing","n.","管路"],["drain","n.","引流管"],["output","n.","引流量"],["urine","n.","尿"],["rhythm","n.","节奏"],["sinus","n.","窦性节律"],["bowel","n.","肠"],["gas","n.","气体"],["awaken","v.","苏醒"],["regain","v.","恢复"],["groggy","adj.","昏沉的"],["blink","v.","眨眼"],["squint","v.","眯眼"],["coherent","adj.","连贯的"],["orientation","n.","定向力"],["confusion","n.","意识模糊"],["hoarse","adj.","沙哑的"],["throat","n.","喉咙"],["thirst","n.","口渴"],["mumble","v.","含糊"],["croak","v.","嘶哑低语"],["moist","adj.","湿润的"],["nod","v.","点头"],["mutter","v.","低声说"],["sill","n.","窗台"],["potted","adj.","盆栽的"],["jasmine","n.","茉莉"],["shutter","n.","百叶窗板"],["sunbeam","n.","阳光束"],["petal","n.","花瓣"],["vase","n.","花瓶"],["shift","v.","挪动"],["roll","v.","翻身侧转"],["prop","v.","支撑垫起"],["raise","v.","抬起"],["grimace","v.","因痛做鬼脸"],["lull","n.","平静期"],["raspy","adj.","粗哑的"],["straw","n.","吸管"],["lukewarm","adj.","温的"],["gulp","n.","大口"],["stool","n.","粪便"],["tear","n.","眼泪"],["chuckle","v.","轻笑"],["banter","n.","玩笑"],["festive","adj.","喜庆的"],["settled","adj.","平定下来的"],["even","adj.","平稳均匀的"],["ripple","n.","涟漪"],["subside","v.","平息消退"],["wane","v.","减弱"],["ebb","v.","退去"],["diminish","v.","减少"],["wax","v.","增强"],["sunrise","n.","日出"],["hazy","adj.","朦胧的"],["fog","n.","雾感"],["misty","adj.","雾蒙蒙的"],["invigorate","v.","恢复元气"],["overjoyed","adj.","狂喜的"],["elated","adj.","欢欣的"],["jubilation","n.","欢庆"],["sprout","v.","抽芽"],["bloom","v.","绽放"],["flourish","v.","茂盛"]],
ps:[
"术后第一夜，霍父是在重症监护室过的。",
"呼吸机凌晨三点撤了，改鼻导管。胸前两根 {{tubing|管路}} 接着引流，胸腔 {{drain|引流管}} 的 {{output|引流量}} 从鲜红转淡红，第五个小时起，{{urine|尿}} 量回升，监护屏的 {{rhythm|节奏}} 干净——{{sinus|窦性节律}} 一直很稳。",
"值夜的年轻医生守着记录单，每隔一小时勾一行：{{bowel|肠}} 鸣音未恢复、肠道 {{gas|气体}} 未过——这两关一过，才算真正脱险。",
"清晨六点，霍父 {{awaken|苏醒}} 了。{{regain|恢复}} 神志的过程像退潮：先是 {{groggy|昏沉的}} 地 {{blink|眨眼}}，{{squint|眯眼}} 着适应灯光；护士做三问——姓名、年份、地点——他答得 {{coherent|连贯的}}，{{orientation|定向力}} 满分，没有一丝 {{confusion|意识模糊}}，只是声音 {{hoarse|沙哑的}} 得像砂纸。",
"「先别说话，」护士用棉签蘸水润他的 {{throat|喉咙}}，「{{thirst|口渴}} 也忍一忍，六小时后才能小口喝水。」",
"霍父却急着要说话。他 {{mumble|含糊}} 了半天，终于 {{croak|嘶哑低语}} 出一句整话：「晚……先生……」",
"「手术很成功。」护士答，「晚先生交代过，您醒来若找他，就说：针已收，账已清，让您安心养。」",
"霍父眼皮 {{moist|湿润的}} 了。他 {{nod|点头}}，又艰难地抬起手指了指自己的胸口，{{mutter|低声说}}：「欠条……都在这儿。」",
"没人听懂，也没人多问。",
"上午十点，家属探视。窗 {{sill|窗台}} 上摆着一小 {{potted|盆栽的}} {{jasmine|茉莉}}，{{shutter|百叶窗板}} 的光影一格一格移过，{{sunbeam|阳光束}} 落在 {{petal|花瓣}} 上，开得正好；旁边素白 {{vase|花瓶}} 里，另插着几枝剪下的同款。",
"霍沉坐在床边，握着父亲的手教他做康复动作：{{shift|挪动}} 手腕、{{roll|翻身侧转}} 试 {{prop|支撑垫起}}、{{raise|抬起}} 腿练循环。霍父每做一个，就 {{grimace|因痛做鬼脸}} 一次，又不服输地再来一次。",
"「行了行了，」霍沉按住他，「明天再做。护士说了，今天的 {{lull|平静期}} 是您的，谁也别跟自己较劲。」",
"「水……」霍父 {{raspy|粗哑的}} 地讨水。霍沉拿小 {{straw|吸管}} 蘸了 {{lukewarm|温的}} 水送到他唇边，一次只给一小口——{{gulp|大口}} 咽这种事，得等出院。",
"到了傍晚，好消息接二连三：排气过了，能进流食了；{{stool|粪便}} 常规送检无异常，胸腔引流管撤了一根。",
"霍母进来的时候，眼睛是 {{tear|眼泪}} 汪汪的。她攥着丈夫的手说了半个钟头的家常，说到高兴处 {{chuckle|轻笑}} 出声，又赶紧捂嘴——监护区不许大声。",
"老爷子是下午到的。他拄杖立在床尾，看了很久，最后只说了一句：「我早说过，欠的债要当面还。这下，还清了。」",
"晚上八点，陈默拎着一袋子营养品守在门外，跟保安 {{banter|玩笑}} 了半天混了个脸熟，被护士长笑着轰走：「明天再来。今天过 {{festive|喜庆的}} 也不行，规矩是规矩。」",
"夜里，霍父睡了术后的第一个好觉。监护屏上的线 {{settled|平定下来的}}，{{even|平稳均匀的}} 呼吸一起一伏，像安静的 {{ripple|涟漪}}。",
"术后的恢复一日一个台阶：引流逐日 {{wane|减弱}}，术区肿胀 {{subside|平息消退}}，镇痛药量 {{ebb|退去}}，输液速度 {{diminish|减少}}，体力和食欲 {{wax|增强}}——一减一增之间，人就回来了。",
"第三天清晨，霍父已经能靠坐半小时。他望着窗外 {{sunrise|日出}}，{{hazy|朦胧的}} 视野一天天亮起来，那片术后的脑 {{fog|雾感}} 和 {{misty|雾蒙蒙的}} 的恍惚，正在一点点散去。",
"「感觉整个人被 {{invigorate|恢复元气}} 了。」他跟查房医生说，「像换了一颗心。」",
"「换的不是心，」医生笑，「是往后几十年的生活方式。」",
"第五天转出监护区那天，护士们自发在门口站成一排相送，年轻的眼眶都红着。",
"霍家人在外面等。看见病床推出来，霍母第一个 {{overjoyed|狂喜的}} 迎上去，被护士笑着拦住；霍沉 {{elated|欢欣的}} 得连话都说不利索，一天里第三次拨错了号码。",
"老宅当晚摆了家宴。没有外人，没有酒，老爷子亲手给每个人斟了一杯热茶：「这一桌，敬晚先生，也敬我们自己——从今往后，霍家记恩不记账。」",
"满堂的 {{jubilation|欢庆}} 里，霍沉举着茶杯站在窗前，望着城南的方向。",
"明天，他要去还一张三十年的旧欠条——把那份老药铺的档案，亲手送回它该去的地方。",
"而城南的夜里，拾晚堂的灯还亮着。苏晚把一株刚 {{sprout|抽芽}} 的药苗栽进盆里，看着它 {{bloom|绽放}} 新叶，整个小院都跟着 {{flourish|茂盛}} 起来。",
"她的手机屏幕亮着，是顾之衍刚发来的消息：「老宅今晚开宴了。霍总喝醉了——以茶代酒的那种。他拿着药铺档案的卷宗，在窗前站了整晚。」",
"苏晚看完，把手机扣在药柜上，笑了笑。",
"窗台上那盆薄荷——三年没人管、如今活得越发精神的那一盆——正把香气一寸一寸送进夜色里。"
]},
{no:30,t:"晚先生",ws:[["stature","n.","声望"],["persona","n.","面具身份"],["bare","v.","坦露"],["countenance","n.","面容"],["feature","n.","容貌"],["dumbfounded","adj.","目瞪口呆的"],["flabbergasted","adj.","大惊失色"],["teary","adj.","含泪的"],["thunderstruck","adj.","震惊的"],["incredulous","adj.","难以置信的"],["disbelief","n.","难以相信"],["visage","n.","面貌"],["profess","v.","明言"],["gawk","v.","呆看"],["bewildered","adj.","不知所措的"],["spectacle","n.","情景"],["scene","n.","场面"],["fraternity","n.","同业会"],["circulate","v.","流传"],["convene","v.","召集"],["congress","n.","大会"],["keynote","n.","主旨演讲"],["plenary","adj.","全体的"],["delegate","n.","代表"],["symposium","n.","研讨会"],["seminar","n.","研习班"],["gape","v.","目瞪口呆"],["reverberate","v.","回荡"],["fame","n.","名气"],["resonate","v.","引起共鸣"],["repute","n.","声誉"],["acclaim","n.","赞誉"],["lettering","n.","字样"],["accolade","n.","荣誉"],["laurel","n.","桂冠"],["luminary","n.","泰斗"],["medallion","n.","奖牌"],["commendation","n.","表彰"],["dignitary","n.","贵宾"],["courier","n.","专递员"],["foil","n.","箔"],["crest","n.","纹章"],["embossed","adj.","凹凸压印的"],["envelope","n.","信封"],["seal","n.","封缄"],["airmail","n.","航空邮递"],["postage","n.","邮资"],["postmark","n.","邮戳"],["commemorative","adj.","纪念性的"],["letterhead","n.","信头"],["showcase","n.","展台"],["pavilion","n.","展馆"],["booth","n.","展位"],["reply","n.","回复"],["recipient","n.","收件人"],["podium","n.","领奖台"],["trophy","n.","奖杯"],["ribbon","n.","绶带"],["autograph","n.","签名"],["correspondence","n.","信函"],["expo","n.","博览会"],["indebted","adj.","感激的"],["appreciative","adj.","感念的"],["demeanor","n.","举止神态"],["bearing","n.","仪态"]],
ps:[
"霍父出院那天，提了一个要求：当面谢晚先生。",
"老宅设了小宴。没有外人，一家人加程伯，加一位素衫覆面的客人。",
"席间，霍父挣扎着起身，举起面前那杯温水，手抖得厉害。他说他这辈子只服过两个人：一个是他爹，一个是把他从手术台上拽回来的这位。",
"「可是我连恩人的脸都没见过。」他放下杯子，声音低下去，「晚先生，今日这一宴，霍家上下拿全部 {{stature|声望}} 担保，永守您的秘密。只求您——让我看一眼。」",
"满桌寂静。霍沉的心跳到了喉咙口——那一刻，他莫名觉得，某扇门要开了。",
"苏晚沉默了片刻，忽然笑了笑。",
"「好啊。」她说，「反正，也该让几位看看了。」",
"她抬手，将那层 {{persona|面具身份}} 连同面纱一并摘下，把十年的真相 {{bare|坦露}} 在一桌人面前。",
"满桌的 {{countenance|面容}}，齐齐僵住。",
"霍父 {{dumbfounded|目瞪口呆的}} 地张着嘴，半晌，一个字一个字地往外挤：「晚……晚丫头？」",
"霍母手里的筷子当啷掉了，整个人 {{flabbergasted|大惊失色}}；程伯垂着的手抖了抖，眼眶先红了——他等这一天，等了半年。",
"老爷子反倒最镇定，把茶盏搁下，慢悠悠说了句：「我说什么来着。药王谷的规矩，救人不问姓氏——可不问姓氏，也得先认认人。」",
"霍沉坐在原处，一动没动。他早就猜到了——从背影、从步态、从排班表、从矿区那双手。可亲眼看见这张 {{feature|容貌}} 的这一刻，心口还是像被什么狠狠撞了一下：{{thunderstruck|震惊的}}，{{incredulous|难以置信的}}，又有一丝迟到了三年的 {{disbelief|难以相信}}，终于落了地。",
"「这张 {{visage|面貌}} 是真的，」苏晚对满桌 {{gawk|呆看}} 的人扯了扯嘴角，「针也是真的。爷爷，各位——苏晚，行医十年，今日 {{profess|明言}}：收回化名，往后拾晚堂坐堂，晚先生这个名字，一并由我认下。」",
"「可你……你不是晚先生吗？」霍母 {{bewildered|不知所措的}} 地问，「那你这半年，两头跑……」",
"「白天在梅岭，傍晚在城南。」程伯替她答，声音哽着，「我的车，接送了半年。」",
"霍母 {{teary|含泪的}}，当场没绷住。她想说什么，又觉得说什么都轻了，最后只挤出三个字：「受苦了。」",
"霍父忽然挣扎着起身，从怀里掏出那块旧怀表——正是他托晚先生转交苏家的那一块。此刻他把它放在苏晚面前，手背上的老年斑都在抖。",
"「物归原主。」他哑声说，「三十年前我欠苏家一条命，没敢认；三年前我磋磨苏家的女儿，更没脸认。这表你替你奶奶收好——利钱，我拿后半辈子偿。」",
"苏晚看着那块表，很久，伸手收进袖中。",
"「账清了。」她说，「往后只论亲，不论债。」",
"苏晚收面纱的那个 {{spectacle|情景}}，老爷子后来只在酒后提过一次；而这一晚的 {{scene|场面}}，程伯写进了家史，只有一行字：晚先生，即苏氏晚，霍家两代人的恩人，自家人。",
"消息没有外传——霍家守口如瓶。可「晚先生主刀、金针镇场」的传奇，还是在医学圈里悄悄 {{circulate|流传}}：先是术间参与者，再是医院高层，再是全国心外 {{fraternity|同业会}}。",
"十月底，世界中医药联合会向「晚先生」发来请帖：请他出席明年 {{convene|召集}} 的国际 {{congress|大会}}，做一场 {{keynote|主旨演讲}}，{{plenary|全体的}} 场次，各国 {{delegate|代表}} 团开放旁听。",
"苏晚回绝了请柬，理由只有八个字：坐堂医者，不出江湖。老教授替她惋惜，转头却把手术复盘匿名送上了春季 {{symposium|研讨会}}——台下 {{gape|目瞪口呆}} 的人比比皆是；他自己学会里办的 {{seminar|研习班}}，他把那卷录像放了三遍，一句点评没有。",
"这段传奇也在医学生中间 {{reverberate|回荡}}：那年梅岭的公开课，教室挤到走廊；有人把她的方子抄进笔记，有人把「晚先生三针」设成手机壁纸。她没有 {{fame|名气}} 的负担——名气在别人那里 {{resonate|引起共鸣}}，她只管把脉。",
"城南的日子照旧。她在同行里的 {{repute|声誉}} 一日高过一日，拾晚堂的 {{acclaim|赞誉}} 也水涨船高，锦旗从柜台挂到房梁，苏晚只留一面——是位康复老船工送的，{{lettering|字样}} 歪歪扭扭：手到病除。",
"顾之衍把这些 {{accolade|荣誉}} 看在眼里，笑称她是「不戴 {{laurel|桂冠}} 的 {{luminary|泰斗}}」；某学会寄来的纪念 {{medallion|奖牌}} 和 {{commendation|表彰}} 证书，她转手捐给了老药市的义诊基金。",
"十一月的第一场风来的那天，两封 {{dignitary|贵宾}} 级的烫金请柬，经两个 {{courier|专递员}} 之手，先后敲开了两扇门。",
"第一封送到霍氏：国际珠宝大展组委会的正式邀请函——烫金 {{foil|箔}} 的 {{crest|纹章}}，{{embossed|凹凸压印的}} 字样，白 {{envelope|信封}} 上一枚红蜡 {{seal|封缄}}，贴着 {{airmail|航空邮递}} 的 {{postage|邮资}}，{{postmark|邮戳}} 盖着日内瓦字样，还带一截 {{commemorative|纪念性的}} 小字：第十一届。{{letterhead|信头}} 落款是组委会——诚邀霍氏珠宝携新系列参展，{{showcase|展台}} 一席、{{pavilion|展馆}} 双间，{{booth|展位}} 编号随 {{reply|回复}} 确认函另寄。",
"第二封，送到城南拾晚堂。",
"同样的白信封，同样的红蜡封，{{recipient|收件人}} 一栏只有一个字母：S。",
"顾之衍的视频电话立刻打过来，语气少见地发飘：「特别席位——开幕日 {{podium|领奖台}} 上的致辞席，闭幕日 {{trophy|奖杯}} 的终身成就候选，连剪彩的 {{ribbon|绶带}} 都给你备了金色。十年了，「S」头一回收到官方邀请；上一封这样的信，收信人是位王室珠宝师，信末那枚亲笔 {{autograph|签名}}，如今还陈列在大展的荣誉厅。」",
"苏晚把那封 {{correspondence|信函}} 在灯下转了转。信里另附一页，印着本届大展的主题：传承与新生。",
"「去不去？」顾之衍问。",
"「去。」她把信折起来，指尖在「S」字上停了停，「奶奶留下的手稿，也该见见世面了。」",
"挂了电话，她望着窗外的夜色，忽然想起白天老宅宴散时，霍父红着眼眶塞给她的一句话：「丫头，霍家欠你的这辈子还不完——你开 {{expo|博览会}}，爸爸……爸爸给你搬箱子。」",
"这话 {{indebted|感激的}} 又笨拙，{{appreciative|感念的}} 又好笑，苏晚当时没忍住，笑出了声。",
"而此刻，霍家书房的灯还亮着。霍沉把那份烫金请柬看了一遍又一遍，忽然叫陈默：「去查——霍氏这届参展，谁负责？」",
"陈默咽了口唾沫：「珠宝线……正缺一个艺术总监。」",
"霍沉在窗前站了很久。窗外夜色沉沉，城南方向有一盏极小的灯，隔着半座城，稳稳地亮着。",
"他想起白天宴席上她摘下面纱的那个瞬间——那种沉静的 {{demeanor|举止神态}}，那种不动声色的 {{bearing|仪态}}，像把十年风霜都别进了袖口。",
"「艺术总监的人选，」他轻声说，「我有一个。」",
"夜色里，怀表的滴答声一下一下，像在替谁数着倒计时——下一场风，已经从日内瓦的方向吹过来了。"
]},
{no:31,t:"S",ws:[["hall","n.","大厅"],["concept","n.","概念"],["pseudonym","n.","化名"],["biography","n.","简介"],["blueprint","n.","蓝图"],["pattern","n.","纹样"],["gradient","n.","渐变"],["sinuous","adj.","蜿蜒的"],["genre","n.","体裁"],["flamboyant","adj.","浮夸的"],["ornate","adj.","华丽的"],["opulent","adj.","豪华的"],["tacky","adj.","俗气的"],["unassuming","adj.","不事张扬的"],["tasteful","adj.","有品位的"],["sleek","adj.","流畅优雅的"],["sophisticated","adj.","精致老练的"],["imitation","n.","模仿"],["ingenuity","n.","巧思"],["originality","n.","独创性"],["novelty","n.","新颖"],["replica","n.","复制品"],["knockoff","n.","仿冒品"],["dimensions","n.","尺寸"],["scale","n.","比例"],["proportion","n.","比例"],["juxtaposition","n.","并置"],["rendering","n.","效果图"],["aesthetic","adj.","审美的"],["prototype","n.","原型"],["geometric","adj.","几何的"],["fluid","adj.","流畅的"],["symmetry","n.","对称"],["angular","adj.","有棱角的"],["harmony","n.","和谐"],["bold","adj.","大胆醒目的"],["muted","adj.","柔和低调的"],["palette","n.","色板"],["hue","n.","色调"],["tint","n.","浅色调"],["shade","n.","深浅"],["tone","n.","色调"],["baroque","adj.","巴洛克的"],["chic","adj.","时髦别致的"],["minimalist","adj.","极简的"],["brand","n.","品牌"],["avant-garde","n.","前卫"],["trademark","n.","商标"],["iconic","adj.","标志性的"],["logo","n.","标志"],["catalog","n.","目录"],["portfolio","n.","作品集"],["connoisseur","n.","鉴赏家"],["vibrant","adj.","鲜活的"],["monochrome","adj.","单色的"],["debut","n.","首秀"],["arena","n.","竞技场"],["audience","n.","观众"],["curator","n.","策展人"],["jury","n.","评审团"],["reviewer","n.","评论员"],["style","n.","风格"],["school","n.","流派"],["vision","n.","愿景"],["distinctive","adj.","独特的"]],
ps:[
"日内瓦的信在拾晚堂放了三天。第四天清晨，霍沉亲自来了。",
"他这次没带律师、没带特助，只在柜台上放了一份烫金的聘书：霍氏珠宝参展系列，诚聘艺术总监一职，聘期到大展闭幕。",
"「条件你开。」霍沉站在柜台三步外，语气是谈判桌上学不来的诚恳，「但请务必答应——霍氏的展 {{hall|大厅}}，需要你。」",
"苏晚擦着手上的药粉，把聘书扫了一遍：「我先问三个问题。」",
"「第一，霍氏这届的展台，想要什么？」",
"「让世界看见霍氏不只是珠宝商。」霍沉答得很快，「但我说不好那是什么——所以需要一个懂的人。」",
"「第二，谁拍板？我定的 {{concept|概念}}，中间能被市场部改吗？」",
"「创作全权在你。任何人，包括我，只有建议权。」",
"「第三，」苏晚把聘书合上，「署名。作品落款只有一个字母：S。展前，关于这个 {{pseudonym|化名}}，任何人不得追问；展册 {{biography|简介}} 一页纸，由我提供。」",
"霍沉的瞳孔缩了一下。S——那封送到城南的、他不知道内容的信。此刻两条线索在他脑中轰然相撞，他却听见自己说：「可以。」",
"「你不好奇S是谁吗？」苏晚故意问。",
"「好奇。」霍沉看着她，一字一句，「但我更怕好奇心毁掉一次合作。开幕那天你想让我知道的时候，我自然会知道。」",
"苏晚看了他两秒，忽然笑了。这一关，他总算学会了不催。",
"「成交。」她伸出手，「聘书留下，图纸明天起你来取。」",
"当天夜里，老宅阁楼。樟木箱最底层，奶奶的手稿一页页摊开：虫蛀的边角、{{gradient|渐变}} 的墨色、{{sinuous|蜿蜒的}} 卷草纹——从一九三八年到一九七五年，一个女设计师四十年的手泽。",
"手稿中段，一张 {{blueprint|蓝图}} 夹在两页 {{pattern|纹样}} 之间：一整套名为「本草」的珠宝设计——金银为骨，宝石为药，七件一套，每件对应一味药：甘草、当归、连翘、佩兰……",
"图纸右下角，一枚小小的花押：S。",
"奶奶的S。她这才发现，自己那个用了十年的化名，原来是一场隔代的继承。",
"「本草。」她轻声念出主题，{{aesthetic|审美的}} 脉络在这一刻清晰起来：以药入饰，以饰入世——这不只是珠宝，是苏家两代人的行医笔记，换了一种语言。",
"她连夜定下整套设计语言：「本草」七件，{{genre|体裁}} 上不追时兴的 {{flamboyant|浮夸的}} 大件，不做 {{ornate|华丽的}} 堆叠；既不学老派 {{opulent|豪华的}} 全金全钻，也不落 {{tacky|俗气的}} 批发款；整体 {{unassuming|不事张扬的}}，细节 {{tasteful|有品位的}}，弧线 {{sleek|流畅优雅的}}，气质 {{sophisticated|精致老练的}}。",
"第二周，霍氏老工坊重启。设计 {{prototype|原型}} 第一稿贴上墙：整套七件，{{geometric|几何的}} 底座配 {{fluid|流畅的}} 线条，{{symmetry|对称}} 里藏一点故意的 {{angular|有棱角的}} 偏斜——{{harmony|和谐}} 中带一丝锋芒，像药性，也像她自己。",
"市场部第一次看稿，会议室静得能听见空调声。",
"「{{bold|大胆醒目的}}。」市场总监半晌憋出一句，「但主石 {{muted|柔和低调的}} 色系，会不会太素？」",
"「素是本事。」苏晚调出 {{palette|色板}}：青金石的 {{hue|色调}}、绿松石的 {{tint|浅色调}}、紫晶的 {{shade|深浅}}、南红玛瑙的 {{tone|色调}}——「珠宝界的 {{baroque|巴洛克的}} 堆砌够多了，我们走一条 {{chic|时髦别致的}}、{{minimalist|极简的}} 路。」",
"「S老师，」市场总监试探着问，「咱们的 {{brand|品牌}} 调性偏老派，这套 {{avant-garde|前卫}} 得会不会跳？」",
"「跳才是目的。」苏晚淡淡道，「霍氏百年老 {{trademark|商标}}，缺的不是稳重，是让人记住的那一眼。{{iconic|标志性的}} 一眼，比一万句广告都值钱。」",
"整套「本草」刻意压住大红大金：唯一一件用浓色的「朱砂」，也是把 {{vibrant|鲜活的}} 红压进近乎 {{monochrome|单色的}} 银灰底座里，像雪里一点丹。",
"散会后，市场部连夜把新的 {{logo|标志}} 方案与展陈 {{catalog|目录}} 做出初稿。霍沉翻着目录，在「署名：S」那一行停了很久。",
"陈默凑过来：「霍总，查吗？S的 {{portfolio|作品集}} 十年只有七件，全球顶流 {{connoisseur|鉴赏家}} 抢着收藏，从没人见过真容。」",
"「不查。」霍沉合上册子，「她肯署名，就是给我的信任。别辜负。」",
"图纸深化同步推进：每件的 {{dimensions|尺寸}} 按 {{scale|比例}} 放样，{{proportion|比例}} 反复校核；两组主石刻意做 {{juxtaposition|并置}} 的碰撞；{{rendering|效果图}} 出三版，挑最静的一版。",
"草图堆到第三摞，阿满趴在案边问：「师父，灵感哪来？」",
"「从旧里来。」苏晚翻着奶奶的手稿，「行当里都怕撞款，其实怕的不是 {{imitation|模仿}}，是懒。真正的 {{originality|独创性}} 从来不新鲜——是把旧东西以 {{novelty|新颖}} 的方式重新说一遍。{{replica|复制品}} 和 {{knockoff|仿冒品}} 会过时，{{ingenuity|巧思}} 不会。」",
"「这是S的第二次 {{debut|首秀}} 吗？」",
"「算第一次。」苏晚收针线，「十年前，S的七件作品在一场小拍上匿名出手，只被三个懂行的看中。这次不同——日内瓦的 {{arena|竞技场}}，全世界的 {{audience|观众}}、{{jury|评审团}}、{{reviewer|评论员}}，还有最挑剔的 {{curator|策展人}}，都在场。S这个 {{style|风格}} 十年没露面，江湖里早传成了三个 {{school|流派}} 的故事；这次去，就是把故事收回来。」",
"她要的不是赢一场展，是立一个 {{vision|愿景}}：让「本草」成为霍氏新的 {{distinctive|独特的}} 印记——以药入饰，以善入美。",
"而在城市的另一头，一间灯火通明的工作室里，有人把拾晚堂外景的照片放大又放大。",
"「查清楚了，」阴恻恻的声音对着电话，「霍氏这届的艺术总监，签的是一个化名。备展四个月——够我们做很多事了。」",
"电话那头，是温家二公子。温氏珠宝倒了，但温家的手艺没倒——抄，是他们的祖传绝活。"
]},
{no:32,t:"灵感",ws:[["muse","n.","缪斯"],["sage","n.","鼠尾草"],["bud","n.","芽"],["fern","n.","蕨"],["dew","n.","露"],["ivy","n.","常春藤"],["willow","n.","柳"],["shower","n.","阵雨"],["moss","n.","苔"],["camphor","n.","樟"],["lavender","n.","薰衣草"],["thyme","n.","百里香"],["rosemary","n.","迷迭香"],["basil","n.","罗勒"],["coriander","n.","香菜"],["vine","n.","藤蔓"],["thorn","n.","刺"],["twig","n.","细枝"],["cinnabar","n.","朱砂"],["resin","n.","树脂"],["brook","n.","溪"],["pond","n.","池"],["reed","n.","芦苇"],["birch","n.","桦"],["ginkgo","n.","银杏"],["apothecary","n.","药铺"],["magnolia","n.","木兰"],["pollen","n.","花粉"],["flash","n.","灵光一闪"],["serendipity","n.","机缘巧合"],["epiphany","n.","顿悟"],["phial","n.","小药瓶"],["insight","n.","洞见"],["ethereal","adj.","空灵的"],["maple","n.","枫"],["puddle","n.","水洼"],["zest","n.","生趣"],["elixir","n.","灵药"],["rouse","v.","唤起"],["conjure","v.","变幻出"],["ignite","v.","点燃"],["ineffable","adj.","难以言喻的"],["otherworldly","adj.","超然尘世的"],["spellbinding","adj.","使人入迷的"],["captivate","v.","迷住"],["transcendent","adj.","超凡的"],["sublime","adj.","崇高的"],["allure","n.","魅力"],["enchant","v.","使着迷"],["charisma","n.","个人魅力"],["fortuitous","adj.","偶然的"],["fluke","n.","侥幸"],["galvanize","v.","激发"],["germ","n.","萌芽"],["animate","v.","赋予生机"],["nectar","n.","花蜜"],["gurgle","v.","汩汩"],["bark","n.","树皮"],["evoke","v.","唤起"],["foliage","n.","树叶簇"],["panacea","n.","万灵药"],["balm","n.","膏香油"],["hunch","n.","直觉"],["inspiration","n.","灵感"],["mesmerize","v.","使入迷"]],
ps:[
"备展的第一个月，苏晚把「灵感」两个字过成了日子。",
"她的 {{muse|缪斯}} 不在远方，在城南：在晨起炮制的一屉 {{sage|鼠尾草}}，在窗台那盆薄荷的新 {{bud|芽}}，在雨天 {{fern|蕨}} 叶上一颗一颗的 {{dew|露}}。",
"老街的墙根爬着 {{ivy|常春藤}}，井边的 {{willow|柳}} 条垂进水里；{{shower|阵雨}} 天，她带着阿满去看 {{moss|苔}}——「苔色要入石青，雨气要留白。」阿满记了一本子，似懂非懂。",
"药圃是她最常去的地方。{{camphor|樟}} 树荫下种着 {{lavender|薰衣草}}、{{thyme|百里香}}、{{rosemary|迷迭香}}、{{basil|罗勒}}，一畦 {{coriander|香菜}} 开着碎白花；{{vine|藤蔓}} 缠上篱笆，{{thorn|刺}} 与 {{twig|细枝}} 都成了纹样素材——回去就进图纸。",
"晨光把整条街 {{animate|赋予生机}}：花架上的 {{nectar|花蜜}} 引来蜂，檐角滴水 {{gurgle|汩汩}} 作响，老 {{bark|树皮}} 与新叶同框。她把这些统统搬进「连翘」件的底纹，隔着金属，{{evoke|唤起}} 一整个初夏；{{foliage|树叶簇}} 的层次，后来成了整组作品共享的暗纹。",
"「本草」七件的主石，灵感多从药里来：甘草的暖金、当归的赭、佩兰的青；最难的那件「朱砂」，用的是她压箱底的一块天然 {{cinnabar|朱砂}} 矿——奶奶旧年所得，色如凝血，灯下 {{resin|树脂}} 般通透。",
"城南的小 {{brook|溪}}、{{pond|池}} 边，{{reed|芦苇}} 与 {{birch|桦}} 影给了她线条；{{ginkgo|银杏}} 一黄，满地都是现成的金工镶嵌稿。她说：「大自然是最好的 {{apothecary|药铺}}，也是最好的珠宝匠。」",
"月末，老宅后院那株 {{magnolia|木兰}} 开了头一茬。苏晚站在树下看了半个时辰，回去把「佩兰」一件的曲线全部重画——花瓣上那一点将谢未谢的 {{pollen|花粉}} 黄，成了新主石。",
"「这一笔是偷来的？」阿满问。",
"「借来的。」苏晚笑，「天地间的美，谁不是借了用？」",
"也有玄乎的时刻。给「佩兰」找主石那周，她连续五天没有头绪，索性关了工坊去河边帮人捞猫——{{fortuitous|偶然的}} 得很，猫上树那家竟是位退休的宝石匠，家里一抽屉青金；{{fluke|侥幸}} 到她自己都不信。奶奶在世时管这叫「手气」，她现在懂了：那叫 {{galvanize|激发}}——把心放空，天地才肯给你 {{germ|萌芽}}。",
"创作顺的时候，一晚出三稿；卡住的时候，三天画不出一条线。她不急，去给街坊扎两针、配两剂药，回来再看，笔自己就动了——灵感这东西，从来不是 {{flash|灵光一闪}} 撞出来的，是 {{serendipity|机缘巧合}} 加上手上的笨功夫。",
"某个雨夜，她给「连翘」件的托座改到第七版，忽然停笔——{{epiphany|顿悟}} 来了：托座不该是平的，该是一枚浅浅的药 {{phial|小药瓶}} 剖面，瓶口那一线，正好卡住主石。",
"那一刻她想起奶奶的话：好设计是等来的 {{insight|洞见}}，不是熬出来的执念。她在图纸边角记下时间：凌晨两点十七分，雨停。",
"阿满有一回凑热闹：「师父，您说世上有没有 {{panacea|万灵药}}？」",
"「没有。」苏晚头也不抬，「但有 {{balm|膏香油}}。」——那瓶自制的紫草膏，治烫伤，也治画废图纸的手滑。夜里灵感断线时，她靠多年的 {{hunch|直觉}} 起稿：先落错笔，再改对——{{inspiration|灵感}} 从来不怕错，只怕空。",
"第二个月起，霍沉每周三来取图。",
"他从不进工作间，只站在拾晚堂门口，等阿满把图纸抱出来。第一周，图纸封套上多了一盒润喉的枇杷露；第二周，是一把新伞骨；第三周，封套里附了张字条：工坊老师傅说，朱砂件的托座角度，全世界没人做过，请问苏老师是不是疯了。",
"苏晚回他四个字：是，别改。",
"霍沉的回复第二天送到，也四个字：已驳回工坊——保护疯子。",
"苏晚对着那行字，笑出了声。",
"十一月尾，第一件成品出炉：甘草。金托如根须盘绕，蜜蜡嵌成切开的甘草片，一圈年轮似的放射纹——灯下看，{{ethereal|空灵的}}；拿远了看，全是人间烟火气。",
"霍沉捧着那件甘草，看了足足五分钟。",
"「值多少钱？」他问得很轻。",
"「这个问题，」苏晚收工具，「在日内瓦，不成立。」",
"圈子里开始有流言。有藏家把S的旧作翻出来看，说那七件东西「有点说不清的味道」——{{ineffable|难以言喻的}}，又 {{otherworldly|超然尘世的}}，像看一场 {{spellbinding|使人入迷的}} 的梦。有位老收藏家说得直白：「别人做珠宝是卖宝石，S做珠宝像施法——{{captivate|迷住}} 人的不是克拉数，是那点 {{transcendent|超凡的}} 的气。」",
"霍沉也看过S的旧作照片。第一眼的感觉他没法跟任何人说：那种 {{sublime|崇高的}} 的静，那种 {{allure|魅力}}，隔着照片都 {{enchant|使着迷}}——明明无人露面，字里行间全是 {{charisma|个人魅力}}。他把照片锁进抽屉，心想：等日内瓦。",
"日内瓦寄来的往届预展视频里，老师傅们修蜡起版的手艺，让工坊的年轻人看得 {{mesmerize|使入迷}}——苏晚在片尾备注：学的是精神，不是别人的手。",
"当晚，温家二公子的工作室里也摆着一件「甘草」——照片版。无人机拍的，隔窗，糊。",
"「就这么个东西，也值得他们兴师动众？」二公子嗤笑，「行，照着做。三件赶工，展前放出去——署名，也叫S。」",
"助理迟疑：「可万一……」",
"「万一什么？」二公子把照片拍在桌上，「S十年不露面，谁认识真S？等我们的人先「亮相」，真S再出来，那就是冒我们的名。偷来的锣，敲响了自己拿走——这生意我爷爷做了半辈子。」",
"冬月，城南落了初雪。苏晚在院里晒药，看见 {{maple|枫}} 叶最后一批落进 {{puddle|水洼}}，忽然想起给「当归」件配的那枚蜜蜡——「取它的 {{zest|生趣}}。」她自言自语，回去把托座的弧度又收了一分。",
"阿满烤着红薯问：「师父，您说好的珠宝，到底是什么？」",
"「是让人看见看不见的东西。」苏晚想了想，「药 {{elixir|灵药}} 治身，好的器物 {{rouse|唤起}} 心。奶奶管这个叫「借物还魂」——把山河岁月 {{conjure|变幻出}} 一小块，挂在人身上。」",
"「那要是有人偷了魂呢？」",
"苏晚收拾晒药的竹匾，语气淡：「偷得走图纸，偷不走落笔前的十年。」",
"她没跟阿满说的是：那天清晨取信时，她收到过一封没有署名的手稿征集函——有人高价收购「苏氏药铺」旧图纸，出价人代号「回声」。",
"「回声。」顾之衍在电话里皱眉，「有人想抢在开幕前，把你的来路买断。」",
"「买不走的。」苏晚把那封征集函折成纸飞机，丢进药炉，「手稿能买，传承买不到——我奶奶的东西，早长进我手上了。」",
"十二月，七件图纸全部定稿。最后一晚，苏晚在扉页写下落款：S。笔尖顿了顿，又添了一行小字：借天地一物，还人间一味。",
"窗外雪落无声。工坊里，第一批金料已经 {{ignite|点燃}} 了熔炉——四个月倒计时，正式开始。"
]},
{no:33,t:"工坊",ws:[["foundry","n.","铸造车间"],["karat","n.","开"],["alloy","n.","合金"],["purity","n.","纯度"],["mold","n.","模具"],["tongs","n.","夹钳"],["vent","n.","排气口"],["flask","n.","铸型筒"],["kiln","n.","窑"],["cast","v.","浇铸"],["crucible","n.","坩埚"],["goldsmith","n.","金匠"],["furnace","n.","熔炉"],["smelt","v.","熔炼"],["anneal","v.","退火"],["quench","v.","淬火"],["temper","v.","回火"],["silversmith","n.","银匠"],["anvil","n.","铁砧"],["hammer","n.","锤"],["mallet","n.","木槌"],["chisel","n.","凿子"],["punch","n.","冲头"],["lapidary","n.","宝石匠"],["bezel","n.","包边"],["inlay","n.","镶嵌"],["prong","n.","爪"],["cluster","n.","群镶"],["channel","n.","槽镶轨道"],["setting","n.","镶嵌底座"],["setter","n.","镶嵌师"],["draw","v.","拉丝"],["wire","n.","金属丝"],["burr","n.","毛刺"],["rasp","n.","粗锉"],["rivet","n.","铆钉"],["solder","v.","焊"],["flux","n.","助焊剂"],["granulation","n.","金珠工艺"],["filigree","n.","金丝细工"],["twine","v.","捻"],["braid","v.","编织"],["coil","v.","盘绕"],["weave","v.","编"],["mesh","n.","网状结构"],["lattice","n.","格架"],["leaf","n.","金箔"],["hinge","n.","铰链"],["abrasive","n.","磨料"],["emery","n.","金刚砂"],["buff","v.","抛光"],["burnish","v.","擦亮"],["plating","n.","电镀"],["gild","v.","镀金"],["brooch","n.","胸针"],["earring","n.","耳环"],["necklace","n.","项链"],["pendant","n.","吊坠"],["locket","n.","吊坠盒"],["tiara","n.","冠冕"],["ring","n.","戒指"],["solitaire","n.","单钻戒"],["cameo","n.","浮雕宝石"],["patina","n.","包浆"],["hallmark","n.","检验印记"]],
ps:[
"腊月里的霍氏老工坊，是全城最暖的地方——不是暖气，是炉火。",
"百年 {{foundry|铸造车间}} 翻新重开，三位老匠人带七个年轻学徒，为七件「本草」赶工。苏晚每三天来一次，盯工序，也教课。",
"第一课讲料。「金有金性，」她拈起一粒金珠，「24 {{karat|开}} 是足金，软；做托要掺银铜成 {{alloy|合金}}，硬而不脆。{{purity|纯度}} 和韧性，永远在打架——好金工，就是劝架的。」",
"失蜡法是七件的骨架。蜡模雕刻完，插上 {{vent|排气口}}，灌浆成 {{mold|模具}} 壳，进 {{kiln|窑}} 脱蜡，再把熔化的金液 {{cast|浇铸}} 进空腔——蜡去金来，一次成器；趁 {{flask|铸型筒}} 未冷，用 {{tongs|夹钳}} 叩出毛坯。",
"{{crucible|坩埚}} 里的金水亮得晃眼。老 {{goldsmith|金匠}} 掌火，{{furnace|熔炉}} 一开，{{smelt|熔炼}} 的热浪隔着两米都烤脸。",
"金属的脾气比人还怪：烧红要 {{anneal|退火}}，落水要 {{quench|淬火}}，回炉要 {{temper|回火}}——三把火，一把都不能错。老 {{silversmith|银匠}} 示范银件的活儿：银条在 {{anvil|铁砧}} 上被 {{hammer|锤}} 出长浪纹，木 {{mallet|木槌}} 定形，误差不超一根发丝。",
"錾刻那几天，工坊从早到晚叮叮当当。錾刀统共三十六把：平口錾走线，圆口錾起肉，{{chisel|凿子}} 开层；老匠人捏 {{punch|冲头}} 的手稳得像钟摆，一条卷草纹錾到底，中途不换气。",
"切石的 {{lapidary|宝石匠}} 先行打样。「本草」七件镶法各不相同：「朱砂」的金 {{inlay|镶嵌}} 纹里先嵌细银线，再整体入 {{bezel|包边}} 闷镶；「佩兰」的浅色碧玺走 {{prong|爪}} 镶，露光最多；「连翘」的碎黄晶按 {{cluster|群镶}} 摆出花序；「当归」托座下藏一道 {{channel|槽镶轨道}}，侧看只见一线金边。{{setting|镶嵌底座}} 差之毫厘，石就露或不露，全在 {{setter|镶嵌师}} 手上。",
"最难的是「甘草」的须根：金丝拉到 0.3 毫米——{{draw|拉丝}} 板从粗到细过八道，{{wire|金属丝}} 拉到最后一道，一碰就断。断了不许扔：接头的 {{burr|毛刺}} 用 {{rasp|粗锉}} 磨平，小件直接 {{rivet|铆钉}} 固定，大件才 {{solder|焊}} 回去；焊点上 {{flux|助焊剂}} 多一分就发乌，全靠老师傅一杆喷枪的手感。",
"「朱砂」件的 {{granulation|金珠工艺}} 耗时最久：把金烧成几百颗小珠，再一颗颗焊上底托，摆出药丸铺陈的阵。年轻学徒焊废三十颗，哭了鼻子。",
"「焊废的不是珠子，」苏晚把废珠扫进回收皿，「是火候。明天再来。」",
"金丝细工也开了课：{{filigree|金丝细工}} 的卷纹用镊子盘，{{twine|捻}} 丝、{{braid|编织}}、{{coil|盘绕}} 三种手法教了个遍；托底 {{lattice|格架}} 用 {{weave|编}} 织法走线，成品细看是一片 {{mesh|网状结构}}，透光，像药筛。还有极薄的 {{leaf|金箔}}，贴嵌在托座暗纹里，薄到屏息。",
"「佩兰」件里藏了个小心思：吊坠背板做成活动 {{hinge|铰链}}，能翻开——里面錾着一行小字：佩兰入药，辟秽。",
"抛光是最后一关。砂磨从粗 {{abrasive|磨料}} 到细 {{emery|金刚砂}}，油石、皮轮、毛刷轮着来；{{buff|抛光}} 之后过 {{burnish|擦亮}}，白洋布擦三天，金属面能照出人脸。老匠人验收「甘草」那件时，指腹摸过须根，半天说了一句：「这活儿，三十年没见过了。」",
"有学徒问，要不要给银件做 {{plating|电镀}} 提亮。苏晚摇头：「本草不镀。银就是银，戴旧了，包浆是它的第二层皮。」",
"成器那天，七件摆成一排：{{brooch|胸针}} 是「连翘」，{{earring|耳环}} 是「佩兰」，颈间的 {{necklace|项链}} 是「当归」；{{pendant|吊坠}}「甘草」配 {{locket|吊坠盒}} 式翻盖，冠饰 {{tiara|冠冕}} 的名分给了「朱砂」，{{ring|戒指}} 用的是「连翘」第二件；压轴那枚 {{cameo|浮雕宝石}} 用的「佩兰」俏色料。另有一枚 {{solitaire|单钻戒}} 式的单主石「朱砂」戒——不参展，留给苏家自己。",
"阿满跟班一个月，问：「师父，为什么每件都留手作痕迹？机器做不是更平吗？」",
"「平的东西没有体温。」苏晚把一件半成品对着灯，「人手会抖，抖出来的 {{patina|包浆}} 味道，机器一辈子学不会。」她指着「当归」上那层薄 {{gild|镀金}}：「这层金不是贵，是给银胎描一味药色——薄到透，才叫本事。」",
"工坊的墙上贴着规矩，最后一条是苏晚手写的：出坊的每件东西，都要敢刻 {{hallmark|检验印记}}——宁可慢，不可假。",
"年后，工坊新招了个学徒，手脚勤快，眼神却总往图纸柜上飘。",
"没人注意他袖口里的微型相机，也没人知道，「回声」的定金，已经打进了他表哥的账户。"
]},
{no:34,t:"石头的语言",ws:[["mine","n.","矿"],["volcanic","adj.","火山的"],["crust","n.","地壳"],["mantle","n.","地幔"],["stratum","n.","地层"],["magma","n.","岩浆"],["lava","n.","熔岩"],["excavate","v.","发掘"],["boulder","n.","巨石"],["sediment","n.","沉积物"],["eruption","n.","喷发"],["geology","n.","地质学"],["mineralogy","n.","矿物学"],["bedrock","n.","基岩"],["miner","n.","矿工"],["mineral","n.","矿物"],["shaft","n.","矿井"],["tunnel","n.","隧道"],["seam","n.","矿层"],["lode","n.","矿脉"],["ore","n.","矿石"],["quarry","n.","采石场"],["rough","n.","原石"],["impurity","n.","杂质"],["provenance","n.","来源"],["moonstone","n.","月长石"],["opal","n.","蛋白石"],["garnet","n.","石榴石"],["pit","n.","矿坑"],["carat","n.","克拉"],["spinel","n.","尖晶石"],["opaque","adj.","不透明的"],["iridescent","adj.","虹彩的"],["dazzle","v.","炫目"],["facets","n.","刻面"],["brilliance","n.","火彩"],["cabochon","n.","蛋面"],["cut","n.","切工"],["hardness","n.","硬度"],["mohs","n.","莫氏"],["density","n.","密度"],["cleavage","n.","解理"],["fracture","n.","断口"],["grade","n.","品级"],["flawless","adj.","无瑕的"],["clarity","n.","净度"],["refract","v.","折射"],["dispersion","n.","色散"],["fire","n.","火彩"],["amethyst","n.","紫晶"],["citrine","n.","黄晶"],["tourmaline","n.","碧玺"],["aquamarine","n.","海蓝宝"],["topaz","n.","托帕石"],["peridot","n.","橄榄石"],["zircon","n.","锆石"],["ruby","n.","红宝石"],["sapphire","n.","蓝宝石"],["emerald","n.","祖母绿"],["gemstone","n.","宝石（统称）"],["diamond","n.","钻石"],["alexandrite","n.","变石"],["tanzanite","n.","坦桑石"],["quartz","n.","石英"],["flaw","n.","瑕疵"]],
ps:[
"备展第三个月，主石还没凑齐。苏晚决定：亲自去南边走一趟。",
"工坊留阿满看家，她带着霍氏的采购师和一名鉴定师，直奔南岭的宝石 {{mine|矿}} 区。",
"矿区像一册摊开的教科书：远处是死火山，{{volcanic|火山的}} 锥体下压着 {{crust|地壳}} 与 {{mantle|地幔}} 交界的褶皱；矿脉顺着 {{stratum|地层}} 走向蜿蜒，像大地写的一行行草书。",
"鉴定师一路科普：这行当的一半是 {{geology|地质学}}——石头从 {{magma|岩浆}} 到 {{lava|熔岩}}，从 {{sediment|沉积物}} 到岩层，每一次 {{eruption|喷发}} 都在给宝石重新发牌；另一半是 {{mineralogy|矿物学}}，认的就是藏在 {{bedrock|基岩}} 里、等着被 {{excavate|发掘}} 的那些 {{mineral|矿物}} 颗粒。",
"矿上规矩，下 {{shaft|矿井}} 要签生死状。苏晚签了。吊笼落到负三百米，掌子面的灯一盏盏亮起来，{{tunnel|隧道}} 深处有水声，{{seam|矿层}} 里有星子似的反光——那是 {{lode|矿脉}} 的心跳。",
"老 {{miner|矿工}} 举灯带路，锤子敲一敲岩壁与 {{boulder|巨石}}：「听声辨石。闷的是废 {{ore|矿石}}，脆的才有货。」",
"他们在 {{quarry|采石场}} 旁的选矿棚里蹲了两天。成堆的 {{rough|原石}} 里挑货，讲究「三看」：看皮、看口、看里头的 {{impurity|杂质}} 与棉纹。",
"「杂质棉纹不是脏。」苏晚捏着一块对着光，「是石头的胎记。有的内行专门收它——这些内含物的走向，能看出石头的 {{provenance|来源}}，比证书还诚实。」",
"一周下来，「本草」的主石渐渐齐了：佩兰配月长石——{{moonstone|月长石}} 的光像揉进水里的月，另有一枚 {{opal|蛋白石}} 备选，日光下更幻；当归配石榴石——{{garnet|石榴石}} 的暖赭像煨透的药汤。最难的那颗大件，还在深矿 {{pit|矿坑}} 边的私藏柜里等着她。",
"那是一颗三分 {{carat|克拉}} 出头的红尖晶——{{spinel|尖晶石}} 里最烈的鸽血色，底色深得近乎 {{opaque|不透明的}}，灯下 {{iridescent|虹彩的}} 一转，像一整条命都燃在里面。",
"矿区老板开价时讲了来历：三十年前，这颗石头的原矿被一个咳血的老矿工揣在怀里下了井，上来时人已经不行了——留给闺女，闺女后来学医，救过他全家。",
"苏晚握着那颗石头，半天没说话。",
"奶奶救过的人里，有一个是矿工——她忽然想起父亲呓语里那句「药王谷」，想起手稿里一页画着红石头的速写，边角注着小字：还债之人，赠石为凭。",
"这颗石头在外面转了三十年，兜兜转转，还是回到了苏家手里。",
"「按你的价，」苏晚点头，「再加一成——那一成，替我爷爷的爷爷，谢南岭的山水。」",
"回程的火车上，她把那颗尖晶摆在窗台，落日穿过它，在车顶投下一小片红。{{dazzle|炫目}} 得不讲道理。",
"切工会议开了整整一夜。鉴定师主张切成标准明亮式，五十七个 {{facets|刻面}} 保 {{brilliance|火彩}}；苏晚摇头：「朱砂不切亮面。做 {{cabochon|蛋面}}，火收进去——药要文火，石头也一样。」",
"最后定的是弧面蛋形，仅留底部一圈暗 {{cut|切工}} 线收光。对着灯看，光从石心里透出来，闷而不暗，烈而不浮——「这才是朱砂，」她说，「按住火，才有药性。」",
"鉴定师在旁边做记录：{{hardness|硬度}} 8，{{mohs|莫氏}} 标准；{{density|密度}} 折算 3.6；{{cleavage|解理}} 完整，无 {{fracture|断口}}；按净度 {{grade|品级}}，这一颗近乎 {{flawless|无瑕的}}——{{clarity|净度}} 这么高的尖晶，矿上二十年没出过第二颗。",
"「过 {{refract|折射}} 仪了吗？」",
"「过了。{{dispersion|色散}} 0.020，高于平均值。」",
"「{{fire|火彩}} 呢？」",
"「切蛋面，等于埋了它八成的火。」鉴定师心疼，「S老师，您真舍得？」",
"「舍得。」苏晚把石头收进绒盒，「药性不能靠抢眼。抢眼的东西，日内瓦多的是。」",
"同一周，温家二公子的采购清单也添了新货：{{amethyst|紫晶}}、{{citrine|黄晶}}、{{tourmaline|碧玺}}、{{aquamarine|海蓝宝}} 成批扫货，{{topaz|托帕石}} 与 {{peridot|橄榄石}} 论斤称。",
"「S不是用碧玺吗？」助理问。",
"「照着买。」二公子剔着指甲，「她用什么，我们用什么。{{zircon|锆石}} 能替的就替——展柜隔着玻璃，十个看客九个分不清 {{ruby|红宝石}} 与尖石。」",
"助理又问：「那 {{sapphire|蓝宝石}} 和 {{emerald|祖母绿}} 要吗？大件压场子。」",
"「要最好的。」二公子冷笑，「压场的东西不能省。另外，把那批 {{gemstone|宝石（统称）}} 的证书做了——渠道证书，你懂的。」",
"那颗用来「压场」的 {{diamond|钻石}} 后来被切成一百零八面，二公子管它叫「定海针」；边上两颗小的，{{alexandrite|变石}} 一颗、{{tanzanite|坦桑石}} 一颗——日光下绿、灯下红，蓝得发紫。他不懂石头的语言，只懂贵的语言。",
"而在北上的另一趟车上，苏晚把玩着一颗没入选的 {{quartz|石英}}——全透明，一丝 {{flaw|瑕疵}} 也没有。",
"「挑剩下的？」阿满在电话里问。",
"「挑剩下的。」苏晚笑了，「完美得没有故事——石头的语言里，这叫哑巴。」",
"她把那颗哑巴石英丢进随身的锦囊。有些东西不说话，但得留着——留给往后需要听它说话的那一天。"
]},

ps:[
"三月，备展收官。「本草」七件装箱启运的那天，城南下了一场杏花雨。",
"阿满把最后一个 {{crate|装箱}} 钉好，眼圈红红的。苏晚把工坊钥匙交到他手上：「看家。四月，带瑞士的巧克力回来给你。」",
"货运走的是专业 {{freight|货运}}：恒温恒湿柜、防震气垫、独立报关清单——三十七件 {{cargo|货物}} 的 {{manifest|货单}} 逐项核对，随车保镖比金库的还多；包装箱用完当日 {{dismantle|拆卸}} 回收。日内瓦那边的 {{clearance|清关}} 手续，顾之衍提前一周就办完了。",
"出发那天，老宅全员 {{farewell|送行}}。老爷子送到安检口，霍母塞了一整箱常备药，霍父的手写纸条贴在箱盖上：出了事，先打给我，别自己扛。{{embark|启程}} 前，苏晚回头望了一眼——她身后，站着一整个霍家。",
"瑞士的时间比想象中紧。落地 {{arrival|抵达}} 当天，行李往酒店一丢，全员直奔展馆 {{venue|场地}}。",
"第十一届国际珠宝大展的展馆大得像座城：{{atrium|中庭}} 挑高四层，{{foyer|前厅}} 的新 {{banner|横幅}} 与 {{poster|海报}} 换了整批，{{mezzanine|夹层}} 是媒体区，扶梯把人流一格格送上送下。各队的 {{lanyard|挂绳}} 颜色分明：红色是 {{credential|证件}} 齐全的参展商，黄色是 {{journalism|新闻业}} 的媒体证，白色是布展施工。",
"霍氏的 {{check-in|签到}} 台前，组委会的 {{organizer|组办方}} 专员核对材料——双语 {{introduction|介绍}}、作品清单、保险单，一页页过。她的 {{nameplate|铭牌}} 上只印四个信息：霍氏珠宝，艺术总监，S，展位 A-07。",
"布展三天，一天当两天用。展台按图 {{mount|布展}}：七件「本草」各上 {{pedestal|底座展台}}，{{mannequin|人台}} 穿素 {{linen|亚麻布}} 托起项链与耳饰，衬布选了茧 {{silk|丝}} 一类的 {{textile|纺织品}}；{{backdrop|背景板}} 是一整面药柜照片墙，{{lighting|灯光}} 调到暖白，{{placard|标牌}} 全部 {{trilingual|三语的}}——法、英、中。",
"老匠人 {{install|安装}} 展柜，{{assemble|组装}} 底座，一遍 {{align|对齐}} 一遍校平；苏晚蹲在「朱砂」展位前，做最后几笔 {{touch|点睛}} 的修整——标签、角度、光斑的位置。",
"开展前夜，全馆 {{rehearsal|彩排}} 到凌晨。阿满的越洋电话打进来时，苏晚正躺在 {{last-minute|最后关头的}} 的杂乱里吃三明治：展台 {{ambience|氛围}} 初成，七件东西在灯下静静立着，像等一场大考的学生。",
"「师父，」电话那头的声音很郑重，「今天国内有个发布会——有个工作室也发了一套「本草」，三件，署名S。」",
"苏晚捏着三明治，半天没说话。",
"来了。比她预想的还早三天。",
"手机里，阿满发来发布会的照片：三件仿品——仿得粗糙，托座走线、主石排布、錾纹走向，处处是对着照片硬描的痕迹；但通稿写得极其狠辣：S 归来，携新作「本草」先行亮相，并「正告同行：仿冒必究」。",
"而真正的 S，此刻蹲在日内瓦 A-07 展位里，手里捏着一枚螺丝。",
"倒打一耙。抢先亮相、倒扣帽子——这一手，把「真 S」逼到了墙角：开展后若两相对质，先声夺人的那一方，看客未必认账。",
"「师父，我们怎么办？改名字吗？」",
"「不改。」苏晚把最后一颗螺丝拧紧，站起来，掸了掸手，「一个字都不改。他们抢的是名字，抢不走东西。开展那天，让作品自己开口。」",
"第二天清晨，开展前两小时。各国团队在展馆里 {{greet|问候}} 寒暄，耳边 {{multilingual|多语的}} 声浪此起彼伏；组委会的 {{translator|笔译员}} 抱着材料匆匆走过，两位置身 {{bilingual|双语的}} 瑞士记者正对着海报整理采访提纲。",
"一位法国老先生驻足 A-07 前看了很久，用带口音的英文问：「这套东西……我在哪里见过这种神气。三十年前？还是六十年前？」",
"「或许是家师。」苏晚答。",
"老先生深深看她一眼：「S 的 {{premiere|首展}}，我会来。」",
"开展前一小时，日内瓦当地的展务已经把霍氏列入重点关注名单。瑞士人的严谨写在每个环节里：从 {{Switzerland|瑞士}} 组办方的 {{timetable|时刻表}} 到 {{Geneva|日内瓦}} 市政府的安保函，从中国驻瑞 {{embassy|大使馆}} 文化处送来的祝贺花篮到 {{consulate|领事馆}} 转来的媒体报道预约——霍氏的 {{entourage|随行团}} 里，连顾之衍都惊叹这阵仗，连 {{Swiss|瑞士的}} 老牌媒体都来预约了专访。",
"晚上的欢迎 {{gala|晚会}}，是全场第一场社交硬仗。",
"晚宴 {{buffet|自助餐}} 的长桌上，{{cocktail|鸡尾酒}} 一杯接一杯 {{clink|碰杯}}；各方人马在 {{mingle|交际周旋}}，陈默捧着一摞 {{flyer|传单}} 和 {{handout|派发材料}} 跟在苏晚身后，看她一个 {{handshake|握手}} 认识一位经销商，三句话 {{socialize|社交}} 到点子上，五句话 {{network|拓展人脉}} 一位藏家，一小时攒下的 {{connection|人脉}}，比市场部半年都多。",
"有个德国同行的 {{French|法语}} 说不利索，改用 {{German|德语}} 比划；苏晚用德语答了两句，又替他向瑞士主人转译——连 {{subtitle|字幕}} 都省了。围观的陈默目瞪口呆：他的苏老师，行医之外还藏着几国话？",
"晚会散场，苏晚回到 A-07，把七件「本草」最后巡了一遍。",
"「明天，」她对着灯下的七件东西轻声说，「替你们的祖母，也替你们的名字，开口吧。」",
"展馆熄了大灯。A-07 的小射灯下，「朱砂」的蛋面在暗处静静烧着一点红，像雪夜里的一味药。"
]},
{no:36,t:"抄袭",ws:[["spectator","n.","观众"],["trending","adj.","热搜的"],["hashtag","n.","话题标签"],["tweet","n.","推文"],["post","n.","帖子"],["chronology","n.","时间线"],["repost","v.","转发"],["bot","n.","机器人水军"],["troll","n.","网络喷子"],["viral","adj.","病毒式传播的"],["leak","v.","泄露"],["censure","n.","谴责"],["thread","n.","讨论串"],["plausibility","n.","可信度"],["backlash","n.","强烈反弹"],["announcement","n.","公告"],["libel","n.","文字诽谤"],["counterclaim","n.","反诉"],["defame","v.","诽谤"],["notice","n.","通告"],["sue","v.","起诉"],["discredit","v.","败坏名声"],["disparage","v.","贬损"],["underhanded","adj.","暗中的"],["unscrupulous","adj.","不择手段的"],["boycott","v./n.","抵制"],["campaign","n.","运动"],["piracy","n.","盗版"],["bootleg","adj.","盗版的"],["outcry","n.","强烈抗议"],["cyberbullying","n.","网络霸凌"],["warning","n.","警告"],["committee","n.","委员会"],["complaint","n.","投诉"],["arbitration","n.","仲裁"],["tribunal","n.","裁决庭"],["hearing","n.","听证"],["indictment","n.","控告"],["litigation","n.","诉讼"],["plaintiff","n.","原告"],["respondent","n.","被告方"],["affidavit","n.","书面证词"],["swear","v.","宣誓"],["corroborate","v.","佐证"],["belittle","v.","轻视"],["exhibit","n.","呈堂证物"],["video","n.","录像"],["timestamp","n.","时间戳"],["metadata","n.","元数据"],["documentation","n.","文件证明"],["dossier","n.","卷宗"],["air","v.","公之于众"],["testify","v.","作证"],["onlooker","n.","围观者"],["eyewitness","n.","目击者"],["clamor","n.","喧嚣"],["adjourn","v.","休庭"],["whistleblower","n.","吹哨人"],["ruling","n.","裁定"],["rebut","v.","反驳"],["restitution","n.","返还赔偿"],["retraction","n.","撤回声明"],["watermark","n.","水印"],["plagiarism","n.","剽窃"],["squabble","n.","口角"]],
ps:[
"开展第一天，A-07 门前排起了队。",
"「本草」七件在灯下立着，看过的 {{spectator|观众}} 出来都不说话，站一会儿，又折回去再看。到中午，队伍拐过两个弯。有藏家当场询价，被苏晚婉拒：「本草非卖品，展毕回国。」有人出价到七位数，她还是那句。",
"麻烦在下午三点到。",
"一队人推着展箱，直接在 A-07 对面包下空展位，横幅拉起：「S 系列新作——本草·先声」。三件仿品摆上台面，连同一份律师声明：S 系列原创新作即日起全球首发；凡仿冒者，必起诉。",
"半小时内，词条上了 {{trending|热搜}}。",
"热搜里的剧情很顺滑：神秘大师 S 重磅回归、携「本草」新作亮相，却被霍氏「抢先布展」——评论区瞬间被 {{hashtag|话题标签}} 挺真S 刷屏；一篇篇「知情人爆料」的 {{tweet|推文}} 与长 {{post|帖子}} 挂出所谓 {{chronology|时间线}}，把霍氏描述成「买不到S就偷S」的无良资本。",
"水军来势汹汹。数据分析组连夜出报告：带节奏的账号里，三成是 {{bot|机器人水军}}，另有明显的 {{troll|网络喷子}} 集群；那条百万转的 {{repost|转发}}，源头账号注册时间不到一周。",
"「{{viral|病毒式传播的}} 是谣言，不是真相。」顾之衍在视频里冷笑，「他们花在热搜上的钱，够开三间工坊。」",
"有人把霍氏过去三个月的慈善记录一条条 {{leak|泄露}} 出来，反而成了风向的转折——帖子下面第一次出现「等裁定，别急着 {{censure|谴责}}」的 {{thread|讨论串}}。也有小博主坚持做对比视频，逐帧比錾纹、比镶口、比主石，专业号一个个冒出来，风向的 {{plausibility|可信度}} 悄悄扳回半城。",
"国内外的 {{backlash|强烈反弹}} 也来了：有自媒体发起对霍氏珠宝的 {{boycott|抵制}} {{campaign|运动}}，几个签约在谈的经销商按下了暂停键。",
"温方也没闲着：一边放话「盗版必究」，一边把三件仿品高价预售，链接标题就写「S 同款」——赤裸裸的 {{piracy|盗版}} 与 {{bootleg|盗版的}} 路数；那家签了「授权」的工作室，注册地查无实址。",
"官方 {{announcement|公告}} 当晚发布：一、欢迎一切鉴定与核验；二、已对不实 {{libel|文字诽谤}} 内容完成公证存证；三、{{counterclaim|反诉}} 材料同步准备，涉 {{defame|诽谤}} 的营销号一个不漏。声明没有辩解，只有三行 {{notice|通告}} 式的冷静，末尾一句：作品自己会说话。",
"霍氏内部，也有不同声音。公关与法务在会议室 {{squabble|口角}} 到凌晨：一个要发声，一个要封口。有顾问主张先发制人 {{sue|起诉}} 对方 {{discredit|败坏名声}}；有顾问建议花大钱 {{disparage|贬损}} 对方声量，{{underhanded|暗中的}} 办事，别沾手就好。霍沉听完，全否了：「霍氏不做 {{unscrupulous|不择手段的}} 事，但一步也不退。」",
"裁定悬而未决，展馆里先起了 {{outcry|强烈抗议}} 与 {{cyberbullying|网络霸凌}} 的杂音：A-07 的留言簿被人恶意刷屏，年轻组员被陌生账号围攻。组委会发了一份 {{warning|警告}}：任何干扰参展商的行为，一律取消资格。",
"第二天上午，大展 {{committee|委员会}} 收到温方工作室的正式 {{complaint|投诉}}，请求裁定霍氏侵权、撤销 A-07 参展资格，并申请禁令禁止霍氏继续展出「本草」。按章程，重大知识产权争议先 {{arbitration|仲裁}} 调解、后提交特别 {{tribunal|裁决庭}}，程序三步：书面 {{hearing|听证}}、公开质证、裁定；期间涉案展品可继续展出，展签加注「争议中」。",
"A-07 的展签挂上黄条那一刻，苏晚正给「连翘」换灯。她把标签扶正，笑了一下：加注吧，正好帮我们排队。",
"温方的律师团阵容豪华，先递了 {{indictment|控告}} 式的声明，又提交 {{litigation|诉讼}} 预告；通稿里，S 是 {{plaintiff|原告}} 方的「签约艺术家」，霍氏是 {{respondent|被告方}}。",
"「哪来的签约艺术家？」一位欧洲记者当场提问，「S 十年只闻其名，谁见过签约仪式？」",
"对方律师亮出一份 {{affidavit|书面证词}}：有「证人」{{swear|宣誓}} 作证，亲眼见过 S 本人亲授新系列；另附「创作手稿」照片一叠，声称足以 {{corroborate|佐证}}。那份证词把 S 的十年，轻描淡写成一场随时可以作废的交易。",
"「手稿？」苏晚接过那叠复印件，一页页翻。翻到第三页，她的手指停了半秒——纸上的纹样，是奶奶手稿第七卷的失散页。",
"她面无表情地翻完，递还回去，只说了三个字：「鉴定吧。」",
"第三天，公开质证。两方 {{exhibit|呈堂证物}} 摆满长桌：温方有「授权书」「证词」「手稿」，霍氏有工坊全程 {{video|录像}}、{{timestamp|时间戳}} 完整的数字图纸、{{metadata|元数据}} 齐备的设计文件，以及「本草」每件主石的矿区 {{documentation|文件证明}}——含那颗红尖晶的来历公证书。",
"老匠人被请来 {{testify|作证}}。当着满堂 {{onlooker|围观者}}，他用放大镜看仿品的錾纹：「这是机雕的手。人是活的，机器是死的——死手描活线，描得再像，间距是匀的。匀，就是假。」",
"矿区的退休宝石匠也来了，电话连线充当 {{eyewitness|目击者}}：那颗红尖晶，三十年前经他手切割，他记得那道天然的愈合纹。",
"温方律师反问，语气里带着对老匠人的 {{belittle|轻视}}：「霍氏的录像，会不会是后来补拍？」",
"「原始文件带机内数据，可送第三方实验室核验。」顾之衍答。当夜他把霍氏的 {{dossier|卷宗}} 理成三大册：创作、制作、流传——哪一段都有第三方签章。「他们的稿子经不起 {{air|公之于众}}，」他说，「我们的每一页，都晒得。」",
"质证从上午开到黄昏，{{clamor|喧嚣}} 的旁听席渐渐安静：懂行的人看得出，霍氏的证据链在变硬；温方的「手稿」却始终没拿出原件——「在保险库」，他们说。",
"「原件在保险库，」顾之衍当场笑了，「巧了。我们的原件，随时都在。」",
"当晚，特别法庭 {{adjourn|休庭}}，宣布七十二小时后裁定。",
"后半夜，工坊那名眼神飘的学徒失联了。第二天，他摇身一变成 {{whistleblower|吹哨人}}，对着镜头「勇敢」揭发霍氏「抄袭内幕」，口播稿连工坊术语都念错三处。老匠人看完只说了一句：「让孩子把退火和回火分清，再说话。」",
"七十二小时的最后一天，霍氏律师团把 {{restitution|返还赔偿}} 与公开 {{retraction|撤回声明}} 的诉求一并写进 {{ruling|裁定}} 建议，同时逐条 {{rebut|反驳}} 温方全部主张。这场被媒体称作「双S之争」的风波，把 {{plagiarism|剽窃}} 这个词钉在了展会热搜上——日内瓦本地报纸的标题起得刻薄：「当 S 遇见 S：谁在抄谁？」",
"而真正的暗流，散场后才开始涌动。",
"霍沉没走。他站在空了大半的厅里，盯着投影上没关的那页「手稿」照片——放大，再放大。",
"那条卷草纹，那个落款的运笔，那页纸右下角被茶水洇过的痕迹——他见过。不在档案里，不在资料里；在三年前一个雨夜，那个女人替他熬药的小桌上，摊开的一页旧纸上。一模一样。",
"「查到了吗，」他哑声问陈默，「S 是谁。」",
"陈默把钱包夹层里那张排班表抽出来，双手奉上。",
"霍沉看都没看：「烧了。她肯让我们知道的那天，会亲口说。」",
"可他攥着那张纸，在原地站了很久，忽然说：「备车。回老宅。」",
"「取什么？」",
"「阁楼那张照片。药柜前的那个人。」",
"同一夜，某间酒店套房。温二公子对着电话那头的「回声」发火：「不是说你把苏家的来路都买断了？他们的证据怎么一件比一件硬？！」",
"「急什么。」电话那头的声音很平，「手稿是真的，年代是真的。他们赢不了鉴定这一局——除非，那个老太婆的东西里，还藏着我们不知道的底。」",
"挂了电话，「回声」摩挲着茶杯，忽然想起什么，从保险柜里取出一页纸——那是当年从苏家诊所流出的、唯一没入册的残页。",
"灯下，残页角落有一枚极淡的 {{watermark|水印}}，形如一枚银针。",
"「这是什么？」",
"没人答得上来。"
]},
{no:37,t:"鉴定台",ws:[["assess","v.","评估"],["forensic","adj.","法证的"],["facility","n.","实验设施"],["apparatus","n.","装置仪器"],["spectrometer","n.","光谱仪"],["magnifier","n.","放大镜"],["ultraviolet","n./adj.","紫外"],["infrared","adj.","红外"],["radiocarbon","n.","放射性碳"],["chromatography","n.","色谱法"],["spectroscopy","n.","光谱学"],["swatch","n.","小样"],["cross-section","n.","横截面"],["ink","n.","墨水"],["pigment","n.","颜料"],["dye","n.","染料"],["paper","n.","纸张"],["pulp","n.","纸浆"],["grain","n.","纹理"],["lignin","n.","木质素"],["aging","n.","老化"],["yellowing","n.","泛黄"],["brittle","adj.","易碎的"],["creased","adj.","有折痕的"],["torn","adj.","撕破的"],["smudge","n.","污痕"],["fade","v.","褪色"],["legible","adj.","可辨认的"],["illegible","adj.","难辨认的"],["handwriting","n.","笔迹"],["script","n.","手写体"],["stroke","n.","笔画"],["embellishment","n.","修饰花饰"],["distinguish","v.","区分"],["differentiate","v.","辨别"],["inconsistency","n.","不一致"],["anachronism","n.","年代错置"],["telltale","adj.","露马脚的"],["glaring","adj.","显眼的"],["impeccable","adj.","无可挑剔的"],["watertight","adj.","滴水不漏的"],["airtight","adj.","无懈可击的"],["tangible","adj.","有形的"],["intangible","adj.","无形的"],["irrefutable","adj.","无可辩驳的"],["undeniable","adj.","不可否认的"],["decisive","adj.","决定性的"],["reverse","v.","逆转"],["upend","v.","掀翻"],["undercut","v.","削弱"],["disprove","v.","证伪"],["substantiate","v.","证实"],["attest","v.","证明"],["expert","n.","专家"],["pundit","n.","权威评论者"],["commentary","n.","评论"],["narrative","n.","叙述"],["spurious","adj.","伪造的"],["falsify","v.","篡改"],["tamper","v.","篡改"],["doctor","v.","篡改"],["rig","v.","暗箱操纵"],["cover-up","n.","掩盖"],["whitewash","v.","粉饰"],["smokescreen","n.","烟幕"]],
ps:[
"七十二小时的头一个清晨，温方声称的「S 原创手稿原件」，终于离开了保险库。",
"鉴定在展馆 {{facility|实验设施}} 区进行：三张长台，一圈 {{forensic|法证的}} 级设备——{{spectrometer|光谱仪}}、{{infrared|红外}} 成像、{{ultraviolet|紫外}} 灯、{{chromatography|色谱法}} 取样舱，外加一间便携 {{radiocarbon|放射性碳}} 测年室。",
"白手套、{{magnifier|放大镜}}、恒温手套箱，一样样 {{apparatus|装置仪器}} 看得人眼花。旁听席上的 {{pundit|权威评论者}} 们举着手机，连闪光灯都不敢开。",
"温方原件上台：一叠手稿，纸色 {{aging|老化}} 均匀，边角 {{torn|撕破的}} 豁口自然，折痕 {{creased|有折痕的}}，几点 {{smudge|污痕}} 深浅得当——第一轮目检，几乎 {{impeccable|无可挑剔的}}。",
"{{spectroscopy|光谱学}} 扫过去，年代也对：纸的 {{pulp|纸浆}} 里 {{lignin|木质素}} 衰减曲线落在六十年上下，{{ink|墨水}} 的 {{pigment|颜料}} 谱与老墨吻合，{{dye|染料}} 无现代合成峰。",
"「年代是真的。」负责 {{assess|评估}} 的首席 {{expert|专家}} 开口，语气克制，「就纸墨而言，这批手稿不是近作。」",
"温方律师席上，当场松了一口气。",
"旁听席的 {{commentary|评论}} 立刻起了风：纸是真的，S 的归属还有悬念？",
"霍氏申请追加第二轮：不只验纸墨，验笔与防伪。",
"顾之衍陈词：「年代只能证明纸老，不能证明字是谁写的。请鉴定组对 {{handwriting|笔迹}} 做 {{differentiate|辨别}} 分析——同一个时代的两双手，写的不是同一种字。」",
"鉴定组调出 S 现存旧作上仅有的几处笔迹档案，与原件逐 {{stroke|笔画}} 比对，再对两组 {{script|手写体}} 的运笔 {{grain|纹理}} 习惯做交叉分析。",
"结果出来：相似度极高——高到不自然的程度。",
"「{{telltale|露马脚的}} 痕迹在这儿。」苏晚上前，戴白手套翻到原件的落款页，「这组 {{embellishment|修饰花饰}}，起笔藏锋、收笔回带，是练过多年金石的写法；而温方提交的「授权书」签名，同一个装饰，写成了四道死直的线。同一双手？不可能。」",
"「再看这页。」她换过一页，指着角落，「真手稿容不下这种 {{anachronism|年代错置}} 式的细节：这枚印油，是一九五八年前的独家配方；可这批纸里有两页——纸对、印对、墨迹 {{legible|可辨认的}}——唯独 {{inconsistency|不一致}} 的，是装订孔距：现代工业化打孔机的孔距。仿旧装新，一孔露馅。」",
"温方律师立刻反对：「孔距不能说明什么。」",
"「那就再加一项。」苏晚退后半步，「申请 {{cross-section|横截面}} 取样，验 {{paper|纸张}} 分层与 {{swatch|小样}} 的 {{brittle|易碎的}} 程度——老纸的断面有梯度，做旧的断面是均匀的。」",
"第二轮取样进行到一半，{{glaring|显眼的}} 破绽先一步跳了出来：紫外灯下，原件其中一页浮出一层极淡的 {{yellowing|泛黄}} 喷涂痕迹——纸是老的，黄是喷的。",
"「做旧。」鉴定组长宣布，用词干脆，「人工 {{fade|褪色}} 与自然陈化，光谱分得开。」",
"旁听席炸了。",
"有记者趁乱挖出温方「授权工作室」的底细：注册不到四个月，官网图片盗自三家同行，所谓「运营记录」明显 {{doctor|篡改}} 过后台时间——连 {{cover-up|掩盖}} 都懒得做全。网上的评论二次发酵，先前带节奏的大号一夜删帖跑路。",
"温方律师还在撑：「即便做旧，也不能证明整批是伪造——」",
"「还要更 {{decisive|决定性的}} 的？」霍氏这边推出了第二组证物。",
"霍沉抱着一只扁木匣走进来，放在长台上：「霍氏补充证物：老宅档案，编号甲字第一。」",
"匣里是一张放大的旧照：一九六二年，一间药铺，一位女大夫，身后整面药柜。她手里摊开的，正是温方「原件」的其中一页——纸角同一处茶渍。",
"「照片经数字增强比对，纸页尺寸、折痕位置、茶渍形状，与今日呈堂原件一致。」鉴定组复核后 {{attest|证明}}，影像无篡改痕迹。",
"「也就是说，」顾之衍替全场总结，「温方手里那页真手稿，一九六二年就在苏家的药铺。请问温方：S 是一九六二年跟贵方签的约吗？」",
"满堂寂静里，温方律师的 {{narrative|叙述}} 彻底 {{upend|掀翻}}。",
"「笔迹鉴定的第一课，」当晚苏晚给阿满视频补课，「不是认字，是 {{distinguish|区分}} 习惯：真迹的每一笔都有来历，仿写的每一笔都有犹豫。真伪之间，隔着一层 {{illegible|难辨认的}} 却骗不过放大镜的东西——叫人心。」",
"顾之衍则连夜把温方的证词做成对照表：「每一页 {{spurious|伪造的}} 授权，都配着一次 {{tamper|篡改}} 痕迹；他们想 {{falsify|篡改}} 时间，就得 {{rig|暗箱操纵}} 整条证据链——可证据链不认钱，只认链。什么 {{smokescreen|烟幕}} 都挡不住链子断在哪个环上；新抛出来的那些「证人」，不过是障眼法。」",
"第三天清晨，鉴定组把两份报告并排封箱：霍氏一侧，证据 {{airtight|无懈可击的}}，链条 {{watertight|滴水不漏的}}；温方一侧，{{reverse|逆转}} 已无可能。日内瓦的早报用了一个词，叫 {{irrefutable|无可辩驳的}}；中区的老藏家们私下说得更直白：{{undeniable|不可否认的}}，东西和人都齐了。",
"温家的公关试图 {{whitewash|粉饰}}，发了一篇「误会说」的软文，评论区第一热评只有一句：「鉴定灯下，无话可说。」",
"还有更狠的。苏晚提出最后一项：请鉴定组确认原件上是否有一枚特殊暗记。",
"「{{tangible|有形的}} 证据验完了，」她说，「还有一道 {{intangible|无形的}} 的锁——苏家手稿，每页都有。」",
"紫外灯再起。第三页的角落，一枚针形暗记缓缓显影——与「回声」保险柜那页残页上的一样，只是更完整。",
"「苏家防伪，代代相承。」苏晚看着那枚显影，声音很稳，「手稿可以流散，锁认得回家的路。」",
"当晚，鉴定组出具中期结论：温方提交之「原件」，混合了真手稿与做旧仿页，来源不明；其指控基础已被 {{undercut|削弱}} 至零。有随行鉴定师对镜头感叹：「三十年了，头一次见把 {{substantiate|证实}} 做到这个精度的展商。他们不赢，连天理都难 {{disprove|证伪}}。」",
"次日一早，几家大报的标题换了风向：「双S之争反转：谁在用真纸写假字？」",
"温二公子连夜砸了酒店的一套茶具。",
"「回声」的电话，再也打不通了。",
"而在 A-07，霍沉把那只木匣留在了展台。他和苏晚站在展签的黄条下，隔着一段展柜的距离。",
"「照片是我从老宅带来的。」他说，「我猜，你不需要。」",
"「嗯。」苏晚看着展柜里的「朱砂」，语气平常，「我有的，比照片更全。」",
"「我知道。」霍沉忽然说。",
"苏晚抬眼。",
"「从矿区那双手开始，我就知道。」他看着她，目光稳得像手术前夜的灯，「你说过，开幕那天你想让我知道的时候，我自然会知道。我不催——但今天，是别人逼你。抱歉。」",
"「所以照片不是证物？」",
"「是我。」霍沉顿了顿，「我替奶奶来的。她要是还在，会想看看你把这些东西带到了多远。」",
"苏晚沉默了很久。展柜的射灯在两人之间亮着，像一盏熬了很多年的灯，终于挪到了能看清彼此的地方。",
"「霍沉，」她最后开口，「这盏灯，我先借展台一用。散展那天，再谈我们。」",
"「好。」他答得没有一丝犹豫，「我等散展。」",
"裁定还有十八小时。但有些裁定，在鉴定灯亮起的那一刻，就已经结束了。"
]},
{no:38,t:"熟悉的手稿",ws:[["remembrance","n.","回忆纪念"],["memoir","n.","回忆录"],["annals","n.","编年史"],["bygone","adj.","往昔的"],["sentimental","adj.","伤感的"],["heartrending","adj.","揪心的"],["heartwarming","adj.","暖心的"],["bittersweet","adj.","苦甜参半的"],["touching","adj.","动人的"],["soft","adj.","轻柔的"],["moved","adj.","感动的"],["overcome","v.","情难自禁"],["vulnerable","adj.","脆弱袒露的"],["exposed","adj.","被看穿的"],["recognized","adj.","被认出的"],["truthful","adj.","诚实的"],["transparent","adj.","坦诚的"],["affirm","v.","确言"],["medical","adj.","医疗的"],["practitioner","n.","从业医师"],["medic","n.","医护"],["infirmary","n.","医务室"],["genealogy","n.","家谱"],["pedigree","n.","家世"],["forebear","n.","先祖"],["surname","n.","姓"],["manuscript","n.","手稿"],["folio","n.","书页"],["notation","n.","记号"],["annotation","n.","批注"],["postscript","n.","附言"],["epilogue","n.","尾声"],["preface","n.","序言"],["dog-eared","adj.","卷角的"],["worn","adj.","磨旧的"],["rapprochement","n.","和解"],["amends","n.","赔罪"],["penance","n.","忏悔赎罪"],["absolve","v.","赦免"],["pardon","v.","原谅"],["closure","n.","心结的了结"],["peace","n.","平静"],["tranquility","n.","宁静"],["calm","adj.","平静的"],["fireside","n.","炉边"],["candlelight","n.","烛光"],["lamplight","n.","灯光"],["moonlight","n.","月光"],["starlight","n.","星光"],["shadows","n.","暗影"],["evening","n.","傍晚"],["listener","n.","倾听者"],["listen","v.","听"],["silent","adj.","沉默的"],["wordless","adj.","无言的"],["unspoken","adj.","未说出口的"],["voice","n.","声音"],["pitch","n.","音调"],["glance","n.","一瞥"],["behold","v.","注视"],["cry","v.","哭"],["hold","v.","握住"],["arm","n.","臂"],["hug","n.","拥抱"],["gentle","adj.","轻柔的"]],
ps:[
"裁定在第三天正午公布。",
"特别法庭当庭宣读：一、霍氏「本草」系列为原创作品，S 之署名归属霍氏展方；二、温方工作室提交之「授权」与「手稿」存在伪造与来源不明，取消本届参展资格，证据移交国内司法机关；三、温方须公开撤回声明并赔偿。",
"消息传回国内，前一天的骂声原样倒戈。那些昨天喊抵制的号，今天连夜改口「理性吃瓜」；昨天宣布暂停合作的经销商，排队发来道歉函。",
"国内老宅里，消息到时正是 {{evening|傍晚}}。霍父让程伯把 {{manuscript|手稿}} 的故事从头讲给佣人们听——这一回，没有遮掩。听完全家 {{moved|感动}}，霍母在厨房哭了一场，出来时眼睛肿着，却笑着把温了一天的汤端出来：「都是 {{heartwarming|暖心的}} 事儿，喝汤。」",
"苏晚没看热搜。裁定宣读的那一刻，她站在 A-07 的灯下，先把展签上那条黄色的「争议中」贴纸，慢慢撕了下来。",
"当晚，展馆破例给 A-07 留了一盏灯。",
"霍沉来了，带着老宅那只木匣，还有两杯热可可。",
"「散展还有十天。」他把一杯放在她手边，「不算违约吧，提前来还东西。」",
"匣子打开，是那页从温方证据堆里追回的真手稿——裁定后物归原主，法庭移交的第一件。",
"苏晚接过去，指尖在纸页上停了很久。",
"「陪我读读？」霍沉问，「我看了两天，有些地方……想知道你怎么讲。」",
"于是，展台的射灯下，两个人一页页翻那些 {{dog-eared|卷角的}}、{{worn|磨旧的}} 纸。{{candlelight|烛光}} 的气氛是达不到的——头顶是无影灯——可那份安静，比什么都像 {{fireside|炉边}} 的夜话。",
"第一个 {{folio|书页}}，是奶奶的 {{preface|序言}}，写于一九三八年，钢笔字：苏氏行医记，传吾孙。",
"「这个「孙」，」霍沉轻声问，「一开始，就是我认识的那个人？」",
"「嗯。」苏晚点头，「奶奶把我记进 {{annals|编年史}} 那年，我七岁。她说姓氏不重要，手艺认人。我后来用 S，一半是她的 {{surname|姓}}，一半是她说过的一针——所以 S 不只是一个字母。」",
"那一夜，霍沉才真正读懂这册 {{memoir|回忆录}} 的分量：它不是一册设计稿，是一部苏家的 {{genealogy|家谱}}——每一味药、每一页纸，都记着一个 {{forebear|先祖}} 的名字；那枚针形暗记，是苏家的 {{pedigree|家世}} 印，代代只传一人。",
"手稿中段，是十年行医的 {{medical|医疗的}} 案记，行行 {{notation|记号}} 密布：谁家小儿夜啼、谁家老人从 {{infirmary|医务室}} 转来的方子、哪一位 {{practitioner|从业医师}} 的会诊批语——{{annotation|批注}} 的墨色深浅不一，像十年的灯火明灭。",
"翻到一九六二年那页——照片里的那页。霍沉的手指停在茶渍上：「这渍……你说过，是病人打翻的药碗。」",
"「是急诊。」苏晚笑，「奶奶半夜出诊回来，药箱都没放稳。那页背面她补了一行 {{postscript|附言}}：活人要紧，稿纸事小。」",
"再往后，是被撕走又补抄的部分——流散出去的那几页。",
"「三十多年前，温家办「医闹」那一手，」苏晚的声音很平，「撬了诊所的柜，搜走两箱东西：一半是账，一半是稿。账他们拿去做了局，稿一直锁着——锁到今天，成了这场把戏。」",
"「你早就知道手稿在他们手里？」",
"「知道一部分。」她合上那页，「所以备展第一天看到复印件，我就知道：他们终于把压箱底的赃物亮出来了。」",
"霍沉沉默了很久。展柜的 {{shadows|暗影}} 里，「朱砂」那点红稳稳燃着。",
"「讲讲这十年吧。」他把 {{voice|声音}} 放得很低，像个 {{listener|倾听者}}，「我想 {{listen|听}}。」",
"于是她讲了。从十年前第一次以 S 之名出手讲起，讲到一半忽然停住——那些独自熬过的夜从没对人说过，此刻对着一个旧人开口，忽然觉得自己 {{vulnerable|脆弱袒露的}}；讲到金针救人的部分，又忍不住 {{cry|哭}} 了一场。霍沉全程 {{silent|沉默的}}，只在她说不下去的时候，用自己的 {{arm|臂}} 圈住她的肩，算得上一个笨拙的 {{hug|拥抱}}。",
"那是一种 {{bittersweet|苦甜参半的}} 的夜：话是 {{heartrending|揪心的}}，天亮时两个人却都 {{overcome|情难自禁}} 地笑了——把十年的结，讲成了 {{touching|动人的}} 的开头；仿佛只有展台那束 {{soft|轻柔的}} 射灯，一路听到了最后。",
"「苏晚，」霍沉终于开口，语气 {{gentle|轻柔的}} 却哑，「这些天我一直在想一件事。三年里，你在我家——我连你是谁都没看见。今天全世界都看见 S 了，我只想看见你。」",
"苏晚把热可可捧在掌心，没有立刻回答。",
"「你要的这个「看见」，」她慢慢说，「三年前我等过。后来不等了，不是灰心——是我自己也在学着先看见自己。等我把自己认全了，被看见这件事才不 {{exposed|被看穿的}} 惊慌，而 {{recognized|被认出的}} 安心。」",
"「那现在呢？」",
"「现在是——」她抬眼，{{glance|一瞥}} 落在他脸上，「我认全了。你是第一个，在所有人只看见马甲的时候，先看见我的人。谢谢你，等我长完。」",
"展台很静。{{wordless|无言的}} 半晌，霍沉伸出手，{{hold|握住}} 她的手腕——像医生之间确认脉搏那样，又完全不是。",
"「苏晚，」他说，「我不求你现在给我什么，散展那天你说了算。我只求一件事：往后你再掉一根针，让我在场。」",
"「 {{affirm|确言}} 一次，」她笑了，「成交。不 {{pardon|原谅}} 前尘，也不急着 {{penance|忏悔赎罪}}——先把人做对，再把日子过对。我们从头，慢慢来。」",
"「从头……是多前头？」",
"「从你把我的名字念对的那天起。」",
"「往后我们立个规矩，」苏晚擦了把脸，语气 {{calm|平静的}} 下来，「家里的事，你我都 {{truthful|诚实的}} 一点、{{transparent|坦诚的}} 一点。上一回三年，输就输在谁都没给谁看真账。」",
"霍沉点头，当场把它写进备忘录：「家事第一页：彼此 {{rapprochement|和解}} 的基础，是先 {{amends|赔罪}} 再 {{absolve|赦免}}，不翻旧账，不许缺席。」苏晚看着他认真写字的样子，忽然觉得胸口压了三年的那块地方，第一次透进 {{peace|平静}} 与 {{tranquility|宁静}}。",
"有些话依旧 {{unspoken|未说出口的}}——比如那句迟到三年半的对不起。可当 {{moonlight|月光}} 从展馆玻璃顶棚斜进来，落了两人一身，谁都明白：不是所有的债都要用嘴还。",
"那晚他们把手稿翻到最后一页。{{epilogue|尾声}} 只有一行小字，是奶奶的最后一句：稿在，人在，医道在。",
"苏晚说，这一页她十岁那年就看过了；这些年走到哪都带着。「现在，」她把最后一页抚平，「它 {{closure|了结}} 了——从温家的箱底，回了家的灯下。」",
"霍沉看着那行字，忽然想起什么，从西装内袋摸出一个小绒盒——里面是那块老怀表。「我爸让我带来的。他说，表在，账在，往后换我们家记恩。」",
"两件旧物并排躺在图纸堆上：一块表，一页稿。半生的误会与蹉跎，抵不过一句 {{bygone|往昔的}} 灯下诺言。",
"夜再深些，值班巡场的 {{medic|医护}} 过来说灯该关了。两人把手稿收进匣子，熄了展灯，并肩走出空馆——{{starlight|星光}} 稀薄，风把远处的湖吹出很低的 {{pitch|音调}}。",
"「不许笑我 {{sentimental|伤感的}}。」霍沉在馆外站定，回头看那座睡了的大展馆，「等散展那天，我想带你来看一眼拆空的 A-07。空的 {{remembrance|回忆纪念}} 也要留一张——记住我们从哪儿把彼此捡回来。」",
"苏晚 {{behold|注视}} 着他，忽然觉得这个把告别都要过成仪式的男人，比三年前那个连伞都递不明白的人，可爱了太多。",
"散展倒计时十天。夜色里 {{lamplight|灯光}} 一盏一盏熄了，A-07 的还亮着——这一回，是为两个人留的。"
]},
{no:39,t:"旧稿",ws:[["apprehend","v.","拘捕"],["archival","adj.","档案的"],["track","v.","追踪"],["footprint","n.","足迹"],["follow","v.","顺着"],["trail","n.","踪迹"],["hunt","v.","追查"],["shell","n.","空壳"],["proxy","n.","代理人"],["front","n.","幌子"],["launder","v.","洗（钱）"],["embezzle","v.","挪用"],["siphon","v.","抽走（资金）"],["deed","n.","契据"],["mastermind","n.","幕后主使"],["henchman","n.","爪牙"],["penitentiary","n.","监狱"],["visitation","n.","探视"],["embittered","adj.","怨愤的"],["inmate","n.","囚犯"],["warden","n.","典狱长"],["cell","n.","牢房"],["bars","n.","铁栏"],["parole","n.","假释"],["probation","n.","缓刑"],["clemency","n.","减刑宽恕"],["sentence","n.","判刑"],["hardened","adj.","麻木狠戾的"],["contraband","n.","违禁品"],["bequest","n.","遗赠"],["repository","n.","库藏"],["cataloguing","n.","编目"],["missing","adj.","缺失的"],["intact","adj.","完好无损的"],["fragment","n.","残片"],["incomplete","adj.","不全的"],["complete","v.","补全"],["stitch","v.","缝合连缀"],["collate","v.","整理装订"],["binder","n.","封套"],["volume","n.","卷册"],["illustration","n.","插图"],["typeset","v.","排版"],["reprint","v.","再版"],["out-of-print","adj.","绝版的"],["hardcover","n.","精装本"],["edition","n.","版本"],["imprint","n.","出版印记"],["publisher","n.","出版方"],["leaflet","n.","传单页"],["appendix","n.","附录"],["index","n.","索引"],["bustling","adj.","熙攘的"],["peddler","n.","小贩"],["mercantile","adj.","商贸的"],["emporium","n.","商场"],["vibrancy","n.","活力"],["homecoming","n.","归乡"],["repatriate","v.","归还故土"],["renewal","n.","更新"],["renaissance","n.","复兴"],["resurgence","n.","回潮"],["fundraiser","n.","募捐活动"],["dedication","n.","奉献"],["deposition","n.","口述记录"]],
ps:[
"裁定的第三天，那批追回的手稿随霍氏展团先期归国——护送等级，等同金条。",
"国内同步收网。",
"那名被收买的学徒，在机场被 {{apprehend|拘捕}}：袖口相机里存着两百多张图纸翻拍，{{archival|档案的}} 编号清晰可见。",
"顺着他的供述，办案人员 {{track|追踪}} 定金流水、循着数字 {{footprint|足迹}}、{{follow|顺着}} 通讯记录、锁定出货的 {{trail|踪迹}}，一路 {{hunt|追查}} 到温二公子名下三家 {{shell|空壳}} 公司：都是替温家当 {{proxy|代理人}} 的 {{front|幌子}}，账上近千万赃款 {{launder|洗}} 过四道。",
"温二公子的罪名一条条落实：教唆伪造、商业诋毁、{{embezzle|挪用}} 资金——审批签字俱在，{{siphon|抽走}} 的每一笔都有对应的 {{deed|契据}}。他在酒店大堂被带走时，还在跟律师讲价。",
"「回声」的身份也被挖了出来：温家老管家的儿子，三十年前经手过那场「医闹」，如今温家倒了，他替旧主办最后一件事。所谓 {{mastermind|幕后主使}}，真正下黑手的从来不是他——但 {{henchman|爪牙}} 也好，主谋也罢，档案袋一样厚。",
"城北女子 {{penitentiary|监狱}} 里，温念薇的第二次 {{visitation|探视}}，在狱方安排下进行。",
"隔着玻璃，霍沉没有太多话：「你家的手，伸得比我想的还长。」",
"温念薇穿着囚服，瘦得脱形，眼神却还 {{embittered|怨愤的}}：「我只是输给了运气。」",
"「不是运气。」霍沉起身前留下一句，「你和你家，输给了从来没把人当人。」",
"监区里，新来的 {{inmate|囚犯}} 都要听 {{warden|典狱长}} 讲一遍她的故事：诈骗、投毒、诬陷，一条龙。她的 {{cell|牢房}} 挨着放风场，铁 {{bars|栏}} 外一棵歪脖子树。入监第二年，工坊查出 {{contraband|违禁品}}，与她无关，她却出头替同监的人说了话——那大概是她头一回替别人说话。据说她后来在缝纫工坊干得最卖力，改造评语一年比一年好；但这辈子与 {{parole|假释}} 无缘——当年那纸 {{sentence|判刑}}，主罪没有 {{probation|缓刑}}，也谈不上 {{clemency|减刑宽恕}}。",
"有人问她悔不悔。据说她只是低头干活，一天比一天 {{hardened|麻木狠戾的}}，也一天比一天沉默。",
"手稿回国那天，老药市半条街放了鞭炮。",
"苏晚做了一件事：把追回的一百三十七页手稿，连同奶奶的旧照、老怀表，一并 {{bequest|遗赠}} 给老药市新设的苏氏医馆纪念馆——条件只有一条：免费对街坊开放，永不售票。",
"归档工作在纪念馆的 {{repository|库藏}} 室进行：{{cataloguing|编目}} 按年代分卷，缺页的标 {{missing|缺失的}}，幸存的标 {{intact|完好无损的}}；散落的 {{fragment|残片}} 用无酸纸袋分装，{{incomplete|不全的}} 卷次留出补录位。",
"「把它 {{complete|补全}}，」苏晚对顾之衍说，「不是把缺的页画出来，是把缺的故事讲下去。」",
"于是纪念馆立了个传统：向老街坊征集当年苏氏医案的回忆 {{deposition|口述记录}}，谁来都欢迎。",
"装订也在老药市完成：老师傅带着徒弟，一页一页 {{stitch|缝合连缀}}、上胶、{{collate|整理装订}}，配上素蓝 {{binder|封套}}；散了多少年的稿子，第一次有了完整的 {{volume|卷册}}。",
"纪念馆请了出版社，把影印版按年分卷排上日程：{{typeset|排版}}、配 {{illustration|插图}} 三十幅、付印、{{reprint|再版}} 各有专人。当年那册绝了版的家传医案，{{out-of-print|绝版的}} 三十年后，将以 {{hardcover|精装本}} 重回人间。首印扉页加一行 {{edition|版本}} 附记：本册 {{imprint|出版印记}} 由霍氏文化基金监制，{{publisher|出版方}} 注资不取名；每册随书附一页义诊 {{leaflet|传单页}}。",
"附录与索引也没落下：{{appendix|附录}} 收了裁定书全文，{{index|索引}} 按药名、人名、年份三套编排——找任何一页，三十秒。",
"开馆那天，老药市 {{bustling|熙攘的}} 得像过年。{{peddler|小贩}} 挑着担子来回，{{mercantile|商贸的}} 气与药香搅在一起；剪彩没请领导，请的是当年被苏大夫救过的人家，一人一句贺词。有位老船工举着杯说：「苏大夫的 {{vibrancy|活力}}，回来了。」",
"苏晚站在人群外，看着纪念馆门口那块 {{emporium|商场}} 招牌换成「苏氏医馆纪念馆」六个字，忽然想起十年前第一次以 S 之名出手的那天——她说不清这算不算一场 {{homecoming|归乡}}：手稿回家了，名字回家了，连她自己也像被谁领着，往家走了一趟。",
"「下一步呢？」阿满问。",
"「 {{repatriate|归还故土}} 完了，就该 {{renewal|更新}} 了。」苏晚望着满街的人，「老药市的故事讲完了，日内瓦的 {{renaissance|复兴}} 才开头——散展那天的 {{resurgence|回潮}}，才是 S 真正的场子。」",
"同一天，霍氏基金会把新一期 {{fundraiser|募捐活动}} 定在散展夜：主题定为「药与珠宝」，所有义卖收入，捐给罕见病与透析基金——把当年霍父的承诺，续成制度。",
"散展倒计时，八天。日内瓦湖上的风换了方向，吹得展览馆的旗猎猎作响。",
"一座城的 {{dedication|奉献}} 和一个人的十年，就要在同一片灯光下，接受全世界的注视了。"
]},
{no:40,t:"斗宝",ws:[["gavel","n.","拍卖槌"],["lot","n.","拍品批次"],["plaque","n.","号牌"],["reserve","n.","保留价"],["estimate","n.","估价"],["consignment","n.","委托拍品"],["opening","n.","开拍"],["increment","n.","加价幅度"],["rostrum","n.","拍台"],["skyrocket","v.","飙升"],["soar","v.","高涨"],["dip","v.","回落"],["fervor","n.","热度"],["feverish","adj.","狂热的"],["thrill","n.","激动"],["suspense","n.","悬念"],["anticipation","n.","期待"],["zenith","n.","顶点"],["strike","v.","落槌敲定"],["sold","adj.","售出的"],["unsold","adj.","流拍的"],["pass","v.","跳过"],["duel","n.","对决"],["showdown","n.","终极对决"],["standoff","n.","对峙"],["razor-thin","adj.","微弱的"],["cliffhanger","n.","悬念时刻"],["heart-stopping","adj.","摄人心魄的"],["dumbstruck","adj.","惊呆的"],["hoard","v.","囤藏"],["amass","v.","积攒"],["obtain","v.","获得"],["possess","v.","拥有"],["covet","v.","觊觎"],["prize","v.","珍视"],["flaunt","v.","炫耀"],["conspicuous","adj.","惹眼的"],["magnate","n.","巨头"],["tycoon","n.","大亨"],["scion","n.","后裔"],["aristocrat","n.","贵族"],["royal","adj.","王室的"],["duke","n.","公爵"],["duchess","n.","公爵夫人"],["baron","n.","男爵"],["countess","n.","女伯爵"],["ballroom","n.","舞厅"],["caviar","n.","鱼子酱"],["orchestra","n.","管弦乐队"],["encore","n.","返场"],["proceeds","n.","收入款项"],["tally","n.","统计总数"],["public","adj.","公开的"],["openly","adv.","公开地"],["proclaim","v.","昭告"],["own","v.","认领"],["finalist","n.","决赛入围者"],["shortlist","n.","入围名单"],["nominee","n.","被提名人"],["victor","n.","胜者"],["winning","adj.","制胜的"],["prevail","v.","获胜"],["sweep","v.","横扫"],["landslide","n.","压倒性胜利"],["underdog","n.","黑马弱者"]],
ps:[
"散展周的重头戏，压在最后一个夜晚：传承专场「斗宝」——各展方各出一件重器，同场义拍，{{proceeds|收入款项}} 全额注入儿童医疗基金。这是大展六十年的老规矩，也是每年最热闹的一夜。",
"霍氏上拍的 {{lot|拍品批次}} 定了「朱砂」——七件「本草」里唯一一件单主石重器。消息一出，预展走廊挤了三层人。",
"斗宝夜设在展馆顶层的 {{ballroom|舞厅}}。穹顶垂下水晶灯，{{orchestra|管弦乐队}} 在二楼廊台调音，侍者端着 {{caviar|鱼子酱}} 穿行；入口的电子屏滚动着本场 {{tally|统计总数}} 的实时善款数。",
"到场的没有闲人：中东的石油 {{magnate|巨头}}、东南亚的橡胶 {{tycoon|大亨}}、欧洲老牌家族的 {{scion|后裔}}，还有一位从不接受采访的 {{aristocrat|贵族}}；更远处，一位 {{royal|王室的}} 远支 {{duke|公爵}} 与 {{duchess|公爵夫人}} 交谈正欢，{{baron|男爵}} 们围成的小圈里，那位以收藏见长的 {{countess|女伯爵}} 正低声问：「朱砂几号出场？」",
"拍卖师登 {{rostrum|拍台}}，敲了第一声 {{gavel|拍卖槌}}。",
"第七号 {{consignment|委托拍品}} 上台：温家债权方拿来充数的「定海针」——那颗一百零八面的大钻。{{estimate|估价}} 八百万，{{reserve|保留价}} 却没人接——三次 {{pass|跳过}}，{{unsold|流拍的}} 信号灯亮起。有懂行的低笑：「石头是好石头，可惜沾了官司。」",
"第十一号，「朱砂」。",
"全场忽然静了半拍——那颗鸽血色的蛋面在射灯下转了个角度，像雪夜里忽然睁开的一味药。{{anticipation|期待}} 拉满，前几排的号 {{plaque|号牌}} 悄悄抬了一寸。",
"「 {{opening|开拍}} 价，两百万。」拍卖师话音未落，三块号牌同时起——{{increment|加价幅度}} 从十万一路加到五十万，报价 {{skyrocket|飙升}}：三百万、五百八十万、七百二十万。",
"后半场成了两个人的 {{duel|对决}}：左区那位从不举牌的贵族，对右区一位华裔老者。你一下我一下，谁都不肯让——全场屏息，只剩报价声。价格 {{soar|高涨}} 到一千二百万时，有人受不了 {{suspense|悬念}}，索性站到了椅子上。",
"中段还出过一场小 {{standoff|对峙}}：两位电话委托的买家隔着两条电话线互不相让，{{feverish|狂热的}} 空气绷到极点——每一次报价都带着一阵 {{thrill|激动}}，每一次停顿都像个 {{cliffhanger|悬念时刻}}，连侍者都忘了上酒。",
"一千五百万。一次。一千五百万，两次——右区的老者忽然笑了笑，放下号牌：「罢了。石头认人，它认你。」",
"{{heart-stopping|摄人心魄的}} 三秒之后，拍卖槌 {{strike|落槌敲定}}：{{sold|售出的}}，一千五百万。",
"善款屏哗地翻了个数。全场起立鼓掌，掌声比 {{encore|返场}} 的安可还长——一半给善款，一半给那颗朱砂。",
"拍下朱砂的贵族婉拒了采访，只让助理留下一句：「受人之托，替它 {{own|认领}} 一个临时的家。」懂行的都在猜他背后是哪路藏家——是替哪位只 {{hoard|囤藏}} 不露面的老钱 {{amass|积攒}} 器物，还是替哪个基金代持？没人猜得中。",
"后台有记者追问霍沉：「霍总，一千五百万买回自己的拍品，值吗？」",
"「拍品 {{obtain|获得}} 什么价都是缘分，」霍沉答得平静，「何况这一千五百万，进的是儿童医院。」",
"那位华裔老者临走前，特意绕到后台，对苏晚说了句话：「三十年前，苏大夫救过我母亲。今天我 {{covet|觊觎}} 这颗朱砂，是想报恩——没拍到，也是命。替我谢谢她的孙女。」",
"苏晚怔在原地。老人摆摆手走了，背影融进人群。",
"这一晚的 {{fervor|热度}} 一直烧到散场：报道把「朱砂」称作「本届最有 {{winning|制胜的}} 相的拍品」；几位没出手的大藏家私下约苏晚看货，被她一一婉谢：「本草七件是套组，少一件都不完整——散了，就再也不是药了。」",
"有人 {{possess|拥有}} 是为了 {{prize|珍视}}，有人是为了 {{flaunt|炫耀}}——而这一场的气氛里，最贵的东西恰恰不显山露水：一颗石头的来历、一句三十年的谢、和一笔不动声色的大善。真正的收藏家都懂：最 {{conspicuous|惹眼的}} 从来不是最贵的。",
"斗宝散场，善款 {{dip|回落}} 前的 {{zenith|顶点}} 被电子屏定格：全场四千二百万，「朱砂」独占三分之一。有人算了一笔账：这颗石头三年前在南岭矿口的成交价，三十万。",
"价格的数字之外，还有另一种 {{razor-thin|微弱的}} 差距：赌对石头的人赚的是钱，赌对良心的人赢的是路。今晚的真正 {{victor|胜者}}，从来不在号牌席上。",
"斗宝结束，一年一度的大奖 {{shortlist|入围名单}} 随即公布：六件 {{finalist|决赛入围者}} 作品，S 的「本草」占了两个席位——「朱砂」与「佩兰」双双 {{nominee|被提名人}} 在列。榜单一出，没人惊讶；惊讶的是备注栏里那行小字：评审团一致意见，若 S 不 {{public|公开的}} 身份，本届大奖「无法颁得心安理得」。",
"顾之衍把这一行念给苏晚听，问：「最后一关了。摘不摘？」",
"苏晚站在 A-07 的灯下，看着「佩兰」翻盖铰链后那行「佩兰入药，辟秽」，想起奶奶的那句「stitch」——一针。",
"「摘。」她说，「十年了，让它 {{openly|公开地}} 回来。」",
"散展颁奖礼定在后天。那一晚，日内瓦所有知道内情的人都在等一件事：S 会不会 {{proclaim|昭告}} 自己的名字，以及——那个把「本草」做成传说的神秘设计师，到底会不会 {{prevail|获胜}}，把大奖 {{sweep|横扫}} 回家。",
"没人想到，大奖之夜的真正 {{landslide|压倒性胜利}}，不在奖杯，而在奖杯之后——而更没人想到，这场十年之约的 {{underdog|黑马弱者}} 从来不是 S。真正的 {{showdown|终极对决}}，此刻才刚拉开序幕；而台下某位 {{dumbstruck|惊呆的}} 观众握着一张旧船票，眼眶通红。"
]},
{no:41,t:"珐琅与火",ws:[["cloisonné","n.","掐丝珐琅"],["enamel","n.","珐琅"],["glaze","v./n.","上釉"],["frit","n.","熔块"],["firing","n.","烧制"],["oxidize","v.","氧化"],["torch","n.","喷枪"],["blowtorch","n.","喷焰灯"],["nozzle","n.","喷嘴"],["sheen","n.","光泽"],["gleam","v.","微光"],["glisten","v.","闪润"],["sparkle","v.","闪耀"],["glitter","v.","灿光"],["radiant","adj.","光彩照人的"],["luminous","adj.","发光的"],["incandescent","adj.","白炽的"],["bend","v.","弯折"],["pinch","v.","捏"],["twist","v.","拧"],["flatten","v.","压平"],["contour","n.","轮廓"],["outline","n.","轮廓线"],["grid","n.","格"],["compartments","n.","分隔格"],["fill","v.","填充"],["pool","v.","汇积"],["level","adj.","平的"],["viscous","adj.","黏稠的"],["droplet","n.","小滴"],["seep","v.","渗"],["bubble","n.","气泡"],["burst","v.","破裂"],["crack","n.","裂纹"],["shrink","v.","收缩"],["expand","v.","膨胀"],["temperature","n.","温度"],["thermometer","n.","温度计"],["heatproof","adj.","隔热的"],["refractory","adj.","耐火的"],["liquefy","v.","液化"],["molten","adj.","熔融的"],["blast","n.","一炉"],["flame","n.","火焰"],["inferno","n.","烈焰"],["blaze","n.","烈火"],["scorch","v.","灼痕"],["char","v.","烧焦"],["soot","n.","烟灰"],["ash","n.","灰"],["smoke","n.","烟"],["combust","v.","燃烧"],["extinguish","v.","熄灭"],["cooldown","n.","冷却"],["iteration","n.","迭代"],["accuracy","n.","精度"],["leeway","n.","余地"],["fireproof","adj.","防火的"],["cobalt","n.","钴蓝"],["apron","n.","围裙"],["visor","n.","面罩"],["mitt","n.","隔热手套"],["pliers","n.","钳子"],["tweezer","n.","镊子"],["spatula","n.","刮刀"]],
ps:[
"大奖前夜，大展的传统环节「大师工坊」如期开讲：入围者轮流亮一手绝活，观众近距离围观。S 报的题目只有四个字：珐琅与火。",
"演示厅烧着两台炉。开讲前，苏晚先把一身 {{fireproof|防火的}} 行头换上：帆布 {{apron|围裙}}、护目 {{visor|面罩}}、石棉 {{mitt|隔热手套}}，台面垫好 {{heatproof|隔热的}} 石棉布；台边一溜排开 {{pliers|钳子}}、{{tweezer|镊子}}、{{spatula|刮刀}}，还有那把老 {{torch|喷枪}}。",
"「{{enamel|珐琅}} 是什么？」她开门见山，「是玻璃的近亲——把石英、长石和金属氧化物烧成的 {{frit|熔块}}，磨成粉，调成浆，填进金属格子里再烧。烧一次，是一次 {{firing|烧制}}；烧一百次，就是一百次告别。」",
"她举起一块素银胎：「今天做一枚小样，掐丝珐琅——法语叫 {{cloisonné|掐丝珐琅}}，掐的是丝，填的是色，赌的是火。」",
"掐丝先来。细银丝在她指间 {{bend|弯折}}、{{twist|拧}}、{{pinch|捏}}，{{flatten|压平}} 之后贴着画好的 {{outline|轮廓线}} 走线；一条卷草纹的 {{contour|轮廓}}，三分钟盘完，严丝合缝地焊成一排 {{grid|格}} 与 {{compartments|分隔格}}——格与格的间距，就是颜色的国界。",
"「丝要匀，格要稳。」她把银胎举给前排看，「火一烧，丝会 {{shrink|收缩}}、釉会 {{expand|膨胀}}，两头打架——匠人就是中间那点 {{leeway|余地}} 的裁判。」",
"填色是第二关。釉浆 {{viscous|黏稠的}} 得像蜂蜜，用刮刀一点点往格里 {{fill|填充}}，填多了 {{seep|渗}} 出界，填少了烧完塌陷；填完要 {{pool|汇积}} 平，平面必须 {{level|平的}}，靠灯照出反光来判断。",
"「看气泡。」她指着格边一粒 {{droplet|小滴}} 旁顶起的小 {{bubble|气泡}}，「烧之前它叫隐患，烧完还 {{burst|破裂}} 不掉，就叫瑕疵。珐琅的第一课，是学会跟气泡过日子。」",
"烧制是压轴。银胎进耐火托，托是 {{refractory|耐火的}} 白泥板；小件用台面 {{blowtorch|喷焰灯}}，{{nozzle|喷嘴}} 的蓝 {{flame|火焰}} 温度直逼八百度，她只凭一张 {{thermometer|温度计}} 贴片和肉眼看火色定 {{temperature|温度}}。",
"「火心里面是一小片 {{inferno|烈焰}}，」她隔着面罩说，「釉粉在八十秒内 {{liquefy|液化}}，变成 {{molten|熔融的}} 的一汪；火大了 {{scorch|灼痕}} 发黑，火小了 {{char|烧焦}} 不透。珐琅人一辈子都在学一件事——跟 {{combust|燃烧}} 讲道理。」",
"第一 {{blast|一炉}} 出来，全场屏息。银胎上的釉面还带着 {{soot|烟灰}} 气，{{smoke|烟}} 散尽后，那格 {{cobalt|钴蓝}} 微微 {{gleam|微光}}，边缘起了一线细 {{crack|裂纹}}。",
"「第一次就成这样，已经……」台下有人赞叹。",
"「不成。」苏晚摇头，拿起锉刀把整格釉面锉平——方才那片湖蓝应声变成 {{ash|灰}} 白，「釉的 {{glaze|上釉}} 厚了，色发闷。重来。」",
"第二炉，色对了，边线还是 {{oxidize|氧化}} 发了乌。再重来。",
"第三炉，{{incandescent|白炽的}} 光里取出来的小样终于齐整：湖蓝沉静，{{luminous|发光的}} 釉面下细看有星光般的 {{glisten|闪润}}，转动时整片 {{sheen|光泽}} 流动，像把一小片夜空按进银里。围观席一片 {{blaze|烈火}} 般的掌声。",
"有人问她试错的秘诀。她举了举手里那枚成废两枚的小样：「没有秘诀，只有 {{iteration|迭代}}——记录、比对、修正。珐琅教的 {{accuracy|精度}}，一半靠手，一半靠不骗自己的账本。」",
"演示的最后一个环节是「救火」：她故意把一小片釉烧过了头，当场示范怎么 {{extinguish|熄灭}} 局部火、怎么让工件缓慢 {{cooldown|冷却}}——「急冷必裂，人也一样。」",
"散场后，一位老匠人守在台边等她摘面罩，看了半天那枚湖蓝小样，说了句：「这釉色里，有股药香。」",
"「有。」苏晚笑了，「湖蓝那份配方，我调了十年。火里见真章——珐琅这行，{{sparkle|闪耀}} 是给外人看的，{{glitter|灿光}} 是给相机看的；真正留给自己的，是 {{radiant|光彩照人的}} 那点安静。」",
"夜里，她把那枚湖蓝小样收进随身的锦囊——锦囊里已经有一颗哑巴石英。现在，一哑一亮，正好凑一对儿。",
"明天，颁奖。"
]},
{no:42,t:"修旧如旧",ws:[["repair","v.","修理"],["mend","v.","修补"],["patch","v.","补"],["splice","v.","铆接"],["rejoin","v.","接回"],["reattach","v.","重新固定"],["cleaning","n.","清洁"],["cleanse","v.","净化"],["cleaner","n.","清洁剂"],["detergent","n.","洗涤剂"],["grime","n.","油污"],["grit","n.","尘砂"],["accretion","n.","附积物"],["tarnish","v.","失光"],["corrode","v.","腐蚀"],["erosion","n.","侵蚀"],["rust","n.","锈"],["verdigris","n.","铜绿"],["scratch","n.","划痕"],["dent","n.","凹痕"],["gouge","n.","凿坑"],["nick","n.","缺口"],["notch","n.","刻槽"],["chip","n.","崩口"],["wear","n.","磨损"],["deform","v.","变形"],["warp","v.","翘曲"],["buckle","v.","弯折变形"],["sag","v.","下垂"],["reinforce","v.","加固"],["underpin","v.","支撑"],["anchor","v.","锚定"],["epoxy","n.","环氧胶"],["lacquer","n.","大漆"],["varnish","n.","清漆"],["fidelity","n.","忠实度"],["original","adj.","原初的"],["reversibility","n.","可逆性"],["minimal","adj.","最小的"],["intrusive","adj.","侵入的"],["invisible","adj.","隐形的"],["visible","adj.","可见的"],["honesty","n.","诚实"],["remnant","n.","残迹"],["vestige","n.","遗痕"],["period","n.","时代"],["era","n.","年代"],["epoch","n.","时期"],["century","n.","世纪"],["millennium","n.","千年"],["pillbox","n.","药盒"],["dovetail","n.","燕尾榫"],["lid","n.","盖"],["base","n.","底"],["rim","n.","沿口"],["interior","n.","内里"],["exterior","n.","外观"],["finish","n.","表面处理"],["glow","n.","光晕"],["silverware","n.","银器"],["workmanship","n.","做工"],["painstaking","adj.","一丝不苟的"],["fastidious","adj.","讲究的"],["exacting","adj.","严苛的"],["delicacy","n.","精细"]],
ps:[
"大师工坊的第二场，在颁奖当天上午开讲。S 报的题目是：修旧如旧。",
"她带的工作台格外素：绒布、棉签、一支软毛刷、三瓶 {{cleaner|清洁剂}} 与中性 {{detergent|洗涤剂}}，还有一件用红绸裹着的老物件。",
"「这是一只银 {{pillbox|药盒}}，家传的，上过三十年门诊。」她把红绸揭开，「今天当众修它——它是我祖母的，也是我的第一件工具。」",
"修复的第一步是会诊。她把药盒托在掌心，一样样指给观众看：盒 {{lid|盖}} 有一处 {{dent|凹痕}}，盖沿一圈 {{nick|缺口}}；盒 {{base|底}} 翘了角，整个底板轻微 {{warp|翘曲}}，盒身 {{buckle|弯折变形}} 得合不拢缝；侧壁一处 {{gouge|凿坑}}，锁扣 {{chip|崩口}}，铰链的销子 {{sag|下垂}} 半分。",
"「内里更惨。」她打开盖，「内壁积了半 {{century|世纪}} 的药渍 {{grime|油污}}，边角嵌着 {{grit|尘砂}}；盖内侧一层 {{accretion|附积物}}，把当年錾的字糊死了。」",
"第二步是清洁。她先用软刷干扫，再用棉签蘸中性洗液，一点一点 {{cleanse|净化}} 内壁；顽固药渍用敷贴法闷软，绝不上硬器刮。「{{cleaning|清洁}} 不是把老东西洗成新的，是把不属于它的东西请走。」",
"银面的 {{tarnish|失光}} 与 {{verdigris|铜绿}} 分开处理：铜绿是病史，留一小块不除，作证；银的暗哑轻轻拭亮，{{corrode|腐蚀}} 出的小坑 {{erosion|侵蚀}} 到肉，不做填平；包边铁件起的一点 {{rust|锈}}，机械除净——「伤疤是它的年轮，锈不是。锈是病灶。」",
"第三步是矫正。底板翘角用木榔头隔毡轻敲回形，{{deform|变形}} 的盒身靠定制夹具慢慢回正——绝不硬掰，硬掰就是二次伤害。",
"「修复的黄金律有三条。」她一边干活一边讲，「第一，{{minimal|最小的}} 干预：能不动手的地方绝不动手，修复者最忌 {{intrusive|侵入的}} 贪功。第二，{{reversibility|可逆性}}：今天用的每一分 {{epoxy|环氧胶}}、每一层 {{lacquer|大漆}}，五十年后都能无损撤掉——修旧的人，要给后来者留退路。第三，{{fidelity|忠实度}}：补的地方必须忠于 {{original|原初的}} 工艺，不许夹带今天的手艺私心。」",
"补盖沿缺口用了老法子：取同 {{era|年代}} 的旧银一小条，退火锤薄，剪出 {{notch|刻槽}} 对位，{{splice|铆接}} 上去，锉平——新旧接缝处刻意留一线 {{visible|可见的}} 微痕。「这一线痕，是修复者的 {{honesty|诚实}}：告诉后人哪里是唐代的它，哪里是今天的我。」",
"盖上的 {{scratch|划痕}} 分两类：日常 {{wear|磨损}} 全部保留，恶意的深伤只做稳定，不做 {{mend|修补}}。铰链销子重新车配，{{reattach|重新固定}}；盒盖开合恢复了顺滑，她试了三次开合，声音和四十年前一样。",
"锁扣的崩口太深，补不回原样，她便做了一个 {{invisible|隐形的}} 内 {{anchor|锚定}} 件 {{reinforce|加固}} 托底，外面再以旧漆薄封——「外观让位于结构，救命的东西先要能干活。」",
"最后是表面 {{finish|表面处理}}：整件 {{silverware|银器}} 不做抛光翻新，旧光泽原样保留——灯下看，银面泛着一层温润的 {{glow|光晕}}；外 {{exterior|外观}} 只上一层可逆的 {{varnish|清漆}} 防护，盖 {{rim|沿口}} 修复处加 {{underpin|支撑}} 一圈内衬，内 {{interior|内里}} 药渍清洁后，錾字重新露出来：苏氏药盒，一九五八。",
"盒身侧面还有一处 {{dovetail|燕尾榫}} 旧接——那是祖母当年亲手 {{repair|修理}} 过的痕迹，接口比原件还密。「修旧如旧的最高境界，」苏晚摩挲那道榫，「是能认出前人的手。这一道，我认得——她补过的地方，永远比原来结实。」",
"「这件东西活过战乱 {{epoch|时期}}、跨过千禧 {{millennium|门槛}}、进过我家三代人的口袋。」收工时她说，「所谓修复，不是把它送回某个 {{period|时代}}，是让它体面地、带着全部的 {{remnant|残迹}} 和 {{vestige|遗痕}}，继续活到下一个时代。」",
"讲台下安静了几秒，随后掌声从后排滚到前排。有位老教授起立鼓掌：「这不只是手艺，这是修复伦理的公开课——今天讲的三条金律，够写进教材。」",
"有人问：「您这么 {{fastidious|讲究的}}、这么 {{exacting|严苛的}}，一件小银盒修三个小时，值得吗？」",
"「值得。」苏晚收起工具，答得干脆，「器物的 {{workmanship|做工}} 里住着人。我修的不是银盒，是我祖母的三个小时——她当年也这样 {{painstaking|一丝不苟的}}，替别人的性命 {{patch|补}}、{{rejoin|接回}}。手艺的 {{delicacy|精细}}，是医道教的。」",
"散场时，她把修好的药盒揣进胸前口袋，贴着那枚锦囊。",
"下午五点，颁奖礼。"
]},
{no:43,t:"加冕",ws:[["ovation","n.","欢呼"],["cheer","n.","欢呼"],["roar","n.","喝彩声"],["whistle","n.","口哨声"],["confetti","n.","彩带纸屑"],["fireworks","n.","烟花"],["stage","n.","舞台"],["stairway","n.","台阶"],["lectern","n.","讲台"],["microphone","n.","麦克风"],["plate","n.","铭牌"],["insignia","n.","徽记"],["title","n.","头衔"],["champion","n.","冠军"],["record","n.","记录"],["unprecedented","adj.","前所未有的"],["breakthrough","n.","突破"],["award","n.","奖"],["medal","n.","奖章"],["diploma","n.","证书"],["backstage","n.","后台"],["card","n.","卡"],["recite","v.","宣读"],["salute","v.","致敬"],["honor","n.","荣誉"],["bestow","v.","授予"],["present","v.","颁发"],["acceptance","n.","领奖致辞"],["speech","n.","演讲"],["address","n.","致辞"],["wave","v.","致意挥手"],["goosebumps","n.","起鸡皮疙瘩"],["tearful","adj.","含泪的"],["euphoria","n.","狂喜"],["exhilaration","n.","振奋"],["ecstatic","adj.","狂喜的"],["pride","n.","自豪"],["gracious","adj.","大方的"],["thank","v.","感谢"],["appearance","n.","露面"],["face","n.","面孔"],["name","n.","名字"],["auditorium","n.","礼堂"],["dais","n.","领奖台"],["row","n.","排"],["seat","n.","座位"],["camera","n.","相机"],["lens","n.","镜头"],["livestream","n.","直播"],["viewer","n.","观众"],["follower","n.","粉丝"],["fan","n.","迷"],["supporter","n.","支持者"],["function","n.","典礼"],["dinner","n.","晚宴"],["celebration","n.","庆典"],["moment","n.","时刻"],["instant","n.","瞬间"],["memory","n.","记忆"],["story","n.","故事"],["legend","n.","传奇"],["future","n.","未来"],["past","n.","过去"],["beginning","n.","开端"],["ending","n.","终局"]],
ps:[
"颁奖礼定在展馆主 {{auditorium|礼堂}}，一千二百个 {{seat|座位}}，三小时前座无虚席；过道和后 {{row|排}} 站满人，全球二十家媒体 {{livestream|直播}}，镜头 {{camera|相机}} 与 {{lens|镜头}} 从四面八方对准 {{stage|舞台}}。",
"评审团先行登台，从 {{dais|领奖台}} 侧的 {{stairway|台阶}} 依次落座。主席致辞只有一段：「本届的评语我们斟酌了很久，最后只剩一句话——有些作品，评委不选它，是评委的损失。」",
"揭晓从新人奖开始。每念一个 {{name|名字}}，台下一阵 {{cheer|欢呼}}；{{confetti|彩带纸屑}} 从穹顶撒下三回，{{whistle|口哨声}} 此起彼伏。",
"压轴之前，主持人当众 {{recite|宣读}} 了评审团的一致意见：本届最高奖，双件并列——S 的「朱砂」与「佩兰」。全场起立，{{ovation|欢呼}} 像潮水一样掀了三次。",
"然后，是那个约定的 {{moment|时刻}}。",
"「有请 S。」",
"聚光灯下，苏晚从侧台走出，一步一步走上来。她还戴着那条用了十年的素色面纱——台下有人低呼：她真来了。十年的传闻，这一刻有了 {{face|面孔}} 的轮廓。",
"她走到 {{lectern|讲台}} 前，调了调 {{microphone|麦克风}}，在满堂寂静里，抬手解下了面纱。",
"「我叫苏晚。」她说，「S，是我的姓，也是我祖母教我的第一针。」",
"一千二百人起立。{{roar|喝彩声}} 延续了整整两分钟，前排有位老藏家抹着眼角，直播间弹幕炸成雪花，{{viewer|观众}} 数曲线笔直向上。",
"评审团主席亲自 {{present|颁发}} 奖项：两座金 {{award|奖}} 座，底座 {{plate|铭牌}} 上刻着获奖名录，顶端的展徽 {{insignia|徽记}} 錾着一圈橄榄枝，中央嵌一枚金 {{medal|奖章}}；他向她致 {{salute|致敬}} 的礼，又把终身成就的特别 {{title|头衔}} 与 {{diploma|证书}} 一并 {{bestow|授予}} 到她手里——本届最年轻得主，也是第一个双件 {{champion|冠军}}，展史 {{record|记录}} 簿上前所未有：{{unprecedented|前所未有的}} 双金。",
"苏晚发表 {{acceptance|领奖致辞}}。那段 {{speech|演讲}} 不长，却让整个礼堂安静得能听见呼吸：「{{thank|感谢}} 评审团，感谢所有在这十年里为 S 保守秘密的人。今天我要把这份 {{honor|荣誉}} 还给它的第一主人——我的祖母，一位行医四十年的大夫。她教我，医是救人的手艺，珠宝是渡美的手艺；手艺的根，都是不许敷衍四个字。这双金的分量，我替她领一半，替所有在手艺里熬日子的人领一半。」",
"她说到「祖母」两个字时，台下第二排的霍家一行，齐齐红了眼眶。霍父攥着拐杖的手背青筋隆起；霍母把泪按在掌心里；霍沉望着台上那个挺直的背影，忽然明白了自己心跳的来处——十年了，他终于赶上了一场属于她的 {{celebration|庆典}}。整座礼堂的人都在起 {{goosebumps|鸡皮疙瘩}}：有人 {{tearful|含泪的}}，有人 {{ecstatic|狂喜的}}，前排一位老藏家连连摇头，喃喃说这十年「值了」；老匠人盯着大屏看了半天，忽然挺直了背——今晚全城手艺人的 {{pride|自豪}}，都被这一枚小小的徽记攥在了一处。",
"而台上的人反而最 {{gracious|大方的}}：她朝每一排都欠了欠身，把掌声一次次送还给台下——像把一份十年的账，当众摊开，人手一份。",
"致辞的最后，她举起那枚随身的湖蓝珐琅小样，对着灯光：「本次 {{breakthrough|突破}} 如果算数，请记在『苏氏手稿，一九五八』的名下。药入饰，善入美——这是我的 {{address|致辞}}，也是我往后全部作品的落款。」",
"话音落下，穹顶的 {{fireworks|烟花}} 装置轰然点亮，两束金光打在「本草」的展柜上；她朝台下深深 {{wave|致意挥手}}，像把十年的孤独一次挥散。直播间的 {{follower|粉丝}} 数字滚成瀑布，老工匠们的 {{supporter|支持者}} 们在弹幕里刷同一句话：手艺人，值得。",
"{{backstage|后台}} 的 {{instant|瞬间}}，才是这场 {{function|典礼}} 的暗涌。陈默抱着花冲进来时，看见霍沉把外套披在苏晚肩上——两人之间只隔一句话的距离，可谁都没急。",
"「大奖之夜的官方 {{dinner|晚宴}}，」陈默咽了口唾沫，「全球一百七十家媒体堵在门外，都想要 S 的首个 {{appearance|露面}} 专访。」",
"「不去。」苏晚把奖座交给工作人员，「记者会只开十分钟，问题我来定：只聊手艺，不聊私事。」",
"十分钟的记者会，她说了一句被第二天所有报纸加粗的话：「作品的 {{legend|传奇}}，到此为止；手艺的 {{story|故事}}，才刚 {{beginning|开端}}。」",
"当晚的 {{euphoria|狂喜}} 是全行业的。日内瓦湖边有人放起了整段的烟花，{{fan|迷}} 们举着手机沿湖拍照；老藏家的酒会上，人人都在算同一个 {{past|过去}}：十年前谁三千块错过 S，谁二十万收了 S——这张账，如今翻了一千倍，成了行业里最著名的 {{memory|记忆}}。",
"而苏晚谢绝了所有庆功局，只在 A-07 的灯下坐了一会儿。她把两座奖座并排放在「朱砂」展柜前，看着它们在玻璃上投出的光斑。",
"「祖母，」她轻声说，「加冕的不是我。是这一针，终于被人看见了。」",
"展台的射灯把她的影子投得很长，像十年前那间小药铺里的灯影，也像 {{future|未来}} 每一间工坊的灯影。她伸手抚平「佩兰」的展签，指尖在获奖 {{card|卡}} 上一行小字停了停——那行字是评审团手写的：愿世间手艺，皆有回响。",
"散展日，明天。所有故事的第一幕，今晚圆满 {{ending|终局}}。",
"而真正的 {{exhilaration|振奋}}，是散场后她收到的那条短信，来自霍沉，只有六个字：「明天，空 A-07，等你。」"
]},

ps:[
"散展日的展馆，比开幕日还喧闹——只是喧闹换了性质：撤。",
"工作人员小心地把七件「本草」逐一 {{vacate|撤出}} 展柜，入 {{carton|纸箱}}、塞 {{foam|泡沫}} 缓冲，按编号 {{dispatch|发运}} 回国；空出来的 {{store|店}} 位一夜之间 {{stark|光秃秃的}}，像退潮后的沙滩。",
"A-07 是最后撤的。按霍沉的那条短信，苏晚到了时，展台已经 {{empty|空的}}，只剩地胶上一圈展柜的印子。",
"霍沉站在那圈印子中央，手里拿着一台相机。",
"「说好的，空 A-07。」他按下快门，{{snapshot|快照}} 存档，「再拍一张你的。往后翻起来，记得我们从哪儿开始重新算。」",
"苏晚站进那圈印子里，和他并排。空展台的射灯还没关，把两个人的影子叠在地上——像一场无声的 {{parting|分别}}，也像一场无声的重逢。",
"「散展了，」霍沉开口，嗓音不高，「按约定，今天谈我们。」",
"「嗯。」",
"「我想清楚了。」他转过身，正对着她，「上一段婚姻，是我欠你的，怎么还都还不清。所以这一次——我不求复合，求一个 {{courtship|追求}} 的资格。三年零四个月，你追过我的那些日子，一件件，换我来做一遍：等门、送伞、记住每一次 {{date|约会}} 的日子。你 {{slow|慢的}} 一点没关系，我 {{unhurried|不急的}}。」",
"「追到什么程度算数？」",
"「追到你在城南的窗台上，愿意为我多亮一盏灯。」",
"苏晚看着这个把求婚都说成季度报告的男人，忽然笑了。这一段迟到的 {{romance|浪漫}}，终于被他学成了 {{romantic|浪漫的}} 样子——比三年前 {{wholehearted|全心全意的}} 多了点笨拙，也多了点真心。",
"「准了。」她说，「先说好，我这个人，追起来很贵——不吃烛光晚餐，只喝你熬的粥。」",
"「成交。」霍沉答得像签一份一生 {{deal|交易}}，「这回没有 {{terms|条件}}，没有附加 {{condition|条款}}——只有一条 {{promise|承诺}}，终身有效，不接受 {{negotiable|可谈的}} 修改。」",
"当晚的散展 {{goodbye|告别}} 酒会，是另一场没有硝烟的战争。",
"大奖余温未散，全球的请柬先到。法国某高定 {{house|品牌行}} 的 {{couture|高定时装}} 部总裁亲自递上 {{proposal|提案}}：请苏晚出任高定珠宝线的首位华人艺术总监，{{retainer|聘用定金}} 八位数，首个 {{flagship|旗舰}} 系列全球同步发布。苏晚还没看完，旁边的 {{broker|经纪人}} 已经把 {{quotation|报价单}} 递了上来，笑称这是「本季最 {{handsome|可观的}} 的一单」。",
"更热的在后面：瑞士某百年 {{label|品牌标签}} 出价 {{astronomical|天文数字的}}——签约费一笔 {{upfront|一次付清的}}，作品按 {{royalty|版税}} 分成；中东财团走 {{agent|经纪}} 渠道报价，光是 {{fee|费用}} 的那个「零」就让翻译数了三遍。散场不到一小时，{{billionaire|亿万富翁}} 们的 {{clout|影响力}} 与 {{millionaire|百万富翁}} 们的名片挤满了陈默的托盘：开 {{chain|连锁}} 的要 {{franchise|特许经营}}，做 {{licensing|授权}} 的求联名，某腕表 {{status|地位}} 之神甚至开出「每年只做一件、价格随你 {{quote|报价}}、{{rate|费率}} 不设上限」的 {{commission|委托费}}——只求她点头出任品牌 {{ambassador|大使}}。",
"宴会厅的另一角，几家公关正在抢人：代言人 {{endorsement|代言}} 与 {{spokesperson|代言人}} 的合约从门缝里递进来，条款被律师 {{specify|明确}} 到每一句文案的署名方式。霍沉站在人墙外，看着她被各国资本 {{pursue|追求}}——那阵仗，比他 {{woo|求爱}} 热闹一万倍。",
"苏晚的回应只有一种：{{refusal|拒绝}}。",
"她对高定总裁的 {{rejection|回绝}} 说得客气：「谢谢，但我有工坊。」对腕表之神，她只回了六个字：「手艺不卖 {{cash|现金}} 价。」对方愣了愣，反而起身致意：「这个 {{price|价格}}，我记住了。」",
"最后被她签下的只有两份合同，一份公益拍卖的终身合作，一份给老药市博物馆的作品借展——两份她都当场 {{execute|签署生效}}，一支笔用到底。",
"「为什么不接？」散场后陈默终于没忍住，「随便一单，都是别人几辈子的钱。」",
"「因为 {{freedom|自由}} 和 {{independence|独立}} 更贵。」苏晚望着展馆外的湖，「S 十年无名，换来今天可以拒绝任何人。这份拒绝的权利，才是那十年攒下的全部家底。」",
"回程的货机比客机先起飞。七件「本草」在恒温舱里 {{ship|运送}} 回国，苏晚坚持坐同一班：「作品在哪，我在哪。」",
"登机前，她在廊桥口 {{wander|漫步}} 回望这座点亮过她的城市，拍了最后一张 {{photo|照片}}：晨光里半醒的日内瓦，湖面平得像一页还没写字的纸。",
"「 {{remember|记得}} 这座城吗？」霍沉在她身边问。",
"「记得。」她把相机收进包里，「它 {{unload|卸载}} 了我的十年，也 {{load|装载}} 了我的下半生。」",
"飞机腾空。老宅方向，霍家一行已在备接风宴；城南方向，阿满和街坊把拾晚堂的灯笼擦得锃亮。",
"没人注意，城市的另一头，一座老宅正在挂牌出售——温家的老宅。买主是温父自己请来的中介，卖得又急又静。",
"价码栏空着。中介问填多少，温父望着满堂旧物，只说了两个字：「随便。」",
"拿到那笔钱，他会去做一件所有人都想不到的事。"
]},
